name: Install Duckie Days v24.361 Miho Love Interests
on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.361-Miho-Love-Interests-UPDATE-ONLY.zip'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Miho love-interest update
        shell: bash
        run: |
          set -euo pipefail
          ZIP=Duckie-Days-v24.361-Miho-Love-Interests-UPDATE-ONLY.zip
          test -f "$ZIP" || { echo "::error::Upload $ZIP to the repo root first."; exit 1; }
          unzip -t "$ZIP"
          unzip -oq "$ZIP" -d .
          test -f duck-quest/js/love-interests-v326.js
          grep -q '24.361' version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Miho 7 love interests v24.361' || echo 'Already installed'
          git push

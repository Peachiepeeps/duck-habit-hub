name: Install Duckie Days v24.312 Miko Fashion Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.312-miko-fashion-recovery.zip"
      - ".github/workflows/FIX-MIKO-v24.312.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-312
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for patch ZIP
        id: patch
        shell: bash
        run: |
          if [ -f "Duckie-Days-v24.312-miko-fashion-recovery.zip" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Workflow installed. Waiting for Duckie-Days-v24.312-miko-fashion-recovery.zip"
          fi

      - name: Install v24.312
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duckie-Days-v24.312-miko-fashion-recovery.zip"
          TMP=".duckie-v24-312-install"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/payload"
          cp -a "$TMP/payload/." .

          python3 - <<'PY'
          from pathlib import Path

          root=Path("index.html")
          text=root.read_text()

          old_js='  <script src="sock-gremlin-fashion-fix-v311.js?v=24.311"></script>'
          new_js='  <script src="sock-gremlin-fashion-fix-v312.js?v=24.312"></script>'
          if new_js not in text:
              if old_js in text:
                  text=text.replace(old_js,new_js,1)
              else:
                  anchor='  <script src="sock-gremlin-fashion-v297.js?v=24.297"></script>'
                  if anchor not in text:
                      raise SystemExit("Could not find Sock Gremlin fashion script anchor")
                  text=text.replace(anchor,anchor+"\n"+new_js,1)

          css='  <link rel="stylesheet" href="sock-gremlin-fashion-fix-v312.css?v=24.312" />'
          css_anchor='  <link rel="stylesheet" href="universal-clothing-v311.css?v=24.311" />'
          if css not in text:
              if css_anchor not in text:
                  raise SystemExit("Could not find Universal Clothing CSS anchor")
              text=text.replace(css_anchor,css_anchor+"\n"+css,1)

          root.write_text(text)

          sw=Path("sw.js")
          text=sw.read_text()
          text=text.replace("duck-habit-hub-app-v24-311","duck-habit-hub-app-v24-312")
          text=text.replace(
              " './sock-gremlin-fashion-fix-v311.js?v=24.311',",
              " './sock-gremlin-fashion-fix-v312.js?v=24.312',"
          )

          css_entry=" './sock-gremlin-fashion-fix-v312.css?v=24.312',"
          css_anchor=" './universal-clothing-v311.css?v=24.311',"
          if css_entry not in text:
              if css_anchor not in text:
                  raise SystemExit("Could not find Universal Clothing cache anchor")
              text=text.replace(css_anchor,css_anchor+"\n"+css_entry,1)

          sw.write_text(text)
          PY

          test -f "sock-gremlin-fashion-fix-v312.js"
          test -f "sock-gremlin-fashion-fix-v312.css"
          grep -q '"version": "24.312"' version.json
          grep -q 'sock-gremlin-fashion-fix-v312.js?v=24.312' index.html
          grep -q 'sock-gremlin-fashion-fix-v312.css?v=24.312' index.html
          grep -q 'duck-habit-hub-app-v24-312' sw.js
          grep -q 'Clear Stuck Outfit' sock-gremlin-fashion-fix-v312.js

          node --check sock-gremlin-fashion-fix-v312.js

      - name: Clean installer files
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-v24-312-install"
          rm -f "Duckie-Days-v24.312-miko-fashion-recovery.zip"
          rm -f ".github/workflows/FIX-MIKO-v24.312.yml"
          rm -f "DUCKIE-DAYS-v24.311-README.txt"
          rm -f "sock-gremlin-fashion-fix-v311.js"

      - name: Commit patch
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Add Miko fashion battle recovery v24.312"
          git push

name: Add Ocean Duck Quest Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ocean-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Create and organize Ocean assets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          from pathlib import Path

          files = {
    'duck-quest/assets/backgrounds/ocean/deep.png': '',
    'duck-quest/assets/backgrounds/ocean/floor.png': '',
    'duck-quest/assets/backgrounds/ocean/shore.png': '',
    'duck-quest/assets/backgrounds/ocean/surface.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Blue-hurt.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Blue-idle-1.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Blue-idle-2.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Coral-hurt.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Coral-idle-1.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Coral-idle-2.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Pink-hurt.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Pink-idle-1.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Pink-idle-2.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Purple-hurt.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Purple-idle-1.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/Purple-idle-2.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/hurt.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/idle-1.png': '',
    'duck-quest/assets/bosses/vampire-squid/base/idle-2.png': '',
    'duck-quest/assets/enemies/catfish/base/Black-hurt.png': '',
    'duck-quest/assets/enemies/catfish/base/Black-idle-1.png': '',
    'duck-quest/assets/enemies/catfish/base/Black-idle-2.png': '',
    'duck-quest/assets/enemies/catfish/base/Brown-hurt.png': '',
    'duck-quest/assets/enemies/catfish/base/Brown-idle-1.png': '',
    'duck-quest/assets/enemies/catfish/base/Brown-idle-2.png': '',
    'duck-quest/assets/enemies/catfish/base/Navy-hurt.png': '',
    'duck-quest/assets/enemies/catfish/base/Navy-idle-1.png': '',
    'duck-quest/assets/enemies/catfish/base/Navy-idle-2.png': '',
    'duck-quest/assets/enemies/catfish/base/Orange-hurt.png': '',
    'duck-quest/assets/enemies/catfish/base/Orange-idle-1.png': '',
    'duck-quest/assets/enemies/catfish/base/Orange-idle-2.png': '',
    'duck-quest/assets/enemies/catfish/base/hurt.png': '',
    'duck-quest/assets/enemies/catfish/base/idle-1.png': '',
    'duck-quest/assets/enemies/catfish/base/idle-2.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Black-hurt.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Black-idle-1.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Black-idle-2.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Blue-hurt.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Blue-idle-1.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Blue-idle-2.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Pink-hurt.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Pink-idle-1.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Pink-idle-2.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Yellow-hurt.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Yellow-idle-1.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/Yellow-idle-2.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/hurt.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/idle-1.png': '',
    'duck-quest/assets/enemies/cool-seagull/base/idle-2.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Blue-hurt.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Blue-idle-1.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Blue-idle-2.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Gold-hurt.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Gold-idle-1.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Gold-idle-2.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Pink-hurt.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Pink-idle-1.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Pink-idle-2.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Purple-hurt.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Purple-idle-1.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/Purple-idle-2.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/hurt.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/idle-1.png': '',
    'duck-quest/assets/enemies/sea-turtle/base/idle-2.png': '',
          }

          for relative_path, encoded in files.items():
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))

          print(f"Created {len(files)} organized Ocean assets.")
          PY

          # Safety checks: make sure all intended groups were actually created.
          test "$(find duck-quest/assets/backgrounds/ocean -type f -name '*.png' | wc -l)" -eq 4
          test "$(find duck-quest/assets/enemies/cool-seagull/base -type f -name '*.png' | wc -l)" -eq 15
          test "$(find duck-quest/assets/enemies/sea-turtle/base -type f -name '*.png' | wc -l)" -eq 15
          test "$(find duck-quest/assets/enemies/catfish/base -type f -name '*.png' | wc -l)" -eq 15
          test "$(find duck-quest/assets/bosses/vampire-squid/base -type f -name '*.png' | wc -l)" -eq 15

          echo "All 64 Ocean assets verified."

      - name: Commit Ocean assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove this one-time workflow after it succeeds.
          rm -f .github/workflows/add-ocean-duck-quest-assets.yml

          git add -A

          if git diff --cached --quiet; then
            echo "Ocean assets are already present. Nothing to commit."
            exit 0
          fi

          git commit -m "Add organized Ocean Duck Quest assets"
          git push

          echo "Ocean assets added successfully."

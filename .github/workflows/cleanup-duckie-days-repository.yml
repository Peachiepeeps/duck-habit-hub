name: One-time Duckie Days Repository Cleanup

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-duckie-days-repository.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-one-time-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove obsolete update and workflow files
        shell: bash
        run: |
          set -euo pipefail

          echo "Current app version:"
          cat version.json || true

          rm -f -- \
            "Duckie-Days-v24.279-mimic-portraits-peep-update-only.zip" \
            "Duckie-Days-v24.280-Workflow-Upload-Bundle.zip" \
            "Duckie-Days-v24.286-workflow-yml.zip" \
            "DuckieDays_v24_280_Update.zip.zip" \
            "install-duckie-days-v24-214-exp-candy-use-button 2.yml" \
            "UPDATE-v24.270.txt" \
            "UPDATE-v24.280.txt" \
            "UPDATE-v24.281.txt" \
            "UPDATE-v24.282.txt" \
            "UPDATE-v24.283.txt" \
            "UPDATE-v24.284.txt" \
            "UPDATE-v24.285.txt" \
            ".github/workflows/duckie-v24-271-retry.yaml" \
            ".github/workflows/install_v24_280.yml" \
            ".github/workflows/retry-duckie-days-v24-270-workshop-buddy-details.yaml"

          # This cleanup workflow is one-time-use, so remove it too.
          rm -f -- ".github/workflows/cleanup-duckie-days-repository.yml"

      - name: Show cleanup result
        shell: bash
        run: |
          set -euo pipefail
          echo "Remaining workflow files:"
          find .github/workflows -maxdepth 1 -type f -print 2>/dev/null || true

          echo
          echo "Remaining root ZIP/YAML update artifacts:"
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.yml" -o -name "*.yaml" \) -print || true

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing needed cleaning."
            exit 0
          fi

          git commit -m "Clean obsolete update and workflow files"
          git push

          for rel,expected_sha in EXPECTED.items():
              p=Path(rel)
              if p.is_symlink() or (p.exists() and (not p.is_file() or digest(p)!=expected_sha)):
                  raise SystemExit('An outdated file changed since export; no cleanup performed: '+rel)
          
          removed=[]
          for rel in EXPECTED:
              p=Path(rel)
              if p.exists():
                  p.unlink()
                  removed.append(rel)
          Path('README.md').write_text(README_TEXT,encoding='utf-8')
          Path('CLEANUP-AUDIT.md').write_text(AUDIT_TEXT,encoding='utf-8')
          print(f'Removed {len(removed)} inactive files; all active game files preserved.')

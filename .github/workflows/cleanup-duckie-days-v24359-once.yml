name: Duckie Days - One-time cleanup of retired installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-retired-installers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Remove obsolete installer workflows (game files untouched)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('version.json').read_text()).get('version')
          if version != '24.359':
              raise SystemExit(f'Expected game version 24.359, found {version!r}. No cleanup performed.')
          for required in ('index.html', 'app.js', 'app.css', 'sw.js', 'duck-quest/index.html', 'trading-cards-base.js'):
              if not Path(required).is_file():
                  raise SystemExit(f'Game file absent: {required}. No cleanup performed.')
          PY
          git rm -f --ignore-unmatch -- \
            '.github/workflows/cleanup-duckie-days-v24-346.yml' \
            '.github/workflows/install-duckie-days-v24-347-stoplight-owl-chonk-fix-corrected.yml' \
            '.github/workflows/install-duckie-days-v24-347-stoplight-owl-chonk-fix.yml' \
            '.github/workflows/install-duckie-days-v24-348-owl-light-nudge.yml' \
            '.github/workflows/install-duckie-days-v24-349-city-owl-fix.yml' \
            '.github/workflows/install-duckie-days-v24-350-trading-card-shop.yml' \
            '.github/workflows/install-duckie-days-v24-351-variants-artwork-mimic-fix-corrected.yml' \
            '.github/workflows/install-duckie-days-v24-351-variants-artwork-mimic-fix-verified.yml' \
            '.github/workflows/install-duckie-days-v24-351-variants-artwork-mimic-fix.yml' \
            '.github/workflows/install-duckie-days-v24-352-egg-love-sweetheart.yml' \
            '.github/workflows/install-duckie-days-v24-353-fashion-holo.yml' \
            '.github/workflows/install-duckie-days-v24-356 2.yml' \
            '.github/workflows/install-duckie-days-v24-359-path-fixed.yml' \
            'install-duckie-days-v24-350-trading-card-shop.yml'
          # Remove this temporary maintenance workflow after using it.
          git rm -f --ignore-unmatch -- '.github/workflows/cleanup-duckie-days-v24359-once.yml'
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=D'],text=True).splitlines()
          allowed = {
              '.github/workflows/cleanup-duckie-days-v24-346.yml',
              '.github/workflows/install-duckie-days-v24-347-stoplight-owl-chonk-fix-corrected.yml',
              '.github/workflows/install-duckie-days-v24-347-stoplight-owl-chonk-fix.yml',
              '.github/workflows/install-duckie-days-v24-348-owl-light-nudge.yml',
              '.github/workflows/install-duckie-days-v24-349-city-owl-fix.yml',
              '.github/workflows/install-duckie-days-v24-350-trading-card-shop.yml',
              '.github/workflows/install-duckie-days-v24-351-variants-artwork-mimic-fix-corrected.yml',
              '.github/workflows/install-duckie-days-v24-351-variants-artwork-mimic-fix-verified.yml',
              '.github/workflows/install-duckie-days-v24-351-variants-artwork-mimic-fix.yml',
              '.github/workflows/install-duckie-days-v24-352-egg-love-sweetheart.yml',
              '.github/workflows/install-duckie-days-v24-353-fashion-holo.yml',
              '.github/workflows/install-duckie-days-v24-356 2.yml',
              '.github/workflows/install-duckie-days-v24-359-path-fixed.yml',
              'install-duckie-days-v24-350-trading-card-shop.yml',
              '.github/workflows/cleanup-duckie-days-v24359-once.yml',
          }
          if not set(changed).issubset(allowed):
              raise SystemExit(f'Unexpected staged deletions: {sorted(set(changed)-allowed)}')
          print(f'Removing {len(changed)} obsolete installer/maintenance files; no game code or assets are staged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
          else
            git commit -m 'Maintenance: remove retired one-time installer workflows'
            git push origin HEAD:main
          fi

name: One-time Duckie Days Versioned Files Cleanup

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-unreferenced-versioned-files.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-versioned-files-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate current live version before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.286"' version.json
          grep -Fq 'script-v24-201.js?v=24-286' index.html
          grep -Fq 'style-v24-201.css?v=24-254' index.html
          grep -Fq 'hub-v286.css?v=24-286' index.html
          grep -Fq "importScripts('./sw-v24-286.js?v=24-286');" sw.js

      - name: Remove clearly unreferenced old root version files
        shell: bash
        run: |
          set -euo pipefail
          rm -f --             script-v24-200.js             style-v24-200.css             sw-v24-270.js \
            sw-v24-271.js \
            sw-v24-272.js \
            sw-v24-273.js \
            sw-v24-274.js \
            sw-v24-275.js \
            sw-v24-276.js \
            sw-v24-277.js \
            sw-v24-278.js \
            sw-v24-280.js \
            sw-v24-281.js \
            sw-v24-282.js \
            sw-v24-283.js \
            sw-v24-284.js \
            sw-v24-285.js

          # One-time workflow: remove itself too.
          rm -f -- .github/workflows/cleanup-unreferenced-versioned-files.yml

      - name: Show remaining root version files
        shell: bash
        run: |
          set -euo pipefail
          echo 'Remaining root script/style/sw files:'
          find . -maxdepth 1 -type f \( -name 'script-v*.js' -o -name 'style-v*.css' -o -name 'sw-v*.js' -o -name 'sw.js' \) | sort

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing needed cleaning.'
            exit 0
          fi
          git commit -m "Clean old unreferenced root version files"
          git push

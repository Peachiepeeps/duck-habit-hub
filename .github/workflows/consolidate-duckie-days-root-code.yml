name: Consolidate Duckie Days Root Code v24.287

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/consolidate-duckie-days-root-code.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-287-root-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm current app version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.286"' version.json
          test -f hub-v286.css
          test -f sw-v24-286.js

      - name: Build clean current files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          code = base64.b64decode("").decode("utf-8")
          exec(compile(code, "duckie_refactor_v24287.py", "exec"))
          PY

      - name: Validate consolidated app
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js
          node --check hub-boosts.js
          node --check hub.js
          node --check trading-cards-base.js
          node --check trading-cards-extra.js
          node --check trading-cards-ui.js
          node --check tasks.js
          node --check task-reminders.js
          node --check firebase-reminders.mjs
          node --check sw.js

          grep -Fq 'app.css?v=24.287' index.html
          grep -Fq 'hub.css?v=24.287' index.html
          grep -Fq 'tasks.js?v=24.287' index.html
          grep -Fq 'trading-cards-ui.js?v=24.287' index.html
          grep -Fq 'firebase-reminders.mjs?v=24.287' index.html
          grep -Fq 'duck-habit-build" content="24.287"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.287";' index.html

          grep -Fq '../trading-cards-base.js?v=24.287' duck-quest/index.html
          grep -Fq '../trading-cards-extra.js?v=24.287' duck-quest/index.html
          grep -Fq '../trading-cards-base.js?v=24.287' crane-game/play-v24-40.html
          grep -Fq '../trading-cards-base.js?v=24.287' memory-game/index.html

          grep -Fq "duck-habit-hub-app-v24-287" sw.js
          grep -Fq "./hub.css?v=24.287" sw.js
          grep -Fq "./trading-cards-base.js?v=24.287" sw.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          m=re.search(r'const APP_SHELL=\[(.*?)\];',sw,re.S)
          assert m, 'APP_SHELL missing'
          missing=[]
          for entry in re.findall(r"'([^']+)'",m.group(1)):
              if not entry.startswith('./'):
                  continue
              rel=entry.split('?',1)[0][2:]
              if not rel:
                  continue
              if not (root/rel).exists():
                  missing.append(entry)
          assert not missing, f'Missing cached files: {missing}'
          print('All service-worker app-shell paths exist.')
          PY

          if find . -maxdepth 1 -type f \( \
            -name 'hub-v*.css' -o -name 'hub-v*.js' \
            -o -name 'task-progression-v*' -o -name 'task-reminders-v*' \
            -o -name 'firebase-reminders-v*' \
            -o -name 'trading-cards-v*' -o -name 'trading-cards-ui-v*' \
            -o -name 'script-v24-201.js' -o -name 'style-v24-201.css' \
            -o -name 'sw-v24-*.js' \
          \) | grep -q .; then
            echo "ERROR: old numbered root files remain"
            find . -maxdepth 1 -type f | sort
            exit 1
          fi

          echo
          echo "Clean root code files:"
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.css' \) -printf '%f\n' | sort

      - name: Remove this one-time workflow
        shell: bash
        run: |
          rm -f ".github/workflows/consolidate-duckie-days-root-code.yml"

      - name: Commit v24.287 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: no consolidation changes were staged."
            exit 1
          fi
          git commit -m "Consolidate root code for easier Duckie Days development"
          git push

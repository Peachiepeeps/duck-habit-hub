name: Fix Duck Quest folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repo history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Duck Quest placement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Creating a safety backup branch..."
          BACKUP_BRANCH="backup-before-duck-quest-folder-fix-${GITHUB_RUN_ID}"
          git branch "$BACKUP_BRANCH" HEAD
          git push origin "$BACKUP_BRANCH"

          echo "Creating duck-quest folder..."
          mkdir -p duck-quest

          echo "Saving the Duck Quest page inside its proper folder..."
          # The current root index is the Duck Quest index that was uploaded by mistake.
          if grep -q "<title>Duck Quest</title>" index.html 2>/dev/null; then
            cp index.html duck-quest/index.html
          fi

          echo "Moving Duck Quest assets/code out of the repo root..."
          if [ -f "bee-hurt.png" ]; then git mv "bee-hurt.png" "duck-quest/bee-hurt.png"; fi
          if [ -f "bee-idle-1-high.png" ]; then git mv "bee-idle-1-high.png" "duck-quest/bee-idle-1-high.png"; fi
          if [ -f "bee-idle-2-low.png" ]; then git mv "bee-idle-2-low.png" "duck-quest/bee-idle-2-low.png"; fi
          if [ -f "cat-slime-idle-1-neutral.png" ]; then git mv "cat-slime-idle-1-neutral.png" "duck-quest/cat-slime-idle-1-neutral.png"; fi
          if [ -f "cat-slime-idle-2-squish.png" ]; then git mv "cat-slime-idle-2-squish.png" "duck-quest/cat-slime-idle-2-squish.png"; fi
          if [ -f "cat-slime-idle-3-bounce.png" ]; then git mv "cat-slime-idle-3-bounce.png" "duck-quest/cat-slime-idle-3-bounce.png"; fi
          if [ -f "chest-closed.png" ]; then git mv "chest-closed.png" "duck-quest/chest-closed.png"; fi
          if [ -f "chest-open.png" ]; then git mv "chest-open.png" "duck-quest/chest-open.png"; fi
          if [ -f "flower-hurt.png" ]; then git mv "flower-hurt.png" "duck-quest/flower-hurt.png"; fi
          if [ -f "flower-idle-1.png" ]; then git mv "flower-idle-1.png" "duck-quest/flower-idle-1.png"; fi
          if [ -f "flower-idle-2.png" ]; then git mv "flower-idle-2.png" "duck-quest/flower-idle-2.png"; fi
          if [ -f "game-v01.js" ]; then git mv "game-v01.js" "duck-quest/game-v01.js"; fi
          if [ -f "meadow-stage-1-tree.png" ]; then git mv "meadow-stage-1-tree.png" "duck-quest/meadow-stage-1-tree.png"; fi
          if [ -f "meadow-stage-2-bushes.png" ]; then git mv "meadow-stage-2-bushes.png" "duck-quest/meadow-stage-2-bushes.png"; fi
          if [ -f "meadow-stage-3-flowers.png" ]; then git mv "meadow-stage-3-flowers.png" "duck-quest/meadow-stage-3-flowers.png"; fi
          if [ -f "meadow-stage-4-boss.png" ]; then git mv "meadow-stage-4-boss.png" "duck-quest/meadow-stage-4-boss.png"; fi
          if [ -f "mimic-open-1.png" ]; then git mv "mimic-open-1.png" "duck-quest/mimic-open-1.png"; fi
          if [ -f "mimic-open-2.png" ]; then git mv "mimic-open-2.png" "duck-quest/mimic-open-2.png"; fi
          if [ -f "mushroom-cat-hurt.png" ]; then git mv "mushroom-cat-hurt.png" "duck-quest/mushroom-cat-hurt.png"; fi
          if [ -f "mushroom-cat-idle-1.png" ]; then git mv "mushroom-cat-idle-1.png" "duck-quest/mushroom-cat-idle-1.png"; fi
          if [ -f "mushroom-cat-idle-2.png" ]; then git mv "mushroom-cat-idle-2.png" "duck-quest/mushroom-cat-idle-2.png"; fi
          if [ -f "peep-attack.png" ]; then git mv "peep-attack.png" "duck-quest/peep-attack.png"; fi
          if [ -f "peep-hurt.png" ]; then git mv "peep-hurt.png" "duck-quest/peep-hurt.png"; fi
          if [ -f "peep-idle-1.png" ]; then git mv "peep-idle-1.png" "duck-quest/peep-idle-1.png"; fi
          if [ -f "peep-idle-2.png" ]; then git mv "peep-idle-2.png" "duck-quest/peep-idle-2.png"; fi
          if [ -f "style-v01.css" ]; then git mv "style-v01.css" "duck-quest/style-v01.css"; fi

          echo "Moving the Duck Quest README if it overwrote the root README..."
          if [ -f README.txt ] && grep -q "DUCK QUEST v0.1" README.txt; then
            cp README.txt duck-quest/README.txt
          fi

          echo "Restoring the correct Duck Habit Hub v24.42 homepage..."
          printf '%s' '' | base64 --decode > index.html

          echo "Trying to restore the old Hub README.txt from history..."
          GOOD_README=""
          while read -r COMMIT; do
            if git cat-file -e "${COMMIT}:index.html" 2>/dev/null; then
              HIST_INDEX="$(git show "${COMMIT}:index.html" 2>/dev/null || true)"
              if ! printf '%s' "$HIST_INDEX" | grep -q "<title>Duck Quest</title>"; then
                if git cat-file -e "${COMMIT}:README.txt" 2>/dev/null; then
                  GOOD_README="$COMMIT"
                  break
                fi
              fi
            fi
          done < <(git rev-list HEAD)

          if [ -n "$GOOD_README" ]; then
            git checkout "$GOOD_README" -- README.txt
          else
            # If there was never a root README.txt before, remove the accidental one.
            if [ -f README.txt ] && grep -q "DUCK QUEST v0.1" README.txt; then
              rm README.txt
            fi
          fi

          echo "Removing this one-time workflow after repair..."
          rm -f .github/workflows/fix-duck-quest-folder.yml

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing needed changing."
            exit 0
          fi

          git commit -m "Move Duck Quest into its proper folder"
          git push

          echo "Done!"
          echo "Safety backup branch: $BACKUP_BRANCH"

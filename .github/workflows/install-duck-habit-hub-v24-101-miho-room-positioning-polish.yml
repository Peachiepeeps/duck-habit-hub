name: Install Duck Habit Hub v24.101 Miho + Room Positioning Polish

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-101-Miho-Room-Positioning-Polish-UPDATE-ONLY.zip"
      - "*v24-101*Miho*Room*Positioning*Polish*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-101-Miho-Room-Positioning-Polish-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-101*miho*room*positioning*polish*update*only*.zip' -o -iname '*v24.101*miho*room*positioning*polish*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.101"' version.json \
              && [ -f "script-v24-101.js" ] \
              && [ -f "style-v24-101.css" ] \
              && [ -f "duck-quest/js/game-v47.js" ] \
              && [ -f "duck-quest/css/style-v41.css" ] \
              && grep -Fq 'script-v24-101.js' index.html \
              && grep -Fq 'js/game-v47.js' duck-quest/index.html; then
              echo "v24.101 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.101 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "index.html" \
            "script-v24-101.js" \
            "style-v24-101.css" \
            "sw.js" \
            "version.json" \
            "duck-quest/index.html" \
            "duck-quest/js/game-v47.js" \
            "duck-quest/css/style-v41.css"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.101 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-101-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          rm -f script-v24-100.js style-v24-100.css

          grep -Fq 'DUCK_HUB_BUILD = "24.101"' index.html
          grep -Fq 'script-v24-101.js' index.html
          grep -Fq 'style-v24-101.css' index.html
          grep -Fq 'css/style-v41.css' duck-quest/index.html
          grep -Fq 'js/game-v47.js' duck-quest/index.html
          grep -Fq 'label: "Short Hair"' script-v24-101.js
          grep -Fq 'label: "White Skirt"' script-v24-101.js
          grep -Fq 'const mihoBackToFront = [' script-v24-101.js
          grep -Fq 'top: 54.5' script-v24-101.js
          grep -Fq 'transform:scaleY(1.075)' style-v24-101.css
          grep -Fq 'data-character-id="miho"' style-v24-101.css
          grep -Fq 'miho-active' duck-quest/js/game-v47.js
          grep -Fq 'bottom:7% !important' duck-quest/css/style-v41.css
          grep -Fq '"version": "24.101"' version.json

          node --check script-v24-101.js
          node --check duck-quest/js/game-v47.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.101 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.101 Miho and room positioning polish"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Install Duck Habit Hub v24.103 Miho Exact Layering Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-103-Miho-Exact-Layering-Fix-UPDATE-ONLY.zip"
      - "*v24-103*Miho*Exact*Layering*Fix*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-103-Miho-Exact-Layering-Fix-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-103*miho*exact*layering*fix*update*only*.zip' -o -iname '*v24.103*miho*exact*layering*fix*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.103"' version.json \
              && [ -f "script-v24-103.js" ] \
              && grep -Fq 'script-v24-103.js' index.html; then
              echo "v24.103 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.103 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "index.html" \
            "script-v24-103.js" \
            "sw.js" \
            "version.json"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.103 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-103-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          rm -f script-v24-102.js

          grep -Fq 'DUCK_HUB_BUILD = "24.103"' index.html
          grep -Fq 'script-v24-103.js' index.html
          grep -Fq 'const mihoBackToFront = [' script-v24-103.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('script-v24-103.js').read_text()
          block = text.split('const mihoBackToFront = [',1)[1].split('];',1)[0]
          expected = [
              '"hair-main", "hair-long"',
              '"bow", "bow-low"',
              '"base"',
              '"legwear-stockings", "legwear-stockings-laceup"',
              '"shoes-boots", "shoes-booties"',
              '"bottom-skirt", "bottom-slit-skirt", "bottom-shorts"',
              '"top-shirt", "top-button-shirt"',
              '"belt", "neck-bow"',
              '"jacket-black", "jacket-red"',
              '"expression-neutral", "expression-happy", "expression-sad", "expression-shocked", "expression-mad"',
              '"bangs"'
          ]
          pos=-1
          for item in expected:
              nxt=block.find(item,pos+1)
              if nxt < 0:
                  raise SystemExit(f'Missing or misordered Miho layer group: {item}')
              pos=nxt
          PY
          grep -Fq '"version": "24.103"' version.json

          node --check script-v24-103.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.103 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.103 Miho exact layering fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

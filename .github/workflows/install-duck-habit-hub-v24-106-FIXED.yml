name: Install Duck Habit Hub v24.106 Room Wallpaper + Shiny Update

on:
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-106-update-only.zip"
      - "Duck-Habit-Hub-v24-106-Room-Wallpaper-Shiny-UPDATE-ONLY.zip"
      - "*v24-106*UPDATE*ONLY*.zip"
      - "*v24-106*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.106 update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""

          # First try the two filenames that have been supplied for this update.
          for candidate in \
            "duck-habit-hub-v24-106-update-only.zip" \
            "Duck-Habit-Hub-v24-106-Room-Wallpaper-Shiny-UPDATE-ONLY.zip"; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          # If it was renamed, inspect root ZIPs and find the one that actually
          # contains the v24.106 update files. This makes manual reruns forgiving.
          if [ -z "$ZIP" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if unzip -Z1 "$candidate" 2>/dev/null | grep -Fqx "script-v24-106.js" \
                && unzip -Z1 "$candidate" 2>/dev/null | grep -Fqx "style-v24-106.css" \
                && unzip -Z1 "$candidate" 2>/dev/null | grep -Fqx "duck-quest/js/game-v48.js"; then
                ZIP="$candidate"
                break
              fi
            done < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort)
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.106"' version.json \
              && [ -f "script-v24-106.js" ] \
              && [ -f "style-v24-106.css" ] \
              && grep -Fq 'script-v24-106.js' index.html \
              && grep -Fq 'style-v24-106.css' index.html \
              && grep -Fq 'js/game-v48.js' duck-quest/index.html; then
              echo "v24.106 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::Could not find the v24.106 UPDATE-ONLY ZIP in the repository root."
            echo "Accepted filename: duck-habit-hub-v24-106-update-only.zip"
            echo "It should be uploaded beside index.html."
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "index.html" \
            "script-v24-106.js" \
            "style-v24-106.css" \
            "sw.js" \
            "version.json" \
            "duck-quest/index.html" \
            "duck-quest/js/game-v48.js" \
            "duck-quest/css/style-v42.css"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.106 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-106-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          # Remove only the superseded active-version files.
          rm -f script-v24-105.js style-v24-105.css duck-quest/js/game-v47.js

          grep -Fq 'DUCK_HUB_BUILD = "24.106"' index.html
          grep -Fq 'script-v24-106.js' index.html
          grep -Fq 'style-v24-106.css' index.html
          grep -Fq 'href="css/style-v42.css"' duck-quest/index.html
          grep -Fq 'src="js/game-v48.js"' duck-quest/index.html
          grep -Fq 'duck-habit-hub-app-v24-106' sw.js
          grep -Fq './duck-quest/js/game-v48.js' sw.js
          grep -Fq '"version": "24.106"' version.json
          grep -Fq 'ROOM_STAGE_BACKGROUNDS' script-v24-106.js
          grep -Fq 'const SHINY_RATE = 1 / 250;' duck-quest/js/game-v48.js

          node --check script-v24-106.js
          node --check duck-quest/js/game-v48.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.106 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.106 room wallpaper + shiny update"
          git push origin "HEAD:${GITHUB_REF_NAME}"

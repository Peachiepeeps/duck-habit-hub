name: Install Duck Habit Hub v24.107 Room Layout + Wallpaper Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-107-update-only.zip"
      - "Duck-Habit-Hub-v24-107-*-UPDATE-ONLY.zip"
      - "*v24-107*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.107 update ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""

          for CANDIDATE in \
            "duck-habit-hub-v24-107-update-only.zip" \
            "Duck-Habit-Hub-v24-107-Room-Layout-Wallpaper-Fix-UPDATE-ONLY.zip"; do
            if [ -f "$CANDIDATE" ]; then
              ZIP="$CANDIDATE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -iname '*v24-107*update*only*.zip' -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f version.json ] \
              && grep -Fq '"version": "24.107"' version.json \
              && [ -f script-v24-107.js ] \
              && [ -f style-v24-107.css ] \
              && grep -Fq 'script-v24-107.js' index.html \
              && grep -Fq 'style-v24-107.css' index.html; then
              echo "v24.107 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::Could not find the v24.107 UPDATE-ONLY ZIP in the repository root."
            echo "Upload duck-habit-hub-v24-107-update-only.zip beside index.html, then run this workflow again."
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update ZIP
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-107.js \
            style-v24-107.css \
            sw.js \
            version.json; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.107
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-107-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          # Remove only the immediately superseded root JS/CSS files.
          rm -f script-v24-106.js style-v24-106.css

          grep -Fq 'DUCK_HUB_BUILD = "24.107"' index.html
          grep -Fq 'script-v24-107.js' index.html
          grep -Fq 'style-v24-107.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-107' sw.js
          grep -Fq '"version": "24.107"' version.json
          grep -Fq 'goose-shelf-perch' script-v24-107.js
          grep -Fq 'V24.107 — TALL PHONE ROOM ANCHOR' style-v24-107.css

          node --check script-v24-107.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.107 room layout + wallpaper fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

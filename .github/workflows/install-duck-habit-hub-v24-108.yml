name: Install Duck Habit Hub v24.108 Quest Charms

on:
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-108-update-only.zip"
      - "*v24*108*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="duck-habit-hub-v24-108-update-only.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f -iname '*v24*108*update*only*.zip' -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f version.json ] \
              && grep -Fq '"version": "24.108"' version.json \
              && [ -f script-v24-108.js ] \
              && [ -f style-v24-108.css ] \
              && [ -f duck-quest/js/game-v49.js ] \
              && [ -f duck-quest/css/style-v43.css ]; then
              echo "v24.108 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.108 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload the update ZIP beside index.html, then run this workflow again."
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "index.html" \
            "script-v24-108.js" \
            "style-v24-108.css" \
            "sw.js" \
            "version.json" \
            "duck-quest/index.html" \
            "duck-quest/js/game-v49.js" \
            "duck-quest/css/style-v43.css" \
            "duck-quest/assets/charms/Charm-metal.png" \
            "duck-quest/assets/charms/Charm-sparkle.png" \
            "duck-quest/assets/charms/Charm-heart.png" \
            "duck-quest/assets/charms/Charm-duck.png" \
            "duck-quest/assets/charms/Charm-beak.png" \
            "duck-quest/assets/charms/Charm-outline.png"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.108 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-108-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          rm -f script-v24-107.js style-v24-107.css
          rm -f duck-quest/js/game-v48.js duck-quest/css/style-v42.css

          grep -Fq 'DUCK_HUB_BUILD = "24.108"' index.html
          grep -Fq 'script-v24-108.js' index.html
          grep -Fq 'style-v24-108.css' index.html
          grep -Fq 'href="css/style-v43.css"' duck-quest/index.html
          grep -Fq 'src="js/game-v49.js"' duck-quest/index.html
          grep -Fq 'id="charmScreen"' duck-quest/index.html
          grep -Fq 'const BASE_SHINY_RATE = 1 / 500;' duck-quest/js/game-v49.js
          grep -Fq 'shimmer-rose-gold' duck-quest/js/game-v49.js
          grep -Fq 'ensureDuckipediaRoseGoldShimmerCharm' script-v24-108.js
          grep -Fq '"version": "24.108"' version.json

          node --check script-v24-108.js
          node --check duck-quest/js/game-v49.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.108 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.108 Quest Charms"
          git push origin "HEAD:${GITHUB_REF_NAME}"

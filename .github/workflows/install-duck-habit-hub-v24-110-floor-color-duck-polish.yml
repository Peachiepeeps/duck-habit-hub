name: Install Duck Habit Hub v24.110 Floor Color + Duck Polish

on:
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-110-update-only.zip"
      - "*v24-110*update*only*.zip"
      - "*v24.110*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="duck-habit-hub-v24-110-update-only.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-110*update*only*.zip' -o -iname '*v24.110*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f version.json ] \
              && grep -Fq '"version": "24.110"' version.json \
              && [ -f script-v24-110.js ] \
              && [ -f style-v24-110.css ] \
              && grep -Fq 'script-v24-110.js' index.html \
              && grep -Fq 'style-v24-110.css' index.html; then
              echo "v24.110 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The v24.110 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload it beside index.html. Expected: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in index.html script-v24-110.js style-v24-110.css sw.js version.json; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.110 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-110-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          rm -f script-v24-109.js style-v24-109.css

          grep -Fq 'DUCK_HUB_BUILD = "24.110"' index.html
          grep -Fq 'script-v24-110.js' index.html
          grep -Fq 'style-v24-110.css' index.html
          grep -Fq 'syncRoomStageBackgroundFromImage' script-v24-110.js
          grep -Fq 'duck-habit-hub-app-v24-110' sw.js
          grep -Fq '"version": "24.110"' version.json

          node --check script-v24-110.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.110 floor color + duck polish"
          git push origin "HEAD:${GITHUB_REF_NAME}"

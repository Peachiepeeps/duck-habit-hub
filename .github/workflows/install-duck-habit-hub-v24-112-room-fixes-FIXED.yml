name: Install Duck Habit Hub v24.112 Room Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-112-room-fixes-update-only.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="duck-habit-hub-v24-112-room-fixes-update-only.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP beside index.html without unzipping or renaming it."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            index.html \
            script-v24-112.js \
            style-v24-112.css \
            sw.js \
            version.json \
            duck-quest/index.html \
            duck-quest/js/game-v49.js \
            duck-quest/css/style-v43.css; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || {
              echo "ERROR: Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.112 update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="duck-habit-hub-v24-112-room-fixes-update-only.zip"
          TMP=".duckhub-v24-112-update"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/." ./

          # Remove only Hub files replaced by this update.
          rm -f script-v24-110.js style-v24-110.css
          rm -f script-v24-111.js style-v24-111.css
          rm -f script-v24-64.js style-v24-64.css sw-v24-64.js

          grep -Fq 'DUCK_HUB_BUILD = "24.112"' index.html
          grep -Fq 'script-v24-112.js' index.html
          grep -Fq 'style-v24-112.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-112' sw.js
          grep -Fq '"version": "24.112"' version.json
          grep -Fq 'js/game-v49.js' duck-quest/index.html
          grep -Fq 'css/style-v43.css' duck-quest/index.html

          node --check script-v24-112.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.112 room fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

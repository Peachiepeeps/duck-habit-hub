name: Install Duck Habit Hub v24.112 Room Fixes

on:
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-112-room-fixes-update-only.zip"
      - "*v24-112*room*fixes*update*only*.zip"
      - "*v24.112*room*fixes*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.112 package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="duck-habit-hub-v24-112-room-fixes-update-only.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-112*room*fixes*update*only*.zip' -o -iname '*v24.112*room*fixes*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f version.json ] \
              && grep -Fq '"version": "24.112"' version.json \
              && [ -f script-v24-112.js ] \
              && [ -f style-v24-112.css ] \
              && grep -Fq 'script-v24-112.js' index.html \
              && grep -Fq 'style-v24-112.css' index.html \
              && grep -Fq 'js/game-v49.js' duck-quest/index.html \
              && grep -Fq 'css/style-v43.css' duck-quest/index.html; then
              echo "v24.112 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The v24.112 ZIP is not in the repository root."
            echo "Upload it beside index.html. Expected: $EXPECTED"
            exit 1
          fi

          echo "Found package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify v24.112 package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-112.js \
            style-v24-112.css \
            sw.js \
            version.json \
            duck-quest/index.html \
            duck-quest/js/game-v49.js \
            duck-quest/css/style-v43.css; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.112 on top of current app
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-112-room-fixes"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -f "$TMP/index.html" ./index.html
          cp -f "$TMP/script-v24-112.js" ./script-v24-112.js
          cp -f "$TMP/style-v24-112.css" ./style-v24-112.css
          cp -f "$TMP/sw.js" ./sw.js
          cp -f "$TMP/version.json" ./version.json

          mkdir -p ./duck-quest/js ./duck-quest/css
          cp -f "$TMP/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$TMP/duck-quest/js/game-v49.js" ./duck-quest/js/game-v49.js
          cp -f "$TMP/duck-quest/css/style-v43.css" ./duck-quest/css/style-v43.css

          # Clean out superseded Hub file versions.
          rm -f script-v24-64.js style-v24-64.css sw-v24-64.js
          rm -f script-v24-110.js style-v24-110.css
          rm -f script-v24-111.js style-v24-111.css

          grep -Fq 'DUCK_HUB_BUILD = "24.112"' index.html
          grep -Fq 'script-v24-112.js' index.html
          grep -Fq 'style-v24-112.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-112' sw.js
          grep -Fq '"version": "24.112"' version.json
          grep -Fq 'js/game-v49.js' duck-quest/index.html
          grep -Fq 'css/style-v43.css' duck-quest/index.html
          grep -Fq 'transform:translateY(-34%)' style-v24-112.css
          grep -Fq 'bottom: 11.8%' style-v24-112.css
          grep -Fq 'sameIoOutfit' script-v24-112.js

          node --check script-v24-112.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed v24.112 room fixes
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.112 room fixes"
          git push origin "HEAD:${{ GITHUB_REF_NAME }}"

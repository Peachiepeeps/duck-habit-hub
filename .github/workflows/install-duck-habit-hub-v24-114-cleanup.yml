name: Install Duck Habit Hub v24.114 + Clean Repository

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-114-cleanup-update-only.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-114-cleanup-update-only.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP beside index.html without unzipping or renaming it."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-114.js \
            style-v24-114.css \
            sw.js \
            version.json \
            README-v24.114-CLEANUP.txt \
            duck-quest/index.html \
            duck-quest/js/game-v49.js \
            duck-quest/css/style-v43.css; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || {
              echo "ERROR: Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.114
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-114-cleanup-update-only.zip"
          TMP=".duckhub-v24-114-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.114"' index.html
          grep -Fq 'script-v24-114.js' index.html
          grep -Fq 'style-v24-114.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-114' sw.js
          grep -Fq '"version": "24.114"' version.json
          grep -Fq 'js/game-v49.js' duck-quest/index.html
          grep -Fq 'css/style-v43.css' duck-quest/index.html
          node --check script-v24-114.js
          node --check sw.js
          rm -rf "$TMP"

      - name: Clean superseded repository files
        shell: bash
        run: |
          set -euo pipefail

          # Old Hub JS/CSS versions; keep only v24.114.
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-114.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-114.css' -delete

          # Old version notes and root installer YAMLs.
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.114-CLEANUP.txt' -delete
          find . -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' -delete

          # Old installer/archive ZIPs. The current ZIP is removed after install too.
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v*.zip' -delete

          # Duck Quest: keep only the versions used by the current index.
          find duck-quest -maxdepth 1 -type f -name 'README-v*.txt' -delete
          find duck-quest -maxdepth 1 -type f -name 'battle-v*.html' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v49.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v43.css' -delete

          # Remove old Duck Habit installer workflows, but keep this cleanup workflow.
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' \
              ! -name 'install-duck-habit-hub-v24-114-cleanup.yml' -delete
          fi

      - name: Verify cleaned repository
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f script-v24-114.js
          test -f style-v24-114.css
          test -f sw.js
          test -f version.json
          test -f duck-quest/index.html
          test -f duck-quest/js/game-v49.js
          test -f duck-quest/css/style-v43.css

          # Make sure active mini-game files were not touched.
          test -f crane-game/script-v24-40.js
          test -f crane-game/style-v24-40.css
          test -f memory-game/script-v24-44.js
          test -f memory-game/style-v24-42.css
          test -f sort-game/script-v24-32.js
          test -f sort-game/style-v24-31.css

          # Fail if superseded Hub or Duck Quest versions remain.
          test -z "$(find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-114.js' -print -quit)"
          test -z "$(find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-114.css' -print -quit)"
          test -z "$(find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v49.js' -print -quit)"
          test -z "$(find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v43.css' -print -quit)"

      - name: Commit v24.114 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Install v24.114 and clean superseded files"
          git push origin "HEAD:${GITHUB_REF_NAME}"

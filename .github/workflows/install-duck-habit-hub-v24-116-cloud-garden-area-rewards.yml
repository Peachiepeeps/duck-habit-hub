name: Install Duck Habit Hub v24.116 Cloud Garden + Area Rewards

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-116-cloud-garden-area-rewards-update-only.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-116-cloud-garden-area-rewards-update-only.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP beside index.html without unzipping or renaming it."
            exit 1
          fi

          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-116.js \
            style-v24-116.css \
            sw.js \
            version.json \
            README-v24.116-CLOUD-GARDEN-AREA-REWARDS.txt \
            assets/peep/Daisy-Crown.png \
            assets/peep/Sunglasses.png \
            assets/peep/Halo.png \
            assets/miko/Daisy-Crown.png \
            assets/miko/Sunglasses.png \
            assets/miko/Halo.png \
            assets/io/Daisy-Crown.png \
            assets/io/Sunglasses.png \
            assets/io/Halo.png \
            assets/miho/Daisy-Crown.png \
            assets/miho/Sunglasses.png \
            assets/miho/Halo.png \
            assets/ui/daisy-crown-reward.png \
            assets/ui/sunglasses-reward.png \
            assets/ui/halo-reward.png \
            duck-quest/index.html \
            duck-quest/js/game-v51.js \
            duck-quest/css/style-v45.css \
            duck-quest/assets/backgrounds/cloud/stage-1-stairs.png \
            duck-quest/assets/backgrounds/cloud/stage-2-pillar.png \
            duck-quest/assets/backgrounds/cloud/stage-3-top.png \
            duck-quest/assets/backgrounds/cloud/stage-4-star-boss.png \
            duck-quest/assets/enemies/catterpillar/base/idle-1.png \
            duck-quest/assets/enemies/catterpillar/base/shiny-idle-1.png \
            duck-quest/assets/enemies/sea-star/base/idle-1.png \
            duck-quest/assets/enemies/sea-star/base/shiny-idle-1.png \
            duck-quest/assets/enemies/star-mouse/base/idle-1.png \
            duck-quest/assets/enemies/puff-fairy/base/idle-1.png \
            duck-quest/assets/enemies/tulipa/base/idle-1.png \
            duck-quest/assets/enemies/snoud/base/idle-1.png \
            duck-quest/assets/enemies/cloud-bunny/base/idle-1.png \
            duck-quest/assets/enemies/lunar-moth/base/idle-1.png \
            duck-quest/assets/bosses/aries/base/idle-1.png \
            duck-quest/assets/bosses/aries/base/shiny-idle-1.png \
            duck-quest/assets/bosses/cherub-duck/base/idle-1.png \
            duck-quest/assets/bosses/cherub-duck/base/shiny-idle-1.png; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || {
              echo "ERROR: Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.116
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-116-cloud-garden-area-rewards-update-only.zip"
          TMP=".duckhub-v24-116-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.116"' index.html
          grep -Fq 'script-v24-116.js' index.html
          grep -Fq 'style-v24-116.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-116' sw.js
          grep -Fq '"version": "24.116"' version.json
          grep -Fq 'js/game-v51.js' duck-quest/index.html
          grep -Fq 'css/style-v45.css' duck-quest/index.html
          grep -Fq 'data-area="cloud"' duck-quest/index.html
          grep -Fq 'maxRank:40' duck-quest/js/game-v51.js
          grep -Fq 'maxRank:100' duck-quest/js/game-v51.js
          grep -Fq 'maxRank:150' duck-quest/js/game-v51.js
          grep -Fq '["star-mouse","puff-fairy"]' duck-quest/js/game-v51.js
          grep -Fq '["cloud-bunny","lunar-moth"]' duck-quest/js/game-v51.js
          grep -Fq 'const ENDLESS_BOSSES' duck-quest/js/game-v51.js
          grep -Fq '"aries","cherub-duck"' duck-quest/js/game-v51.js
          grep -Fq 'AREA_CLEAR_CLOSET_REWARDS' duck-quest/js/game-v51.js
          grep -Fq 'daisy-crown' duck-quest/js/game-v51.js
          grep -Fq 'ocean-sunglasses' duck-quest/js/game-v51.js
          grep -Fq 'playShinyArrivalSparkle' duck-quest/js/game-v51.js
          grep -Fq 'Daisy Crown is locked' script-v24-116.js
          grep -Fq 'Sunglasses are locked' script-v24-116.js
          grep -Fq 'Halo is locked' script-v24-116.js

          node --check script-v24-116.js
          node --check duck-quest/js/game-v51.js
          node --check sw.js
          rm -rf "$TMP"

      - name: Clean superseded repository files
        shell: bash
        run: |
          set -euo pipefail

          # Old Hub JS/CSS versions; keep only v24.116.
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-116.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-116.css' -delete

          # Old version notes and root installer YAMLs.
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.116-CLOUD-GARDEN-AREA-REWARDS.txt' -delete
          find . -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' -delete

          # Old installer/archive ZIPs. The current installer ZIP is removed after install too.
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v*.zip' -delete

          # Duck Quest: keep only the versions used by the current index.
          find duck-quest -maxdepth 1 -type f -name 'README-v*.txt' -delete
          find duck-quest -maxdepth 1 -type f -name 'battle-v*.html' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v51.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v45.css' -delete

          # Remove old Duck Habit installer workflows, but keep this one.
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' \
              ! -name 'install-duck-habit-hub-v24-116-cloud-garden-area-rewards.yml' -delete
          fi

      - name: Verify installed game and cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f script-v24-116.js
          test -f style-v24-116.css
          test -f sw.js
          test -f version.json
          test -f README-v24.116-CLOUD-GARDEN-AREA-REWARDS.txt
          test -f duck-quest/index.html
          test -f duck-quest/js/game-v51.js
          test -f duck-quest/css/style-v45.css

          # Universal area-clear closet rewards.
          for OC in peep miko io miho; do
            test -f "assets/$OC/Daisy-Crown.png"
            test -f "assets/$OC/Sunglasses.png"
            test -f "assets/$OC/Halo.png"
          done
          test -f assets/ui/daisy-crown-reward.png
          test -f assets/ui/sunglasses-reward.png
          test -f assets/ui/halo-reward.png

          # New Cloud Garden + new Meadow/Ocean enemy assets.
          test -f duck-quest/assets/backgrounds/cloud/stage-1-stairs.png
          test -f duck-quest/assets/backgrounds/cloud/stage-2-pillar.png
          test -f duck-quest/assets/backgrounds/cloud/stage-3-top.png
          test -f duck-quest/assets/backgrounds/cloud/stage-4-star-boss.png
          test -f duck-quest/assets/enemies/catterpillar/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/sea-star/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/star-mouse/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/puff-fairy/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/tulipa/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/snoud/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/cloud-bunny/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/lunar-moth/base/shiny-idle-1.png
          test -f duck-quest/assets/bosses/aries/base/shiny-idle-1.png
          test -f duck-quest/assets/bosses/cherub-duck/base/shiny-idle-1.png

          # Make sure active mini-game files were not touched.
          test -f crane-game/play-v24-40.html
          test -f crane-game/script-v24-40.js
          test -f crane-game/style-v24-40.css
          test -f memory-game/index.html
          test -f memory-game/script-v24-44.js
          test -f memory-game/style-v24-42.css
          test -f sort-game/index.html
          test -f sort-game/script-v24-32.js
          test -f sort-game/style-v24-31.css

          # Fail if superseded Hub or Duck Quest versions remain.
          test -z "$(find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-116.js' -print -quit)"
          test -z "$(find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-116.css' -print -quit)"
          test -z "$(find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v51.js' -print -quit)"
          test -z "$(find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v45.css' -print -quit)"

      - name: Commit v24.116
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Install v24.116 Cloud Garden and area rewards"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Install Duck Habit Hub v24.117 Io + Smack + Shelf Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-117-io-smack-shelf-fixes-update-only.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-117-io-smack-shelf-fixes-update-only.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP beside index.html without unzipping or renaming it."
            exit 1
          fi

          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-117.js \
            style-v24-117.css \
            sw.js \
            version.json \
            README-v24.117-IO-SMACK-SHELF-FIXES.txt \
            duck-quest/index.html \
            duck-quest/js/game-v52.js; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || {
              echo "ERROR: Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Verify v24.116 prerequisite assets
        shell: bash
        run: |
          set -euo pipefail
          # v24.117 is a small repair update on top of v24.116. These checks keep
          # the workflow from silently installing over a repo that missed Cloud Garden.
          test -f duck-quest/css/style-v45.css
          test -f duck-quest/assets/backgrounds/cloud/stage-4-star-boss.png
          test -f assets/io/Halo.png
          test -f assets/io/Daisy-Crown.png
          test -f assets/io/Sunglasses.png

      - name: Install v24.117
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-117-io-smack-shelf-fixes-update-only.zip"
          TMP=".duckhub-v24-117-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.117"' index.html
          grep -Fq 'script-v24-117.js' index.html
          grep -Fq 'style-v24-117.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-117' sw.js
          grep -Fq '"version": "24.117"' version.json
          grep -Fq 'js/game-v52.js' duck-quest/index.html

          # Requested fixes.
          grep -Fq 'ioWardrobePurchaseRecoveryV24117' script-v24-117.js
          grep -Fq 'recoverIoPurchasedWardrobeOnce' script-v24-117.js
          grep -Fq '{ left: 11.7, top: 94.4, width: 11.5 }' script-v24-117.js
          grep -Fq 'grid-template-rows: 211fr 242fr 248fr 242fr 229fr 254fr' style-v24-117.css
          grep -Fq 'height: 132.0371vw' style-v24-117.css
          grep -Fq 'const MIHO_SKILLS' duck-quest/js/game-v52.js
          python - <<'PY'
          from pathlib import Path
          s = Path('duck-quest/js/game-v52.js').read_text()
          for name in ('PEEP_SKILLS','MIKO_SKILLS','IO_SKILLS','MIHO_SKILLS'):
              start = s.index('const ' + name)
              end = s.index('];', start) + 2
              assert 'just-a-smack' in s[start:end], f'{name} is missing Just a smack!'
          PY

          node --check script-v24-117.js
          node --check duck-quest/js/game-v52.js
          node --check sw.js
          rm -rf "$TMP"

      - name: Clean superseded repository files
        shell: bash
        run: |
          set -euo pipefail

          # Old Hub JS/CSS versions; keep only v24.117.
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-117.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-117.css' -delete

          # Old version notes and root installer YAMLs.
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.117-IO-SMACK-SHELF-FIXES.txt' -delete
          find . -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' -delete

          # Old installer/archive ZIPs. The current installer ZIP is removed after install too.
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v*.zip' -delete

          # Duck Quest: keep only the versions used by the current index.
          find duck-quest -maxdepth 1 -type f -name 'README-v*.txt' -delete
          find duck-quest -maxdepth 1 -type f -name 'battle-v*.html' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v52.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v45.css' -delete

          # Remove old Duck Habit installer workflows, but keep this one.
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' \
              ! -name 'install-duck-habit-hub-v24-117-io-smack-shelf-fixes.yml' -delete
          fi

      - name: Verify installed game and cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f script-v24-117.js
          test -f style-v24-117.css
          test -f sw.js
          test -f version.json
          test -f README-v24.117-IO-SMACK-SHELF-FIXES.txt
          test -f duck-quest/index.html
          test -f duck-quest/js/game-v52.js
          test -f duck-quest/css/style-v45.css

          # v24.116 content must remain intact.
          test -f duck-quest/assets/backgrounds/cloud/stage-1-stairs.png
          test -f duck-quest/assets/backgrounds/cloud/stage-4-star-boss.png
          test -f duck-quest/assets/enemies/catterpillar/base/shiny-idle-1.png
          test -f duck-quest/assets/enemies/sea-star/base/shiny-idle-1.png
          test -f duck-quest/assets/bosses/aries/base/shiny-idle-1.png
          test -f duck-quest/assets/bosses/cherub-duck/base/shiny-idle-1.png
          for OC in peep miko io miho; do
            test -f "assets/$OC/Daisy-Crown.png"
            test -f "assets/$OC/Sunglasses.png"
            test -f "assets/$OC/Halo.png"
          done

          # Make sure active mini-game files were not touched.
          test -f crane-game/play-v24-40.html
          test -f crane-game/script-v24-40.js
          test -f crane-game/style-v24-40.css
          test -f memory-game/index.html
          test -f memory-game/script-v24-44.js
          test -f memory-game/style-v24-42.css
          test -f sort-game/index.html
          test -f sort-game/script-v24-32.js
          test -f sort-game/style-v24-31.css

          # Fail if superseded Hub or Duck Quest versions remain.
          test -z "$(find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-117.js' -print -quit)"
          test -z "$(find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-117.css' -print -quit)"
          test -z "$(find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v52.js' -print -quit)"
          test -z "$(find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v45.css' -print -quit)"

      - name: Commit v24.117
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Install v24.117 Io, Smack, and shelf fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

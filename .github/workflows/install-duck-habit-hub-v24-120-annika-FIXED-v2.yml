name: Install Duck Habit Hub v24.120 Annika FIXED v2

"on":
  workflow_dispatch:
  push:
    paths:
      - "*24-120*annika*.zip"
      - "*24.120*annika*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find Annika update ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find . -maxdepth 1 -type f \
              \( -iname '*24-120*annika*.zip' -o -iname '*24.120*annika*.zip' \) \
              -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "${ZIP:-}" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: I could not find the v24.120 Annika update ZIP in the repository root."
            echo "Upload the Annika update ZIP beside index.html, then run this workflow again."
            exit 1
          fi

          echo "Using update package: $ZIP"
          echo "ANNIKA_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$ANNIKA_ZIP"

          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            index.html \
            script-v24-120.js \
            style-v24-120.css \
            sw.js \
            version.json \
            assets/oc-invitations/Annika-invitation.png \
            assets/ducks/annika-duck.png \
            assets/thumbs/ducks/annika-duck.webp \
            duck-quest/index.html \
            duck-quest/js/game-v54.js; do
            if ! grep -Fqx "$REQUIRED" <<<"$LISTING"; then
              echo "ERROR: Update ZIP is missing: $REQUIRED"
              exit 1
            fi
          done

      - name: Install v24.120
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$ANNIKA_ZIP"
          TMP=".duckhub-v24-120-annika"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./

          # The ZIP contains the original installer workflow. Preserve the
          # FIXED workflow that is currently running instead of committing
          # the older copy back into the repository.
          if git ls-files --error-unmatch '.github/workflows/install-duck-habit-hub-v24-120-annika-FIXED.yml' >/dev/null 2>&1; then
            git checkout -- '.github/workflows/install-duck-habit-hub-v24-120-annika-FIXED.yml'
          fi

          # Remove the old installer copy bundled with the update package so
          # it cannot create a second failing workflow later.
          rm -f '.github/workflows/install-duck-habit-hub-v24-120-annika.yml'
          rm -f 'install-duck-habit-hub-v24-120-annika.yml'

          grep -Fq 'DUCK_HUB_BUILD = "24.120"' index.html
          grep -Fq 'script-v24-120.js' index.html
          grep -Fq 'style-v24-120.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-120' sw.js
          grep -Fq 'js/game-v54.js' duck-quest/index.html
          grep -Fq 'id: "annika"' script-v24-120.js
          grep -Fq 'const ANNIKA_ASSETS =' script-v24-120.js
          grep -Fq 'const ANNIKA_SKILLS =' duck-quest/js/game-v54.js

          node --check script-v24-120.js
          node --check duck-quest/js/game-v54.js
          node --check sw.js

          rm -rf "$TMP"

      - name: Clean superseded files
        shell: bash
        run: |
          set -euo pipefail

          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-120.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-120.css' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v54.js' -delete

          # Delete the installer ZIP after a successful extraction so the
          # repository stays tidy. Quoting handles iPad-renamed files too.
          rm -f -- "$ANNIKA_ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.120 Annika"
          git push

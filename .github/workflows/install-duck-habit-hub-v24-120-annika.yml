name: Install Duck Habit Hub v24.120 Annika

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-120-annika-update-only.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-120-annika-update-only.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-120.js \
            style-v24-120.css \
            sw.js \
            version.json \
            assets/oc-invitations/Annika-invitation.png \
            assets/ducks/annika-duck.png \
            assets/thumbs/ducks/annika-duck.webp \
            duck-quest/index.html \
            duck-quest/js/game-v54.js; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || exit 1
          done
      - name: Verify v24.119 prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test -f script-v24-119.js
          test -f style-v24-119.css
          test -f duck-quest/js/game-v53.js
      - name: Install v24.120
        shell: bash
        run: |
          set -euo pipefail
          TMP=.duckhub-v24-120
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q duck-habit-hub-v24-120-annika-update-only.zip -d "$TMP"
          cp -a "$TMP/." ./
          node --check script-v24-120.js
          node --check duck-quest/js/game-v54.js
          node --check sw.js
          rm -rf "$TMP"
      - name: Clean superseded files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-120.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-120.css' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v54.js' -delete
      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Duck Habit Hub v24.120 Annika"
          git push

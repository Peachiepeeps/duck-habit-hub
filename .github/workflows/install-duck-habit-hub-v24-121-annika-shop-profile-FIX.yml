name: Install Duck Habit Hub v24.121 Annika Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-121*annika*.zip"
      - "*v24-121*Annika*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find v24.121 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          FOUND=""
          shopt -s nullglob
          for ZIP in ./*.zip; do
            if unzip -Z1 "$ZIP" 2>/dev/null | grep -Fqx 'script-v24-121.js'; then
              FOUND="${ZIP#./}"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "ERROR: Could not find the v24.121 update ZIP in the repository root."
            echo "Upload the v24.121 ZIP beside index.html, then run this workflow again."
            exit 1
          fi
          echo "UPDATE_ZIP=$FOUND" >> "$GITHUB_ENV"
          echo "Using $FOUND"

      - name: Install and verify v24.121
        shell: bash
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-121-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -tq "$UPDATE_ZIP"
          unzip -q "$UPDATE_ZIP" -d "$TMP"

          for REQUIRED in \
            index.html \
            script-v24-121.js \
            style-v24-121.css \
            sw.js \
            version.json \
            duck-quest/index.html \
            duck-quest/js/game-v55.js; do
            test -f "$TMP/$REQUIRED" || { echo "ERROR: ZIP missing $REQUIRED"; exit 1; }
          done

          cp -a "$TMP/." ./
          rm -rf "$TMP"

          grep -Fq 'DUCK_HUB_BUILD = "24.121"' index.html
          grep -Fq 'Annika Invitation' script-v24-121.js
          grep -Fq 'assets/oc-invitations/Annika-invitation.png' script-v24-121.js
          grep -Fq 'profile-avatar[data-character-id="annika"]' style-v24-121.css
          grep -Fq 'id:"stop", name:"Stop!", unlock:10, type:"stun", duration:2' duck-quest/js/game-v55.js
          grep -Fq 'sprite:"assets/characters/annika/base/stop.webp"' duck-quest/js/game-v55.js
          grep -Fq '"version": "24.121"' version.json

          test -f assets/oc-invitations/Annika-invitation.png
          test -f assets/annika/Annika-hair-ribbon.png
          test -f duck-quest/assets/characters/annika/base/stop.webp

          node --check script-v24-121.js
          node --check duck-quest/js/game-v55.js
          node --check sw.js

      - name: Clean superseded installer/version files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-121.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-121.css' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v55.js' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.121-ANNIKA-SHOP-PROFILE-FIX.txt' -delete
          rm -f "$UPDATE_ZIP"
          find .github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-121-annika-shop-profile-FIX.yml' -delete

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.121 Annika fixes"
          git push

name: Install Duck Habit Hub v24.122 Annika + Buddy Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-122-annika-buddy-polish*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find update ZIP
        id: findzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'duck-habit-hub-v24-122-annika-buddy-polish*.zip' -printf '%f\n' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Could not find the v24.122 update ZIP in the repository root."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          unzip -tq "$ZIP"

      - name: Install v24.122
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.findzip.outputs.zip }}"
          TMP=".duckhub-v24-122-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

          grep -Fq 'DUCK_HUB_BUILD = "24.122"' index.html
          grep -Fq 'script-v24-122.js' index.html
          grep -Fq 'style-v24-122.css' index.html
          grep -Fq 'js/game-v56.js' duck-quest/index.html
          grep -Fq 'css/style-v47.css' duck-quest/index.html
          grep -Fq 'const BASE_SHINY_RATE = 1 / 500' duck-quest/js/game-v56.js
          grep -Fq 'battlefield?.classList.toggle("annika-active",isAnnika)' duck-quest/js/game-v56.js
          grep -Fq 'function startBuddyIdle' duck-quest/js/game-v56.js
          grep -Fq 'legwear-bow-left' script-v24-122.js
          grep -Fq 'shirt-sheer' script-v24-122.js

          node --check script-v24-122.js
          node --check duck-quest/js/game-v56.js
          node --check sw.js

      - name: Clean superseded version files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-122.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-122.css' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v56.js' -delete
          find ./duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v47.css' -delete
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v24-122-annika-buddy-polish*.zip' -delete

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.122 Annika and Buddy polish"
          git push

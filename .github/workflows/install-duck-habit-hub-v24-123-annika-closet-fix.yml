name: Install Duck Habit Hub v24.123 Annika Closet Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-123-annika-closet-fix*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find update ZIP
        id: findzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'duck-habit-hub-v24-123-annika-closet-fix*.zip' -printf '%f\n' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Could not find the v24.123 update ZIP in the repository root."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          unzip -tq "$ZIP"

      - name: Install v24.123
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.findzip.outputs.zip }}"
          TMP=".duckhub-v24-123-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

          grep -Fq 'DUCK_HUB_BUILD = "24.123"' index.html
          grep -Fq 'script-v24-123.js' index.html
          grep -Fq 'style-v24-123.css' index.html
          grep -Fq '"version": "24.123"' version.json
          grep -Fq 'function renderAnnikaBowStockingsCard' script-v24-123.js
          grep -Fq 'function showAnnikaBowStockingPopover' script-v24-123.js
          grep -Fq 'if (annikaUnlocks.has("outer-sheer")) annikaUnlocks.add("shirt-sheer")' script-v24-123.js
          grep -Fq '"hair-long", "hair-ponytail",' script-v24-123.js
          grep -Fq '"back-bow-circus",' script-v24-123.js

          test -f duck-quest/js/game-v56.js
          test -f duck-quest/css/style-v47.css
          node --check script-v24-123.js
          node --check duck-quest/js/game-v56.js
          node --check sw.js

      - name: Clean superseded version files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-123.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-123.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.123-ANNIKA-CLOSET-FIX.txt' -delete
          find . -maxdepth 1 -type f -name 'install-duck-habit-hub-v24-*.yml' ! -name 'install-duck-habit-hub-v24-123-annika-closet-fix.yml' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-v24-*.yml' ! -name 'install-duck-habit-hub-v24-123-annika-closet-fix.yml' -delete
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v24-123-annika-closet-fix*.zip' -delete

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.123 Annika closet fixes"
          git push

name: Install Duck Habit Hub v24.125 Quest Menu Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-125*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find and verify v24.125 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          shopt -s nullglob
          for candidate in ./*.zip; do
            LISTING="$(unzip -Z1 "$candidate" 2>/dev/null || true)"
            if grep -Fqx 'script-v24-125.js' <<<"$LISTING" \
              && grep -Fqx 'duck-quest/js/game-v58.js' <<<"$LISTING" \
              && grep -Fqx 'duck-quest/css/style-v49.css' <<<"$LISTING"; then
              ZIP="$candidate"
              break
            fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: Could not find the v24.125 Quest Menu update ZIP in the repository root."
            exit 1
          fi
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-125.js \
            style-v24-125.css \
            sw.js \
            version.json \
            README-v24.125-QUEST-MENU.txt \
            duck-quest/index.html \
            duck-quest/js/game-v58.js \
            duck-quest/css/style-v49.css; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "ERROR: ZIP is missing $REQUIRED"; exit 1; }
          done
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Install v24.125
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.package.outputs.zip }}'
          TMP=".duckhub-v24-125-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DUCK_HUB_BUILD = "24.125"' index.html
          grep -Fq 'script-v24-125.js' index.html
          grep -Fq 'style-v24-125.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-125' sw.js
          grep -Fq '"version": "24.125"' version.json
          grep -Fq 'css/style-v49.css' duck-quest/index.html
          grep -Fq 'js/game-v58.js' duck-quest/index.html
          grep -Fq 'id="routePickerModal"' duck-quest/index.html
          grep -Fq 'id="skillBookModal"' duck-quest/index.html
          grep -Fq 'id="openSkillBook"' duck-quest/index.html
          grep -Fq 'id="openBuddyCollection"' duck-quest/index.html
          grep -Fq 'cream-fox-fighter' duck-quest/js/game-v58.js
          grep -Fq 'openRoutePicker' duck-quest/js/game-v58.js
          grep -Fq 'maybeShowAffectionMilestone' duck-quest/js/game-v58.js
          grep -Fq 'area-option.candy-area-option' duck-quest/css/style-v49.css
          grep -Fq 'grid-column:auto!important' duck-quest/css/style-v49.css
          node --check script-v24-125.js
          node --check duck-quest/js/game-v58.js
          node --check sw.js

      - name: Clean superseded installer and version files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-125.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-125.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.125-QUEST-MENU.txt' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v58.js' -delete
          find ./duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v49.css' -delete
          find . -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' -delete
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v*.zip' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-125-quest-menu-polish.yml' -delete

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.125 Quest menu polish"
          git push

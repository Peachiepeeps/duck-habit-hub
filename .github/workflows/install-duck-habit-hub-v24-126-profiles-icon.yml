name: Install Duckie Days v24.126 Profiles + Icon

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-126-profiles-icon*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find and verify v24.126 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          shopt -s nullglob
          for candidate in ./*.zip; do
            LISTING="$(unzip -Z1 "$candidate" 2>/dev/null || true)"
            if grep -Fqx 'script-v24-126.js' <<<"$LISTING" \
              && grep -Fqx 'icon-512-v5.png' <<<"$LISTING" \
              && grep -Fqx 'manifest.webmanifest' <<<"$LISTING"; then
              ZIP="$candidate"
              break
            fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: Could not find the v24.126 Profiles + Icon update ZIP in the repository root."
            exit 1
          fi
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-126.js \
            style-v24-126.css \
            manifest.webmanifest \
            sw.js \
            version.json \
            duck-hub-cache-reset.html \
            README.md \
            README-v24.126-PROFILES-ICON.txt \
            apple-touch-icon-v5.png \
            favicon-32-v5.png \
            icon-192-v5.png \
            icon-512-v5.png \
            icon-maskable-512-v5.png; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "ERROR: ZIP is missing $REQUIRED"; exit 1; }
          done
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Install v24.126
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.package.outputs.zip }}'
          TMP=".duckhub-v24-126-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DUCK_HUB_BUILD = "24.126"' index.html
          grep -Fq 'script-v24-126.js' index.html
          grep -Fq 'style-v24-126.css' index.html
          grep -Fq '<title>Duckie Days</title>' index.html
          grep -Fq 'apple-touch-icon-v5.png' index.html
          grep -Fq 'favicon-32-v5.png' index.html
          grep -Fq 'duck-habit-hub-app-v24-126' sw.js
          grep -Fq 'icon-maskable-512-v5.png' sw.js
          grep -Fq '"version": "24.126"' version.json
          grep -Fq '"name": "Duckie Days"' manifest.webmanifest
          grep -Fq '"short_name": "Duckie Days"' manifest.webmanifest
          grep -Fq '"src": "icon-512-v5.png"' manifest.webmanifest
          grep -Fq '"src": "icon-maskable-512-v5.png"' manifest.webmanifest
          grep -Fq 'favoriteItem: "Add favorite item(s) here"' script-v24-126.js
          grep -Fq 'description: "Add character description here"' script-v24-126.js
          grep -Fq 'priceText: "Invite Miko to the hub and unlock his default wardrobe."' script-v24-126.js
          grep -Fq 'css/style-v49.css' duck-quest/index.html
          grep -Fq 'js/game-v58.js' duck-quest/index.html
          test -s apple-touch-icon-v5.png
          test -s favicon-32-v5.png
          test -s icon-192-v5.png
          test -s icon-512-v5.png
          test -s icon-maskable-512-v5.png
          node --check script-v24-126.js
          node --check duck-quest/js/game-v58.js
          node --check sw.js

      - name: Clean superseded installer and version files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-126.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-126.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.126-PROFILES-ICON.txt' -delete
          find . -maxdepth 1 -type f -name 'apple-touch-icon-v*.png' ! -name 'apple-touch-icon-v5.png' -delete
          find . -maxdepth 1 -type f -name 'favicon-32-v*.png' ! -name 'favicon-32-v5.png' -delete
          find . -maxdepth 1 -type f -name 'icon-192-v*.png' ! -name 'icon-192-v5.png' -delete
          find . -maxdepth 1 -type f -name 'icon-512-v*.png' ! -name 'icon-512-v5.png' -delete
          find . -maxdepth 1 -type f -name 'icon-maskable-512-v*.png' ! -name 'icon-maskable-512-v5.png' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v58.js' -delete
          find ./duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v49.css' -delete
          find . -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' -delete
          find . -maxdepth 1 -type f -iname 'duck-habit-hub-v*.zip' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-126-profiles-icon.yml' -delete

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.126 profiles and icon"
          git push

name: Install Duckie Days v24.127 Buddy Book Mobile Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-127-buddy-book-mobile-update-only.zip"
      - "*v24-127*buddy*book*mobile*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.127 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="duck-habit-hub-v24-127-buddy-book-mobile-update-only.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-127*buddy*book*mobile*update*only*.zip' -o -iname '*v24.127*buddy*book*mobile*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f version.json ] \
              && grep -Fq '"version": "24.127"' version.json \
              && [ -f script-v24-127.js ] \
              && [ -f style-v24-127.css ] \
              && [ -f duck-quest/css/style-v50.css ] \
              && grep -Fq 'css/style-v50.css' duck-quest/index.html; then
              echo "v24.127 already appears to be installed. Nothing else is needed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ERROR: Could not find the v24.127 Buddy Book update ZIP in the repository root."
            echo "Upload it beside index.html without unzipping or renaming it."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Verify update package
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-127.js \
            style-v24-127.css \
            sw.js \
            version.json \
            README.md \
            README-v24.127-BUDDY-BOOK-MOBILE.txt \
            duck-quest/index.html \
            duck-quest/css/style-v50.css; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "ERROR: Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.127
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-127-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.127"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.127"' index.html
          grep -Fq 'script-v24-127.js' index.html
          grep -Fq 'style-v24-127.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-127' sw.js
          grep -Fq './duck-quest/css/style-v50.css' sw.js
          grep -Fq '"version": "24.127"' version.json
          grep -Fq 'css/style-v50.css' duck-quest/index.html
          grep -Fq 'js/game-v58.js' duck-quest/index.html
          grep -Fq 'V50 / Hub v24.127 — Buddy Book mobile framing polish' duck-quest/css/style-v50.css
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' duck-quest/css/style-v50.css
          grep -Fq 'width:88% !important' duck-quest/css/style-v50.css
          node --check script-v24-127.js
          node --check duck-quest/js/game-v58.js
          node --check sw.js

      - name: Clean superseded active files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-127.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-127.css' -delete
          find ./duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v50.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.127-BUDDY-BOOK-MOBILE.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-127-buddy-book-mobile.yml' -delete
          rm -f "${{ steps.package.outputs.zip }}"

      - name: Commit installed update
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.127 Buddy Book mobile polish"
          git push

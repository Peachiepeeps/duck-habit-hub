name: Install Duckie Days v24.129 Quest Theme Consistency

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-129-quest-theme-consistency-update-only.zip"
      - "*v24-129*quest*theme*consistency*update*only*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.129 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="duck-habit-hub-v24-129-quest-theme-consistency-update-only.zip"
          ZIP=""
          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-129*quest*theme*consistency*update*only*.zip' -o -iname '*v24.129*quest*theme*consistency*update*only*.zip' \) -printf '%f
' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f version.json ]               && grep -Fq '"version": "24.129"' version.json               && [ -f script-v24-129.js ]               && [ -f style-v24-129.css ]               && [ -f duck-quest/js/game-v60.js ]               && [ -f duck-quest/css/style-v52.css ]               && grep -Fq 'js/game-v60.js' duck-quest/index.html; then
              echo "v24.129 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ERROR: Could not find the v24.129 update ZIP in the repository root."
            echo "Upload it beside index.html without renaming or unzipping it."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in             index.html             script-v24-129.js             style-v24-129.css             sw.js             version.json             README.md             README-v24.129-QUEST-THEME-CONSISTENCY.txt             duck-quest/index.html             duck-quest/js/game-v60.js             duck-quest/css/style-v52.css; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "ERROR: Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.129
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-129-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.129"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.129"' index.html
          grep -Fq 'script-v24-129.js' index.html
          grep -Fq 'style-v24-129.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-129' sw.js
          grep -Fq './duck-quest/js/game-v60.js' sw.js
          grep -Fq './duck-quest/css/style-v52.css' sw.js
          grep -Fq '"version": "24.129"' version.json
          grep -Fq 'css/style-v52.css' duck-quest/index.html
          grep -Fq 'js/game-v60.js' duck-quest/index.html
          grep -Fq 'Miho Silent Space' duck-quest/js/game-v60.js
          grep -Fq 'Quest theme carries into the main hub' script-v24-129.js || true
          node --check script-v24-129.js
          node --check duck-quest/js/game-v60.js
          node --check sw.js

      - name: Clean superseded active files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-129.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-129.css' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v60.js' -delete
          find ./duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v52.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.129-QUEST-THEME-CONSISTENCY.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-129-quest-theme-consistency.yml' -delete
          rm -f "${{ steps.package.outputs.zip }}"

      - name: Commit installed update
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.129 Quest theme consistency"
          git push

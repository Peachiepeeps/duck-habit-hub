name: Install Duckie Days v24.130 Text Edit Repair

"on":
  workflow_dispatch:
  push:
    paths:
      - "duck-habit-hub-v24-130-text-edit-repair-update-only.zip"
      - ".github/workflows/install-duck-habit-hub-v24-130-text-edit-repair.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.130 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="duck-habit-hub-v24-130-text-edit-repair-update-only.zip"

          if [ ! -f "$ZIP" ]; then
            if [ -f "version.json" ] && grep -Fq '"version": "24.130"' version.json && [ -f "script-v24-130.js" ] && [ -f "style-v24-130.css" ]; then
              echo "v24.130 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not find $ZIP in the repository root."
            echo "Upload it beside index.html, then run this workflow again."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            "index.html" \
            "script-v24-130.js" \
            "style-v24-130.css" \
            "sw.js" \
            "version.json" \
            "README-v24.130-TEXT-EDIT-REPAIR.txt"
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.130
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-130-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.130"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.130"' index.html
          grep -Fq 'script-v24-130.js' index.html
          grep -Fq 'style-v24-130.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-130' sw.js
          grep -Fq './script-v24-130.js' sw.js
          grep -Fq './style-v24-130.css' sw.js
          grep -Fq '"version": "24.130"' version.json
          grep -Fq 'nicknamed \"Majo\"' script-v24-130.js
          test -f duck-quest/js/game-v60.js
          test -f duck-quest/css/style-v52.css
          node --check script-v24-130.js
          node --check duck-quest/js/game-v60.js
          node --check sw.js

      - name: Clean superseded root files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-130.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-130.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.130-TEXT-EDIT-REPAIR.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-130-text-edit-repair.yml' -delete
          rm -f "$ZIP"

      - name: Commit installed repair
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Repair Duckie Days v24.130 text edit syntax"
          git push

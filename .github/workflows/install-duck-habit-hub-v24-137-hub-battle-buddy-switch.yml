name: Install Duckie Days v24.137 Hub + Battle Buddy Switch

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-137*hub*battle*buddy*switch*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-137-hub-battle-buddy-switch.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-installer
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.137 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "version.json" ] \
            && grep -Fq '"version": "24.137"' version.json \
            && [ -f "script-v24-137.js" ] \
            && [ -f "style-v24-137.css" ] \
            && [ -f "duck-quest/js/game-v67.js" ] \
            && [ -f "duck-quest/css/style-v59.css" ]; then
            echo "v24.137 already appears to be installed."
            echo "already_installed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f \
            \( -iname '*v24-137*hub*battle*buddy*switch*update-only*.zip' \
            -o -iname '*v24.137*hub*battle*buddy*switch*update-only*.zip' \) \
            -printf '%f\n' | sort | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "::error::Could not find the v24.137 UPDATE-ONLY ZIP in the repository root."
            echo "Upload it beside index.html, then let this workflow run."
            exit 1
          fi

          echo "Using update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            "index.html" \
            "script-v24-137.js" \
            "style-v24-137.css" \
            "sw.js" \
            "version.json" \
            "README-v24.137-HUB-BATTLE-BUDDY-SWITCH.txt" \
            "duck-quest/index.html" \
            "duck-quest/js/game-v67.js" \
            "duck-quest/css/style-v59.css"
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.137
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-137-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.137"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.137"' index.html
          grep -Fq 'script-v24-137.js' index.html
          grep -Fq 'style-v24-137.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-137' sw.js
          grep -Fq './duck-quest/js/game-v67.js' sw.js
          grep -Fq './duck-quest/css/style-v59.css' sw.js
          grep -Fq '"version": "24.137"' version.json
          grep -Fq 'css/style-v59.css' duck-quest/index.html
          grep -Fq 'js/game-v67.js' duck-quest/index.html

          # Hub-polish regression checks.
          grep -Fq 'stage.dataset.characterId = save.selectedCharacter' script-v24-137.js
          grep -Fq 'left: 25.0' script-v24-137.js
          grep -Fq '.stage[data-character-id="peep"] .peep-layer[data-asset="daisy-crown"]' style-v24-137.css
          grep -Fq '.stage.closet-open .book-room-object' style-v24-137.css

          # Six-Buddy battle roster + mobile battle UI checks.
          grep -Fq 'id="switchBuddyMenuButton"' duck-quest/index.html
          grep -Fq 'id="buddySwitchGrid"' duck-quest/index.html
          grep -Fq 'function buddyRecordForSlot' duck-quest/js/game-v67.js
          grep -Fq 'function switchBattleBuddy' duck-quest/js/game-v67.js
          grep -Fq 'buddySwitchUsedThisEncounter' duck-quest/js/game-v67.js
          grep -Fq 'grid-template-areas:' duck-quest/css/style-v59.css
          grep -Fq '.buddy-switch-grid' duck-quest/css/style-v59.css
          grep -Fq 'body:has(#battleScreen:not(.hidden)) .quest-shell' duck-quest/css/style-v59.css

          # Keep the v24.136 chest-freeze regression protection too.
          grep -Fq 'function ensureCurrentRunRewardCollections()' duck-quest/js/game-v67.js
          grep -Fq 'ensureCurrentRunRewardCollections();' duck-quest/js/game-v67.js

          node --check script-v24-137.js
          node --check duck-quest/js/game-v67.js
          node --check sw.js

      - name: Clean superseded active files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-137.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-137.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find ./duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v67.js' -delete
          find ./duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v59.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.137-HUB-BATTLE-BUDDY-SWITCH.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-137-hub-battle-buddy-switch.yml' -delete || true
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.137 hub and battle buddy switch"
          git push

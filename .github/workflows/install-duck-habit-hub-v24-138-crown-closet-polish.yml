name: Install Duckie Days v24.138 Crown + Closet Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-138*crown*closet*polish*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-138-crown-closet-polish.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-installer
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.138 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "version.json" ] \
            && grep -Fq '"version": "24.138"' version.json \
            && [ -f "script-v24-138.js" ] \
            && [ -f "style-v24-138.css" ]; then
            echo "v24.138 already appears to be installed."
            echo "already_installed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f \
            \( -iname '*v24-138*crown*closet*polish*update-only*.zip' \
            -o -iname '*v24.138*crown*closet*polish*update-only*.zip' \) \
            -printf '%f\n' | sort | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "::error::Could not find the v24.138 update ZIP in the repository root."
            echo "Upload the UPDATE-ONLY ZIP beside index.html, then run this workflow again."
            exit 1
          fi

          echo "Using update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            "index.html" \
            "script-v24-138.js" \
            "style-v24-138.css" \
            "sw.js" \
            "version.json" \
            "README-v24.138-CROWN-CLOSET-POLISH.txt"
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.138
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-138-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.138"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.138"' index.html
          grep -Fq 'script-v24-138.js' index.html
          grep -Fq 'style-v24-138.css' index.html
          grep -Fq 'duck-habit-hub-app-v24-138' sw.js
          grep -Fq '"version": "24.138"' version.json
          grep -Fq 'transform:translateX(3.4%)' style-v24-138.css
          grep -Fq '.stage.closet-open .book-room-object' style-v24-138.css
          grep -Fq 'visibility:hidden' style-v24-138.css
          [ -f "duck-quest/js/game-v67.js" ]
          [ -f "duck-quest/css/style-v59.css" ]
          node --check script-v24-138.js
          node --check duck-quest/js/game-v67.js
          node --check sw.js

      - name: Clean superseded active files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-138.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-138.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.138-CROWN-CLOSET-POLISH.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-138-crown-closet-polish.yml' -delete || true
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.138 crown and closet polish"
          git push

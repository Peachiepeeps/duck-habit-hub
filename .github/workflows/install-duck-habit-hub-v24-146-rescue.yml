name: Rescue Install Duckie Days v24.146

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duck-habit-hub-v24-146-rescue.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-146-rescue
  cancel-in-progress: false

jobs:
  rescue-install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find existing v24.146 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "version.json" ] \
            && grep -Fq '"version": "24.146"' version.json \
            && [ -f "script-v24-146.js" ] \
            && [ -f "style-v24-146.css" ] \
            && [ -f "sw-v24-146.js" ]; then
            echo "v24.146 is already installed."
            echo "already_installed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f \
            \( -iname '*v24-146*pwa*update-only*.zip' -o -iname '*v24.146*pwa*update-only*.zip' \) \
            -printf '%f\n' | sort | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "::error::The v24.146 UPDATE-ONLY ZIP is not in the repository root."
            exit 1
          fi

          echo "Found $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "index.html" \
            "script-v24-146.js" \
            "style-v24-146.css" \
            "sw.js" \
            "sw-v24-146.js" \
            "manifest.webmanifest" \
            "version.json" \
            "duck-hub-cache-reset.html"
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.146
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-146-rescue"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.146"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.146"' index.html
          grep -Fq 'script-v24-146.js?v=24-146' index.html
          grep -Fq 'style-v24-146.css?v=24-146' index.html
          grep -Fq 'manifest.webmanifest?v=24-146' index.html
          grep -Fq 'sw-v24-146.js?v=24-146' index.html
          grep -Fq '"version": "24.146"' version.json
          grep -Fq 'top: 82.8' script-v24-146.js
          node --check script-v24-146.js
          node --check sw-v24-146.js

      - name: Clean superseded active files
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-146.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-146.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-146.js' -delete
          rm -f "$ZIP"

      - name: Commit rescued v24.146 install
        if: steps.package.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Rescue install Duckie Days v24.146"
          git push

name: Install Duckie Days v24.148 Pet Bed Duck Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-148*pet-bed*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-148-pet-bed-duck-polish.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-148-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.148 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "version.json" ] \
            && grep -Fq '"version": "24.148"' version.json \
            && [ -f "script-v24-148.js" ] \
            && [ -f "style-v24-148.css" ] \
            && [ -f "sw-v24-148.js" ]; then
            echo "v24.148 is already installed."
            echo "already_installed=true" >> "$GITHUB_OUTPUT"
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f \
            \( -iname '*v24-148*pet-bed*update-only*.zip' -o -iname '*v24.148*pet-bed*update-only*.zip' \) \
            -printf '%f\n' | sort | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "v24.148 workflow is ready, but the update ZIP is not in the repo root yet."
            echo "already_installed=false" >> "$GITHUB_OUTPUT"
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"
          echo "package_found=true" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            "index.html" \
            "script-v24-148.js" \
            "style-v24-148.css" \
            "sw.js" \
            "sw-v24-148.js" \
            "manifest.webmanifest" \
            "version.json" \
            "duck-hub-cache-reset.html" \
            "README-v24.148-PET-BED-DUCK-POLISH.txt"
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.148
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-148-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.148"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.148"' index.html
          grep -Fq 'script-v24-148.js?v=24-148' index.html
          grep -Fq 'style-v24-148.css?v=24-148' index.html
          grep -Fq 'manifest.webmanifest?v=24-148' index.html
          grep -Fq 'sw-v24-148.js?v=24-148' index.html
          grep -Fq '"version": "24.148"' version.json
          grep -Fq '"start_url": "./?appVersion=24.148"' manifest.webmanifest
          grep -Fq 'top: 88.2' script-v24-148.js
          grep -Fq 'width: 14.2' script-v24-148.js
          grep -Fq 'z-index: 24' style-v24-148.css
          node --check script-v24-148.js
          node --check sw-v24-148.js

      - name: Clean superseded active files
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-148.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-148.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-148.js' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.148-PET-BED-DUCK-POLISH.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-148-pet-bed-duck-polish.yml' -delete || true
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.148 pet bed duck polish"
          git push

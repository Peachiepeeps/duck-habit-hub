name: Install Duckie Days v24.150 Pet Bed Duck Final Tweak

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-150*pet-bed*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-150-pet-bed-duck-final-tweak.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-150-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.150 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "version.json" ]             && grep -Fq '"version": "24.150"' version.json             && [ -f "script-v24-150.js" ]             && [ -f "style-v24-150.css" ]             && [ -f "sw-v24-150.js" ]; then
            echo "v24.150 is already installed."
            echo "already_installed=true" >> "$GITHUB_OUTPUT"
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f             \( -iname '*v24-150*pet-bed*update-only*.zip' -o -iname '*v24.150*pet-bed*update-only*.zip' \)             -printf '%f\n' | sort | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "v24.150 workflow is ready, but the update ZIP is not in the repo root yet."
            echo "already_installed=false" >> "$GITHUB_OUTPUT"
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"
          echo "package_found=true" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in             "index.html"             "script-v24-150.js"             "style-v24-150.css"             "sw.js"             "sw-v24-150.js"             "manifest.webmanifest"             "version.json"             "duck-hub-cache-reset.html"             "README-v24.150-PET-BED-DUCK-FINAL-TWEAK.txt"
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.150
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-150-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.150"' index.html
          grep -Fq 'DUCK_HUB_BUILD = "24.150"' index.html
          grep -Fq 'script-v24-150.js?v=24-150' index.html
          grep -Fq 'style-v24-150.css?v=24-150' index.html
          grep -Fq 'manifest.webmanifest?v=24-150' index.html
          grep -Fq 'sw-v24-150.js?v=24-150' index.html
          grep -Fq '"version": "24.150"' version.json
          grep -Fq '"start_url": "./?appVersion=24.150"' manifest.webmanifest
          grep -Fq 'left: 24.4' script-v24-150.js
          grep -Fq 'top: 91.0' script-v24-150.js
          grep -Fq 'width: 16.0' script-v24-150.js
          node --check script-v24-150.js
          node --check sw-v24-150.js

      - name: Clean superseded active files
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-150.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-150.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-150.js' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.150-PET-BED-DUCK-FINAL-TWEAK.txt' -delete
          find ./.github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-150-pet-bed-duck-final-tweak.yml' -delete || true
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.150 pet bed duck final tweak"
          git push

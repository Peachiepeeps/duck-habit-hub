name: Install Duckie Days v24.154 Stitched Border Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-154*update-only*.zip"
      - "*v24.154*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-154-stitched-border-polish-FIXED.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-154-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.154 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f version.json ] \
            && grep -Fq '"version": "24.154"' version.json \
            && [ -f script-v24-154.js ] \
            && [ -f style-v24-154.css ] \
            && [ -f sw-v24-154.js ] \
            && [ -f duck-quest/js/game-v71.js ] \
            && [ -f duck-quest/css/style-v63.css ]; then
            echo "v24.154 is already installed."
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-154*update-only*.zip' -o -iname '*v24.154*update-only*.zip' \) -print | sort | head -n 1 || true)"
          ZIP="${ZIP#./}"

          if [ -z "$ZIP" ]; then
            echo "Workflow is ready. Upload the v24.154 update-only ZIP to the repo root."
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "package_found=true" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            index.html \
            script-v24-154.js \
            style-v24-154.css \
            sw.js \
            sw-v24-154.js \
            manifest.webmanifest \
            version.json \
            duck-hub-cache-reset.html \
            duck-quest/index.html \
            duck-quest/js/game-v71.js \
            duck-quest/css/style-v63.css \
            README-v24.154-STITCHED-BORDER-POLISH.txt
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.154
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-154-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.154"' index.html
          grep -Fq '"version": "24.154"' version.json
          grep -Fq 'script-v24-154.js?v=24-154' index.html
          grep -Fq 'style-v24-154.css?v=24-154' index.html
          grep -Fq 'css/style-v63.css?v=24-154' duck-quest/index.html
          grep -Fq 'js/game-v71.js?v=24-154' duck-quest/index.html
          grep -Fq 'wantsAssist=safeStyleId==="stitched"' duck-quest/js/game-v71.js
          node --check script-v24-154.js
          node --check sw-v24-154.js
          node --check duck-quest/js/game-v71.js

      - name: Clean superseded active files
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-154.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-154.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-154.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v71.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v63.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.154-STITCHED-BORDER-POLISH.txt' -delete
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.154 stitched border polish"
          git push

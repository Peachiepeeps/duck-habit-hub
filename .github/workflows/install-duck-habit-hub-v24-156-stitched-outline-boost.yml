name: Install Duckie Days v24.156 Stitched Outline Boost

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-156*update-only*.zip"
      - "*v24.156*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-156-stitched-outline-boost.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-156-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.156 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f version.json ] \
            && grep -Fq '"version": "24.156"' version.json \
            && [ -f script-v24-156.js ] \
            && [ -f style-v24-156.css ] \
            && [ -f sw-v24-156.js ] \
            && [ -f duck-quest/js/game-v73.js ] \
            && [ -f duck-quest/css/style-v65.css ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP="$(find . -maxdepth 1 -type f \
            \( -iname '*v24-156*update-only*.zip' -o -iname '*v24.156*update-only*.zip' \) \
            -printf '%f\n' | sort | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "Workflow ready; upload the v24.156 update ZIP."
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "package_found=true" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            index.html \
            script-v24-156.js \
            style-v24-156.css \
            sw.js \
            sw-v24-156.js \
            manifest.webmanifest \
            version.json \
            duck-hub-cache-reset.html \
            duck-quest/index.html \
            duck-quest/js/game-v73.js \
            duck-quest/css/style-v65.css \
            README-v24.156-STITCHED-OUTLINE-BOOST.txt
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || { echo "::error::Missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.156
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-156-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="24.156"' index.html
          grep -Fq '"version": "24.156"' version.json
          grep -Fq 'script-v24-156.js?v=24-156' index.html
          grep -Fq 'style-v24-156.css?v=24-156' index.html
          grep -Fq 'css/style-v65.css?v=24-156' duck-quest/index.html
          grep -Fq 'js/game-v73.js?v=24-156' duck-quest/index.html
          grep -Fq 'wantsLightStitchOutline' duck-quest/js/game-v73.js
          grep -Fq 'makeQuestBorderAssistColor' duck-quest/js/game-v73.js
          node --check script-v24-156.js
          node --check sw-v24-156.js
          node --check duck-quest/js/game-v73.js

      - name: Clean superseded active files
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-156.js' ! -name 'shared-ui-theme-v24-131.js' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-156.css' ! -name 'shared-ui-theme-v24-131.css' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-156.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v73.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v65.css' -delete
          find . -maxdepth 1 -type f -name 'README-v24*.txt' ! -name 'README-v24.156-STITCHED-OUTLINE-BOOST.txt' -delete
          find .github/workflows -maxdepth 1 -type f -name 'install-duck-habit-hub-*.yml' ! -name 'install-duck-habit-hub-v24-156-stitched-outline-boost.yml' -delete || true
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Duckie Days v24.156 stitched outline boost"
          git push

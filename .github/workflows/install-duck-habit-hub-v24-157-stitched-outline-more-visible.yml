name: Install Duckie Days v24.157 Stitched Outline More Visible

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-157*update-only*.zip"
      - "*v24.157*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-157-stitched-outline-more-visible.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-157-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate v24.157 update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f version.json ] \
            && grep -Fq '"version": "24.157"' version.json \
            && [ -f script-v24-157.js ] \
            && [ -f style-v24-157.css ] \
            && [ -f sw-v24-157.js ] \
            && [ -f duck-quest/js/game-v74.js ] \
            && [ -f duck-quest/css/style-v66.css ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-157*update-only*.zip' -o -iname '*v24.157*update-only*.zip' \) -printf '%f\n' | sort | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "Workflow is ready; upload the v24.157 update ZIP."
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "package_found=true" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            index.html \
            script-v24-157.js \
            style-v24-157.css \
            sw.js \
            sw-v24-157.js \
            manifest.webmanifest \
            version.json \
            duck-hub-cache-reset.html \
            duck-quest/index.html \
            duck-quest/js/game-v74.js \
            duck-quest/css/style-v66.css \
            README-v24.157-STITCHED-OUTLINE-MORE-VISIBLE.txt
          do
            grep -Fqx "$REQUIRED" <<< "$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.157
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-157-update"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/." ./
          rm -rf "$TMP"

      - name: Verify installed build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.157"' version.json
          grep -Fq 'content="24.157"' index.html
          grep -Fq 'script-v24-157.js?v=24-157' index.html
          grep -Fq 'style-v24-157.css?v=24-157' index.html
          grep -Fq 'css/style-v66.css?v=24-157' duck-quest/index.html
          grep -Fq 'js/game-v74.js?v=24-157' duck-quest/index.html
          grep -Fq 'outlineOffsets' duck-quest/js/game-v74.js
          grep -Fq 'stitchOffsets' duck-quest/js/game-v74.js
          grep -Fq 'r*0.68' duck-quest/js/game-v74.js
          node --check script-v24-157.js
          node --check sw-v24-157.js
          node --check duck-quest/js/game-v74.js

      - name: Remove uploaded update ZIP
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install Duckie Days v24.157 stitched outline boost"
          git push

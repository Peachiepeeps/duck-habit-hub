name: Install Duckie Days v24.162 Double Battle Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-162*update-only*.zip"
      - "*v24.162*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-162-double-battle-polish.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f version.json ] && grep -Fq '"version": "24.162"' version.json; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP=$(find . -maxdepth 1 -type f \( -iname '*v24-162*update-only*.zip' -o -iname '*v24.162*update-only*.zip' \) -printf '%f\n' | sort | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Install update
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          TMP=.duckhub-v24-162-update
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Verify installed build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.162"' version.json
          grep -Fq 'script-v24-162.js?v=24-162' index.html
          grep -Fq 'style-v24-162.css?v=24-162' index.html
          grep -Fq 'js/game-v79.js?v=24-162' duck-quest/index.html
          grep -Fq 'css/style-v71.css?v=24-162' duck-quest/index.html
          grep -Fq 'Sea-turtle-shiny-idle-1.png' duck-quest/js/game-v79.js
          grep -Fq 'Fully clear the secondary slot' duck-quest/js/game-v79.js
          grep -Fq 'v24.162 — Double Trouble readability' duck-quest/css/style-v71.css
          node --check script-v24-162.js
          node --check sw-v24-162.js
          node --check duck-quest/js/game-v79.js

      - name: Commit changes
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install Duckie Days v24.162 double battle polish"
          git push

name: Install Duckie Days v24.167 Hatching Area Redesign

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-167*update-only*.zip"
      - "*v24.167*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-167-hatching-area-redesign.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f \( -iname '*v24-167*update-only*.zip' -o -iname '*v24.167*update-only*.zip' \) | sort | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Install update
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          TMP=.duckhub-v24-167-update
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Verify build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '24.167' version.json
          grep -Fq 'script-v24-167.js?v=24-167' index.html
          grep -Fq 'style-v24-167.css?v=24-167' index.html
          grep -Fq 'js/game-v83.js?v=24-167' duck-quest/index.html
          grep -Fq 'Hatching-background-new.png' duck-quest/js/game-v83.js
          grep -Fq 'Hatch-nest.png' duck-quest/js/game-v83.js
          grep -Fq 'hatchBounce' duck-quest/js/game-v83.js
          grep -Fq "../assets/miko/Miko-angry.PNG" duck-quest/js/game-v83.js
          grep -Fq 'data-asset="ocean-sunglasses"' style-v24-167.css
          test -f duck-quest/assets/eggs/Hatching-background-new.png
          test -f duck-quest/assets/eggs/Hatch-nest.png
          test -f assets/miko/Miko-angry.PNG
          node --check script-v24-167.js
          node --check sw-v24-167.js
          node --check duck-quest/js/game-v83.js

      - name: Commit changes
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install Duckie Days v24.167 Hatching Area redesign"
          git push

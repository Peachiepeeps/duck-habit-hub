name: Install Duckie Days v24.169 Home Hatchery Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24-169*update-only*.zip"
      - "*v24.169*update-only*.zip"
      - ".github/workflows/install-duck-habit-hub-v24-169-home-hatchery-polish.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f \( -iname '*v24-169*update-only*.zip' -o -iname '*v24.169*update-only*.zip' \) | sort | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Install update
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          TMP=.duckhub-v24-169-update
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Verify build
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.169"' version.json
          grep -Fq 'duck-habit-build" content="24.169"' index.html
          grep -Fq 'script-v24-169.js?v=24-169' index.html
          grep -Fq 'style-v24-169.css?v=24-169' index.html
          grep -Fq 'js/game-v85.js?v=24-169' duck-quest/index.html
          grep -Fq 'dq-home-polished' duck-quest/js/game-v85.js
          grep -Fq 'hatchery-fit-screen' duck-quest/js/game-v85.js
          grep -Fq "nth-child(1){top:35.5%" duck-quest/js/game-v85.js
          grep -Fq "nth-child(3){top:83%" duck-quest/js/game-v85.js
          node --check script-v24-169.js
          node --check sw-v24-169.js
          node --check duck-quest/js/game-v85.js

      - name: Commit changes
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install Duckie Days v24.169 home and hatchery polish"
          git push

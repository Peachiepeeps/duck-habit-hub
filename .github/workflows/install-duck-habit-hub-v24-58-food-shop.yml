name: Install Duck Habit Hub v24.58 Food Shop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-food-shop:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-58-Food-Shop.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP to the repo root without unzipping it."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "index.html"
          unzip -l "$ZIP" | grep -q "script-v24-58.js"
          unzip -l "$ZIP" | grep -q "sw-v24-58.js"

      - name: Install Food Shop update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-58-Food-Shop.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-58.js"
          test -f "sw-v24-58.js"

          grep -q 'data-shop-tab="food"' "index.html"
          grep -q 'script-v24-58.js' "index.html"
          grep -q 'sw-v24-58.js' "index.html"

          rm -f "script-v24-57.js" "sw-v24-57.js"
          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Add Food tab to Shop"
          git push origin "HEAD:${GITHUB_REF_NAME}"

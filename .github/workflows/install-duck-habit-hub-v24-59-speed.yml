name: Install Duck Habit Hub v24.59 Speed Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-speed-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-59-Speed-Update.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP to the repo root without unzipping it."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "index.html"
          unzip -l "$ZIP" | grep -q "script-v24-59.js"
          unzip -l "$ZIP" | grep -q "sw-v24-59.js"
          unzip -l "$ZIP" | grep -q "assets/ui/book-room.webp"
          unzip -l "$ZIP" | grep -q "assets/rooms/pink.webp"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/backgrounds/ocean/shore.webp"

          echo "v24.59 speed package verified."

      - name: Install speed update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-59-Speed-Update.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-59.js"
          test -f "sw-v24-59.js"
          test -f "assets/ui/book-room.webp"
          test -f "assets/rooms/pink.webp"
          test -f "duck-quest/assets/backgrounds/ocean/shore.webp"

          grep -q 'script-v24-59.js' "index.html"
          grep -q 'sw-v24-59.js' "index.html"
          grep -q 'assets/ui/mirror.webp' "index.html"

          rm -f "$ZIP"

          echo "v24.59 speed files installed."

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.59 speed update"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "v24.59 speed update committed successfully."

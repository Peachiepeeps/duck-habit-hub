name: Install Duck Habit Hub v24.60 Sprites + Speed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-60-Sprites-and-Speed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP to the repo root without unzipping it."
            exit 1
          fi

          unzip -t "$ZIP"

          unzip -l "$ZIP" | grep -q "script-v24-60.js"
          unzip -l "$ZIP" | grep -q "sw-v24-60.js"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v19.js"
          unzip -l "$ZIP" | grep -q "duck-quest/css/style-v19.css"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/characters/miko/base/gun.webp"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/characters/peep/base/final-move.webp"
          unzip -l "$ZIP" | grep -q "assets/rooms/pink.webp"

          echo "v24.60 package verified."

      - name: Install update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-60-Sprites-and-Speed.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-60.js"
          test -f "sw-v24-60.js"

          test -f "duck-quest/index.html"
          test -f "duck-quest/battle-v19.html"
          test -f "duck-quest/css/style-v19.css"
          test -f "duck-quest/js/game-v19.js"

          test -f "duck-quest/assets/characters/peep/base/heal.webp"
          test -f "duck-quest/assets/characters/peep/base/duck-throw.webp"
          test -f "duck-quest/assets/characters/peep/base/final-move.webp"

          test -f "duck-quest/assets/characters/miko/base/idle-1.webp"
          test -f "duck-quest/assets/characters/miko/base/idle-2.webp"
          test -f "duck-quest/assets/characters/miko/base/mock.webp"
          test -f "duck-quest/assets/characters/miko/base/smug.webp"
          test -f "duck-quest/assets/characters/miko/base/failed-spell.webp"
          test -f "duck-quest/assets/characters/miko/base/gun.webp"

          grep -q 'script-v24-60.js' "index.html"
          grep -q 'sw-v24-60.js' "index.html"
          grep -q 'css/style-v19.css' "duck-quest/index.html"
          grep -q 'js/game-v19.js' "duck-quest/index.html"
          grep -q 'duck-quest/?v=19' "script-v24-60.js"

          # Remove old active code versions only after v24.60 is verified.
          rm -f \
            "script-v24-58.js" \
            "sw-v24-58.js" \
            "script-v24-59.js" \
            "sw-v24-59.js"

          rm -f \
            "duck-quest/battle-v18.html" \
            "duck-quest/css/style-v18.css" \
            "duck-quest/js/game-v18.js" \
            "duck-quest/README-v18.txt"

          # The ZIP is only the transport package.
          rm -f "$ZIP"

          echo "v24.60 installed."

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install v24.60 Duck Quest sprites and speed update"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "v24.60 committed successfully."

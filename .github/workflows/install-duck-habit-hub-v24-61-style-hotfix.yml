name: Install Duck Habit Hub v24.61 Style Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-style-hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify hotfix package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-61-Style-Hotfix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "index.html"
          unzip -l "$ZIP" | grep -q "style-v24-61.css"
          unzip -l "$ZIP" | grep -q "sw-v24-61.js"

      - name: Install stylesheet hotfix
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-61-Style-Hotfix.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "style-v24-61.css"
          test -f "sw-v24-61.js"

          grep -q 'style-v24-61.css' "index.html"
          grep -q 'script-v24-60.js' "index.html"
          grep -q 'sw-v24-61.js' "index.html"

          rm -f "$ZIP"

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Restore Hub stylesheet after v24.60"
          git push origin "HEAD:${GITHUB_REF_NAME}"

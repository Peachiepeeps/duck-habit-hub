name: Install Duck Habit Hub v24.62 UI + Battle Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-polish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-62-UI-Battle-Polish.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "style-v24-62.css"
          unzip -l "$ZIP" | grep -q "sw-v24-62.js"
          unzip -l "$ZIP" | grep -q "duck-quest/css/style-v20.css"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v20.js"

      - name: Install polish update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-62-UI-Battle-Polish.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "style-v24-62.css"
          test -f "sw-v24-62.js"
          test -f "duck-quest/index.html"
          test -f "duck-quest/battle-v20.html"
          test -f "duck-quest/css/style-v20.css"
          test -f "duck-quest/js/game-v20.js"

          grep -q 'style-v24-62.css' "index.html"
          grep -q 'script-v24-60.js' "index.html"
          grep -q 'sw-v24-62.js' "index.html"
          grep -q 'css/style-v20.css' "duck-quest/index.html"
          grep -q 'js/game-v20.js' "duck-quest/index.html"

          rm -f \
            "style-v24-61.css" \
            "sw-v24-61.js" \
            "duck-quest/battle-v19.html" \
            "duck-quest/css/style-v19.css" \
            "duck-quest/js/game-v19.js"

          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Restore UI tweaks and polish Duck Quest battle layout"
          git push origin "HEAD:${GITHUB_REF_NAME}"

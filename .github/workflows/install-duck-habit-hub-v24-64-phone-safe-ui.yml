name: Install Duck Habit Hub v24.64 Phone-Safe UI

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-64-Phone-Safe-UI.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.64 phone-safe UI package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-64-Phone-Safe-UI.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fxq "index.html" <<<"$LISTING"
          grep -Fxq "script-v24-64.js" <<<"$LISTING"
          grep -Fxq "style-v24-64.css" <<<"$LISTING"
          grep -Fxq "sw-v24-64.js" <<<"$LISTING"
          grep -Fxq "duck-quest/index.html" <<<"$LISTING"
          grep -Fxq "duck-quest/battle-v21.html" <<<"$LISTING"
          grep -Fxq "duck-quest/css/style-v21.css" <<<"$LISTING"
          grep -Fxq "duck-quest/js/game-v21.js" <<<"$LISTING"

      - name: Install v24.64 phone-safe UI update
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-64-Phone-Safe-UI.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-64.js"
          test -f "style-v24-64.css"
          test -f "sw-v24-64.js"

          grep -q 'style-v24-64.css' "index.html"
          grep -q 'script-v24-64.js' "index.html"
          grep -q 'sw-v24-64.js' "index.html"

          # Confirm the phone-safe lower-left UI patch is present.
          grep -q 'V24.64 — PHONE-SAFE LOWER-LEFT UI POSITIONING' "style-v24-64.css"
          grep -q 'bottom: 8.3%' "style-v24-64.css"
          grep -q 'top: 77.8%' "style-v24-64.css"

          # Remove only the superseded Hub version files and installer ZIP.
          rm -f \
            "script-v24-63.js" \
            "style-v24-63.css" \
            "sw-v24-63.js" \
            "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Raise lower-left room UI for phone safe area"
          git push origin "HEAD:${GITHUB_REF_NAME}"

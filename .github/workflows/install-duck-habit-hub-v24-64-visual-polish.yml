name: Install Duck Habit Hub v24.64 Visual Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-polish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-64-Visual-Polish.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP to the repo root without unzipping it."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "script-v24-64.js"
          unzip -l "$ZIP" | grep -q "style-v24-64.css"
          unzip -l "$ZIP" | grep -q "sw-v24-64.js"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v22.js"
          unzip -l "$ZIP" | grep -q "duck-quest/css/style-v22.css"

      - name: Install update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-64-Visual-Polish.zip"

          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-64.js"
          test -f "style-v24-64.css"
          test -f "sw-v24-64.js"

          test -f "duck-quest/index.html"
          test -f "duck-quest/battle-v22.html"
          test -f "duck-quest/css/style-v22.css"
          test -f "duck-quest/js/game-v22.js"

          grep -q 'style-v24-64.css' "index.html"
          grep -q 'script-v24-64.js' "index.html"
          grep -q 'sw-v24-64.js' "index.html"

          grep -q 'css/style-v22.css' "duck-quest/index.html"
          grep -q 'js/game-v22.js' "duck-quest/index.html"
          grep -q 'duck-quest/?v=22' "script-v24-64.js"

          # Remove only the versions replaced by this patch.
          rm -f \
            "script-v24-63.js" \
            "style-v24-63.css" \
            "sw-v24-63.js"

          rm -f \
            "duck-quest/battle-v21.html" \
            "duck-quest/css/style-v21.css" \
            "duck-quest/js/game-v21.js" \
            "duck-quest/README-v21.txt"

          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Polish home fit and Duck Quest positioning"
          git push origin "HEAD:${GITHUB_REF_NAME}"

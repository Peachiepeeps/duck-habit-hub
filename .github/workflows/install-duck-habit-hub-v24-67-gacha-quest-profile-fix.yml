name: Install Duck Habit Hub v24.67 Gacha + Quest/Profile Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-67-Gacha-Quest-Profile-Fix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the repo root."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "index.html"
          unzip -l "$ZIP" | grep -q "script-v24-67.js"
          unzip -l "$ZIP" | grep -q "style-v24-67.css"
          unzip -l "$ZIP" | grep -q "sw-v24-67.js"
          unzip -l "$ZIP" | grep -q "assets/gacha/gacha-menu-icon.webp"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v26.js"

      - name: Install v24.67
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-67-Gacha-Quest-Profile-Fix.zip"
          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-67.js"
          test -f "style-v24-67.css"
          test -f "sw-v24-67.js"
          test -f "assets/gacha/gacha-menu-icon.webp"
          test -f "duck-quest/index.html"
          test -f "duck-quest/battle-v26.html"
          test -f "duck-quest/js/game-v26.js"

          grep -q 'style-v24-67.css' "index.html"
          grep -q 'script-v24-67.js' "index.html"
          grep -q 'sw-v24-67.js' "index.html"
          grep -q 'assets/gacha/gacha-menu-icon.webp' "index.html"
          grep -q 'data-achievement-tab="duck-trophies"' "index.html"
          grep -q 'id="duckTrophyCase"' "index.html"
          grep -q 'duck-quest/?v=26' "script-v24-67.js"
          grep -q 'profileIconBackgrounds' "script-v24-67.js"
          grep -q 'js/game-v26.js' "duck-quest/index.html"
          grep -q 'questSave.activeCharacter=activeCharacterId' "duck-quest/js/game-v26.js"

          # Remove only superseded active code versions.
          rm -f \
            "script-v24-66.js" \
            "style-v24-66.css" \
            "sw-v24-66.js" \
            "README-v24-66.txt"

          rm -f \
            "duck-quest/battle-v25.html" \
            "duck-quest/js/game-v25.js" \
            "duck-quest/README-v25.txt"

          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Fix gacha icon and separate Quest/Profile OC settings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Install Duck Habit Hub v24.68 Gacha + Unlimited Crafting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-68-Gacha-and-Unlimited-Duck-Crafting.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the repo root."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "index.html"
          unzip -l "$ZIP" | grep -q "script-v24-68.js"
          unzip -l "$ZIP" | grep -q "style-v24-68.css"
          unzip -l "$ZIP" | grep -q "sw-v24-68.js"
          unzip -l "$ZIP" | grep -q "assets/gacha/gacha-menu-icon.webp"

      - name: Install v24.68
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Habit-Hub-v24-68-Gacha-and-Unlimited-Duck-Crafting.zip"
          unzip -o "$ZIP" -d .

          test -f "index.html"
          test -f "script-v24-68.js"
          test -f "style-v24-68.css"
          test -f "sw-v24-68.js"
          test -f "assets/gacha/gacha-menu-icon.webp"

          grep -q 'style-v24-68.css' "index.html"
          grep -q 'script-v24-68.js' "index.html"
          grep -q 'sw-v24-68.js' "index.html"
          grep -q 'max-height:none !important' "style-v24-68.css"
          grep -q 'Duplicate copies count toward Duck Trophies' "script-v24-68.js"
          grep -q 'item.category === "crafting"' "script-v24-68.js"
          grep -q 'incrementDuckCollection(target.id, 1' "script-v24-68.js"

          # Only superseded root code is removed. Duck Quest v26 stays untouched.
          rm -f \
            "script-v24-67.js" \
            "style-v24-67.css" \
            "sw-v24-67.js" \
            "README-v24-67.txt"

          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Extend gacha and allow unlimited duck crafting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

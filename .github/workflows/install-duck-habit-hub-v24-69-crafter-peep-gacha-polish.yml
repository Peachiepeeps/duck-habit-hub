name: Install Duck Habit Hub v24.69 Crafter + Peep + Gacha Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-69-Crafter-Peep-Gacha-Polish.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the repo root, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "index.html"
          unzip -l "$ZIP" | grep -q "script-v24-69.js"
          unzip -l "$ZIP" | grep -q "style-v24-69.css"
          unzip -l "$ZIP" | grep -q "sw-v24-69.js"

      - name: Install v24.69
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-69-Crafter-Peep-Gacha-Polish.zip"
          unzip -o "$ZIP" -d .

          grep -q 'style-v24-69.css' index.html
          grep -q 'script-v24-69.js' index.html
          grep -q 'sw-v24-69.js' index.html
          grep -q 'crafterMissingOnly' script-v24-69.js
          grep -q 'layerPeepHeadDuckBehindBangs' script-v24-69.js
          grep -q 'Only undiscovered' script-v24-69.js

          rm -f script-v24-68.js style-v24-68.css sw-v24-68.js
          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Polish Peep head duck, crafter filter, and gacha spacing"
          git push origin "HEAD:${GITHUB_REF_NAME}"

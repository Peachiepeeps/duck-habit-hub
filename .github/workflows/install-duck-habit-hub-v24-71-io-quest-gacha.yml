name: Install Duck Habit Hub v24.71 Io + Quest + Gacha

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-71-Io-Quest-Gacha.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the repo root, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "script-v24-71.js"
          unzip -l "$ZIP" | grep -q "style-v24-71.css"
          unzip -l "$ZIP" | grep -q "sw-v24-71.js"
          unzip -l "$ZIP" | grep -q "assets/io/Io-body-base.webp"
          unzip -l "$ZIP" | grep -q "assets/oc-invitations/Io-invitation.webp"
          unzip -l "$ZIP" | grep -q "assets/ducks/io-duck.webp"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v27.js"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/characters/io/base/heart-ray.webp"

      - name: Install v24.71
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-71-Io-Quest-Gacha.zip"
          unzip -o "$ZIP" -d .

          # Main Hub version checks
          test -f index.html
          test -f script-v24-71.js
          test -f style-v24-71.css
          test -f sw-v24-71.js
          grep -q 'style-v24-71.css' index.html
          grep -q 'script-v24-71.js' index.html
          grep -q 'sw-v24-71.js' index.html
          grep -q 'duck-quest/?v=27' script-v24-71.js

          # Io checks
          test -f assets/io/Io-body-base.webp
          test -f assets/io/Io-buns.webp
          test -f assets/io/Io-bangs.webp
          test -f assets/io/Io-heart-pin.webp
          test -f assets/oc-invitations/Io-invitation.webp
          test -f assets/ducks/io-duck.webp
          grep -q 'name: "Io"' script-v24-71.js
          grep -q '"io-duck"' script-v24-71.js
          grep -q 'sock-left-school' script-v24-71.js
          grep -q 'sock-right-school' script-v24-71.js

          # Duck Quest checks
          test -f duck-quest/index.html
          test -f duck-quest/js/game-v27.js
          test -f duck-quest/css/style-v25.css
          test -f duck-quest/assets/characters/io/base/idle-1.webp
          test -f duck-quest/assets/characters/io/base/idle-2.webp
          test -f duck-quest/assets/characters/io/base/heart-ray.webp
          test -f duck-quest/assets/characters/io/base/magic-juice.webp
          test -f duck-quest/assets/characters/io/base/sparkle-shot.webp
          test -f duck-quest/assets/characters/io/base/rainbow-check.webp
          grep -q 'css/style-v25.css' duck-quest/index.html
          grep -q 'js/game-v27.js' duck-quest/index.html
          grep -q 'const IO_SKILLS' duck-quest/js/game-v27.js
          grep -q 'function pickThrowDuck' duck-quest/js/game-v27.js

          # Remove only the superseded code versions from this update.
          rm -f script-v24-70.js style-v24-70.css sw-v24-70.js
          rm -f duck-quest/js/game-v26.js duck-quest/css/style-v24.css duck-quest/battle-v26.html duck-quest/README-v26.txt
          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Add Io and polish Duck Quest and gacha"
          git push origin "HEAD:${GITHUB_REF_NAME}"

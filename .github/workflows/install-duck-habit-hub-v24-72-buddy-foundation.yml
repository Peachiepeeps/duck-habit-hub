name: Install Duck Habit Hub v24.72 Buddy Foundation

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-72-Buddy-Foundation-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    # Prevent the bot's own cleanup/commit from starting the installer again.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Buddy Foundation package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-72-Buddy-Foundation-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the main/root page of the repository, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_72/index.html"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_72/script-v24-72.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_72/style-v24-72.css"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_72/sw-v24-72.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_72/README-v24-72.txt"

      - name: Install v24.72 Buddy Foundation
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-72-Buddy-Foundation-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-72-update"
          SRC="$TMP/duckhub_update_v24_72"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$SRC/index.html"
          test -f "$SRC/script-v24-72.js"
          test -f "$SRC/style-v24-72.css"
          test -f "$SRC/sw-v24-72.js"
          test -f "$SRC/README-v24-72.txt"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-72.js" ./script-v24-72.js
          cp -f "$SRC/style-v24-72.css" ./style-v24-72.css
          cp -f "$SRC/sw-v24-72.js" ./sw-v24-72.js
          cp -f "$SRC/README-v24-72.txt" ./README-v24-72.txt

          # Confirm the new page is actually pointing at the new build.
          grep -q 'style-v24-72.css' index.html
          grep -q 'script-v24-72.js' index.html
          grep -q 'sw-v24-72.js' index.html

          # Buddy Foundation checks.
          grep -q '"buddy-pon"' script-v24-72.js
          grep -q '"name": "Buddy Pon"' script-v24-72.js
          grep -q 'profileBuddySlots' script-v24-72.js
          grep -q 'function buddyCollectionEntries' script-v24-72.js
          grep -q '.profile-buddy-slots' style-v24-72.css
          grep -A6 '^.profile-card {' style-v24-72.css | grep -q 'isolation: isolate;'

          # Remove the superseded main-Hub code files only.
          # Other games / Duck Quest files are deliberately left alone.
          rm -f script-v24-71.js style-v24-71.css sw-v24-71.js

          # Clean up the uploaded installer ZIP and temporary extraction folder.
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.72 Buddy Foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

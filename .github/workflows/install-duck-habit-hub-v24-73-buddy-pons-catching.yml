name: Install Duck Habit Hub v24.73 Buddy Pons & Catching

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-73-Buddy-Pons-Catching-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.73 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-73-Buddy-Pons-Catching-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the main/root page of the repository, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/index.html"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/script-v24-73.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/style-v24-73.css"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/sw-v24-73.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/assets/items/buddy-pons/buddy-pon.png"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/assets/items/buddy-pons/super-buddy-pon.png"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/assets/items/buddy-pons/boss-buddy-pon.png"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/duck-quest/index.html"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/duck-quest/js/game-v28.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_73/duck-quest/css/style-v26.css"

      - name: Install v24.73 Buddy Pons and catching
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-73-Buddy-Pons-Catching-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-73-update"
          SRC="$TMP/duckhub_update_v24_73"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$SRC/index.html"
          test -f "$SRC/script-v24-73.js"
          test -f "$SRC/style-v24-73.css"
          test -f "$SRC/sw-v24-73.js"
          test -f "$SRC/README-v24-73.txt"
          test -f "$SRC/duck-quest/index.html"
          test -f "$SRC/duck-quest/js/game-v28.js"
          test -f "$SRC/duck-quest/css/style-v26.css"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-73.js" ./script-v24-73.js
          cp -f "$SRC/style-v24-73.css" ./style-v24-73.css
          cp -f "$SRC/sw-v24-73.js" ./sw-v24-73.js
          cp -f "$SRC/README-v24-73.txt" ./README-v24-73.txt

          mkdir -p assets/items/buddy-pons
          cp -f "$SRC/assets/items/buddy-pons/buddy-pon.png" assets/items/buddy-pons/buddy-pon.png
          cp -f "$SRC/assets/items/buddy-pons/super-buddy-pon.png" assets/items/buddy-pons/super-buddy-pon.png
          cp -f "$SRC/assets/items/buddy-pons/boss-buddy-pon.png" assets/items/buddy-pons/boss-buddy-pon.png

          mkdir -p duck-quest/js duck-quest/css
          cp -f "$SRC/duck-quest/index.html" duck-quest/index.html
          cp -f "$SRC/duck-quest/battle-v27.html" duck-quest/battle-v27.html
          cp -f "$SRC/duck-quest/battle-v28.html" duck-quest/battle-v28.html
          cp -f "$SRC/duck-quest/README-v28.txt" duck-quest/README-v28.txt
          cp -f "$SRC/duck-quest/js/game-v28.js" duck-quest/js/game-v28.js
          cp -f "$SRC/duck-quest/css/style-v26.css" duck-quest/css/style-v26.css

          # Confirm the Hub points to the new build.
          grep -q 'style-v24-73.css' index.html
          grep -q 'script-v24-73.js' index.html
          grep -q 'sw-v24-73.js' index.html

          # Confirm Buddy Pon art, prices, duplicate quantities, and profile link.
          grep -q 'assets/items/buddy-pons/buddy-pon.png' script-v24-73.js
          grep -q '{ itemId: "buddy-pon", price: 50 }' script-v24-73.js
          grep -q '{ itemId: "super-buddy-pon", price: 100 }' script-v24-73.js
          grep -q '{ itemId: "boss-buddy-pon", price: 175 }' script-v24-73.js
          grep -q 'quantity: Math.max(1' script-v24-73.js
          grep -q 'viewBuddyCollection' index.html

          # Confirm Duck Quest catching + Buddy Book are installed.
          grep -q 'css/style-v26.css' duck-quest/index.html
          grep -q 'js/game-v28.js' duck-quest/index.html
          grep -q 'id="buddyScreen"' duck-quest/index.html
          grep -q 'id="befriendPanel"' duck-quest/index.html
          grep -q 'const SHINY_RATE = 0.01' duck-quest/js/game-v28.js
          grep -q 'normalRate:.50' duck-quest/js/game-v28.js
          grep -q 'normalRate:.75, bossRate:.35' duck-quest/js/game-v28.js
          grep -q 'normalRate:1, bossRate:.70' duck-quest/js/game-v28.js
          grep -q 'function captureBuddy' duck-quest/js/game-v28.js
          grep -q 'function renderBuddyCollection' duck-quest/js/game-v28.js
          grep -q 'buddy-pon.png", weight:6' duck-quest/js/game-v28.js

          # Remove only superseded code files. Existing art and other games stay untouched.
          rm -f script-v24-72.js style-v24-72.css sw-v24-72.js
          rm -f duck-quest/js/game-v27.js duck-quest/css/style-v25.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.73 Buddy Pons and catching"
          git push origin "HEAD:${GITHUB_REF_NAME}"

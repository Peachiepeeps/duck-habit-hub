name: Install Duck Habit Hub v24.74 Shinies & Endless

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-74-Shinies-Endless-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.74 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-74-Shinies-Endless-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/index.html"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/script-v24-74.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/style-v24-74.css"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/sw-v24-74.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/duck-quest/index.html"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/duck-quest/js/game-v29.js"
          unzip -l "$ZIP" | grep -q "duckhub_update_v24_74/duck-quest/css/style-v27.css"
          unzip -l "$ZIP" | grep -q "rainbow-slime-kitty-idle-1.png"
          unzip -l "$ZIP" | grep -q "amethyst-mimic-closed.png"
          unzip -l "$ZIP" | grep -q "crimson-squid-idle-1.png"

      - name: Install v24.74 Shinies and Endless Quest
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-74-Shinies-Endless-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-74-update"
          SRC="$TMP/duckhub_update_v24_74"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$SRC/index.html"
          test -f "$SRC/script-v24-74.js"
          test -f "$SRC/style-v24-74.css"
          test -f "$SRC/sw-v24-74.js"
          test -f "$SRC/duck-quest/index.html"
          test -f "$SRC/duck-quest/js/game-v29.js"
          test -f "$SRC/duck-quest/css/style-v27.css"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-74.js" ./script-v24-74.js
          cp -f "$SRC/style-v24-74.css" ./style-v24-74.css
          cp -f "$SRC/sw-v24-74.js" ./sw-v24-74.js
          cp -f "$SRC/README-v24-74.txt" ./README-v24-74.txt
          cp -f "$SRC/README.md" ./README.md

          mkdir -p ./duck-quest
          cp -a "$SRC/duck-quest/." ./duck-quest/

          # Sanity checks before committing anything.
          grep -q 'style-v24-74.css' index.html
          grep -q 'script-v24-74.js' index.html
          grep -q 'sw-v24-74.js' index.html
          grep -q 'css/style-v27.css' duck-quest/index.html
          grep -q 'js/game-v29.js' duck-quest/index.html
          grep -q 'Rainbow Slime Kitty' duck-quest/js/game-v29.js
          grep -q 'Amethyst Mimic' duck-quest/js/game-v29.js
          grep -q 'MYSTERY_CHEST_RATE = 1 / 50' duck-quest/js/game-v29.js
          grep -q 'function beginEndlessRun' duck-quest/js/game-v29.js
          grep -q 'Every 5th floor is a boss' duck-quest/index.html
          test -f duck-quest/assets/shinies/amethyst-mimic-open.png
          test -f duck-quest/assets/shinies/cocoa-mushroom-cat-idle-1.png
          test -f duck-quest/assets/shinies/bubblegum-catfish-idle-1.png

          node --check script-v24-74.js
          node --check sw-v24-74.js
          node --check duck-quest/js/game-v29.js

          # Remove only the files superseded by this update.
          rm -f script-v24-73.js style-v24-73.css sw-v24-73.js
          rm -f duck-quest/js/game-v28.js duck-quest/css/style-v26.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.74 Shinies and Endless Quest"
          git push origin "HEAD:${GITHUB_REF_NAME}"

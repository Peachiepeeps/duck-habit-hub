name: Install Duck Habit Hub v24.75 Buddy Helpers

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-75-Buddy-Helpers-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.75 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-75-Buddy-Helpers-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fq "duckhub_update_v24_75/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_75/script-v24-75.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_75/style-v24-75.css" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_75/sw-v24-75.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_75/duck-quest/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_75/duck-quest/js/game-v30.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_75/duck-quest/css/style-v28.css" <<<"$LISTING"
          grep -Fq "albino-acorn-mouse-idle-1.png" <<<"$LISTING"
          grep -Fq "aurora-seaunicorn-idle-1.png" <<<"$LISTING"
          grep -Fq "sakura-tree-squirrel-idle-1.png" <<<"$LISTING"
          grep -Fq "rainbow-jellybun-idle-1.png" <<<"$LISTING"

      - name: Install v24.75 Buddy Helper Expansion
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-75-Buddy-Helpers-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-75-update"
          SRC="$TMP/duckhub_update_v24_75"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$SRC/index.html"
          test -f "$SRC/script-v24-75.js"
          test -f "$SRC/style-v24-75.css"
          test -f "$SRC/sw-v24-75.js"
          test -f "$SRC/README-v24-75.txt"
          test -f "$SRC/duck-quest/index.html"
          test -f "$SRC/duck-quest/js/game-v30.js"
          test -f "$SRC/duck-quest/css/style-v28.css"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-75.js" ./script-v24-75.js
          cp -f "$SRC/style-v24-75.css" ./style-v24-75.css
          cp -f "$SRC/sw-v24-75.js" ./sw-v24-75.js
          cp -f "$SRC/README-v24-75.txt" ./README-v24-75.txt
          cp -f "$SRC/README.md" ./README.md

          mkdir -p ./duck-quest
          cp -a "$SRC/duck-quest/." ./duck-quest/

          # Sanity checks before committing anything.
          grep -q 'style-v24-75.css' index.html
          grep -q 'script-v24-75.js' index.html
          grep -q 'sw-v24-75.js' index.html
          grep -q 'css/style-v28.css' duck-quest/index.html
          grep -q 'js/game-v30.js' duck-quest/index.html
          grep -q 'id="buddyMenuButton"' duck-quest/index.html
          grep -q 'id="buddyCombatant"' duck-quest/index.html
          grep -q 'id="buddyDetailSkill"' duck-quest/index.html

          grep -q 'Albino Acorn Mouse' duck-quest/js/game-v30.js
          grep -q 'Aurora Seaunicorn' duck-quest/js/game-v30.js
          grep -q 'Sakura Tree Squirrel' duck-quest/js/game-v30.js
          grep -q 'Rainbow Jellybun' duck-quest/js/game-v30.js
          grep -q 'const BUDDY_SKILLS' duck-quest/js/game-v30.js
          grep -q 'function useBuddySkill' duck-quest/js/game-v30.js
          grep -q 'function renderBattleBuddy' duck-quest/js/game-v30.js
          grep -q 'Heart Barrage!' duck-quest/js/game-v30.js
          grep -q 'Hexed Heckle' duck-quest/js/game-v30.js
          grep -q 'Star Shower' duck-quest/js/game-v30.js
          grep -Fq 'const oceanBosses=["vampire-squid","jellybun"]' duck-quest/js/game-v30.js
          grep -Fq '"cat-slime","bee","flower","acorn-mouse","cool-seagull","sea-turtle","catfish","seaunicorn"' duck-quest/js/game-v30.js
          grep -q 'currentRun.floorBackground=chooseEndlessBackground(currentRun.floorBackground)' duck-quest/js/game-v30.js

          test -f duck-quest/assets/enemies/acorn-mouse/base/acorn-mouse-idle-1.png
          test -f duck-quest/assets/enemies/seaunicorn/base/seaunicorn-idle-1.png
          test -f duck-quest/assets/bosses/tree-squirrel/base/tree-squirrel-idle-1.png
          test -f duck-quest/assets/bosses/jellybun/base/jellybun-idle-1.png
          test -f duck-quest/assets/shinies/albino-acorn-mouse-idle-1.png
          test -f duck-quest/assets/shinies/aurora-seaunicorn-idle-1.png
          test -f duck-quest/assets/shinies/sakura-tree-squirrel-idle-1.png
          test -f duck-quest/assets/shinies/rainbow-jellybun-idle-1.png

          node --check script-v24-75.js
          node --check sw-v24-75.js
          node --check duck-quest/js/game-v30.js

          # Remove only the active files superseded by this update.
          rm -f script-v24-74.js style-v24-74.css sw-v24-74.js
          rm -f duck-quest/js/game-v29.js duck-quest/css/style-v27.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.75 Buddy Helper Expansion"
          git push origin "HEAD:${GITHUB_REF_NAME}"

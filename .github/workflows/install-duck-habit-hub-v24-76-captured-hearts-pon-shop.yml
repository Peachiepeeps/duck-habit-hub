name: Install Duck Habit Hub v24.76 Captured Hearts & Pon Shop

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-76-Captured-Hearts-Pon-Shop-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.76 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-76-Captured-Hearts-Pon-Shop-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fq "duckhub_update_v24_76/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_76/script-v24-76.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_76/style-v24-76.css" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_76/sw-v24-76.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_76/duck-quest/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_76/duck-quest/js/game-v31.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_76/duck-quest/css/style-v29.css" <<<"$LISTING"

      - name: Install v24.76 quality-of-life update
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-76-Captured-Hearts-Pon-Shop-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-76-update"
          SRC="$TMP/duckhub_update_v24_76"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$SRC/index.html"
          test -f "$SRC/script-v24-76.js"
          test -f "$SRC/style-v24-76.css"
          test -f "$SRC/sw-v24-76.js"
          test -f "$SRC/README-v24-76.txt"
          test -f "$SRC/duck-quest/index.html"
          test -f "$SRC/duck-quest/js/game-v31.js"
          test -f "$SRC/duck-quest/css/style-v29.css"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-76.js" ./script-v24-76.js
          cp -f "$SRC/style-v24-76.css" ./style-v24-76.css
          cp -f "$SRC/sw-v24-76.js" ./sw-v24-76.js
          cp -f "$SRC/README-v24-76.txt" ./README-v24-76.txt

          mkdir -p ./duck-quest/js ./duck-quest/css
          cp -f "$SRC/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$SRC/duck-quest/js/game-v31.js" ./duck-quest/js/game-v31.js
          cp -f "$SRC/duck-quest/css/style-v29.css" ./duck-quest/css/style-v29.css

          # Sanity checks before committing anything.
          grep -q 'style-v24-76.css' index.html
          grep -q 'script-v24-76.js' index.html
          grep -q 'sw-v24-76.js' index.html
          grep -q 'css/style-v29.css' duck-quest/index.html
          grep -q 'js/game-v31.js' duck-quest/index.html
          grep -q 'id="purchasePonButton"' duck-quest/index.html
          grep -q 'id="ponPurchasePanel"' duck-quest/index.html

          grep -q 'enemy-captured-heart' duck-quest/js/game-v31.js
          grep -q 'function purchaseBuddyPon' duck-quest/js/game-v31.js
          grep -q 'function hasCompatibleBuddyPon' duck-quest/js/game-v31.js
          grep -q 'price:50' duck-quest/js/game-v31.js
          grep -q 'price:100' duck-quest/js/game-v31.js
          grep -q 'price:175' duck-quest/js/game-v31.js
          grep -q '.pon-purchase-panel' duck-quest/css/style-v29.css

          node --check script-v24-76.js
          node --check sw-v24-76.js
          node --check duck-quest/js/game-v31.js

          # Remove only the active files superseded by this update.
          rm -f script-v24-75.js style-v24-75.css sw-v24-75.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.76 Captured Hearts and Pon Shop"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Install Duck Habit Hub v24.77 Battle & Rooms

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-77-Battle-Rooms-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.77 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-77-Battle-Rooms-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fq "duckhub_update_v24_77/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/script-v24-77.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/style-v24-77.css" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/sw-v24-77.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/README-v24-77.txt" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/duck-quest/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/duck-quest/js/game-v32.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_77/duck-quest/css/style-v30.css" <<<"$LISTING"

      - name: Install v24.77 battle and room update
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-77-Battle-Rooms-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-77-update"
          SRC="$TMP/duckhub_update_v24_77"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-77.js" ./script-v24-77.js
          cp -f "$SRC/style-v24-77.css" ./style-v24-77.css
          cp -f "$SRC/sw-v24-77.js" ./sw-v24-77.js
          cp -f "$SRC/README-v24-77.txt" ./README-v24-77.txt

          mkdir -p ./duck-quest/js ./duck-quest/css
          cp -f "$SRC/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$SRC/duck-quest/js/game-v32.js" ./duck-quest/js/game-v32.js
          cp -f "$SRC/duck-quest/css/style-v30.css" ./duck-quest/css/style-v30.css

          # Sanity checks before committing anything.
          grep -q 'style-v24-77.css' index.html
          grep -q 'script-v24-77.js' index.html
          grep -q 'sw-v24-77.js' index.html
          grep -q 'id="statusBuddies"' index.html
          grep -q 'css/style-v30.css' duck-quest/index.html
          grep -q 'js/game-v32.js' duck-quest/index.html
          grep -q 'enemy-status-stack' duck-quest/index.html

          grep -q 'roomsByCharacter' script-v24-77.js
          grep -q 'function totalBuddyCount' script-v24-77.js
          grep -q 'MAIN_ROOM_STORAGE_ID.*characterId' script-v24-77.js || grep -q 'function mainRoomStorageId' script-v24-77.js
          grep -q 'buddyUsedThisHeroTurn' duck-quest/js/game-v32.js
          grep -q 'Now choose.*move' duck-quest/js/game-v32.js
          grep -q 'reference-style battle composition' duck-quest/css/style-v30.css

          node --check script-v24-77.js
          node --check sw-v24-77.js
          node --check duck-quest/js/game-v32.js

          # Remove only the active files superseded by this update.
          rm -f script-v24-76.js style-v24-76.css sw-v24-76.js
          rm -f duck-quest/js/game-v31.js duck-quest/css/style-v29.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.77 Battle and OC Rooms"
          git push origin "HEAD:${GITHUB_REF_NAME}"

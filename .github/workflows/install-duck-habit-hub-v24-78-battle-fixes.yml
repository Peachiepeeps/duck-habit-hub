name: Install Duck Habit Hub v24.78 Battle Fixes

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-78-Battle-Fixes-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.78 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-78-Battle-Fixes-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fq "duckhub_update_v24_78/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/script-v24-78.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/style-v24-78.css" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/sw-v24-78.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/README-v24-78.txt" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/duck-quest/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/duck-quest/js/game-v33.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_78/duck-quest/css/style-v31.css" <<<"$LISTING"

      - name: Install v24.78 battle fixes
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-78-Battle-Fixes-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-78-update"
          SRC="$TMP/duckhub_update_v24_78"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-78.js" ./script-v24-78.js
          cp -f "$SRC/style-v24-78.css" ./style-v24-78.css
          cp -f "$SRC/sw-v24-78.js" ./sw-v24-78.js
          cp -f "$SRC/README-v24-78.txt" ./README-v24-78.txt

          mkdir -p ./duck-quest/js ./duck-quest/css
          cp -f "$SRC/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$SRC/duck-quest/js/game-v33.js" ./duck-quest/js/game-v33.js
          cp -f "$SRC/duck-quest/css/style-v31.css" ./duck-quest/css/style-v31.css

          # Sanity checks before committing anything.
          grep -q 'style-v24-78.css' index.html
          grep -q 'script-v24-78.js' index.html
          grep -q 'sw-v24-78.js' index.html
          grep -q 'css/style-v31.css' duck-quest/index.html
          grep -q 'js/game-v33.js' duck-quest/index.html

          grep -q 'Keep the Main Buddy on the field while the capture panel is open' duck-quest/js/game-v33.js
          grep -q 'function hpFillColor' duck-quest/js/game-v33.js
          grep -q "Can't catch this boss" duck-quest/js/game-v33.js
          grep -q 'pon-just-purchased' duck-quest/js/game-v33.js
          grep -q 'battle polish fixes' duck-quest/css/style-v31.css
          grep -q 'width:auto !important' duck-quest/css/style-v31.css

          node --check script-v24-78.js
          node --check sw-v24-78.js
          node --check duck-quest/js/game-v33.js

          # Remove only the active files superseded by this update.
          rm -f script-v24-77.js style-v24-77.css sw-v24-77.js
          rm -f duck-quest/js/game-v32.js duck-quest/css/style-v30.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.78 battle fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

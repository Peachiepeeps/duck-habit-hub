name: Install Duck Habit Hub v24.81 Switch OC & Polish

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-81-Switch-OC-Polish-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.81 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-81-Switch-OC-Polish-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fq "duckhub_update_v24_81/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/script-v24-81.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/style-v24-81.css" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/sw-v24-81.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/README-v24-81.txt" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/duck-quest/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/duck-quest/js/game-v36.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_81/duck-quest/css/style-v34.css" <<<"$LISTING"

      - name: Install v24.81 Switch OC and polish update
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-81-Switch-OC-Polish-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-81-update"
          SRC="$TMP/duckhub_update_v24_81"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-81.js" ./script-v24-81.js
          cp -f "$SRC/style-v24-81.css" ./style-v24-81.css
          cp -f "$SRC/sw-v24-81.js" ./sw-v24-81.js
          cp -f "$SRC/README-v24-81.txt" ./README-v24-81.txt

          mkdir -p ./duck-quest/js ./duck-quest/css
          cp -f "$SRC/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$SRC/duck-quest/js/game-v36.js" ./duck-quest/js/game-v36.js
          cp -f "$SRC/duck-quest/css/style-v34.css" ./duck-quest/css/style-v34.css

          grep -q 'style-v24-81.css' index.html
          grep -q 'script-v24-81.js' index.html
          grep -q 'sw-v24-81.js' index.html
          grep -q 'css/style-v34.css' duck-quest/index.html
          grep -q 'js/game-v36.js' duck-quest/index.html
          grep -q 'id="questOcPicker"' duck-quest/index.html
          grep -q 'function renderQuestOcPicker' duck-quest/js/game-v36.js
          grep -q 'Switch OC picker + Io battle baseline' duck-quest/css/style-v34.css
          grep -q 'Io profile crop + shelf Book polish' style-v24-81.css

          node --check script-v24-81.js
          node --check sw-v24-81.js
          node --check duck-quest/js/game-v36.js

          rm -f script-v24-80.js style-v24-80.css sw-v24-80.js
          rm -f duck-quest/js/game-v35.js duck-quest/css/style-v33.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.81 Switch OC and polish"
          git push origin "HEAD:${GITHUB_REF_NAME}"

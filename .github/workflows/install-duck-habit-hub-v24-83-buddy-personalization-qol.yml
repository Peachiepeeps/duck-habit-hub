name: Install Duck Habit Hub v24.83 Buddy Personalization & QoL

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-83-Buddy-Personalization-QoL-UPDATE-ONLY.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify v24.83 update package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-83-Buddy-Personalization-QoL-UPDATE-ONLY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched beside index.html, then run this workflow again."
            exit 1
          fi

          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          grep -Fq "duckhub_update_v24_83/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/script-v24-83.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/style-v24-83.css" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/sw-v24-83.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/README-v24-83.txt" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/duck-quest/index.html" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/duck-quest/js/game-v38.js" <<<"$LISTING"
          grep -Fq "duckhub_update_v24_83/duck-quest/css/style-v36.css" <<<"$LISTING"

      - name: Install v24.83 update
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duck-Habit-Hub-v24-83-Buddy-Personalization-QoL-UPDATE-ONLY.zip"
          TMP=".duckhub-v24-83-update"
          SRC="$TMP/duckhub_update_v24_83"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/script-v24-83.js" ./script-v24-83.js
          cp -f "$SRC/style-v24-83.css" ./style-v24-83.css
          cp -f "$SRC/sw-v24-83.js" ./sw-v24-83.js
          cp -f "$SRC/README-v24-83.txt" ./README-v24-83.txt

          mkdir -p ./duck-quest/js ./duck-quest/css
          cp -f "$SRC/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$SRC/duck-quest/js/game-v38.js" ./duck-quest/js/game-v38.js
          cp -f "$SRC/duck-quest/css/style-v36.css" ./duck-quest/css/style-v36.css

          grep -q 'style-v24-83.css' index.html
          grep -q 'script-v24-83.js' index.html
          grep -q 'sw-v24-83.js' index.html
          grep -q 'css/style-v36.css' duck-quest/index.html
          grep -q 'js/game-v38.js' duck-quest/index.html
          grep -q 'id="itemBackButton"' duck-quest/index.html
          grep -q 'id="buddyPersonalizePanel"' duck-quest/index.html
          grep -q 'function buddyLowHpCatchBonus' duck-quest/js/game-v38.js
          grep -q 'personalizationByCharacter' duck-quest/js/game-v38.js
          grep -q 'transform:scaleX(-1)' duck-quest/css/style-v36.css
          grep -q 'ioAhogeClosetMigrationV2483' script-v24-83.js
          grep -q 'translateY(0.65%)' script-v24-83.js
          grep -q 'translateY(-4.8%)' style-v24-83.css

          node --check script-v24-83.js
          node --check sw-v24-83.js
          node --check duck-quest/js/game-v38.js

          rm -f script-v24-82.js style-v24-82.css sw-v24-82.js
          rm -f duck-quest/js/game-v37.js duck-quest/css/style-v35.css

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.83 buddy personalization and QoL"
          git push origin "HEAD:${GITHUB_REF_NAME}"

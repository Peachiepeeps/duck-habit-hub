name: Install Duck Habit Hub v24.86 Item & Pon Menu Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-86-Item-Pon-Menu-UPDATE-ONLY.zip"
      - "*v24-86*Item*Pon*Menu*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-86-Item-Pon-Menu-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-86*item*pon*menu*update*only*.zip' -o -iname '*v24.86*item*pon*menu*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] && grep -Fq '"version": "24.86"' version.json \
               && [ -f "duck-quest/css/style-v37.css" ] \
               && grep -Fq 'css/style-v37.css' duck-quest/index.html; then
              echo "v24.86 already appears to be installed. Nothing else is needed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.86 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_86/index.html" \
            "duckhub_update_v24_86/sw.js" \
            "duckhub_update_v24_86/sw-v24-86.js" \
            "duckhub_update_v24_86/version.json" \
            "duckhub_update_v24_86/README-v24-86.txt" \
            "duckhub_update_v24_86/duck-quest/index.html" \
            "duckhub_update_v24_86/duck-quest/css/style-v37.css"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.86 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-86-update"
          SRC="$TMP/duckhub_update_v24_86"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          mkdir -p duck-quest/css
          cp -f "$SRC/index.html" ./index.html
          cp -f "$SRC/sw.js" ./sw.js
          cp -f "$SRC/sw-v24-86.js" ./sw-v24-86.js
          cp -f "$SRC/version.json" ./version.json
          cp -f "$SRC/README-v24-86.txt" ./README-v24-86.txt
          cp -f "$SRC/README.md" ./README.md
          cp -f "$SRC/duck-quest/index.html" ./duck-quest/index.html
          cp -f "$SRC/duck-quest/css/style-v37.css" ./duck-quest/css/style-v37.css

          grep -Fq 'DUCK_HUB_BUILD = "24.86"' index.html
          grep -Fq 'css/style-v37.css' duck-quest/index.html
          grep -Fq 'V37 / Hub v24.86' duck-quest/css/style-v37.css
          grep -Fq 'position:static' duck-quest/css/style-v37.css
          grep -Fq 'bottom:-132px' duck-quest/css/style-v37.css
          grep -Fq '"version": "24.86"' version.json
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.86 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.86 item and Pon menu fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

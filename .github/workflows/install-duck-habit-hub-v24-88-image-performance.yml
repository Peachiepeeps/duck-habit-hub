name: Install Duck Habit Hub v24.88 Image Performance

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-88-Image-Performance-UPDATE-ONLY.zip"
      - "*v24-88*Image*Performance*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-88-Image-Performance-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-88*image*performance*update*only*.zip' -o -iname '*v24.88*image*performance*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] && grep -Fq '"version": "24.88"' version.json \
               && [ -f "script-v24-88.js" ] \
               && [ -f "duck-quest/js/game-v41.js" ] \
               && grep -Fq 'script-v24-88.js' index.html \
               && grep -Fq 'js/game-v41.js' duck-quest/index.html; then
              echo "v24.88 already appears to be installed. Nothing else is needed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.88 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_88/index.html" \
            "duckhub_update_v24_88/script-v24-88.js" \
            "duckhub_update_v24_88/sw.js" \
            "duckhub_update_v24_88/sw-v24-88.js" \
            "duckhub_update_v24_88/version.json" \
            "duckhub_update_v24_88/README-v24-88.txt" \
            "duckhub_update_v24_88/duck-quest/index.html" \
            "duckhub_update_v24_88/duck-quest/js/game-v41.js" \
            "duckhub_update_v24_88/assets/thumbs/ducks/Standard-duck.webp" \
            "duckhub_update_v24_88/assets/items/buddy-pons/buddy-pon.webp"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.88 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-88-update"
          SRC="$TMP/duckhub_update_v24_88"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          # The update package only contains changed/new files, so merge it
          # directly over the existing repo without touching save data/assets
          # that were not part of this performance pass.
          cp -a "$SRC/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.88"' index.html
          grep -Fq 'script-v24-88.js' index.html
          grep -Fq 'js/game-v41.js' duck-quest/index.html
          grep -Fq 'function duckThumbFile' script-v24-88.js
          grep -Fq 'function characterPreviewSrc' script-v24-88.js
          grep -Fq 'function warmCurrentBattleAssets' duck-quest/js/game-v41.js
          grep -Fq "duck-habit-hub-images-stable-v1" sw.js
          grep -Fq 'trimCache(IMAGE_CACHE,1500)' sw.js
          grep -Fq '"version": "24.88"' version.json

          test "$(find assets/thumbs/ducks -maxdepth 1 -type f -name '*.webp' | wc -l)" -ge 70
          test "$(find assets/thumbs/characters -type f -name '*.webp' | wc -l)" -ge 100

          node --check script-v24-88.js
          node --check duck-quest/js/game-v41.js
          node --check sw.js
          node --check sw-v24-88.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.88 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.88 image performance pass"
          git push origin "HEAD:${GITHUB_REF_NAME}"

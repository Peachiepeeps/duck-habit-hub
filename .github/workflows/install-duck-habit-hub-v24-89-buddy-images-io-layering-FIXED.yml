name: Install Duck Habit Hub v24.89 Buddy Images + Io Layering

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-89-Buddy-Images-Io-Layering-UPDATE-ONLY.zip"
      - "*v24-89*Buddy*Images*Io*Layering*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-89-Buddy-Images-Io-Layering-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-89*buddy*images*io*layering*update*only*.zip' -o -iname '*v24.89*buddy*images*io*layering*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
               && grep -Fq '"version": "24.89"' version.json \
               && [ -f "script-v24-89.js" ] \
               && grep -Fq 'script-v24-89.js' index.html; then
              echo "v24.89 already appears to be installed. Nothing else is needed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.89 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"

          for REQUIRED in \
            "duckhub_update_v24_89/index.html" \
            "duckhub_update_v24_89/script-v24-89.js" \
            "duckhub_update_v24_89/sw.js" \
            "duckhub_update_v24_89/sw-v24-89.js" \
            "duckhub_update_v24_89/version.json" \
            "duckhub_update_v24_89/README-v24-89.txt"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || {
              echo "::error::Update ZIP is missing $REQUIRED"
              exit 1
            }
          done

      - name: Install v24.89 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-89-update"
          SRC="$TMP/duckhub_update_v24_89"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.89"' index.html
          grep -Fq 'script-v24-89.js' index.html
          grep -Fq 'function headDuckBangLayerAssetId' script-v24-89.js
          grep -Fq 'function buddyFallbackImageSource' script-v24-89.js
          grep -Fq 'duck-habit-hub-app-v24-89' sw.js
          grep -Fq 'script-v24-89.js' sw.js
          grep -Fq '"version": "24.89"' version.json

          node --check script-v24-89.js
          node --check sw.js
          node --check sw-v24-89.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.89 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.89 buddy image + Io layering fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

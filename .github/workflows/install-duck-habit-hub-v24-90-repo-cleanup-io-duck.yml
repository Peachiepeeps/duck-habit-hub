name: Install Duck Habit Hub v24.90 Repo Cleanup + Io Duck Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-90-Repo-Cleanup-Io-Duck-UPDATE-ONLY.zip"
      - "*v24-90*Repo*Cleanup*Io*Duck*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-90-Repo-Cleanup-Io-Duck-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-90*repo*cleanup*io*duck*update*only*.zip' -o -iname '*v24.90*repo*cleanup*io*duck*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.90"' version.json \
              && [ -f "script-v24-90.js" ] \
              && grep -Fq 'script-v24-90.js' index.html; then
              echo "v24.90 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.90 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_90/index.html" \
            "duckhub_update_v24_90/script-v24-90.js" \
            "duckhub_update_v24_90/sw.js" \
            "duckhub_update_v24_90/version.json"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.90 update and clean repo
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-90-update"
          SRC="$TMP/duckhub_update_v24_90"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          rm -f \
            README-v24-68.txt README-v24-70.txt README-v24-71.txt README-v24-72.txt README-v24-73.txt \
            README-v24-74.txt README-v24-75.txt README-v24-76.txt README-v24-77.txt README-v24-78.txt \
            README-v24-79.txt README-v24-81.txt README-v24-82.txt README-v24-83.txt README-v24-84.txt \
            README-v24-85.txt README-v24-86.txt README-v24-87.txt README-v24-88.txt README-v24-89.txt \
            script-v24-79.js script-v24-83.js script-v24-84.js script-v24-85.js script-v24-88.js script-v24-89.js \
            style-v24-60.css style-v24-79.css style-v24-83.css \
            sw-v24-60.js sw-v24-79.js sw-v24-80.js sw-v24-81.js sw-v24-82.js sw-v24-83.js sw-v24-84.js \
            sw-v24-85.js sw-v24-86.js sw-v24-87.js sw-v24-88.js sw-v24-89.js

          rm -f \
            .github/workflows/install-duck-habit-hub-v24-86-item-pon-menu.yml \
            .github/workflows/install-duck-habit-hub-v24-87-just-a-smack.yml \
            .github/workflows/install-duck-habit-hub-v24-88-image-performance.yml \
            .github/workflows/install-duck-habit-hub-v24-89-buddy-images-io-layering.yml \
            .github/workflows/install-duck-habit-hub-v24-89-buddy-images-io-layering-FIXED.yml

          find assets -type f -name 'Hold' -delete || true

          grep -Fq 'DUCK_HUB_BUILD = "24.90"' index.html
          grep -Fq 'script-v24-90.js' index.html
          grep -Fq 'characterId === "io"' script-v24-90.js
          grep -Fq 'left: 50.8' script-v24-90.js
          grep -Fq 'duck-habit-hub-app-v24-90' sw.js
          grep -Fq '"version": "24.90"' version.json

          node --check script-v24-90.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.90 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.90 repo cleanup + Io duck fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"

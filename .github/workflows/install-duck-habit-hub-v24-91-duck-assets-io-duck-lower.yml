name: Install Duck Habit Hub v24.91 Duck Assets + Io Duck Lower

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-91-Duck-Assets-Io-Duck-Lower-UPDATE-ONLY.zip"
      - "*v24-91*Duck*Assets*Io*Duck*Lower*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-91-Duck-Assets-Io-Duck-Lower-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-91*duck*assets*io*duck*lower*update*only*.zip' -o -iname '*v24.91*duck*assets*io*duck*lower*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] && grep -Fq '"version": "24.91"' version.json && [ -f "script-v24-91.js" ]; then
              echo "v24.91 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The v24.91 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_91/index.html" \
            "duckhub_update_v24_91/script-v24-91.js" \
            "duckhub_update_v24_91/sw.js" \
            "duckhub_update_v24_91/version.json" \
            "duckhub_update_v24_91/duck-quest/assets/enemies/acorn-mouse/base/acorn-mouse-idle-1.webp" \
            "duckhub_update_v24_91/duck-quest/assets/enemies/seaunicorn/base/seaunicorn-idle-1.webp" \
            "duckhub_update_v24_91/duck-quest/assets/bosses/tree-squirrel/base/tree-squirrel-idle-1.webp" \
            "duckhub_update_v24_91/duck-quest/assets/bosses/jellybun/base/jellybun-idle-1.webp" \
            "duckhub_update_v24_91/duck-quest/assets/shinies/albino-acorn-mouse-idle-1.webp" \
            "duckhub_update_v24_91/duck-quest/js/game-v41.js"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.91 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-91-update"
          SRC="$TMP/duckhub_update_v24_91"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.91"' index.html
          grep -Fq 'script-v24-91.js' index.html
          grep -Fq 'left: 50.8' script-v24-91.js
          grep -Fq 'top: 37.0' script-v24-91.js
          grep -Fq 'duck-habit-hub-app-v24-91' sw.js
          grep -Fq '"version": "24.91"' version.json
          test -f duck-quest/assets/enemies/acorn-mouse/base/acorn-mouse-idle-1.webp
          test -f duck-quest/assets/enemies/seaunicorn/base/seaunicorn-idle-1.webp
          test -f duck-quest/assets/bosses/tree-squirrel/base/tree-squirrel-idle-1.webp
          test -f duck-quest/assets/bosses/jellybun/base/jellybun-idle-1.webp
          test -f duck-quest/assets/shinies/albino-acorn-mouse-idle-1.webp
          test -f duck-quest/assets/shinies/rainbow-jellybun-idle-1.webp

          node --check script-v24-91.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.91 is already current."
            exit 0
          fi
          git commit -m "Install Duck Habit Hub v24.91 duck asset fix + Io duck lower"
          git push origin "HEAD:${GITHUB_REF_NAME}"

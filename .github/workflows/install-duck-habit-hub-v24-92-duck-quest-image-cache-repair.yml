name: Install Duck Habit Hub v24.92 Duck Quest Image Cache Repair

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-92-Duck-Quest-Image-Cache-Repair-UPDATE-ONLY.zip"
      - "*v24-92*Duck*Quest*Image*Cache*Repair*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-92-Duck-Quest-Image-Cache-Repair-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-92*duck*quest*image*cache*repair*update*only*.zip' -o -iname '*v24.92*duck*quest*image*cache*repair*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.92"' version.json \
              && [ -f "script-v24-92.js" ] \
              && grep -Fq 'script-v24-92.js' index.html \
              && grep -Fq "cache:'reload'" sw.js; then
              echo "v24.92 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.92 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_92/index.html" \
            "duckhub_update_v24_92/script-v24-92.js" \
            "duckhub_update_v24_92/sw.js" \
            "duckhub_update_v24_92/version.json" \
            "duckhub_update_v24_92/duck-quest/assets/enemies/acorn-mouse/base/purple-idle-1.webp" \
            "duckhub_update_v24_92/duck-quest/assets/enemies/seaunicorn/base/seaunicorn-idle-1.webp" \
            "duckhub_update_v24_92/duck-quest/assets/bosses/tree-squirrel/base/yellow-idle-1.webp" \
            "duckhub_update_v24_92/duck-quest/assets/bosses/jellybun/base/jellybun-idle-1.webp" \
            "duckhub_update_v24_92/duck-quest/assets/shinies/albino-acorn-mouse-idle-1.webp" \
            "duckhub_update_v24_92/duck-quest/assets/shinies/sakura-tree-squirrel-idle-1.webp" \
            "duckhub_update_v24_92/duck-quest/assets/shinies/rainbow-jellybun-idle-1.webp"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.92 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-92-update"
          SRC="$TMP/duckhub_update_v24_92"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          # Keep the cleaned repository tidy as versions move forward.
          rm -f script-v24-91.js
          rm -f .github/workflows/install-duck-habit-hub-v24-90-repo-cleanup-io-duck.yml
          rm -f .github/workflows/install-duck-habit-hub-v24-91-duck-assets-io-duck-lower.yml

          grep -Fq 'DUCK_HUB_BUILD = "24.92"' index.html
          grep -Fq 'script-v24-92.js' index.html
          grep -Fq "cache:'reload'" sw.js
          grep -Fq 'duck-habit-hub-app-v24-92' sw.js
          grep -Fq '"version": "24.92"' version.json

          test -f duck-quest/assets/enemies/acorn-mouse/base/purple-idle-1.webp
          test -f duck-quest/assets/enemies/seaunicorn/base/seaunicorn-idle-1.webp
          test -f duck-quest/assets/bosses/tree-squirrel/base/yellow-idle-1.webp
          test -f duck-quest/assets/bosses/jellybun/base/jellybun-idle-1.webp
          test -f duck-quest/assets/shinies/albino-acorn-mouse-idle-1.webp
          test -f duck-quest/assets/shinies/sakura-tree-squirrel-idle-1.webp
          test -f duck-quest/assets/shinies/rainbow-jellybun-idle-1.webp

          node --check script-v24-92.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.92 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.92 Duck Quest image cache repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Install Duck Habit Hub v24.95 OC Wallpapers + Taller Attacks

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-95-OC-Wallpapers-Taller-Attacks-UPDATE-ONLY.zip"
      - "*v24-95*OC*Wallpapers*Taller*Attacks*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-95-OC-Wallpapers-Taller-Attacks-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-95*oc*wallpapers*taller*attacks*update*only*.zip' -o -iname '*v24.95*oc*wallpapers*taller*attacks*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.95"' version.json \
              && [ -f "script-v24-95.js" ] \
              && grep -Fq 'script-v24-95.js' index.html \
              && grep -Fq 'rose-ribbon-wallpaper' script-v24-95.js \
              && grep -Fq 'royal-celestial-wallpaper' duck-quest/js/game-v43.js; then
              echo "v24.95 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.95 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_95/index.html" \
            "duckhub_update_v24_95/script-v24-95.js" \
            "duckhub_update_v24_95/sw.js" \
            "duckhub_update_v24_95/version.json" \
            "duckhub_update_v24_95/duck-quest/css/style-v38.css" \
            "duckhub_update_v24_95/duck-quest/js/game-v43.js"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.95 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-95-update"
          SRC="$TMP/duckhub_update_v24_95"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.95"' index.html
          grep -Fq 'script-v24-95.js' index.html
          grep -Fq '"version": "24.95"' version.json
          grep -Fq 'duck-habit-hub-app-v24-95' sw.js
          grep -Fq 'rose-ribbon-wallpaper' script-v24-95.js
          grep -Fq 'crown-confetti-wallpaper' script-v24-95.js
          grep -Fq 'petal-dream-wallpaper' duck-quest/js/game-v43.js
          grep -Fq 'royal-celestial-wallpaper' duck-quest/js/game-v43.js
          grep -Fq 'Taller attack menu' duck-quest/css/style-v38.css

          node --check script-v24-95.js
          node --check duck-quest/js/game-v43.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.95 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.95 OC wallpapers and taller attack window"
          git push origin "HEAD:${GITHUB_REF_NAME}"

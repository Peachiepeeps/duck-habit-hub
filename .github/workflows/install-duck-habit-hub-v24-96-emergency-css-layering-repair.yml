name: Install Duck Habit Hub v24.96 Emergency CSS Layering Repair

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-96-Emergency-CSS-Layering-Repair-UPDATE-ONLY.zip"
      - "*v24-96*Emergency*CSS*Layering*Repair*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-96-Emergency-CSS-Layering-Repair-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-96*emergency*css*layering*repair*update*only*.zip' -o -iname '*v24.96*emergency*css*layering*repair*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.96"' version.json \
              && [ -f "style-v24-96.css" ] \
              && grep -Fq 'style-v24-96.css' index.html; then
              echo "v24.96 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.96 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_96/index.html" \
            "duckhub_update_v24_96/style-v24-96.css" \
            "duckhub_update_v24_96/script-v24-95.js" \
            "duckhub_update_v24_96/sw.js" \
            "duckhub_update_v24_96/version.json" \
            "duckhub_update_v24_96/duck-quest/index.html" \
            "duckhub_update_v24_96/duck-quest/css/style-v38.css" \
            "duckhub_update_v24_96/duck-quest/js/game-v43.js"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.96 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-96-update"
          SRC="$TMP/duckhub_update_v24_96"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          grep -Fq 'DUCK_HUB_BUILD = "24.96"' index.html
          grep -Fq 'style-v24-96.css' index.html
          grep -Fq 'room-wallpaper-overlay' style-v24-96.css
          grep -Fq '.stage-layer' style-v24-96.css
          grep -Fq 'position:absolute' style-v24-96.css
          grep -Fq 'duck-habit-hub-app-v24-96' sw.js
          grep -Fq './style-v24-96.css' sw.js
          grep -Fq '"version": "24.96"' version.json

          node --check script-v24-95.js
          node --check duck-quest/js/game-v43.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.96 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.96 emergency CSS layering repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"

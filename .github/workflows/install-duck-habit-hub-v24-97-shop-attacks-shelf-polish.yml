name: Install Duck Habit Hub v24.97 Shop + Attacks + Shelf Polish

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-97-Shop-Attacks-Shelf-Polish-UPDATE-ONLY.zip"
      - "*v24-97*Shop*Attacks*Shelf*Polish*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-97-Shop-Attacks-Shelf-Polish-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-97*shop*attacks*shelf*polish*update*only*.zip' -o -iname '*v24.97*shop*attacks*shelf*polish*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.97"' version.json \
              && [ -f "script-v24-97.js" ] \
              && [ -f "style-v24-97.css" ] \
              && [ -f "duck-quest/js/game-v44.js" ] \
              && [ -f "duck-quest/css/style-v40.css" ] \
              && grep -Fq 'script-v24-97.js' index.html \
              && grep -Fq 'js/game-v44.js' duck-quest/index.html; then
              echo "v24.97 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.97 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_97/index.html" \
            "duckhub_update_v24_97/script-v24-97.js" \
            "duckhub_update_v24_97/style-v24-97.css" \
            "duckhub_update_v24_97/sw.js" \
            "duckhub_update_v24_97/version.json" \
            "duckhub_update_v24_97/duck-quest/index.html" \
            "duckhub_update_v24_97/duck-quest/js/game-v44.js" \
            "duckhub_update_v24_97/duck-quest/css/style-v40.css"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.97 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-97-update"
          SRC="$TMP/duckhub_update_v24_97"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          # Remove only the superseded active files from the immediately prior build.
          rm -f script-v24-95.js style-v24-96.css
          rm -f duck-quest/js/game-v43.js duck-quest/css/style-v38.css

          grep -Fq 'DUCK_HUB_BUILD = "24.97"' index.html
          grep -Fq 'script-v24-97.js' index.html
          grep -Fq 'style-v24-97.css' index.html
          grep -Fq 'if (listing?.wallpaperId) return `wallpaper:${listing.wallpaperId}`' script-v24-97.js
          grep -Fq '["1", "2", "3", "4", "5", "6"]' script-v24-97.js
          grep -Fq 'transform:translate(70%,-1.2%)' style-v24-97.css
          grep -Fq 'js/game-v44.js' duck-quest/index.html
          grep -Fq 'css/style-v40.css' duck-quest/index.html
          grep -Fq 'activate-zoomies' duck-quest/js/game-v44.js
          grep -Fq 'thoughts-of-lovers' duck-quest/js/game-v44.js
          grep -Fq 'magic-hangover' duck-quest/js/game-v44.js
          grep -Fq 'repeat(4,minmax(0,1fr))' duck-quest/css/style-v40.css
          grep -Fq 'duck-habit-hub-app-v24-97' sw.js
          grep -Fq '"version": "24.97"' version.json

          node --check script-v24-97.js
          node --check duck-quest/js/game-v44.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.97 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.97 shop attacks shelf polish"
          git push origin "HEAD:${GITHUB_REF_NAME}"

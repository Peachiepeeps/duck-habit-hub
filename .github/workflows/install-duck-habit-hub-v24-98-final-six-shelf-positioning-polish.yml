name: Install Duck Habit Hub v24.98 Final Six-Shelf Positioning Polish

on:
  workflow_dispatch:
  push:
    paths:
      - "Duck-Habit-Hub-v24-98-Final-Six-Shelf-Positioning-Polish-UPDATE-ONLY.zip"
      - "*v24-98*Final*Six*Shelf*Positioning*Polish*UPDATE*ONLY*.zip"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate update package
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="Duck-Habit-Hub-v24-98-Final-Six-Shelf-Positioning-Polish-UPDATE-ONLY.zip"
          ZIP=""

          if [ -f "$EXPECTED" ]; then
            ZIP="$EXPECTED"
          else
            ZIP="$(find . -maxdepth 1 -type f \( -iname '*v24-98*final*six*shelf*positioning*polish*update*only*.zip' -o -iname '*v24.98*final*six*shelf*positioning*polish*update*only*.zip' \) -printf '%f\n' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            if [ -f "version.json" ] \
              && grep -Fq '"version": "24.98"' version.json \
              && [ -f "script-v24-98.js" ] \
              && [ -f "style-v24-98.css" ] \
              && grep -Fq 'script-v24-98.js' index.html \
              && grep -Fq 'style-v24-98.css' index.html; then
              echo "v24.98 already appears to be installed."
              echo "already_installed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::The v24.98 UPDATE-ONLY ZIP is not in the repository root."
            echo "Upload this file beside index.html: $EXPECTED"
            exit 1
          fi

          echo "Found update package: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "already_installed=false" >> "$GITHUB_OUTPUT"

      - name: Verify update package
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP"
          LISTING="$(unzip -Z1 "$ZIP")"
          for REQUIRED in \
            "duckhub_update_v24_98/index.html" \
            "duckhub_update_v24_98/script-v24-98.js" \
            "duckhub_update_v24_98/style-v24-98.css" \
            "duckhub_update_v24_98/sw.js" \
            "duckhub_update_v24_98/version.json"; do
            grep -Fqx "$REQUIRED" <<<"$LISTING" || { echo "::error::Update ZIP is missing $REQUIRED"; exit 1; }
          done

      - name: Install v24.98 update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail
          TMP=".duckhub-v24-98-update"
          SRC="$TMP/duckhub_update_v24_98"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$SRC/." ./

          # Remove only the superseded active files from the prior build.
          rm -f script-v24-97.js style-v24-97.css

          grep -Fq 'DUCK_HUB_BUILD = "24.98"' index.html
          grep -Fq 'script-v24-98.js' index.html
          grep -Fq 'style-v24-98.css' index.html
          grep -Fq 'SHELF_DUCK_PERCHES = Object.freeze' script-v24-98.js
          grep -Fq 'shelf-furniture' script-v24-98.js
          grep -Fq 'Choose any Shelf 1–6' script-v24-98.js
          grep -Fq '.left-furniture.shelf-furniture' style-v24-98.css
          grep -Fq 'transform:translate(70%,1.0%)' style-v24-98.css
          grep -Fq 'duck-habit-hub-app-v24-98' sw.js
          grep -Fq '"version": "24.98"' version.json

          node --check script-v24-98.js
          node --check sw.js

          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Commit installed update
        if: steps.locate.outputs.already_installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit. v24.98 is already current."
            exit 0
          fi

          git commit -m "Install Duck Habit Hub v24.98 final six-shelf positioning polish"
          git push origin "HEAD:${GITHUB_REF_NAME}"

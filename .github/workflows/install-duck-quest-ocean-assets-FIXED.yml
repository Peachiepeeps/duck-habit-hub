name: Install Duck Quest Ocean Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-ocean-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find Ocean asset package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ocean-install-temp

          if [ -f "duck-quest-ocean-assets-upload.zip" ]; then
            echo "Using direct Ocean asset ZIP."
            cp "duck-quest-ocean-assets-upload.zip" ".ocean-install-temp/assets.zip"

          elif [ -f "duck-quest-ocean-easy-installer.zip" ]; then
            echo "Using Ocean easy-installer bundle already in repo."

            unzip -j -o \
              "duck-quest-ocean-easy-installer.zip" \
              "duck-quest-ocean-assets-upload.zip" \
              -d ".ocean-install-temp"

            mv \
              ".ocean-install-temp/duck-quest-ocean-assets-upload.zip" \
              ".ocean-install-temp/assets.zip"

          else
            echo "ERROR: No Ocean installer ZIP was found in the repository root."
            echo "Expected either:"
            echo "  duck-quest-ocean-assets-upload.zip"
            echo "or"
            echo "  duck-quest-ocean-easy-installer.zip"
            exit 1
          fi

          echo "Found package:"
          ls -lh ".ocean-install-temp/assets.zip"

      - name: Verify package before installing
        shell: bash
        run: |
          set -euo pipefail

          ZIP=".ocean-install-temp/assets.zip"

          unzip -l "$ZIP" | grep -q "duck-quest/assets/backgrounds/ocean/shore.png"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/backgrounds/ocean/surface.png"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/backgrounds/ocean/deep.png"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/backgrounds/ocean/floor.png"

          unzip -l "$ZIP" | grep -q "duck-quest/assets/enemies/cool-seagull/base/idle-1.png"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/enemies/sea-turtle/base/idle-1.png"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/enemies/catfish/base/idle-1.png"
          unzip -l "$ZIP" | grep -q "duck-quest/assets/bosses/vampire-squid/base/idle-1.png"

          echo "Ocean package verified."

      - name: Install Ocean assets
        shell: bash
        run: |
          set -euo pipefail

          unzip -o ".ocean-install-temp/assets.zip" -d .

          # The map file is only documentation and does not need to stay in the repo.
          rm -f "duck-quest/docs/OCEAN-ASSET-MAP.txt"
          rmdir "duck-quest/docs" 2>/dev/null || true

          echo "Ocean assets extracted."

      - name: Verify installed files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "duck-quest/assets/backgrounds/ocean/shore.png"
            "duck-quest/assets/backgrounds/ocean/surface.png"
            "duck-quest/assets/backgrounds/ocean/deep.png"
            "duck-quest/assets/backgrounds/ocean/floor.png"

            "duck-quest/assets/enemies/cool-seagull/base/Black-hurt.png"
            "duck-quest/assets/enemies/sea-turtle/base/Gold-hurt.png"
            "duck-quest/assets/enemies/catfish/base/Black-hurt.png"
            "duck-quest/assets/bosses/vampire-squid/base/Pink-hurt.png"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: expected installed file is missing:"
              echo "$file"
              exit 1
            fi
          done

          echo "All Ocean asset groups installed successfully."

      - name: Remove temporary installer ZIPs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ".ocean-install-temp"
          rm -f "duck-quest-ocean-assets-upload.zip"
          rm -f "duck-quest-ocean-easy-installer.zip"

      - name: Commit installed Ocean assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Install Duck Quest Ocean assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Ocean assets installed and committed successfully."

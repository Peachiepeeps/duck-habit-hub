name: Install Duck Quest v14 Ocean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-duck-quest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify package exists
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Quest-v14-Ocean-COMPAT.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            exit 1
          fi

          unzip -t "$ZIP"

      - name: Replace Duck Quest folder
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Quest-v14-Ocean-COMPAT.zip"

          rm -rf duck-quest
          unzip -o "$ZIP" -d .

          test -f "duck-quest/index.html"
          test -f "duck-quest/js/game-v14.js"
          test -f "duck-quest/assets/backgrounds/ocean/shore.png"
          test -f "duck-quest/assets/bosses/vampire-squid/base/Pink-hurt.png"

          rm -f "$ZIP"

      - name: Commit Duck Quest v14
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Install Duck Quest v14 Ocean"
          git push origin "HEAD:${GITHUB_REF_NAME}"

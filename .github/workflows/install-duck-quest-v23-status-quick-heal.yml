name: Install Duck Quest v23 Status + Quick Heal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-duck-quest-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Quest-v23-Status-and-Quick-Heal.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the repo root."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "duck-quest/index.html"
          unzip -l "$ZIP" | grep -q "duck-quest/css/style-v23.css"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v23.js"
          unzip -l "$ZIP" | grep -q "duck-quest/battle-v23.html"

      - name: Install Duck Quest v23
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Quest-v23-Status-and-Quick-Heal.zip"

          unzip -o "$ZIP" -d .

          test -f "duck-quest/index.html"
          test -f "duck-quest/css/style-v23.css"
          test -f "duck-quest/js/game-v23.js"
          test -f "duck-quest/battle-v23.html"

          grep -q 'css/style-v23.css' "duck-quest/index.html"
          grep -q 'js/game-v23.js' "duck-quest/index.html"
          grep -q 'quickHealButton' "duck-quest/index.html"
          grep -q 'QUICK_HEAL_MAX_USES = 4' "duck-quest/js/game-v23.js"

          # Remove only the Duck Quest code versions replaced by v23.
          rm -f \
            "duck-quest/battle-v22.html" \
            "duck-quest/css/style-v22.css" \
            "duck-quest/js/game-v22.js" \
            "duck-quest/README-v22.txt"

          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Fix Miko status and add Quick Heal"
          git push origin "HEAD:${GITHUB_REF_NAME}"

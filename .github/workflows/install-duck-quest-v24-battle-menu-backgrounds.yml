name: Install Duck Quest v24 Battle Menu + Backgrounds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-duck-quest-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify update ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Quest-v24-Battle-Menu-and-Special-Backgrounds.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            echo "Upload the ZIP untouched to the repo root."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q "duck-quest/index.html"
          unzip -l "$ZIP" | grep -q "duck-quest/css/style-v24.css"
          unzip -l "$ZIP" | grep -q "duck-quest/js/game-v24.js"
          unzip -l "$ZIP" | grep -q "duck-quest/battle-v24.html"

      - name: Install Duck Quest v24
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duck-Quest-v24-Battle-Menu-and-Special-Backgrounds.zip"
          unzip -o "$ZIP" -d .

          test -f "duck-quest/index.html"
          test -f "duck-quest/css/style-v24.css"
          test -f "duck-quest/js/game-v24.js"
          test -f "duck-quest/battle-v24.html"

          grep -q 'css/style-v24.css' "duck-quest/index.html"
          grep -q 'js/game-v24.js' "duck-quest/index.html"
          grep -q 'commandStage' "duck-quest/index.html"
          grep -q 'sweetheart-rainbow' "duck-quest/js/game-v24.js"
          grep -q 'QUICK_HEAL_MAX_USES = 4' "duck-quest/js/game-v24.js"

          rm -f \
            "duck-quest/battle-v23.html" \
            "duck-quest/css/style-v23.css" \
            "duck-quest/js/game-v23.js" \
            "duck-quest/README-v23.txt"

          rm -f "$ZIP"

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Add overlay battle menu and special icon backgrounds"
          git push origin "HEAD:${GITHUB_REF_NAME}"

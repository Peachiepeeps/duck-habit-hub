name: Install Duckie Days v24.171 Clean Corrected Update

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24.171*clean*corrected*update-only*.zip"
      - "*v24-171*clean*corrected*update-only*.zip"
      - ".github/workflows/install-duckie-days-v24-171-clean-corrected-update.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f \( -iname '*v24.171*clean*corrected*update-only*.zip' -o -iname '*v24-171*clean*corrected*update-only*.zip' \) | sort | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Install update
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          TMP=.duckie-days-clean-corrected-update
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Clean repository clutter
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'duckie-days-v24.*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-171.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-171.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-171.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v74.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v86.js' -delete

      - name: Verify current active files
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.171"' version.json
          grep -Fq 'script-v24-171.js?v=24-171' index.html
          grep -Fq 'style-v24-171.css?v=24-171' index.html
          grep -Fq 'sw-v24-171.js?v=24-171' index.html
          grep -Fq 'js/game-v86.js?v=24-171' duck-quest/index.html
          grep -Fq 'css/style-v74.css?v=24-171' duck-quest/index.html
          grep -Fq "mimicName:'Mimic'" duck-quest/js/game-v86.js
          grep -Fq "mimicName:'Lucky Mimic'" duck-quest/js/game-v86.js
          grep -Fq "mimicName:'Healthy Mimic'" duck-quest/js/game-v86.js
          grep -Fq "mimicName:'Amethyst Mimic'" duck-quest/js/game-v86.js
          test -f duck-quest/assets/enemies/mimic/lucky/idle-1.webp
          test -f duck-quest/assets/enemies/mimic/healthy/idle-1.webp
          test -f duck-quest/assets/shinies/amethyst-mimic-idle-1.webp
          node --check script-v24-171.js
          node --check sw-v24-171.js
          node --check duck-quest/js/game-v86.js

      - name: Commit changes
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Install Duckie Days v24.171 clean corrected update"
          git push

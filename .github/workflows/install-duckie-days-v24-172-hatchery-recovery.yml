name: Install Duckie Days v24.172 Hatchery Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24.172*hatchery*recovery*update-only*.zip"
      - "*v24-172*hatchery*recovery*update-only*.zip"
      - ".github/workflows/install-duckie-days-v24-172-hatchery-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f \( -iname '*v24.172*hatchery*recovery*update-only*.zip' -o -iname '*v24-172*hatchery*recovery*update-only*.zip' \) | sort | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Install update
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          TMP=.duckie-days-v24-172-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Safely clean old version clutter
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Keep current + one previous release so a cached PWA never loses its referenced assets.
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-171.css' ! -name 'style-v24-172.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-171.js' ! -name 'script-v24-172.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-171.js' ! -name 'sw-v24-172.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v74.css' ! -name 'style-v75.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v86.js' ! -name 'game-v87.js' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' ! -name 'DUCKIE_DAYS_v24.172_notes.txt' -delete

      - name: Verify v24.172
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.172"' version.json
          grep -Fq 'style-v24-172.css?v=24-172' index.html
          grep -Fq 'script-v24-172.js?v=24-172' index.html
          grep -Fq 'sw-v24-172.js?v=24-172' index.html
          grep -Fq 'css/style-v75.css?v=24-172' duck-quest/index.html
          grep -Fq 'js/game-v87.js?v=24-172' duck-quest/index.html
          grep -Fq 'v24.172 — robust Hatching Area viewport sizing' duck-quest/js/game-v87.js
          grep -Fq "mimicName:'Mimic'" duck-quest/js/game-v87.js
          test -f duck-quest/assets/enemies/mimic/lucky/idle-1.webp
          test -f duck-quest/assets/enemies/mimic/healthy/idle-1.webp
          test -f duck-quest/assets/shinies/amethyst-mimic-idle-1.webp
          node --check script-v24-172.js
          node --check sw-v24-172.js
          node --check duck-quest/js/game-v87.js

      - name: Commit changes
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Duckie Days v24.172 hatchery recovery"
          git push

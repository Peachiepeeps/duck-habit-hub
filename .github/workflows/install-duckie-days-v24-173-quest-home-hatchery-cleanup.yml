name: Install Duckie Days v24.173 Quest Home + Hatchery + Cleanup

"on":
  workflow_dispatch:
  push:
    paths:
      - "*v24.173*quest*home*hatchery*cleanup*update-only*.zip"
      - "*v24-173*quest*home*hatchery*cleanup*update-only*.zip"
      - ".github/workflows/install-duckie-days-v24-173-quest-home-hatchery-cleanup.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate update ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f             \( -iname '*v24.173*quest*home*hatchery*cleanup*update-only*.zip'             -o -iname '*v24-173*quest*home*hatchery*cleanup*update-only*.zip' \)             | sort | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "package_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "package_found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Install v24.173
        if: steps.package.outputs.package_found == 'true'
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$ZIP"
          TMP=.duckie-days-v24-173-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"
          rm -f "$ZIP"

      - name: Verify v24.173 before cleanup
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.173"' version.json
          grep -Fq 'duck-habit-build" content="24.173"' index.html
          grep -Fq 'style-v24-173.css?v=24-173' index.html
          grep -Fq 'script-v24-173.js?v=24-173' index.html
          grep -Fq 'sw-v24-173.js?v=24-173' index.html
          grep -Fq 'css/style-v76.css?v=24-173' duck-quest/index.html
          grep -Fq 'js/game-v88.js?v=24-173' duck-quest/index.html
          grep -Fq 'v24.173 — final Duck Quest home layout' duck-quest/js/game-v88.js
          grep -Fq 'hatchery-solid-screen' duck-quest/css/style-v76.css
          grep -Fq "mimicName:'Mimic'" duck-quest/js/game-v88.js
          grep -Fq "mimicName:'Lucky Mimic'" duck-quest/js/game-v88.js
          grep -Fq "mimicName:'Healthy Mimic'" duck-quest/js/game-v88.js
          grep -Fq "mimicName:'Amethyst Mimic'" duck-quest/js/game-v88.js
          test -f duck-quest/assets/enemies/mimic/lucky/idle-1.webp
          test -f duck-quest/assets/enemies/mimic/healthy/idle-1.webp
          test -f duck-quest/assets/shinies/amethyst-mimic-idle-1.webp
          node --check script-v24-173.js
          node --check sw-v24-173.js
          node --check duck-quest/js/game-v88.js

      - name: Clean old Duckie Days update clutter
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Old installer workflows only. Leave unrelated workflows alone.
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f               \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \)               ! -name 'install-duckie-days-v24-173-quest-home-hatchery-cleanup.yml'               -delete
          fi

          # Old update packages / release notes.
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete

          # Keep current + one prior build for cache-safe fallback.
          find . -maxdepth 1 -type f -name 'style-v24-*.css'             ! -name 'style-v24-172.css' ! -name 'style-v24-173.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js'             ! -name 'script-v24-172.js' ! -name 'script-v24-173.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js'             ! -name 'sw-v24-172.js' ! -name 'sw-v24-173.js' -delete

          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css'             ! -name 'style-v75.css' ! -name 'style-v76.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js'             ! -name 'game-v87.js' ! -name 'game-v88.js' -delete

      - name: Commit update and cleanup
        if: steps.package.outputs.package_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Install Duckie Days v24.173 and clean old update files"
          git push

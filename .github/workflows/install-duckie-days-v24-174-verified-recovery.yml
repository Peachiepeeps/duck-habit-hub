name: Install Duckie Days v24.174 Verified Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.174-verified-recovery-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-174-verified-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.174-verified-recovery-update-only.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found at the repository root."
            echo "This workflow intentionally fails instead of reporting a false green success."
            echo "Root files currently present:"
            find . -maxdepth 1 -type f -printf '%f
' | sort
            exit 1
          fi
          unzip -tq "$ZIP"

      - name: Install v24.174
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.174-verified-recovery-update-only.zip"
          TMP=.duckie-days-v24-174-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify exact v24.174 files before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.174"' version.json
          grep -Fq 'duck-habit-build" content="24.174"' index.html
          grep -Fq 'style-v24-174.css?v=24-174' index.html
          grep -Fq 'script-v24-174.js?v=24-174' index.html
          grep -Fq 'sw-v24-174.js?v=24-174' index.html
          grep -Fq 'css/style-v77.css?v=24-174' duck-quest/index.html
          grep -Fq 'js/game-v89.js?v=24-174' duck-quest/index.html
          grep -Fq "window.DUCKIE_DAYS_BUILD='24.174'" duck-quest/js/game-v89.js
          grep -Fq 'v24.173 — final Duck Quest home layout' duck-quest/js/game-v89.js
          grep -Fq 'hatchery-solid-screen' duck-quest/css/style-v77.css
          grep -Fq "mimicName:'Mimic'" duck-quest/js/game-v89.js
          grep -Fq "mimicName:'Lucky Mimic'" duck-quest/js/game-v89.js
          grep -Fq "mimicName:'Healthy Mimic'" duck-quest/js/game-v89.js
          grep -Fq "mimicName:'Amethyst Mimic'" duck-quest/js/game-v89.js
          test -f duck-quest/assets/enemies/mimic/lucky/idle-1.webp
          test -f duck-quest/assets/enemies/mimic/healthy/idle-1.webp
          test -f duck-quest/assets/shinies/amethyst-mimic-idle-1.webp
          node --check script-v24-174.js
          node --check sw-v24-174.js
          node --check duck-quest/js/game-v89.js
          echo "VERIFIED: v24.174 update files are installed in the checkout."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f               \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \)               ! -name 'install-duckie-days-v24-174-verified-recovery.yml'               -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.174-verified-recovery-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.174-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-173.css' ! -name 'style-v24-174.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-173.js' ! -name 'script-v24-174.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-173.js' ! -name 'sw-v24-174.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v76.css' ! -name 'style-v77.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v88.js' ! -name 'game-v89.js' -delete
          rm -f "Duckie-Days-v24.174-verified-recovery-update-only.zip"

      - name: Commit installed build and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No repository changes were staged. The install did not change the repo."
            exit 1
          fi
          git commit -m "Install Duckie Days v24.174 verified recovery"
          git push

      - name: Final success marker
        shell: bash
        run: |
          echo "SUCCESS: v24.174 was verified, committed, and pushed."

name: Install Duckie Days v24.175 Home + Hatchery Final Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.175-home-hatchery-final-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-175-home-hatchery-final-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.175 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.175-home-hatchery-final-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing from the repository root."; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.175
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.175-home-hatchery-final-fix-update-only.zip"
          TMP=.duckie-days-v24-175-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.175 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.175"' version.json
          grep -Fq 'duck-habit-build" content="24.175"' index.html
          grep -Fq 'style-v24-175.css?v=24-175' index.html
          grep -Fq 'script-v24-175.js?v=24-175' index.html
          grep -Fq 'sw-v24-175.js?v=24-175' index.html
          grep -Fq 'css/style-v78.css?v=24-175' duck-quest/index.html
          grep -Fq 'js/game-v90.js?v=24-175' duck-quest/index.html
          grep -Fq 'id="questHomeTools"' duck-quest/index.html
          grep -Fq 'Fortune-green-charm.png' duck-quest/index.html
          grep -Fq 'v24.175 — authoritative Duck Quest home tools + hatchery recovery' duck-quest/js/game-v90.js
          grep -Fq "window.DUCKIE_DAYS_BUILD='24.175'" duck-quest/js/game-v90.js
          grep -Fq 'background-image:url(' duck-quest/js/game-v90.js
          test -f duck-quest/assets/charms/Fortune-green-charm.png
          node --check script-v24-175.js
          node --check sw-v24-175.js
          node --check duck-quest/js/game-v90.js
          echo "VERIFIED: v24.175 files are installed."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f               \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \)               ! -name 'install-duckie-days-v24-175-home-hatchery-final-fix.yml'               -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.175-home-hatchery-final-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.175-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-174.css' ! -name 'style-v24-175.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-174.js' ! -name 'script-v24-175.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-174.js' ! -name 'sw-v24-175.js' -delete
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' ! -name 'style-v77.css' ! -name 'style-v78.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v89.js' ! -name 'game-v90.js' -delete
          rm -f "Duckie-Days-v24.175-home-hatchery-final-fix-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-175.css
          test -f script-v24-175.js
          test -f sw-v24-175.js
          test -f duck-quest/css/style-v78.css
          test -f duck-quest/js/game-v90.js
          test -f duck-quest/assets/charms/Fortune-green-charm.png
          test ! -f Duckie-Days-v24.175-home-hatchery-final-fix-update-only.zip
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: cleanup left one Duckie Days installer workflow."

      - name: Commit v24.175 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.175 home and hatchery final fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.175 installed, verified, cleaned, committed, and pushed."

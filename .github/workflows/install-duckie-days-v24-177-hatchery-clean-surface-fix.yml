name: Install Duckie Days v24.177 Hatchery Clean Surface Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.177-hatchery-clean-surface-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-177-hatchery-clean-surface-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.177 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.177-hatchery-clean-surface-fix-update-only.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            ls -1
            exit 1
          fi
          unzip -tq "$ZIP"

      - name: Install v24.177
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.177-hatchery-clean-surface-fix-update-only.zip"
          TMP=.duckie-days-v24-177-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.177 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.177"' version.json
          grep -Fq 'duck-habit-build" content="24.177"' index.html
          grep -Fq 'style-v24-177.css?v=24-177' index.html
          grep -Fq 'script-v24-177.js?v=24-177' index.html
          grep -Fq 'sw-v24-177.js?v=24-177' index.html
          grep -Fq 'css/style-v80.css?v=24-177' duck-quest/index.html
          grep -Fq 'js/game-v92.js?v=24-177' duck-quest/index.html
          grep -Fq 'v24.177 — authoritative clean hatchery surface' duck-quest/js/game-v92.js
          grep -Fq "window.DUCKIE_DAYS_BUILD='24.177'" duck-quest/js/game-v92.js
          grep -Fq 'hatchery-v177' duck-quest/js/game-v92.js
          grep -Fq 'document.body.appendChild(screen)' duck-quest/js/game-v92.js
          grep -Fq 'setInterval(enforceHatcheryV177,120)' duck-quest/js/game-v92.js
          test -f duck-quest/assets/eggs/Hatching-background-new.png
          test -f duck-quest/assets/charms/Fortune-green-charm.png
          node --check script-v24-177.js
          node --check sw-v24-177.js
          node --check duck-quest/js/game-v92.js
          echo "VERIFIED: v24.177 files are installed."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f               \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \)               ! -name 'install-duckie-days-v24-177-hatchery-clean-surface-fix.yml'               -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip'             ! -name 'Duckie-Days-v24.177-hatchery-clean-surface-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt'             ! -name 'V24.176-NOTES.txt' ! -name 'V24.177-NOTES.txt' -delete

          find . -maxdepth 1 -type f -name 'style-v24-*.css'             ! -name 'style-v24-176.css' ! -name 'style-v24-177.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js'             ! -name 'script-v24-176.js' ! -name 'script-v24-177.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js'             ! -name 'sw-v24-176.js' ! -name 'sw-v24-177.js' -delete

          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css'             ! -name 'style-v79.css' ! -name 'style-v80.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js'             ! -name 'game-v91.js' ! -name 'game-v92.js' -delete

          rm -f "Duckie-Days-v24.177-hatchery-clean-surface-fix-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-176.css
          test -f style-v24-177.css
          test -f script-v24-176.js
          test -f script-v24-177.js
          test -f sw-v24-176.js
          test -f sw-v24-177.js
          test -f duck-quest/css/style-v79.css
          test -f duck-quest/css/style-v80.css
          test -f duck-quest/js/game-v91.js
          test -f duck-quest/js/game-v92.js
          test ! -f Duckie-Days-v24.177-hatchery-clean-surface-fix-update-only.zip
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: cleanup left v24.176 fallback + v24.177 current build."

      - name: Commit v24.177 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.177 hatchery clean surface fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.177 installed, verified, cleaned, committed, and pushed."

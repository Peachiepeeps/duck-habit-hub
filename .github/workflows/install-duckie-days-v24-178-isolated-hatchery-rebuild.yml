name: Install Duckie Days v24.178 Isolated Hatchery Rebuild

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.178-isolated-hatchery-rebuild-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-178-isolated-hatchery-rebuild.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.178 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.178-isolated-hatchery-rebuild-update-only.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            ls -1
            exit 1
          fi
          unzip -tq "$ZIP"

      - name: Install v24.178
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.178-isolated-hatchery-rebuild-update-only.zip"
          TMP=.duckie-days-v24-178-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.178 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.178"' version.json
          grep -Fq 'duck-habit-build" content="24.178"' index.html
          grep -Fq 'style-v24-178.css?v=24-178' index.html
          grep -Fq 'script-v24-178.js?v=24-178' index.html
          grep -Fq 'sw-v24-178.js?v=24-178' index.html
          grep -Fq 'css/style-v81.css?v=24-178' duck-quest/index.html
          grep -Fq 'js/game-v93.js?v=24-178' duck-quest/index.html
          grep -Fq 'v24.178 — isolated hatchery screen' duck-quest/js/game-v93.js
          grep -Fq "window.DUCKIE_DAYS_BUILD='24.178'" duck-quest/js/game-v93.js
          grep -Fq "screen.id='hatcheryScreenV178'" duck-quest/js/game-v93.js
          grep -Fq 'window.DuckieHatchApiV178' duck-quest/js/game-v93.js
          grep -Fq '#hatcheryScreenV178.hatchery-clean-v178:not(.hidden)' duck-quest/css/style-v81.css
          grep -Fq './duck-quest/js/game-v93.js?v=24-178' sw-v24-178.js
          grep -Fq './duck-quest/css/style-v81.css?v=24-178' sw-v24-178.js
          test -f duck-quest/assets/eggs/Hatching-background-new.png
          test -f duck-quest/assets/charms/Fortune-green-charm.png
          node --check script-v24-178.js
          node --check sw-v24-178.js
          node --check duck-quest/js/game-v93.js
          echo "VERIFIED: v24.178 isolated hatchery rebuild is installed."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name 'install-duckie-days-v24-178-isolated-hatchery-rebuild.yml' \
              -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' \
            ! -name 'Duckie-Days-v24.178-isolated-hatchery-rebuild-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' \
            ! -name 'V24.177-NOTES.txt' ! -name 'V24.178-NOTES.txt' -delete

          find . -maxdepth 1 -type f -name 'style-v24-*.css' \
            ! -name 'style-v24-177.css' ! -name 'style-v24-178.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' \
            ! -name 'script-v24-177.js' ! -name 'script-v24-178.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' \
            ! -name 'sw-v24-177.js' ! -name 'sw-v24-178.js' -delete

          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' \
            ! -name 'style-v80.css' ! -name 'style-v81.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' \
            ! -name 'game-v92.js' ! -name 'game-v93.js' -delete

          rm -f "Duckie-Days-v24.178-isolated-hatchery-rebuild-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-177.css
          test -f style-v24-178.css
          test -f script-v24-177.js
          test -f script-v24-178.js
          test -f sw-v24-177.js
          test -f sw-v24-178.js
          test -f duck-quest/css/style-v80.css
          test -f duck-quest/css/style-v81.css
          test -f duck-quest/js/game-v92.js
          test -f duck-quest/js/game-v93.js
          test ! -f Duckie-Days-v24.178-isolated-hatchery-rebuild-update-only.zip
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: cleanup left v24.177 fallback + v24.178 current build."

      - name: Commit v24.178 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.178 isolated hatchery rebuild"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.178 installed, verified, cleaned, committed, and pushed."

name: Install Duckie Days v24.179 External Hatchery Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.179-external-hatchery-recovery-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-179-external-hatchery-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.179 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.179-external-hatchery-recovery-update-only.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            ls -1
            exit 1
          fi
          unzip -tq "$ZIP"

      - name: Install v24.179
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.179-external-hatchery-recovery-update-only.zip"
          TMP=.duckie-days-v24-179-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.179 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.179"' version.json
          grep -Fq 'duck-habit-build" content="24.179"' index.html
          grep -Fq 'style-v24-179.css?v=24-179' index.html
          grep -Fq 'script-v24-179.js?v=24-179' index.html
          grep -Fq 'sw-v24-179.js?v=24-179' index.html
          grep -Fq 'css/style-v82.css?v=24-179' duck-quest/index.html
          grep -Fq 'js/game-v94.js?v=24-179' duck-quest/index.html
          grep -Fq 'js/hatchery-v179.js?v=24-179' duck-quest/index.html
          grep -Fq "window.DUCKIE_DAYS_BUILD='24.179'" duck-quest/js/game-v94.js
          grep -Fq "window.DUCKIE_HATCH_SURFACE='24.179-external'" duck-quest/js/hatchery-v179.js
          grep -Fq "legacyButton.cloneNode(true)" duck-quest/js/hatchery-v179.js
          grep -Fq "screen.id='hatcheryScreenV179'" duck-quest/js/hatchery-v179.js
          grep -Fq './duck-quest/js/game-v94.js?v=24-179' sw-v24-179.js
          grep -Fq './duck-quest/js/hatchery-v179.js?v=24-179' sw-v24-179.js
          grep -Fq './duck-quest/css/style-v82.css?v=24-179' sw-v24-179.js
          node --check script-v24-179.js
          node --check sw-v24-179.js
          node --check duck-quest/js/game-v94.js
          node --check duck-quest/js/hatchery-v179.js
          echo "VERIFIED: v24.179 external hatchery recovery is installed."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name 'install-duckie-days-v24-179-external-hatchery-recovery.yml' \
              -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' \
            ! -name 'Duckie-Days-v24.179-external-hatchery-recovery-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' \
            ! -name 'V24.178-NOTES.txt' ! -name 'V24.179-NOTES.txt' -delete

          find . -maxdepth 1 -type f -name 'style-v24-*.css' \
            ! -name 'style-v24-178.css' ! -name 'style-v24-179.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' \
            ! -name 'script-v24-178.js' ! -name 'script-v24-179.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' \
            ! -name 'sw-v24-178.js' ! -name 'sw-v24-179.js' -delete

          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' \
            ! -name 'style-v81.css' ! -name 'style-v82.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' \
            ! -name 'game-v93.js' ! -name 'game-v94.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'hatchery-v*.js' \
            ! -name 'hatchery-v179.js' -delete

          rm -f "Duckie-Days-v24.179-external-hatchery-recovery-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-178.css
          test -f style-v24-179.css
          test -f script-v24-178.js
          test -f script-v24-179.js
          test -f sw-v24-178.js
          test -f sw-v24-179.js
          test -f duck-quest/css/style-v81.css
          test -f duck-quest/css/style-v82.css
          test -f duck-quest/js/game-v93.js
          test -f duck-quest/js/game-v94.js
          test -f duck-quest/js/hatchery-v179.js
          test ! -f Duckie-Days-v24.179-external-hatchery-recovery-update-only.zip
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: cleanup left v24.178 fallback + v24.179 current build."

      - name: Commit v24.179 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.179 external hatchery recovery"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.179 installed, verified, cleaned, committed, and pushed."

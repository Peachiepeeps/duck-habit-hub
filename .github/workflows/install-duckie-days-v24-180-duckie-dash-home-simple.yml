name: Install Duckie Days v24.180 Duckie Dash Home Simple

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.180-duckie-dash-home-simple-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-180-duckie-dash-home-simple.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.180 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.180-duckie-dash-home-simple-update-only.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            ls -1
            exit 1
          fi
          unzip -tq "$ZIP"

      - name: Install v24.180
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.180-duckie-dash-home-simple-update-only.zip"
          TMP=.duckie-days-v24-180-install
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.180 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.180"' version.json
          grep -Fq 'duck-habit-build" content="24.180"' index.html
          grep -Fq 'style-v24-180.css?v=24-180' index.html
          grep -Fq 'script-v24-180.js?v=24-180' index.html
          grep -Fq 'sw-v24-180.js?v=24-180' index.html

          grep -Fq 'css/style-v82.css?v=24-180' duck-quest/index.html
          grep -Fq 'js/game-v94.js?v=24-180' duck-quest/index.html
          grep -Fq 'js/hatchery-v179.js?v=24-180' duck-quest/index.html
          grep -Fq 'js/dash-home-v180.js?v=24-180' duck-quest/index.html

          # Keep the working isolated hatchery exactly in place.
          grep -Fq "window.DUCKIE_HATCH_SURFACE='24.179-external'" duck-quest/js/hatchery-v179.js
          grep -Fq "screen.id='hatcheryScreenV179'" duck-quest/js/hatchery-v179.js

          # Verify this update is limited to the requested Dash home simplification.
          grep -Fq "window.DUCKIE_DASH_HOME_SURFACE='24.180-simple'" duck-quest/js/dash-home-v180.js
          grep -Fq "start.textContent='3 Tokens to Start'" duck-quest/js/dash-home-v180.js
          grep -Fq "card.querySelectorAll('.dq-mini-grid').forEach(el=>el.remove())" duck-quest/js/dash-home-v180.js
          grep -Fq "card.querySelectorAll('.dash-home-cost').forEach(el=>el.remove())" duck-quest/js/dash-home-v180.js

          grep -Fq './duck-quest/js/game-v94.js?v=24-180' sw-v24-180.js
          grep -Fq './duck-quest/js/hatchery-v179.js?v=24-180' sw-v24-180.js
          grep -Fq './duck-quest/js/dash-home-v180.js?v=24-180' sw-v24-180.js
          grep -Fq './duck-quest/css/style-v82.css?v=24-180' sw-v24-180.js

          node --check script-v24-180.js
          node --check sw-v24-180.js
          node --check duck-quest/js/game-v94.js
          node --check duck-quest/js/hatchery-v179.js
          node --check duck-quest/js/dash-home-v180.js
          echo "VERIFIED: v24.180 Dash home simplification is installed and the v24.179 hatchery is preserved."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name 'install-duckie-days-v24-180-duckie-dash-home-simple.yml' \
              -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' \
            ! -name 'Duckie-Days-v24.180-duckie-dash-home-simple-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' \
            ! -name 'V24.179-NOTES.txt' ! -name 'V24.180-NOTES.txt' -delete

          # Keep current + one root fallback generation.
          find . -maxdepth 1 -type f -name 'style-v24-*.css' \
            ! -name 'style-v24-179.css' ! -name 'style-v24-180.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' \
            ! -name 'script-v24-179.js' ! -name 'script-v24-180.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' \
            ! -name 'sw-v24-179.js' ! -name 'sw-v24-180.js' -delete

          # v24.179 and v24.180 share these same Quest core files, so older Quest versions are no longer needed.
          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' \
            ! -name 'style-v82.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' \
            ! -name 'game-v94.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'hatchery-v*.js' \
            ! -name 'hatchery-v179.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'dash-home-v*.js' \
            ! -name 'dash-home-v180.js' -delete

          rm -f "Duckie-Days-v24.180-duckie-dash-home-simple-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-179.css
          test -f style-v24-180.css
          test -f script-v24-179.js
          test -f script-v24-180.js
          test -f sw-v24-179.js
          test -f sw-v24-180.js
          test -f duck-quest/css/style-v82.css
          test -f duck-quest/js/game-v94.js
          test -f duck-quest/js/hatchery-v179.js
          test -f duck-quest/js/dash-home-v180.js
          test ! -f duck-quest/css/style-v81.css
          test ! -f duck-quest/js/game-v93.js
          test ! -f Duckie-Days-v24.180-duckie-dash-home-simple-update-only.zip
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: cleanup left v24.179 root fallback + v24.180 current, with one clean Quest core."

      - name: Commit v24.180 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.180 simple Duckie Dash home"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.180 installed, verified, cleaned, committed, and pushed."

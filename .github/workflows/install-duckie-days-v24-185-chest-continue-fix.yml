name: Install Duckie Days v24.185 Chest Continue Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.185-chest-continue-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-185-chest-continue-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.185 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.185-chest-continue-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.185
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.185-chest-continue-fix-update-only.zip"
          TMP=.duckie-days-v24-185-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.185 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.185"' version.json
          grep -Fq 'duck-habit-build" content="24.185"' index.html
          grep -Fq 'style-v24-185.css?v=24-185' index.html
          grep -Fq 'script-v24-185.js?v=24-185' index.html
          grep -Fq 'sw-v24-185.js?v=24-185' index.html

          grep -Fq 'js/game-v95.js?v=24-185' duck-quest/index.html
          grep -Fq 'js/hatchery-v179.js?v=24-185' duck-quest/index.html
          grep -Fq 'js/dash-home-v180.js?v=24-185' duck-quest/index.html
          grep -Fq 'js/dash-screen-v184.js?v=24-185' duck-quest/index.html

          grep -Fq 'if(pendingChest.opened)' duck-quest/js/game-v95.js
          grep -Fq 'pendingChest=null;' duck-quest/js/game-v95.js
          grep -Fq 'nextEncounter();' duck-quest/js/game-v95.js
          grep -Fq "ui.openChest.textContent='Continue'" duck-quest/js/game-v95.js

          grep -Fq "window.DUCKIE_HATCH_SURFACE='24.179-external'" duck-quest/js/hatchery-v179.js
          grep -Fq "window.DUCKIE_DASH_HOME_SURFACE='24.180-simple'" duck-quest/js/dash-home-v180.js
          grep -Fq "window.DUCKIE_DASH_SCREEN_SURFACE='24.184-lower-ready-cost-below-preview'" duck-quest/js/dash-screen-v184.js

          grep -Fq './duck-quest/js/game-v95.js?v=24-185' sw-v24-185.js
          grep -Fq './duck-quest/js/hatchery-v179.js?v=24-185' sw-v24-185.js
          grep -Fq './duck-quest/js/dash-home-v180.js?v=24-185' sw-v24-185.js
          grep -Fq './duck-quest/js/dash-screen-v184.js?v=24-185' sw-v24-185.js

          node --check script-v24-185.js
          node --check sw-v24-185.js
          node --check duck-quest/js/game-v95.js
          node --check duck-quest/js/hatchery-v179.js
          node --check duck-quest/js/dash-home-v180.js
          node --check duck-quest/js/dash-screen-v184.js
          echo "VERIFIED: v24.185 chest Continue fix installed safely."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name 'install-duckie-days-v24-185-chest-continue-fix.yml' -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' \
            ! -name 'Duckie-Days-v24.185-chest-continue-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'README-v24.*.txt' -delete
          find . -maxdepth 1 -type f -name 'DUCKIE_DAYS_v24.*_notes.txt' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' \
            ! -name 'V24.185-NOTES.txt' -delete

          find . -maxdepth 1 -type f -name 'style-v24-*.css' \
            ! -name 'style-v24-184.css' ! -name 'style-v24-185.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' \
            ! -name 'script-v24-184.js' ! -name 'script-v24-185.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' \
            ! -name 'sw-v24-184.js' ! -name 'sw-v24-185.js' -delete

          find duck-quest/css -maxdepth 1 -type f -name 'style-v*.css' \
            ! -name 'style-v82.css' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' \
            ! -name 'game-v94.js' ! -name 'game-v95.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'hatchery-v*.js' \
            ! -name 'hatchery-v179.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'dash-home-v*.js' \
            ! -name 'dash-home-v180.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'dash-screen-v*.js' \
            ! -name 'dash-screen-v183.js' ! -name 'dash-screen-v184.js' -delete

          rm -f "Duckie-Days-v24.185-chest-continue-fix-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-184.css
          test -f style-v24-185.css
          test -f script-v24-184.js
          test -f script-v24-185.js
          test -f sw-v24-184.js
          test -f sw-v24-185.js
          test -f duck-quest/css/style-v82.css
          test -f duck-quest/js/game-v94.js
          test -f duck-quest/js/game-v95.js
          test -f duck-quest/js/hatchery-v179.js
          test -f duck-quest/js/dash-home-v180.js
          test -f duck-quest/js/dash-screen-v183.js
          test -f duck-quest/js/dash-screen-v184.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.185 current + v24.184 fallback retained cleanly."

      - name: Commit v24.185 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.185 chest Continue fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.185 installed, verified, cleaned, committed, and pushed."

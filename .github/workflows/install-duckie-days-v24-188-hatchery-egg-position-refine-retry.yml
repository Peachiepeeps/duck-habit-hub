name: Install Duckie Days v24.188 Hatchery Egg Position Refine Retry

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.188-hatchery-egg-position-refine-retry-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-188-hatchery-egg-position-refine-retry.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.188 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.188-hatchery-egg-position-refine-retry-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.188
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.188-hatchery-egg-position-refine-retry-update-only.zip"
          TMP=.duckie-days-v24-188-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.188 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.188"' version.json
          grep -Fq 'duck-habit-build" content="24.188"' index.html
          grep -Fq 'style-v24-188.css?v=24-188' index.html
          grep -Fq 'script-v24-188.js?v=24-188' index.html
          grep -Fq 'sw-v24-188.js?v=24-188' index.html

          grep -Fq 'js/game-v95.js?v=24-188' duck-quest/index.html
          grep -Fq 'js/hatchery-v179.js?v=24-188' duck-quest/index.html
          grep -Fq 'js/hatchery-egg-position-v188.js?v=24-188' duck-quest/index.html
          grep -Fq 'js/dash-home-v180.js?v=24-188' duck-quest/index.html
          grep -Fq 'js/dash-screen-v184.js?v=24-188' duck-quest/index.html

          grep -Fq "window.DUCKIE_HATCH_EGG_POSITION='24.188-top-middle-raised'" duck-quest/js/hatchery-egg-position-v188.js
          grep -Fq 'top:35.3%!important;' duck-quest/js/hatchery-egg-position-v188.js
          grep -Fq 'top:33.8%!important;' duck-quest/js/hatchery-egg-position-v188.js
          grep -Fq 'top:36.5%!important;' duck-quest/js/hatchery-egg-position-v188.js

          grep -Fq './duck-quest/js/game-v95.js?v=24-188' sw-v24-188.js
          grep -Fq './duck-quest/js/hatchery-v179.js?v=24-188' sw-v24-188.js
          grep -Fq './duck-quest/js/hatchery-egg-position-v188.js?v=24-188' sw-v24-188.js
          grep -Fq './duck-quest/js/dash-home-v180.js?v=24-188' sw-v24-188.js
          grep -Fq './duck-quest/js/dash-screen-v184.js?v=24-188' sw-v24-188.js

          node --check script-v24-188.js
          node --check sw-v24-188.js
          node --check duck-quest/js/hatchery-egg-position-v188.js
          node --check duck-quest/js/game-v95.js
          node --check duck-quest/js/dash-home-v180.js
          node --check duck-quest/js/dash-screen-v184.js
          echo "VERIFIED: v24.188 hatchery egg refine installed safely."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name 'install-duckie-days-v24-188-hatchery-egg-position-refine-retry.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' \
            ! -name 'Duckie-Days-v24.188-hatchery-egg-position-refine-retry-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.188-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-187.css' ! -name 'style-v24-188.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-187.js' ! -name 'script-v24-188.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-187.js' ! -name 'sw-v24-188.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'hatchery-egg-position-v*.js' \
            ! -name 'hatchery-egg-position-v187.js' ! -name 'hatchery-egg-position-v188.js' -delete
          rm -f "Duckie-Days-v24.188-hatchery-egg-position-refine-retry-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-187.css
          test -f style-v24-188.css
          test -f script-v24-187.js
          test -f script-v24-188.js
          test -f sw-v24-187.js
          test -f sw-v24-188.js
          test -f duck-quest/js/hatchery-egg-position-v187.js
          test -f duck-quest/js/hatchery-egg-position-v188.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.188 installed cleanly."

      - name: Commit v24.188 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.188 hatchery egg position refine retry"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.188 installed, verified, cleaned, committed, and pushed."

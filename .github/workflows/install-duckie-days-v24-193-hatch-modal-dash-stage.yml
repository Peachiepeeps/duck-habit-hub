name: Install Duckie Days v24.193 Hatch Modal + Dash Stage

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.193-hatch-modal-dash-stage-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-193-hatch-modal-dash-stage.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.193 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.193-hatch-modal-dash-stage-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.193
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.193-hatch-modal-dash-stage-update-only.zip"
          TMP=.duckie-days-v24-193-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.193 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.193"' version.json
          grep -Fq 'duck-habit-build" content="24.193"' index.html
          grep -Fq 'style-v24-193.css?v=24-193' index.html
          grep -Fq 'script-v24-193.js?v=24-193' index.html
          grep -Fq 'sw-v24-193.js?v=24-193' index.html

          grep -Fq 'js/game-v96.js?v=24-193' duck-quest/index.html
          grep -Fq 'js/hatchery-v179.js?v=24-193' duck-quest/index.html
          grep -Fq 'js/hatchery-egg-position-v192.js?v=24-193' duck-quest/index.html
          grep -Fq 'js/hatchery-ui-v193.js?v=24-193' duck-quest/index.html
          grep -Fq 'js/dash-home-v180.js?v=24-193' duck-quest/index.html
          grep -Fq 'js/dash-screen-v184.js?v=24-193' duck-quest/index.html
          grep -Fq 'js/dash-screen-v193.js?v=24-193' duck-quest/index.html

          grep -Fq "window.DUCKIE_HATCH_MODAL_UI='24.193-centered-simple'" duck-quest/js/hatchery-ui-v193.js
          grep -Fq "window.DUCKIE_DASH_RUN_SURFACE='24.193-dedicated-stage'" duck-quest/js/dash-screen-v193.js
          grep -Fq 'dash-run-stage-v193' duck-quest/js/game-v96.js
          grep -Fq 'dashRunMenuV193' duck-quest/js/game-v96.js

          grep -Fq 'top:32.4%!important;' duck-quest/js/hatchery-egg-position-v192.js
          grep -Fq 'top:25.1%!important;' duck-quest/js/hatchery-egg-position-v192.js
          grep -Fq 'top:33.5%!important;' duck-quest/js/hatchery-egg-position-v192.js
          grep -Fq 'translate:0 37px!important;' duck-quest/js/hatchery-egg-position-v192.js

          grep -Fq './duck-quest/js/game-v96.js?v=24-193' sw-v24-193.js
          grep -Fq './duck-quest/js/hatchery-ui-v193.js?v=24-193' sw-v24-193.js
          grep -Fq './duck-quest/js/dash-screen-v193.js?v=24-193' sw-v24-193.js

          node --check script-v24-193.js
          node --check sw-v24-193.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/hatchery-egg-position-v192.js
          node --check duck-quest/js/hatchery-ui-v193.js
          node --check duck-quest/js/dash-screen-v193.js
          echo "VERIFIED: v24.193 hatch modal and dedicated Dash stage are valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-193-hatch-modal-dash-stage.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.193-hatch-modal-dash-stage-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.193-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-192.css' ! -name 'style-v24-193.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-192.js' ! -name 'script-v24-193.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-192.js' ! -name 'sw-v24-193.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'game-v*.js' ! -name 'game-v95.js' ! -name 'game-v96.js' -delete
          find duck-quest/js -maxdepth 1 -type f -name 'hatchery-egg-position-v*.js' ! -name 'hatchery-egg-position-v192.js' -delete
          rm -f "Duckie-Days-v24.193-hatch-modal-dash-stage-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-192.css
          test -f style-v24-193.css
          test -f script-v24-192.js
          test -f script-v24-193.js
          test -f sw-v24-192.js
          test -f sw-v24-193.js
          test -f duck-quest/js/game-v95.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/hatchery-v179.js
          test -f duck-quest/js/hatchery-egg-position-v192.js
          test -f duck-quest/js/hatchery-ui-v193.js
          test -f duck-quest/js/dash-home-v180.js
          test -f duck-quest/js/dash-screen-v184.js
          test -f duck-quest/js/dash-screen-v193.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.193 installed cleanly."

      - name: Commit v24.193 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.193 hatch modal and Dash stage"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.193 installed, verified, cleaned, committed, and pushed."

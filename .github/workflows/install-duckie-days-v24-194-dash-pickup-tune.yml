name: Install Duckie Days v24.194 Dash Pickup Tune

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.194-dash-pickup-tune-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-194-dash-pickup-tune.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.194 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.194-dash-pickup-tune-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.194
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.194-dash-pickup-tune-update-only.zip"
          TMP=.duckie-days-v24-194-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.194
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.194"' version.json
          grep -Fq 'duck-habit-build" content="24.194"' index.html
          grep -Fq 'style-v24-194.css?v=24-194' index.html
          grep -Fq 'script-v24-194.js?v=24-194' index.html
          grep -Fq 'sw-v24-194.js?v=24-194' index.html
          grep -Fq "importScripts('./sw-v24-194.js');" sw.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-194' sw-v24-194.js
          grep -Fq '.dash-obstacle{width:15.5%;max-width:74px}' duck-quest/js/game-v96.js
          grep -Fq '.dash-coin{width:9.8%;max-width:42px}' duck-quest/js/game-v96.js
          grep -Fq "const raise=kind==='coin'?(Math.random()<.35?82:38):kind==='tiny'?56:22;" duck-quest/js/game-v96.js
          grep -Fq 'const ow=Math.min(W*.155,74),oh=ow;' duck-quest/js/game-v96.js
          grep -Fq "const iw=o.kind==='tiny'?Math.min(W*.108,48):Math.min(W*.098,42),ih=iw;" duck-quest/js/game-v96.js
          node --check script-v24-194.js
          node --check sw-v24-194.js
          node --check duck-quest/js/game-v96.js
          echo "VERIFIED: v24.194 dash pickup tuning is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-194-dash-pickup-tune.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.194-dash-pickup-tune-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.194-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-193.css' ! -name 'style-v24-194.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-193.js' ! -name 'script-v24-194.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-193.js' ! -name 'sw-v24-194.js' -delete
          rm -f "Duckie-Days-v24.194-dash-pickup-tune-update-only.zip"

      - name: Commit v24.194 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.194 dash pickup tuning"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.194 installed, verified, cleaned, committed, and pushed."

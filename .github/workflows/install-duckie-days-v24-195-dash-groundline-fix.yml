name: Install Duckie Days v24.195 Dash Groundline Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.195-dash-groundline-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-195-dash-groundline-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.195 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.195-dash-groundline-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.195
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.195-dash-groundline-fix-update-only.zip"
          TMP=.duckie-days-v24-195-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.195
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.195"' version.json
          grep -Fq 'duck-habit-build" content="24.195"' index.html
          grep -Fq 'style-v24-195.css?v=24-195' index.html
          grep -Fq 'script-v24-195.js?v=24-195' index.html
          grep -Fq 'sw-v24-195.js?v=24-195' index.html
          grep -Fq "importScripts('./sw-v24-195.js');" sw.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-195' sw-v24-195.js
          grep -Fq 'const raise=4;' duck-quest/js/game-v96.js
          grep -Fq 'o.el.style.bottom=`${ground+o.raise}px`' duck-quest/js/game-v96.js
          grep -Fq 'hitW=ow*.56,hitH=oh*.46,hitX=o.x+ow*.22,hitY=H-ground-hitH-o.raise' duck-quest/js/game-v96.js
          grep -Fq 'pickW=iw*.74,pickH=ih*.74,pickX=o.x+iw*.13,pickY=H-ground-pickH-o.raise' duck-quest/js/game-v96.js
          node --check script-v24-195.js
          node --check sw-v24-195.js
          node --check duck-quest/js/game-v96.js
          echo "VERIFIED: v24.195 dash groundline fix is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-195-dash-groundline-fix.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.195-dash-groundline-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.195-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-194.css' ! -name 'style-v24-195.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-194.js' ! -name 'script-v24-195.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-194.js' ! -name 'sw-v24-195.js' -delete
          rm -f "Duckie-Days-v24.195-dash-groundline-fix-update-only.zip"

      - name: Commit v24.195 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.195 dash groundline fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.195 installed, verified, cleaned, committed, and pushed."

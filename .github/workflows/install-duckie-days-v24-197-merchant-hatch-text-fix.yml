name: Install Duckie Days v24.197 Merchant + Hatch Text Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.197-merchant-hatch-text-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-197-merchant-hatch-text-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.197 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.197-merchant-hatch-text-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.197
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.197-merchant-hatch-text-fix-update-only.zip"
          TMP=.duckie-days-v24-197-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.197
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.197"' version.json
          grep -Fq 'duck-habit-build" content="24.197"' index.html
          grep -Fq 'style-v24-197.css?v=24-197' index.html
          grep -Fq 'script-v24-197.js?v=24-197' index.html
          grep -Fq 'sw-v24-197.js?v=24-197' index.html
          grep -Fq "importScripts('./sw-v24-197.js');" sw.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-197' sw-v24-197.js
          grep -Fq "ready?'Oh?':" duck-quest/js/game-v96.js
          grep -Fq 'merchant-active-v197' duck-quest/js/game-v96.js
          grep -Fq "shop.id='merchantShopV197'" duck-quest/js/game-v96.js
          grep -Fq "leave.textContent='No Thanks'" duck-quest/js/game-v96.js
          grep -Fq "ui.chestLayer?.classList.add('hidden')" duck-quest/js/game-v96.js
          node --check script-v24-197.js
          node --check sw-v24-197.js
          node --check duck-quest/js/game-v96.js
          echo "VERIFIED: v24.197 merchant and hatch text fix is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-197-merchant-hatch-text-fix.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.197-merchant-hatch-text-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.197-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-196.css' ! -name 'style-v24-197.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-196.js' ! -name 'script-v24-197.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-196.js' ! -name 'sw-v24-197.js' -delete
          rm -f "Duckie-Days-v24.197-merchant-hatch-text-fix-update-only.zip"

      - name: Commit v24.197 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.197 merchant and hatch text fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.197 installed, verified, cleaned, committed, and pushed."

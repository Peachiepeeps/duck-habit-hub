name: Install Duckie Days v24.198 Battle UI Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.198-battle-ui-recovery-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-198-battle-ui-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.198 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.198-battle-ui-recovery-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.198
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.198-battle-ui-recovery-update-only.zip"
          TMP=.duckie-days-v24-198-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.198
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.198"' version.json
          grep -Fq 'duck-habit-build" content="24.198"' index.html
          grep -Fq 'style-v24-198.css?v=24-198' index.html
          grep -Fq 'script-v24-198.js?v=24-198' index.html
          grep -Fq 'sw-v24-198.js?v=24-198' index.html
          grep -Fq "importScripts('./sw-v24-198.js');" sw.js
          grep -Fq 'js/game-v96.js?v=24-198' duck-quest/index.html
          grep -Fq 'let siblingDialogueIndex=0,siblingDialogueState=null;' duck-quest/js/game-v96.js
          grep -Fq 'merchant-shop-v197' duck-quest/js/game-v96.js
          grep -Fq "status.textContent=ready?'Oh?'" duck-quest/js/game-v96.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-198' sw-v24-198.js
          node --check script-v24-198.js
          node --check sw-v24-198.js
          node --check duck-quest/js/game-v96.js
          echo "VERIFIED: v24.198 battle UI recovery is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-198-battle-ui-recovery.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.198-battle-ui-recovery-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.198-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-197.css' ! -name 'style-v24-198.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-197.js' ! -name 'script-v24-198.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-197.js' ! -name 'sw-v24-198.js' -delete
          rm -f "Duckie-Days-v24.198-battle-ui-recovery-update-only.zip"

      - name: Commit v24.198 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.198 battle UI recovery"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.198 installed, verified, cleaned, committed, and pushed."

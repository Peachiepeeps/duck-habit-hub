name: Install Duckie Days v24.199 Victory Chest Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.199-victory-chest-recovery-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-199-victory-chest-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.199 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.199-victory-chest-recovery-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.199
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.199-victory-chest-recovery-update-only.zip"
          TMP=.duckie-days-v24-199-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.199
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.199"' version.json
          grep -Fq 'duck-habit-build" content="24.199"' index.html
          grep -Fq 'style-v24-199.css?v=24-199' index.html
          grep -Fq 'script-v24-199.js?v=24-199' index.html
          grep -Fq 'sw-v24-199.js?v=24-199' index.html
          grep -Fq "importScripts('./sw-v24-199.js');" sw.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-199' sw-v24-199.js
          grep -Fq "ui.chestLayer?.classList.remove('merchant-active-v197');" duck-quest/js/game-v96.js
          grep -Fq "ui.chestLayer?.querySelector('#merchantShopV197')?.remove();" duck-quest/js/game-v96.js
          if grep -Fq "if(data?.eventType!=='mysterious-merchant')clearMerchantUi();" duck-quest/js/game-v96.js; then
            echo 'ERROR: broken out-of-scope Merchant cleanup call still exists.'
            exit 1
          fi
          node --check script-v24-199.js
          node --check sw-v24-199.js
          node --check duck-quest/js/game-v96.js
          echo "VERIFIED: normal victory chest flow is no longer blocked by Merchant cleanup scope."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-199-victory-chest-recovery.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.199-victory-chest-recovery-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.199-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-198.css' ! -name 'style-v24-199.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-198.js' ! -name 'script-v24-199.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-198.js' ! -name 'sw-v24-199.js' -delete
          rm -f "Duckie-Days-v24.199-victory-chest-recovery-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-198.css
          test -f style-v24-199.css
          test -f script-v24-198.js
          test -f script-v24-199.js
          test -f sw-v24-198.js
          test -f sw-v24-199.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/hatchery-v179.js
          test -f duck-quest/js/hatchery-egg-position-v192.js
          test -f duck-quest/js/hatchery-ui-v193.js
          test -f duck-quest/js/dash-home-v180.js
          test -f duck-quest/js/dash-screen-v184.js
          test -f duck-quest/js/dash-screen-v193.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.199 installed cleanly."

      - name: Commit v24.199 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.199 victory chest recovery"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.199 installed, verified, cleaned, committed, and pushed."

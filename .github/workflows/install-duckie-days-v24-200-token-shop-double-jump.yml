name: Install Duckie Days v24.200 Token Shop + Double Jump

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.200-token-shop-double-jump-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-200-token-shop-double-jump.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.200 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.200-token-shop-double-jump-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.200
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.200-token-shop-double-jump-update-only.zip"
          TMP=.duckie-days-v24-200-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.200
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.200"' version.json
          grep -Fq 'duck-habit-build" content="24.200"' index.html
          grep -Fq 'style-v24-200.css?v=24-200' index.html
          grep -Fq 'script-v24-200.js?v=24-200' index.html
          grep -Fq 'sw-v24-200.js?v=24-200' index.html
          grep -Fq "importScripts('./sw-v24-200.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-200' duck-quest/index.html
          grep -Fq 'js/token-shop-v200.js?v=24-200' duck-quest/index.html
          grep -Fq './duck-quest/js/token-shop-v200.js?v=24-200' sw-v24-200.js

          grep -Fq "window.DUCKIE_TOKEN_SHOP='24.200-common-egg-and-daily-jump-token'" duck-quest/js/token-shop-v200.js
          grep -Fq 'const EGG_TOKEN_COST=3;' duck-quest/js/token-shop-v200.js
          grep -Fq 'const JUMP_TOKEN_COIN_COST=10;' duck-quest/js/token-shop-v200.js
          grep -Fq 'const DAILY_JUMP_TOKEN_LIMIT=4;' duck-quest/js/token-shop-v200.js
          grep -Fq "button.id='openTokenShopV200'" duck-quest/js/token-shop-v200.js
          grep -Fq '#homeScreen #questHomeTools #openHatchery{' duck-quest/js/token-shop-v200.js

          grep -Fq 'jumpCount:0' duck-quest/js/game-v96.js
          grep -Fq 'if(dash.jumpCount===1){dash.jumpCount=2;' duck-quest/js/game-v96.js
          grep -Fq 'dash.jumpCount=0' duck-quest/js/game-v96.js
          grep -Fq 'hitW=ow*.44,hitH=oh*.27' duck-quest/js/game-v96.js

          grep -Fq "ui.chestLayer?.classList.remove('merchant-active-v197');" duck-quest/js/game-v96.js
          if grep -Fq "if(data?.eventType!=='mysterious-merchant')clearMerchantUi();" duck-quest/js/game-v96.js; then
            echo 'ERROR: broken Merchant cleanup call returned.'
            exit 1
          fi

          node --check script-v24-200.js
          node --check sw-v24-200.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/token-shop-v200.js
          echo "VERIFIED: v24.200 Token Shop and Dash double jump are valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-200-token-shop-double-jump.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.200-token-shop-double-jump-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.200-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-199.css' ! -name 'style-v24-200.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-199.js' ! -name 'script-v24-200.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-199.js' ! -name 'sw-v24-200.js' -delete
          rm -f "Duckie-Days-v24.200-token-shop-double-jump-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-199.css
          test -f style-v24-200.css
          test -f script-v24-199.js
          test -f script-v24-200.js
          test -f sw-v24-199.js
          test -f sw-v24-200.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/token-shop-v200.js
          test -f duck-quest/js/hatchery-v179.js
          test -f duck-quest/js/hatchery-egg-position-v192.js
          test -f duck-quest/js/hatchery-ui-v193.js
          test -f duck-quest/js/dash-home-v180.js
          test -f duck-quest/js/dash-screen-v184.js
          test -f duck-quest/js/dash-screen-v193.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.200 installed cleanly."

      - name: Commit v24.200 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.200 Token Shop and double jump"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.200 installed, verified, cleaned, committed, and pushed."

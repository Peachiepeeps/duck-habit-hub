name: Install Duckie Days v24.201 OC Driver + Safe Coins

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.201-oc-driver-safe-coins-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-201-oc-driver-safe-coins.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.201 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.201-oc-driver-safe-coins-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.201
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.201-oc-driver-safe-coins-update-only.zip"
          TMP=.duckie-days-v24-201-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.201
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.201"' version.json
          grep -Fq 'duck-habit-build" content="24.201"' index.html
          grep -Fq 'style-v24-201.css?v=24-201' index.html
          grep -Fq 'script-v24-201.js?v=24-201' index.html
          grep -Fq 'sw-v24-201.js?v=24-201' index.html
          grep -Fq "importScripts('./sw-v24-201.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-201' duck-quest/index.html
          grep -Fq 'js/token-shop-v200.js?v=24-201' duck-quest/index.html
          grep -Fq 'js/dash-runner-v201.js?v=24-201' duck-quest/index.html
          grep -Fq './duck-quest/js/dash-runner-v201.js?v=24-201' sw-v24-201.js

          grep -Fq 'Duckie Days v24.201 — Duckie Dash OC driver runner + safer coin spacing.' duck-quest/js/dash-runner-v201.js
          grep -Fq "#dashRunner.dash-runner-composite" duck-quest/js/dash-runner-v201.js
          grep -Fq 'syncDashRunner({hurt:true});' duck-quest/js/dash-runner-v201.js
          grep -Fq "pattern=Math.random()<0.55" duck-quest/js/dash-runner-v201.js
          grep -Fq 'obstacleTooClose(x,106)' duck-quest/js/dash-runner-v201.js
          grep -Fq 'dash.jumpV=585;' duck-quest/js/dash-runner-v201.js
          grep -Fq 'const hitW=ow*.40;' duck-quest/js/dash-runner-v201.js

          node --check script-v24-201.js
          node --check sw-v24-201.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/token-shop-v200.js
          node --check duck-quest/js/dash-runner-v201.js
          echo "VERIFIED: v24.201 OC driver and safer coin spawns are valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-201-oc-driver-safe-coins.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.201-oc-driver-safe-coins-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.201-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'style-v24-*.css' ! -name 'style-v24-200.css' ! -name 'style-v24-201.css' -delete
          find . -maxdepth 1 -type f -name 'script-v24-*.js' ! -name 'script-v24-200.js' ! -name 'script-v24-201.js' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-200.js' ! -name 'sw-v24-201.js' -delete
          rm -f "Duckie-Days-v24.201-oc-driver-safe-coins-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f style-v24-200.css
          test -f style-v24-201.css
          test -f script-v24-200.js
          test -f script-v24-201.js
          test -f sw-v24-200.js
          test -f sw-v24-201.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/token-shop-v200.js
          test -f duck-quest/js/dash-runner-v201.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.201 installed cleanly."

      - name: Commit v24.201 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.201 OC driver and safer coin dash"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.201 installed, verified, cleaned, committed, and pushed."

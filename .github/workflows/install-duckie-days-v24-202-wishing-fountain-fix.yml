name: Install Duckie Days v24.202 Wishing Fountain Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.202-wishing-fountain-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-202-wishing-fountain-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.202 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.202-wishing-fountain-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.202
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.202-wishing-fountain-fix-update-only.zip"
          TMP=.duckie-days-v24-202-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.202
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.202"' version.json
          grep -Fq 'duck-habit-build" content="24.202"' index.html
          grep -Fq 'sw-v24-202.js?v=24-202' index.html
          grep -Fq "importScripts('./sw-v24-202.js');" sw.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-202' sw-v24-202.js
          grep -Fq 'js/game-v96.js?v=24-202' duck-quest/index.html
          grep -Fq 'js/token-shop-v200.js?v=24-202' duck-quest/index.html
          grep -Fq 'js/dash-runner-v201.js?v=24-202' duck-quest/index.html
          grep -Fq 'Wishing Fountain recovery' duck-quest/js/game-v96.js
          grep -Fq 'fountain-scene-art-v202' duck-quest/js/game-v96.js
          grep -Fq "captionText:'Wishing Fountain'" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_BUILD='24.202'" duck-quest/js/game-v96.js
          node --check sw-v24-202.js
          node --check duck-quest/js/game-v96.js
          echo "VERIFIED: v24.202 Wishing Fountain fix is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-202-wishing-fountain-fix.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.202-wishing-fountain-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.202-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-202.js' -delete
          rm -f "Duckie-Days-v24.202-wishing-fountain-fix-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-202.js
          test -f duck-quest/js/game-v96.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.202 installed cleanly."

      - name: Commit v24.202 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.202 Wishing Fountain fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.202 installed, verified, cleaned, committed, and pushed."

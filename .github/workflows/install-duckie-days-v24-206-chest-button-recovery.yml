name: Install Duckie Days v24.206 Chest Button Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.206-chest-button-recovery-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-206-chest-button-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.206 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.206-chest-button-recovery-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.206
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.206-chest-button-recovery-update-only.zip"
          TMP=.duckie-days-v24-206-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.206
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.206"' version.json
          grep -Fq 'duck-habit-build" content="24.206"' index.html
          grep -Fq 'sw-v24-206.js?v=24-206' index.html
          grep -Fq "importScripts('./sw-v24-206.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-206' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v204.js?v=24-206' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v205.js?v=24-206' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v206.js?v=24-206' duck-quest/index.html
          grep -Fq './duck-quest/js/quest-fixes-v206.js?v=24-206' sw-v24-206.js

          grep -Fq "window.DUCKIE_DAYS_V206_FIXES='24.206-chest-button-bridge'" duck-quest/js/quest-fixes-v206.js
          grep -Fq "bridge('pendingChest',()=>pendingChest" duck-quest/js/quest-fixes-v206.js
          grep -Fq "bridge('ui',()=>ui);" duck-quest/js/quest-fixes-v206.js
          grep -Fq "fresh.addEventListener('click',openPendingChest);" duck-quest/js/quest-fixes-v206.js

          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v205.js
          test -f duck-quest/js/dash-runner-v203.js
          node --check sw-v24-206.js
          node --check duck-quest/js/quest-fixes-v204.js
          node --check duck-quest/js/quest-fixes-v205.js
          node --check duck-quest/js/quest-fixes-v206.js
          echo "VERIFIED: v24.206 chest button recovery is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-206-chest-button-recovery.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.206-chest-button-recovery-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.206-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-206.js' -delete
          rm -f "Duckie-Days-v24.206-chest-button-recovery-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-206.js
          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v205.js
          test -f duck-quest/js/quest-fixes-v206.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.206 installed cleanly."

      - name: Commit v24.206 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.206 chest button recovery"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.206 installed, verified, cleaned, committed, and pushed."

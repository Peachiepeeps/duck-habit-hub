name: Install Duckie Days v24.207 Direct Chest Recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.207-direct-chest-recovery-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-207-direct-chest-recovery.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.207 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.207-direct-chest-recovery-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.207
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.207-direct-chest-recovery-update-only.zip"
          TMP=.duckie-days-v24-207-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Verify v24.207
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.207"' version.json
          grep -Fq 'duck-habit-build" content="24.207"' index.html
          grep -Fq 'sw-v24-207.js?v=24-207' index.html
          grep -Fq "importScripts('./sw-v24-207.js');" sw.js

          grep -Fq 'js/quest-fixes-v204.js?v=24-207' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v207.js?v=24-207' duck-quest/index.html
          ! grep -Fq 'quest-fixes-v205.js' duck-quest/index.html
          ! grep -Fq 'quest-fixes-v206.js' duck-quest/index.html
          grep -Fq './duck-quest/js/quest-fixes-v207.js?v=24-207' sw-v24-207.js

          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "openPendingChest=openPendingChestV207;" duck-quest/js/quest-fixes-v207.js
          grep -Fq "setTimeout(bindButton,0);" duck-quest/js/quest-fixes-v207.js
          grep -Fq "open:'assets/enemies/mimic/lucky/idle-1.webp'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "mimicReveal:'assets/enemies/mimic/lucky/open.webp'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "closed:'assets/enemies/mimic/healthy/idle-1.webp'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "open:'assets/enemies/mimic/healthy/closed.webp'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "mimicReveal:'assets/enemies/mimic/healthy/open.webp'" duck-quest/js/quest-fixes-v207.js

          node --check sw-v24-207.js
          node --check duck-quest/js/quest-fixes-v204.js
          node --check duck-quest/js/quest-fixes-v207.js
          echo "VERIFIED: v24.207 direct chest recovery is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-207-direct-chest-recovery.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.207-direct-chest-recovery-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.207-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-207.js' -delete
          rm -f "Duckie-Days-v24.207-direct-chest-recovery-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-207.js
          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v207.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.207 installed cleanly."

      - name: Commit v24.207 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.207 direct chest recovery"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.207 installed, verified, cleaned, committed, and pushed."

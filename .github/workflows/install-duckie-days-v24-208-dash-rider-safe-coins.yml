name: Install Duckie Days v24.208 Dash Rider Safe Coins

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.208-dash-rider-safe-coins-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-208-dash-rider-safe-coins.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.208 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.208-dash-rider-safe-coins-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.208 files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.208-dash-rider-safe-coins-update-only.zip"
          TMP=.duckie-days-v24-208-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Patch Duckie Dash core
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v208.py
          python3 tools/patch-v208.py
          rm -f tools/patch-v208.py
          rmdir tools 2>/dev/null || true
          # v203 could not reach Dash's private closure state, so it is intentionally retired.
          rm -f duck-quest/js/dash-runner-v203.js

      - name: Verify v24.208
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.208"' version.json
          grep -Fq 'duck-habit-build" content="24.208"' index.html
          grep -Fq 'sw-v24-208.js?v=24-208' index.html
          grep -Fq "importScripts('./sw-v24-208.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-208' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v204.js?v=24-208' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v207.js?v=24-208' duck-quest/index.html
          ! grep -Fq 'dash-runner-v203.js' duck-quest/index.html
          ! grep -Fq 'dash-runner-v203.js' sw-v24-208.js

          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          grep -Fq 'id="dashRunnerDriverV208"' duck-quest/js/game-v96.js
          grep -Fq 'id="dashRunnerCartV208"' duck-quest/js/game-v96.js
          grep -Fq 'safeObstacleGap=Math.max(112' duck-quest/js/game-v96.js
          grep -Fq 'overObstacleStack:true' duck-quest/js/game-v96.js
          grep -Fq "add('coin',stackX,96" duck-quest/js/game-v96.js
          grep -Fq "add('coin',stackX,148" duck-quest/js/game-v96.js
          grep -Fq 'syncDashDriverV208(true)' duck-quest/js/game-v96.js

          grep -Fq 'merchant-actions-v204' duck-quest/js/quest-fixes-v204.js
          ! grep -Fq 'Duckie Dash visible OC driver' duck-quest/js/quest-fixes-v204.js
          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/quest-fixes-v204.js
          node --check duck-quest/js/quest-fixes-v207.js
          node --check sw-v24-208.js
          echo "VERIFIED: v24.208 OC rider and safe coin core patch is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-208-dash-rider-safe-coins.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.208-dash-rider-safe-coins-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.208-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-208.js' -delete
          rm -f "Duckie-Days-v24.208-dash-rider-safe-coins-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-208.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v207.js
          test ! -f duck-quest/js/dash-runner-v203.js
          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.208 installed cleanly."

      - name: Commit v24.208 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.208 Dash rider and safe coins"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.208 installed, verified, cleaned, committed, and pushed."

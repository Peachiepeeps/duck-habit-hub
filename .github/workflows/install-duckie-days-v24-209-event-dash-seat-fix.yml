name: Install Duckie Days v24.209 Event + Dash Seat Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.209-event-dash-seat-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-209-event-dash-seat-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.209 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.209-event-dash-seat-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.209 files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.209-event-dash-seat-fix-update-only.zip"
          TMP=.duckie-days-v24-209-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Patch v24.209 loaders and service worker
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v209.py
          python3 tools/patch-v209.py
          rm -f tools/patch-v209.py
          rmdir tools 2>/dev/null || true

      - name: Verify v24.209
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.209"' version.json
          grep -Fq 'duck-habit-build" content="24.209"' index.html
          grep -Fq 'sw-v24-209.js?v=24-209' index.html
          grep -Fq "importScripts('./sw-v24-209.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-209' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v204.js?v=24-209' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v207.js?v=24-209' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v209.js?v=24-209' duck-quest/index.html
          grep -Fq './duck-quest/js/quest-fixes-v209.js?v=24-209' sw-v24-209.js

          # Preserve the working Dash-core + chest fixes from v24.208/v24.207.
          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js

          # Verify the new event + seating fix itself.
          grep -Fq "window.DUCKIE_DAYS_V209_FIXES='24.209-event-recovery-dash-seat'" duck-quest/js/quest-fixes-v209.js
          grep -Fq "pendingChest?.eventType==='lucky-picnic'" duck-quest/js/quest-fixes-v209.js
          grep -Fq "pendingChest?.eventType==='wishing-fountain'" duck-quest/js/quest-fixes-v209.js
          grep -Fq "ui.battleUi?.classList.remove('event-mode')" duck-quest/js/quest-fixes-v209.js
          grep -Fq "ui.postFloorActions?.classList.remove('hidden')" duck-quest/js/quest-fixes-v209.js
          grep -Fq 'width:min(122px,30vw)!important' duck-quest/js/quest-fixes-v209.js
          grep -Fq 'width:min(100px,25vw)!important' duck-quest/js/quest-fixes-v209.js
          grep -Fq 'top:-6%!important' duck-quest/js/quest-fixes-v209.js
          grep -Fq 'z-index:4!important' duck-quest/js/quest-fixes-v209.js
          grep -Fq 'z-index:6!important' duck-quest/js/quest-fixes-v209.js
          grep -Fq 'clip-path:none!important' duck-quest/js/quest-fixes-v209.js

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/quest-fixes-v204.js
          node --check duck-quest/js/quest-fixes-v207.js
          node --check duck-quest/js/quest-fixes-v209.js
          node --check sw-v24-209.js
          echo "VERIFIED: v24.209 event recovery and Dash seat fix is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-209-event-dash-seat-fix.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.209-event-dash-seat-fix-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.209-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-209.js' -delete
          rm -f "Duckie-Days-v24.209-event-dash-seat-fix-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-209.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v207.js
          test -f duck-quest/js/quest-fixes-v209.js
          grep -Fq "window.DUCKIE_DAYS_V209_FIXES='24.209-event-recovery-dash-seat'" duck-quest/js/quest-fixes-v209.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.209 installed cleanly."

      - name: Commit v24.209 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.209 event recovery and Dash seat fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.209 installed, verified, cleaned, committed, and pushed."

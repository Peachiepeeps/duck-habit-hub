name: Install Duckie Days v24.210 All-OC HP Refill

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.210-all-oc-hp-refill-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-210-all-oc-hp-refill.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.210 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.210-all-oc-hp-refill-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.210 patch files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.210-all-oc-hp-refill-update-only.zip"
          TMP=.duckie-days-v24-210-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Patch all-OC HP refill
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v210.py
          python3 tools/patch-v210.py
          rm -f tools/patch-v210.py
          rmdir tools 2>/dev/null || true

      - name: Verify v24.210
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.210"' version.json
          grep -Fq 'duck-habit-build" content="24.210"' index.html
          grep -Fq 'sw-v24-210.js?v=24-210' index.html
          grep -Fq "importScripts('./sw-v24-210.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-210' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v204.js?v=24-210' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v207.js?v=24-210' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v209.js?v=24-210' duck-quest/index.html
          grep -Fq './duck-quest/js/game-v96.js?v=24-210' sw-v24-210.js
          grep -Fq './duck-quest/js/quest-fixes-v207.js?v=24-210' sw-v24-210.js
          grep -Fq './duck-quest/js/quest-fixes-v209.js?v=24-210' sw-v24-210.js

          # Confirm all five playable OCs still share the same active-hero battle path.
          grep -Fq 'const QUEST_CHARACTER_IDS = Object.freeze(["peep","miko","io","miho","annika"]);' duck-quest/js/game-v96.js
          grep -Fq 'function activeHeroProgress()' duck-quest/js/game-v96.js
          grep -Fq 'function peepStats(level = activeHeroProgress().level)' duck-quest/js/game-v96.js

          # Universal next-encounter guarantee.
          grep -Fq "window.DUCKIE_HP_REFILL_CORE='24.210-all-oc-between-encounters';" duck-quest/js/game-v96.js
          grep -Fq 'function refillActiveHeroHpV210()' duck-quest/js/game-v96.js
          grep -Fq 'const stats=peepStats(activeHeroProgress().level);' duck-quest/js/game-v96.js
          grep -Fq 'currentRun.maxHp=maxHp;' duck-quest/js/game-v96.js
          grep -Fq 'currentRun.hp=maxHp;' duck-quest/js/game-v96.js
          grep -Fq 'refillActiveHeroHpV210();' duck-quest/js/game-v96.js

          # Immediate visible refill for normal chest and choice-event reward screens.
          grep -Fq "window.DUCKIE_DAYS_V210_CHEST_HP='24.210-normal-chest-refill';" duck-quest/js/quest-fixes-v207.js
          grep -Fq "typeof refillActiveHeroHpV210==='function'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "refillActiveHeroHpV210();" duck-quest/js/quest-fixes-v207.js
          grep -Fq "startEnemy('mimic',{forceShiny:true,mimicChestStyle:'amethyst'});" duck-quest/js/quest-fixes-v207.js
          grep -Fq "startEnemy('mimic',{mimicChestStyle:id});" duck-quest/js/quest-fixes-v207.js
          grep -Fq "window.DUCKIE_DAYS_V210_EVENT_HP='24.210-choice-event-refill';" duck-quest/js/quest-fixes-v209.js
          grep -Fq "typeof refillActiveHeroHpV210==='function'" duck-quest/js/quest-fixes-v209.js

          # Preserve the known-good features from recent versions.
          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "window.DUCKIE_DAYS_V209_FIXES='24.209-event-recovery-dash-seat'" duck-quest/js/quest-fixes-v209.js

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/quest-fixes-v204.js
          node --check duck-quest/js/quest-fixes-v207.js
          node --check duck-quest/js/quest-fixes-v209.js
          node --check sw-v24-210.js
          echo "VERIFIED: v24.210 all-OC HP refill is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-210-all-oc-hp-refill.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.210-all-oc-hp-refill-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.210-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-210.js' -delete
          rm -f "Duckie-Days-v24.210-all-oc-hp-refill-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-210.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v207.js
          test -f duck-quest/js/quest-fixes-v209.js
          grep -Fq "window.DUCKIE_HP_REFILL_CORE='24.210-all-oc-between-encounters';" duck-quest/js/game-v96.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.210 installed cleanly."

      - name: Commit v24.210 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.210 all-OC HP refill"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.210 installed, verified, cleaned, committed, and pushed."

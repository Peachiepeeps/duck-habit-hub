name: Install Duckie Days v24.211 UI Theme Refresh

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.211-ui-theme-refresh-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-211-ui-theme-refresh.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.211 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.211-ui-theme-refresh-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.211 patch files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.211-ui-theme-refresh-update-only.zip"
          TMP=.duckie-days-v24-211-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Ensure v24.210 HP refill base
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v210.py
          python3 tools/patch-v210.py

      - name: Patch v24.211 themes
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v211.py
          test -f duck-quest/js/theme-refresh-v211.js
          python3 tools/patch-v211.py
          rm -f tools/patch-v210.py tools/patch-v211.py
          rmdir tools 2>/dev/null || true

      - name: Verify v24.211
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.211"' version.json
          grep -Fq 'duck-habit-build" content="24.211"' index.html
          grep -Fq 'sw-v24-211.js?v=24-211' index.html
          grep -Fq "importScripts('./sw-v24-211.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-211' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v207.js?v=24-211' duck-quest/index.html
          grep -Fq 'js/quest-fixes-v209.js?v=24-211' duck-quest/index.html
          grep -Fq 'js/theme-refresh-v211.js?v=24-211' duck-quest/index.html
          grep -Fq './duck-quest/js/theme-refresh-v211.js?v=24-211' sw-v24-211.js

          # Preserve the v24.210 universal active-OC refill, whether or not v24.210 was installed separately.
          grep -Fq "window.DUCKIE_HP_REFILL_CORE='24.210-all-oc-between-encounters';" duck-quest/js/game-v96.js
          grep -Fq 'function refillActiveHeroHpV210()' duck-quest/js/game-v96.js

          # Theme catalog and Miko/Miho refresh.
          grep -Fq "window.DUCKIE_UI_THEME_CORE='24.211-expanded-theme-catalog';" duck-quest/js/game-v96.js
          grep -Fq 'id:"miko-moonlight", name:"Miko Teal Moonlight"' duck-quest/js/game-v96.js
          grep -Fq 'description:"Deep teal, ink black, ivory cream, and warm gold."' duck-quest/js/game-v96.js
          grep -Fq 'id:"miho-tea-room", name:"Miho Silent Space"' duck-quest/js/game-v96.js
          grep -Fq 'id:"matcha-cream", name:"Matcha Cream"' duck-quest/js/game-v96.js
          grep -Fq 'id:"seafoam-pearl", name:"Seafoam Pearl"' duck-quest/js/game-v96.js
          grep -Fq 'id:"strawberry-milk", name:"Strawberry Milk"' duck-quest/js/game-v96.js
          grep -Fq 'id:"lavender-starlight", name:"Lavender Starlight"' duck-quest/js/game-v96.js

          # Later-added home UI must be theme-aware instead of hard-coded classic colors.
          grep -Fq "window.DUCKIE_UI_THEME_REFRESH='24.211-unified-home-and-new-themes';" duck-quest/js/theme-refresh-v211.js
          grep -Fq '#homeScreen .quest-home-tools .quest-home-tool-button' duck-quest/js/theme-refresh-v211.js
          grep -Fq '#homeScreen.dq-home-polished .endless-home-card' duck-quest/js/theme-refresh-v211.js
          grep -Fq '.dq-expand-card,' duck-quest/js/theme-refresh-v211.js
          grep -Fq '.quest-title h1{' duck-quest/js/theme-refresh-v211.js
          grep -Fq 'body[data-quest-theme="miko-moonlight"]' duck-quest/js/theme-refresh-v211.js
          grep -Fq 'body[data-quest-theme="miho-tea-room"]' duck-quest/js/theme-refresh-v211.js

          # Preserve recent game fixes.
          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "window.DUCKIE_DAYS_V209_FIXES='24.209-event-recovery-dash-seat'" duck-quest/js/quest-fixes-v209.js

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/quest-fixes-v204.js
          node --check duck-quest/js/quest-fixes-v207.js
          node --check duck-quest/js/quest-fixes-v209.js
          node --check duck-quest/js/theme-refresh-v211.js
          node --check sw-v24-211.js
          echo "VERIFIED: v24.211 UI theme refresh is valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-211-ui-theme-refresh.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.211-ui-theme-refresh-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.211-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-211.js' -delete
          rm -f "Duckie-Days-v24.211-ui-theme-refresh-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-211.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/quest-fixes-v204.js
          test -f duck-quest/js/quest-fixes-v207.js
          test -f duck-quest/js/quest-fixes-v209.js
          test -f duck-quest/js/theme-refresh-v211.js
          grep -Fq "window.DUCKIE_UI_THEME_REFRESH='24.211-unified-home-and-new-themes';" duck-quest/js/theme-refresh-v211.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.211 installed cleanly."

      - name: Commit v24.211 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.211 UI theme refresh"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.211 installed, verified, cleaned, committed, and pushed."

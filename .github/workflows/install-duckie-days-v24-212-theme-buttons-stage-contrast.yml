name: Install Duckie Days v24.212 Theme Buttons + Stage Contrast

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.212-theme-buttons-stage-contrast-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-212-theme-buttons-stage-contrast.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.212 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.212-theme-buttons-stage-contrast-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.212 patch files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.212-theme-buttons-stage-contrast-update-only.zip"
          TMP=.duckie-days-v24-212-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Patch theme buttons and Stage contrast
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v212.py
          test -f duck-quest/js/theme-fixes-v212.js
          test -f duck-quest/js/theme-refresh-v211.js
          python3 tools/patch-v212.py
          rm -f tools/patch-v212.py
          rmdir tools 2>/dev/null || true

      - name: Verify v24.212
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.212"' version.json
          grep -Fq 'duck-habit-build" content="24.212"' index.html
          grep -Fq 'sw-v24-212.js?v=24-212' index.html
          grep -Fq "importScripts('./sw-v24-212.js');" sw.js

          grep -Fq 'js/game-v96.js?v=24-212' duck-quest/index.html
          grep -Fq 'js/theme-refresh-v211.js?v=24-212' duck-quest/index.html
          grep -Fq 'js/theme-fixes-v212.js?v=24-212' duck-quest/index.html
          grep -Fq './duck-quest/js/theme-fixes-v212.js?v=24-212' sw-v24-212.js

          grep -Fq "window.DUCKIE_UI_THEME_FIXES='24.212-tool-buttons-stage-contrast';" duck-quest/js/theme-fixes-v212.js
          grep -Fq '#homeScreen #questHomeTools #openCharmScreen' duck-quest/js/theme-fixes-v212.js
          grep -Fq '#homeScreen #questHomeTools #openTokenShopV200' duck-quest/js/theme-fixes-v212.js
          grep -Fq '#homeScreen #questHomeTools #openHatchery' duck-quest/js/theme-fixes-v212.js
          grep -Fq '#homeScreen .area-option .area-option-copy small' duck-quest/js/theme-fixes-v212.js
          grep -Fq '#routePickerModal .route-modal-range' duck-quest/js/theme-fixes-v212.js

          # Keep the larger v24.211 theme refresh and recent gameplay fixes intact.
          grep -Fq "window.DUCKIE_UI_THEME_REFRESH='24.211-unified-home-and-new-themes';" duck-quest/js/theme-refresh-v211.js
          grep -Fq "window.DUCKIE_UI_THEME_CORE='24.211-expanded-theme-catalog';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_HP_REFILL_CORE='24.210-all-oc-between-encounters';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js
          grep -Fq "window.DUCKIE_DAYS_V209_FIXES='24.209-event-recovery-dash-seat'" duck-quest/js/quest-fixes-v209.js

          node --check duck-quest/js/theme-refresh-v211.js
          node --check duck-quest/js/theme-fixes-v212.js
          node --check duck-quest/js/game-v96.js
          node --check sw-v24-212.js
          echo "VERIFIED: v24.212 theme buttons and Stage contrast are valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-212-theme-buttons-stage-contrast.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.212-theme-buttons-stage-contrast-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.212-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-212.js' -delete
          rm -f "Duckie-Days-v24.212-theme-buttons-stage-contrast-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-212.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/theme-refresh-v211.js
          test -f duck-quest/js/theme-fixes-v212.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.212 installed cleanly."

      - name: Commit v24.212 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.212 theme button and Stage contrast fixes"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.212 installed, verified, cleaned, committed, and pushed."

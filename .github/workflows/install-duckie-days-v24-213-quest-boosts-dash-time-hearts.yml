name: Install Duckie Days v24.213 Quest Boosts + Dash Time Hearts

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.213-quest-boosts-dash-time-hearts-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-213-quest-boosts-dash-time-hearts.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.213 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.213-quest-boosts-dash-time-hearts-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.213 update files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.213-quest-boosts-dash-time-hearts-update-only.zip"
          TMP=.duckie-days-v24-213-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP"/. ./
          rm -rf "$TMP"

      - name: Patch Quest boosts and Dash time hearts
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch-v213.py
          test -f hub-shop-boosts-v213.js
          test -f duck-quest/js/boost-items-v213.js
          test -f assets/items/quest-boosts/Exp-candy-small.png
          test -f assets/items/quest-boosts/Exp-candy-large.png
          test -f assets/items/quest-boosts/Warm-blanket.png
          python3 tools/patch-v213.py
          rm -f tools/patch-v213.py
          rmdir tools 2>/dev/null || true

      - name: Verify v24.213
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.213"' version.json
          grep -Fq 'duck-habit-build" content="24.213"' index.html
          grep -Fq 'sw-v24-213.js?v=24-213' index.html
          grep -Fq "importScripts('./sw-v24-213.js');" sw.js

          # Main Hub Shop extension + exact user-provided assets.
          grep -Fq 'hub-shop-boosts-v213.js?v=24-213' index.html
          grep -Fq "window.DUCKIE_HUB_BOOST_SHOP='24.213-exp-candy-warm-blanket';" hub-shop-boosts-v213.js
          grep -Fq "'exp-candy-small':600" hub-shop-boosts-v213.js
          grep -Fq "'exp-candy-large':1400" hub-shop-boosts-v213.js
          grep -Fq "'warm-blanket':900" hub-shop-boosts-v213.js
          test -s assets/items/quest-boosts/Exp-candy-small.png
          test -s assets/items/quest-boosts/Exp-candy-large.png
          test -s assets/items/quest-boosts/Warm-blanket.png

          # Token Shop + EXP candy behavior.
          grep -Fq 'js/boost-items-v213.js?v=24-213' duck-quest/index.html
          grep -Fq "window.DUCKIE_QUEST_BOOST_ITEMS='24.213-exp-candy-warm-blanket';" duck-quest/js/boost-items-v213.js
          grep -Fq "id:'exp-candy-small', name:'EXP Candy Small', cost:5" duck-quest/js/boost-items-v213.js
          grep -Fq "id:'exp-candy-large', name:'EXP Candy Large', cost:10" duck-quest/js/boost-items-v213.js
          grep -Fq "id:'warm-blanket', name:'Warm Blanket', cost:7" duck-quest/js/boost-items-v213.js
          grep -Fq 'expPercent:.20' duck-quest/js/boost-items-v213.js
          grep -Fq 'expPercent:.50' duck-quest/js/boost-items-v213.js
          grep -Fq 'grantExp(amount)' duck-quest/js/boost-items-v213.js

          # Warm Blanket and Duckie Dash time pickups are in the real Dash/Hatch core.
          grep -Fq "window.DUCKIE_BOOST_CORE='24.213-candy-blanket-time-hearts';" duck-quest/js/game-v96.js
          grep -Fq "slot.endAt=now+Math.max(1000,Math.ceil(remaining*.50));" duck-quest/js/game-v96.js
          grep -Fq "const specialKind=heartRoll<0.006?'time-gold':heartRoll<0.036?'time-pink':null;" duck-quest/js/game-v96.js
          grep -Fq "timeBonus:specialKind==='time-gold'?30:10" duck-quest/js/game-v96.js
          grep -Fq "dash.duration=(Number(dash.duration)||30)+bonus" duck-quest/js/game-v96.js
          grep -Fq "duration:30" duck-quest/js/game-v96.js
          grep -Fq "overObstacleStack:true" duck-quest/js/game-v96.js
          grep -Fq "safeObstacleGap=Math.max(112" duck-quest/js/game-v96.js

          # Service worker caches the new scripts/art and existing Merge Game hearts.
          grep -Fq './hub-shop-boosts-v213.js?v=24-213' sw-v24-213.js
          grep -Fq './duck-quest/js/boost-items-v213.js?v=24-213' sw-v24-213.js
          grep -Fq './assets/items/quest-boosts/Exp-candy-small.png' sw-v24-213.js
          grep -Fq './assets/items/quest-boosts/Exp-candy-large.png' sw-v24-213.js
          grep -Fq './assets/items/quest-boosts/Warm-blanket.png' sw-v24-213.js
          grep -Fq './assets/bakery/drops/Pink-heart-refill.webp' sw-v24-213.js
          grep -Fq './assets/bakery/drops/Gold-heart-refill.webp' sw-v24-213.js

          # Keep the recent fixes intact.
          grep -Fq "window.DUCKIE_UI_THEME_FIXES='24.212-tool-buttons-stage-contrast';" duck-quest/js/theme-fixes-v212.js
          grep -Fq "window.DUCKIE_UI_THEME_REFRESH='24.211-unified-home-and-new-themes';" duck-quest/js/theme-refresh-v211.js
          grep -Fq "window.DUCKIE_HP_REFILL_CORE='24.210-all-oc-between-encounters';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_V209_FIXES='24.209-event-recovery-dash-seat'" duck-quest/js/quest-fixes-v209.js
          grep -Fq "window.DUCKIE_DASH_CORE='24.208-driver-safe-coins'" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_V207_FIXES='24.207-direct-chest-handler'" duck-quest/js/quest-fixes-v207.js

          node --check hub-shop-boosts-v213.js
          node --check duck-quest/js/boost-items-v213.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/theme-refresh-v211.js
          node --check duck-quest/js/theme-fixes-v212.js
          node --check duck-quest/js/quest-fixes-v207.js
          node --check duck-quest/js/quest-fixes-v209.js
          node --check sw-v24-213.js
          echo "VERIFIED: v24.213 Quest boosts and Dash time hearts are valid."

      - name: Clean old Duckie Days update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-213-quest-boosts-dash-time-hearts.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' ! -name 'Duckie-Days-v24.213-quest-boosts-dash-time-hearts-update-only.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.213-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-213.js' -delete
          rm -f "Duckie-Days-v24.213-quest-boosts-dash-time-hearts-update-only.zip"

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f sw-v24-213.js
          test -f hub-shop-boosts-v213.js
          test -f duck-quest/js/boost-items-v213.js
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/theme-refresh-v211.js
          test -f duck-quest/js/theme-fixes-v212.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.213 installed cleanly."

      - name: Commit v24.213 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.213 Quest boosts and Dash time hearts"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.213 installed, verified, cleaned, committed, and pushed."

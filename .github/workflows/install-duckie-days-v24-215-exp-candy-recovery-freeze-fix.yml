name: Install Duckie Days v24.215 EXP Candy Recovery + Freeze Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.215-exp-candy-recovery-duck-quest-freeze-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-215-exp-candy-recovery-freeze-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.215 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.215-exp-candy-recovery-duck-quest-freeze-fix-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.215
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.215-exp-candy-recovery-duck-quest-freeze-fix-update-only.zip"
          TMP=.duckie-days-v24-215-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python "$TMP/tools/patch-v215.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.215
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.215"' version.json
          grep -Fq 'duck-habit-build" content="24.215"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.215";' index.html
          grep -Fq 'hub-exp-candy-use-v215.js?v=24-215' index.html
          ! grep -Fq 'hub-exp-candy-use-v214.js' index.html
          grep -Fq 'js/boost-labels-v215.js?v=24-215' duck-quest/index.html
          ! grep -Fq 'js/boost-labels-v214.js' duck-quest/index.html
          grep -Fq "window.DUCKIE_HUB_EXP_CANDY_USE='24.215-safe-use-and-large-candy-recovery'" hub-exp-candy-use-v215.js
          grep -Fq "save.inventory['exp-candy-large']=7;" hub-exp-candy-use-v215.js
          grep -Fq 'if(button.textContent!==desired) button.textContent=desired;' duck-quest/js/boost-labels-v215.js
          ! grep -Fq 'MutationObserver' duck-quest/js/boost-labels-v215.js
          grep -Fq './hub-exp-candy-use-v215.js?v=24-215' sw-v24-215.js
          grep -Fq './duck-quest/js/boost-labels-v215.js?v=24-215' sw-v24-215.js
          ! grep -Fq 'hub-exp-candy-use-v214.js' sw-v24-215.js
          ! grep -Fq 'boost-labels-v214.js' sw-v24-215.js
          grep -Fq "importScripts('./sw-v24-215.js');" sw.js
          node --check hub-exp-candy-use-v215.js
          node --check duck-quest/js/boost-labels-v215.js
          node --check duck-quest/js/boost-items-v213.js
          node --check sw-v24-215.js
          echo "VERIFIED: v24.215 recovery/freeze fix is valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-215-exp-candy-recovery-freeze-fix.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.215-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-215.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f hub-shop-boosts-v213.js
          test -f hub-exp-candy-use-v215.js
          test -f duck-quest/js/boost-items-v213.js
          test -f duck-quest/js/boost-labels-v215.js
          test -f sw-v24-215.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.215 installed cleanly."

      - name: Commit v24.215 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.215 EXP Candy recovery and freeze fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.215 installed, verified, cleaned, committed, and pushed."

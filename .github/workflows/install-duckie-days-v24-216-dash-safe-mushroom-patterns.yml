name: Install Duckie Days v24.216 Dash Safe Mushroom Patterns

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.216-dash-safe-mushroom-patterns-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-216-dash-safe-mushroom-patterns.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.216 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.216-dash-safe-mushroom-patterns-update-only.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.216
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.216-dash-safe-mushroom-patterns-update-only.zip"
          TMP=.duckie-days-v24-216-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python "$TMP/tools/patch-v216.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.216
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.216"' version.json
          grep -Fq 'duck-habit-build" content="24.216"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.216";' index.html
          grep -Fq 'game-v96.js?v=24-216' duck-quest/index.html
          grep -Fq "window.DUCKIE_DASH_CORE='24.216-safe-mushroom-patterns';" duck-quest/js/game-v96.js
          grep -Fq 'nextObstacleDelay:2.10' duck-quest/js/game-v96.js
          grep -Fq 'const cluster=Math.random()<0.20;' duck-quest/js/game-v96.js
          grep -Fq 'const clusterGap=Math.max(64,Math.min(78,W*.18));' duck-quest/js/game-v96.js
          grep -Fq 'dash.nextObstacleDelay=2.55+Math.random()*.25;' duck-quest/js/game-v96.js
          grep -Fq 'dash.nextObstacleDelay=2.05+Math.random()*.28;' duck-quest/js/game-v96.js
          grep -Fq '(Number(dash.nextObstacleDelay)||2.10)' duck-quest/js/game-v96.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-216' sw-v24-216.js
          grep -Fq "importScripts('./sw-v24-216.js');" sw.js
          node --check duck-quest/js/game-v96.js
          node --check sw-v24-216.js
          echo "VERIFIED: v24.216 safe mushroom patterns are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-216-dash-safe-mushroom-patterns.yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.216-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-216.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f hub-exp-candy-use-v215.js
          test -f duck-quest/js/boost-labels-v215.js
          test -f duck-quest/js/game-v96.js
          test -f sw-v24-216.js
          grep -Fq "window.DUCKIE_DASH_CORE='24.216-safe-mushroom-patterns';" duck-quest/js/game-v96.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.216 installed cleanly."

      - name: Commit v24.216 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.216 safe Dash mushroom patterns"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.216 installed, verified, cleaned, committed, and pushed."

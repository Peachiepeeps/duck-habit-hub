name: Install Duckie Days v24.224 Sibling Spat Scene Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.224-sibling-spat-scene-fix-update-only(1).zip"
      - ".github/workflows/install-duckie-days-v24-224-sibling-spat-scene-fix(1).yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.224 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.224-sibling-spat-scene-fix-update-only(1).zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.224
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.224-sibling-spat-scene-fix-update-only(1).zip"
          TMP=.duckie-days-v24-224-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v224.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.224
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.224"' version.json
          grep -Fq 'duck-habit-build" content="24.224"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.224";' index.html
          grep -Fq 'merchant-fix-v218.js?v=24-224' duck-quest/index.html
          grep -Fq 'dash-background-fix-v224.js?v=24-224' duck-quest/index.html
          grep -Fq "window.DUCKIE_DAYS_MERCHANT_FIX='24.218-visible-purchase-options';" duck-quest/js/merchant-fix-v218.js
          grep -Fq 'data-merchant-buy-v218' duck-quest/js/merchant-fix-v218.js
          grep -Fq 'data-merchant-leave-v218' duck-quest/js/merchant-fix-v218.js
          grep -Fq "window.DUCKIE_DASH_CORE='24.224-2x-fullscreen-endless-no-freeze';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DASH_BACKGROUND_FIX='24.224-2x-fullscreen-endless-no-freeze';" duck-quest/js/dash-background-fix-v224.js
          grep -Fq 'height:100%!important' duck-quest/js/dash-background-fix-v224.js
          grep -Fq 'align-items:flex-end!important' duck-quest/js/dash-background-fix-v224.js
          if grep -Fq 'new MutationObserver(removeBossLanguage)' duck-quest/js/dash-background-fix-v224.js; then
            echo 'ERROR: recursive overlay observer is still present.'
            exit 1
          fi
          test ! -f duck-quest/js/dash-background-fix-v219.js
          test ! -f duck-quest/js/dash-background-fix-v220.js
          test ! -f duck-quest/js/dash-background-fix-v221.js
          test ! -f duck-quest/js/dash-background-fix-v222.js
          test ! -f duck-quest/js/dash-background-fix-v223.js
          grep -Fq "angry:'assets/characters/miko/base/Miko-angry.png'" duck-quest/js/game-v96.js
          if grep -Fq "angry:'../assets/miko/Miko-angry.PNG'" duck-quest/js/game-v96.js; then
            echo 'ERROR: expression-only Miko angry layer is still referenced by Sibling Spat.'
            exit 1
          fi
          grep -Fq 'sibling-spat-hidden-v224' duck-quest/js/game-v96.js
          grep -Fq 'sibling-right-v224' duck-quest/js/game-v96.js
          grep -Fq '@keyframes siblingRightIdleV224' duck-quest/js/game-v96.js
          grep -Fq 'SIBLING_IDLE_FRAMES' duck-quest/js/game-v96.js
          grep -Fq "assets/characters/miko/base/idle-2.webp" duck-quest/js/game-v96.js
          grep -Fq "assets/characters/miho/base/idle-2.webp" duck-quest/js/game-v96.js
          grep -Fq 'Keep going until the timer reaches zero!' duck-quest/js/game-v96.js
          grep -Fq 'Time’s Up!' duck-quest/js/game-v96.js
          grep -Fq 'The timer reached zero — run complete!' duck-quest/js/game-v96.js
          if grep -Fiq 'boss-stage' duck-quest/js/game-v96.js; then
            echo 'ERROR: old boss-stage Dash language is still present.'
            exit 1
          fi
          grep -Fq 'assets/dash/Angel-Wing.png' duck-quest/js/game-v96.js
          grep -Fq 'assets/dash/Bubble-icon.png' duck-quest/js/game-v96.js
          grep -Fq 'id="dashBubble"' duck-quest/js/game-v96.js
          grep -Fq 'dash.duration=(Number(dash.duration)||30)+10' duck-quest/js/game-v96.js
          grep -Fq 'dash.speedBoost=10' duck-quest/js/game-v96.js
          grep -Fq 'dash.bubble=10' duck-quest/js/game-v96.js
          grep -Fq 'DD-Meadow.png' duck-quest/js/game-v96.js
          grep -Fq 'DD-Ocean.png' duck-quest/js/game-v96.js
          grep -Fq 'DD-Candyland.png' duck-quest/js/game-v96.js
          grep -Fq 'DD-CloudGarden.png' duck-quest/js/game-v96.js
          grep -Fq './duck-quest/js/merchant-fix-v218.js?v=24-224' sw-v24-224.js
          grep -Fq './duck-quest/js/dash-background-fix-v224.js?v=24-224' sw-v24-224.js
          grep -Fq "importScripts('./sw-v24-224.js');" sw.js
          test -f duck-quest/assets/dash/Angel-Wing.png
          test -f duck-quest/assets/dash/Bubble-icon.png
          test -f duck-quest/assets/dash/Bubble.png
          test -f duck-quest/assets/dash/backgrounds/DD-Meadow.png
          test -f duck-quest/assets/dash/backgrounds/DD-Ocean.png
          test -f duck-quest/assets/dash/backgrounds/DD-Candyland.png
          test -f duck-quest/assets/dash/backgrounds/DD-CloudGarden.png
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/merchant-fix-v218.js
          node --check duck-quest/js/dash-background-fix-v224.js
          node --check sw-v24-224.js
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from struct import unpack

          expected = {
              'duck-quest/assets/dash/backgrounds/DD-Meadow.png': (4096, 334),
              'duck-quest/assets/dash/backgrounds/DD-Ocean.png': (4096, 334),
              'duck-quest/assets/dash/backgrounds/DD-Candyland.png': (4096, 334),
              'duck-quest/assets/dash/backgrounds/DD-CloudGarden.png': (4096, 334),
              'duck-quest/assets/dash/Angel-Wing.png': (500, 500),
              'duck-quest/assets/dash/Bubble-icon.png': (500, 500),
              'duck-quest/assets/dash/Bubble.png': (500, 500),
          }
          for filename, dimensions in expected.items():
              data = Path(filename).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', filename
              assert unpack('>II', data[16:24]) == dimensions, filename
          enlarged_backgrounds = {
              'duck-quest/assets/dash/backgrounds/DD-Meadow.png': '2786b04b1debe11b3d29bdc7515b4d1353eea0f789513fd3060472adfd31e231',
              'duck-quest/assets/dash/backgrounds/DD-Ocean.png': 'e9c5419c608f3a9ad9f50f527a56ec1e3cbab75a3cb0b437be7f62fa92597d19',
              'duck-quest/assets/dash/backgrounds/DD-Candyland.png': '9541bccc1f48aa0b61dfd2c7b38ee307e8d3b4b203dfd66ecd6985f2e0fa2d0c',
              'duck-quest/assets/dash/backgrounds/DD-CloudGarden.png': '11488a0aff7fa616deb553f55e297cb2f8da249484720574df4c78fbd33c5525',
          }
          for filename, digest in enlarged_backgrounds.items():
              assert sha256(Path(filename).read_bytes()).hexdigest() == digest, filename
          html = Path('duck-quest/index.html').read_text(encoding='utf-8')
          assert html.rfind('merchant-fix-v218.js') > html.rfind('boost-labels-v215.js')
          assert html.rfind('dash-background-fix-v224.js') > html.rfind('merchant-fix-v218.js')
          assert 'dash-background-fix-v219.js' not in html
          assert 'dash-background-fix-v220.js' not in html
          assert 'dash-background-fix-v221.js' not in html
          assert 'dash-background-fix-v222.js' not in html
          assert 'dash-background-fix-v223.js' not in html
          print('VERIFIED: Sibling Spat composition/animation is repaired and the 2x Dash backgrounds are preserved.')
          PY
          echo "VERIFIED: v24.224 code and assets are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-224-sibling-spat-scene-fix(1).yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.224-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-224.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/merchant-fix-v218.js
          test -f duck-quest/js/dash-background-fix-v224.js
          test ! -f duck-quest/js/dash-background-fix-v219.js
          test ! -f duck-quest/js/dash-background-fix-v220.js
          test ! -f duck-quest/js/dash-background-fix-v221.js
          test ! -f duck-quest/js/dash-background-fix-v222.js
          test ! -f duck-quest/js/dash-background-fix-v223.js
          test -f sw-v24-224.js
          test -f V24.224-NOTES.txt
          grep -Fq "window.DUCKIE_DAYS_MERCHANT_FIX='24.218-visible-purchase-options';" duck-quest/js/merchant-fix-v218.js
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.224 installed cleanly."

      - name: Commit v24.224 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.224 Sibling Spat scene fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.224 installed, verified, cleaned, committed, and pushed."

name: Install Duckie Days v24.225 Merchant Sale and Quest Flow

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.225-merchant-sale-quest-flow-update-only(1).zip"
      - ".github/workflows/install-duckie-days-v24-225-merchant-sale-quest-flow(1).yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.225 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.225-merchant-sale-quest-flow-update-only(1).zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.225
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.225-merchant-sale-quest-flow-update-only(1).zip"
          TMP=.duckie-days-v24-225-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v225.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.225
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.225"' version.json
          grep -Fq 'duck-habit-build" content="24.225"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.225";' index.html
          grep -Fq "window.DUCKIE_DAYS_QUEST_FLOW='24.225-next-level-and-start-picker';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_MERCHANT_FIX='24.225-discounted-colored-charms';" duck-quest/js/merchant-fix-v218.js
          grep -Fq 'const MERCHANT_DISCOUNT=.20;' duck-quest/js/merchant-fix-v218.js
          grep -Fq 'ware.price=Math.max(1,Math.round(normalPrice*(1-MERCHANT_DISCOUNT)))' duck-quest/js/merchant-fix-v218.js
          grep -Fq "charmArtMarkup(CHARM_DEFS?.[ware.id],'small')" duck-quest/js/merchant-fix-v218.js
          grep -Fq 'merchant-charm-art-v225' duck-quest/js/merchant-fix-v218.js
          grep -Fq '20% off' duck-quest/js/merchant-fix-v218.js
          grep -Fq 'Pick Starting Point' duck-quest/index.html
          grep -Fq 'id="routeStartLevelSelect"' duck-quest/index.html
          grep -Fq 'id="startSelectedRoute"' duck-quest/index.html
          grep -Fq 'id="runNextRank" class="pixel-button primary large"' duck-quest/index.html
          grep -Fq 'id="runAgain" class="pixel-button primary large hidden"' duck-quest/index.html
          grep -Fq 'ui.runNextRank.textContent=canRunNext?"Run Next Level":"Max Level Reached"' duck-quest/js/game-v96.js
          grep -Fq 'for(let level=1;level<=latest;level++)' duck-quest/js/game-v96.js
          grep -Fq 'runAgain.classList.add("hidden")' duck-quest/js/game-v96.js
          grep -Fq 'runAgain.classList.remove("hidden")' duck-quest/js/game-v96.js
          grep -Fq 'game-v96.js?v=24-225' duck-quest/index.html
          grep -Fq 'style-v82.css?v=24-225' duck-quest/index.html
          grep -Fq 'merchant-fix-v218.js?v=24-225' duck-quest/index.html
          grep -Fq './duck-quest/js/game-v96.js?v=24-225' sw-v24-225.js
          grep -Fq './duck-quest/js/merchant-fix-v218.js?v=24-225' sw-v24-225.js
          grep -Fq "importScripts('./sw-v24-225.js');" sw.js
          test -f V24.225-NOTES.txt
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/merchant-fix-v218.js
          node --check sw-v24-225.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class IdCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.ids.extend(value for key, value in attrs if key == 'id')

          html = Path('duck-quest/index.html').read_text(encoding='utf-8')
          parser = IdCollector()
          parser.feed(html)
          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          assert not duplicates, duplicates
          assert html.index('id="runNextRank"') < html.index('id="backToQuest"') < html.index('id="runAgain"')
          assert 'Start from Beginning' not in html

          game = Path('duck-quest/js/game-v96.js').read_text(encoding='utf-8')
          assert "price:40,normalPrice:50" in game
          assert "price:80,normalPrice:100" in game
          assert "price:140,normalPrice:175" in game
          assert "price:64,normalPrice:80" in game
          assert "price:128,normalPrice:160" in game
          assert "price:340,normalPrice:425" in game
          assert "Math.round(normalPrice*.8)" in game
          assert "charmArtMarkup(CHARM_DEFS[ware.id],'small')" in game
          print('VERIFIED: Merchant sale, colored charms, next-level result flow, and starting-point picker are present.')
          PY
          echo "VERIFIED: v24.225 code and cache files are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-225-merchant-sale-quest-flow(1).yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.225-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-225.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/merchant-fix-v218.js
          test -f duck-quest/css/style-v82.css
          test -f sw-v24-225.js
          test -f V24.225-NOTES.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.225 installed cleanly."

      - name: Commit v24.225 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.225 Merchant sale and Quest flow"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.225 installed, verified, cleaned, committed, and pushed."

name: Install Duckie Days v24.232 Dash Rewards and Duckipedia Book

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.232-dash-rewards-duckipedia-book-update-only(1).zip"
      - ".github/workflows/install-duckie-days-v24-232-dash-rewards-duckipedia-book(1).yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.232 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.232-dash-rewards-duckipedia-book-update-only(1).zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.232
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.232-dash-rewards-duckipedia-book-update-only(1).zip"
          TMP=.duckie-days-v24-232-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v232.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.232
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.232"' version.json
          grep -Fq 'duck-habit-build" content="24.232"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.232";' index.html
          grep -Fq "window.SIBLING_SPAT_BATTLE_FIX='24.230-inward-equal-height';" duck-quest/js/game-v96.js
          grep -Fq '.battlefield.sibling-battle-v230 .enemy-combatant .enemy-fighter.sibling-opponent-v230' duck-quest/js/game-v96.js
          grep -Fq 'scale:-1 1' duck-quest/js/game-v96.js
          grep -Fq 'height:40.2%!important;bottom:8%!important' duck-quest/js/game-v96.js
          grep -Fq 'height:44.5%!important;bottom:9%!important' duck-quest/js/game-v96.js
          grep -Fq 'height:53.3%!important;bottom:6%!important' duck-quest/js/game-v96.js
          grep -Fq 'height:54.2%!important;bottom:7%!important' duck-quest/js/game-v96.js
          grep -Fq 'classList.toggle("sibling-opponent-v230",Boolean(enemy?.siblingCharacterId))' duck-quest/js/game-v96.js
          grep -Fq 'classList.toggle("sibling-battle-v230",Boolean(enemy?.siblingCharacterId))' duck-quest/js/game-v96.js
          grep -Fq "angry:'assets/characters/miko/base/Miko-angry.png'" duck-quest/js/game-v96.js
          grep -Fq '.sibling-scene.sibling-spat-v224 .sibling-right-v224' duck-quest/js/game-v96.js
          grep -Fq '@keyframes siblingRightIdleV224' duck-quest/js/game-v96.js
          grep -Fq 'function startSiblingAnimation()' duck-quest/js/game-v96.js
          grep -Fq 'const SIBLING_IDLE_FRAMES=' duck-quest/js/game-v96.js
          grep -Fq "window.DUCK_CRANE_REWARD_BUILD = '24.232-duck-copy-prizes';" crane-game/script-v24-40.js
          grep -Fq 'const PLAY_COST = 10;' crane-game/script-v24-40.js
          grep -Fq 'const RESET_COST = 50;' crane-game/script-v24-40.js
          grep -Fq 'const CATCH_CHANCE = 0.60;' crane-game/script-v24-40.js
          grep -Fq 'function awardDuckCopy(duckId)' crane-game/script-v24-40.js
          grep -Fq 'data.duckCollectionCounts[id] = owned;' crane-game/script-v24-40.js
          grep -Fq 'data.stats.cranePrizes = Math.max' crane-game/script-v24-40.js
          grep -Fq 'setCoins(coins-PLAY_COST);' crane-game/script-v24-40.js
          grep -Fq 'const owned = awardDuckCopy(target.duckId);' crane-game/script-v24-40.js
          grep -Fq 'if(machineCleared){' crane-game/script-v24-40.js
          grep -Fq 'Machine cleared! Fresh ducks were restocked for free.' crane-game/script-v24-40.js
          grep -Fq 'setCoins(coins-RESET_COST);' crane-game/script-v24-40.js
          ! grep -Fq 'PRIZE_COIN_REWARD' crane-game/script-v24-40.js
          ! grep -Fq 'MACHINE_CLEAR_BONUS' crane-game/script-v24-40.js
          ! grep -Fq 'function addCoins' crane-game/script-v24-40.js
          grep -Fq '<span id="playCostText">10</span>' crane-game/play-v24-40.html
          grep -Fq '<span id="resetCostText">50</span>' crane-game/play-v24-40.html
          grep -Fq '<span id="winRewardText">Duck collected!</span>' crane-game/play-v24-40.html
          ! grep -Fq '+3 Pink Coins' crane-game/play-v24-40.html
          grep -Fq '.reset-cost,.play-cost{' crane-game/style-v24-40.css
          grep -Fq 'script-v24-40.js?v=24-232' crane-game/play-v24-40.html
          grep -Fq 'style-v24-40.css?v=24-232' crane-game/play-v24-40.html
          grep -Fq 'play-v24-40.html?v=24-232' crane-game/index.html
          grep -Fq 'window.location.href = "crane-game/?v=24-232";' script-v24-201.js
          grep -Fq "window.DUCKIE_DASH_CORE='24.229-aligned-foreground';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DASH_REWARD_FIX='24.232-persist-coins-and-tiny-ducks';" duck-quest/js/game-v96.js
          grep -Fq 'function addDashDuckCopyV232(saveData,duckId,amount=0)' duck-quest/js/game-v96.js
          grep -Fq 'function awardDashRewardsV232(collectedCoins,collectedTiny,success)' duck-quest/js/game-v96.js
          grep -Fq 'const latest=loadHubSave();' duck-quest/js/game-v96.js
          grep -Fq "addDashDuckCopyV232(latest,'tiny-duck',tinyDucks);" duck-quest/js/game-v96.js
          grep -Fq 'latest.stats.coinsEarnedTotal=' duck-quest/js/game-v96.js
          grep -Fq 'Tiny Ducks +${rewards.tiny}' duck-quest/js/game-v96.js
          ! grep -Fq 'recordTinyDuck()' duck-quest/js/game-v96.js
          grep -Fq 'const DASH_GROUND_RATIO=.05;' duck-quest/js/game-v96.js
          grep -Fq 'const DASH_RUNNER_RAISE=4;' duck-quest/js/game-v96.js
          grep -Fq 'const DASH_BASE_SPEED=.48;' duck-quest/js/game-v96.js
          grep -Fq 'game-v96.js?v=24-232' duck-quest/index.html
          grep -Fq 'dash-background-fix-v226.js?v=24-232' duck-quest/index.html
          grep -Fq 'style-v24-201.css?v=24-232' index.html
          grep -Fq 'script-v24-201.js?v=24-232' index.html
          grep -Fq 'class="stage-layer room-object book-room-object duckipedia-room-book-v232" src="assets/ui/icons/duckipedia.webp"' index.html
          grep -Fq '#roomBookImage.duckipedia-room-book-v232{' style-v24-201.css
          grep -Fq '#roomBookImage.duckipedia-room-book-v232.on-shelf{' style-v24-201.css
          grep -Fq '#roomBookImage.duckipedia-room-book-v232.on-dresser{' style-v24-201.css
          grep -Fq './crane-game/index.html?v=24-232' sw-v24-232.js
          grep -Fq './crane-game/play-v24-40.html?v=24-232' sw-v24-232.js
          grep -Fq './crane-game/style-v24-40.css?v=24-232' sw-v24-232.js
          grep -Fq './crane-game/script-v24-40.js?v=24-232' sw-v24-232.js
          grep -Fq './duck-quest/js/game-v96.js?v=24-232' sw-v24-232.js
          grep -Fq './style-v24-201.css?v=24-232' sw-v24-232.js
          grep -Fq './script-v24-201.js?v=24-232' sw-v24-232.js
          grep -Fq './assets/ui/icons/duckipedia.webp' sw-v24-232.js
          grep -Fq "importScripts('./sw-v24-232.js');" sw.js
          grep -Fq "window.DUCKIE_DAYS_QUEST_FLOW='24.225-next-level-and-start-picker';" duck-quest/js/game-v96.js
          grep -Fq "window.DUCKIE_DAYS_MERCHANT_FIX='24.225-discounted-colored-charms';" duck-quest/js/merchant-fix-v218.js
          test -f V24.232-NOTES.txt
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/dash-background-fix-v226.js
          node --check duck-quest/js/merchant-fix-v218.js
          node --check crane-game/script-v24-40.js
          node --check script-v24-201.js
          node --check sw-v24-232.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('duck-quest/js/game-v96.js','utf8');
          const start=src.indexOf('function addDashDuckCopyV232');
          const end=src.indexOf('function overlap(',start);
          if(start<0||end<0)throw new Error('reward helpers not found');
          let stored={coins:100,unlockedDucks:['tiny-duck'],duckCollectionCounts:{'tiny-duck':3},tinyDuckSightings:3,stats:{coinsEarnedTotal:9}};
          const ctx={hubSave:{coins:1},loadHubSave:()=>structuredClone(stored)};
          vm.createContext(ctx);
          vm.runInContext(src.slice(start,end),ctx);
          let out=ctx.awardDashRewardsV232(2,1,true);
          if(out.coins!==22||out.tiny!==1)throw new Error('unexpected reward return');
          if(ctx.hubSave.coins!==122)throw new Error('Pink Coin award failed');
          if(ctx.hubSave.duckCollectionCounts['tiny-duck']!==4)throw new Error('Tiny Duck quantity failed');
          if(ctx.hubSave.duckCollectionCounts['tiny-duck-stack']!==1)throw new Error('Tiny Duck Stack milestone failed');
          if(ctx.hubSave.stats.coinsEarnedTotal!==31)throw new Error('coin-earned statistic failed');
          stored={coins:7,unlockedDucks:[],stats:{}};
          out=ctx.awardDashRewardsV232(0,2,false);
          if(ctx.hubSave.coins!==12||ctx.hubSave.duckCollectionCounts['tiny-duck']!==2||ctx.hubSave.tinyDuckSightings!==2)throw new Error('first Tiny Duck award failed');
          console.log('VERIFIED: Duckie Dash rewards update the newest save, exact Tiny Duck quantities, and milestones.');
          NODE
          python3 - <<'PY'
          from pathlib import Path

          game = Path('duck-quest/js/game-v96.js').read_text(encoding='utf-8')
          crane = Path('crane-game/script-v24-40.js').read_text(encoding='utf-8')
          assert game.count("window.SIBLING_SPAT_BATTLE_FIX='24.230-inward-equal-height';") == 1
          assert game.count('scale:-1 1') >= 1
          assert game.count('.sibling-scene.sibling-spat-v224') >= 2
          assert game.count('sibling-right-v224') >= 2
          assert game.count('SIBLING_IDLE_FRAMES') >= 2
          assert "window.DUCKIE_DASH_CORE='24.229-aligned-foreground';" in game
          assert "window.DUCKIE_DASH_REWARD_FIX='24.232-persist-coins-and-tiny-ducks';" in game
          assert 'const DASH_BASE_SPEED=.48;' in game
          assert crane.index('setCoins(coins-PLAY_COST);') < crane.index('const target = closestPrize();')
          cleared = crane.index('if(machineCleared){')
          auto_restock = crane.index('newPrizeLayout();', cleared)
          manual_charge = crane.index('setCoins(coins-RESET_COST);')
          assert cleared < auto_restock < manual_charge
          assert 'awardDuckCopy(target.duckId)' in crane
          assert 'data.duckCollectionCounts[id] = owned;' in crane
          hub = Path('index.html').read_text(encoding='utf-8')
          style = Path('style-v24-201.css').read_text(encoding='utf-8')
          assert 'assets/ui/icons/duckipedia.webp' in hub
          assert 'duckipedia-room-book-v232' in hub
          assert style.count('#roomBookImage.duckipedia-room-book-v232') >= 4
          print('VERIFIED: Dash rewards, Duckipedia room book, sibling battle alignment, and crane duck prizes are installed.')
          PY
          echo "VERIFIED: v24.232 code and cache files are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-232-dash-rewards-duckipedia-book(1).yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' ! -name 'V24.232-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-232.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f duck-quest/js/game-v96.js
          test -f duck-quest/js/merchant-fix-v218.js
          test -f duck-quest/js/dash-background-fix-v226.js
          test -f duck-quest/assets/characters/miko/base/Miko-angry.png
          test -f crane-game/script-v24-40.js
          test -f crane-game/play-v24-40.html
          test -f sw-v24-232.js
          test -f V24.232-NOTES.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.232 installed cleanly."

      - name: Commit v24.232 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.232 Dash rewards and Duckipedia book"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.232 installed, verified, cleaned, committed, and pushed."

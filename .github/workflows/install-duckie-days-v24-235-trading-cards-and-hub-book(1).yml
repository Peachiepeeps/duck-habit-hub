name: Install Duckie Days v24.235 Trading Cards and Hub Book

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.235-trading-cards-and-hub-book-update-only(1).zip"
      - ".github/workflows/install-duckie-days-v24-235-trading-cards-and-hub-book(1).yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.235 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.235-trading-cards-and-hub-book-update-only(1).zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.235
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.235-trading-cards-and-hub-book-update-only(1).zip"
          TMP=.duckie-days-v24-235-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v235.py"
          rm -rf "$TMP"

      - name: Verify v24.235
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.235"' version.json
          grep -Fq 'duck-habit-build" content="24.235"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.235";' index.html
          grep -Fq 'trading-cards-v235.css?v=24-235' index.html
          grep -Fq 'trading-cards-ui-v235.js?v=24-235' index.html
          grep -Fq 'trading-card-drops-v235.js?v=24-235' duck-quest/index.html
          grep -Fq 'trading-card-memory-v235.js?v=24-235' memory-game/index.html
          grep -Fq 'const DASH_RUN_OPTIONS={30:{duration:30,cost:3},60:{duration:60,cost:5}};' duck-quest/js/game-v96.js
          grep -Fq 'const DASH_BASE_SPEED=.54;' duck-quest/js/game-v96.js
          grep -Fq 'dash.speedBoost>0?1.55:1' duck-quest/js/game-v96.js
          grep -Fq "dash.elapsed+=dt;" duck-quest/js/game-v96.js
          grep -Fq "showDashPowerPopV217('-10s')" duck-quest/js/game-v96.js
          grep -Fq '.duckipedia-room-book-v232,.book-hotspot{right:0!important;bottom:0!important' trading-cards-v235.css
          grep -Fq 'Math.random()<.03' crane-game/script-v24-40.js
          grep -Fq 'target.kind==="card-pack" ? awardCardPack()' crane-game/script-v24-40.js
          grep -Fq 'Math.random()<.005' trading-cards-ui-v235.js
          grep -Fq 'starterPackGranted' trading-cards-ui-v235.js
          grep -Fq 'card-pack-torn-top.png' trading-cards-ui-v235.js
          grep -Fq "window.DUCKIE_MEMORY_CARD_BUILD=\"24.235\"" memory-game/trading-card-memory-v235.js
          grep -Fq "window.DUCKIE_TRADING_CARD_DROPS_BUILD=\"24.235\"" duck-quest/js/trading-card-drops-v235.js
          test -f assets/trading-cards/card-common.png
          test -f assets/trading-cards/card-uncommon.png
          test -f assets/trading-cards/card-rare.png
          test -f assets/trading-cards/card-back.png
          test -f assets/trading-cards/card-pack-unopened.png
          test -f assets/trading-cards/card-pack-ripped.png
          test -f assets/trading-cards/card-pack-torn-top.png
          test -f sw-v24-235.js
          test -f UPDATE-v24.235.txt
          node --check script-v24-201.js
          node --check trading-cards-v235.js
          node --check trading-cards-ui-v235.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/trading-card-drops-v235.js
          node --check memory-game/script-v24-44.js
          node --check memory-game/trading-card-memory-v235.js
          node --check crane-game/script-v24-40.js
          node --check sw-v24-235.js
          node - <<'NODE'
          const fs=require('fs');
          global.window={};global.location={pathname:'/'};global.document={createElement:()=>({})};
          require('./trading-cards-v235.js');
          const tc=window.DuckieTradingCards;
          if(tc.cards.length!==65)throw new Error(`Expected 65 cards, found ${tc.cards.length}`);
          const expected={common:22,uncommon:13,rare:30};
          for(const [rarity,count] of Object.entries(expected)){
            if(tc.byRarity(rarity).length!==count)throw new Error(`${rarity} card count mismatch`);
          }
          const missing=tc.cards.filter(card=>!fs.existsSync(`duck-quest/assets/${card.art}`));
          if(missing.length)throw new Error(`Missing card art: ${missing.map(card=>card.id).join(', ')}`);
          const save={};tc.ensureState(save);tc.grantPack(save);const pack=tc.rollPack();
          if(pack.length!==3||pack[0].rarity!=='common'||pack[1].rarity!=='common')throw new Error('Pack rules failed');
          tc.grantCard(save,pack[0].id);tc.grantCard(save,pack[0].id);
          if(save.tradingCards.owned[pack[0].id]!==2)throw new Error('Duplicate card count failed');
          console.log('VERIFIED: 65-card catalog, art, pack rules, and duplicate counts are valid.');
          NODE
          echo "VERIFIED: v24.235 code, card assets, rewards, Dash settings, and cache files are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-235-trading-cards-and-hub-book(1).yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.235.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-235.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v235.js
          test -f trading-cards-ui-v235.js
          test -f duck-quest/js/trading-card-drops-v235.js
          test -f memory-game/trading-card-memory-v235.js
          test -f crane-game/script-v24-40.js
          test -f sw-v24-235.js
          test -f UPDATE-v24.235.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.235 installed cleanly."

      - name: Commit v24.235 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.235 trading cards and Hub book"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.235 installed, verified, cleaned, committed, and pushed."

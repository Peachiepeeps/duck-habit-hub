name: Install Duckie Days v24.236 Card Art and Pack Rip

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.236-card-art-and-pack-rip-update-only(1).zip"
      - ".github/workflows/install-duckie-days-v24-236-card-art-and-pack-rip(1).yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.236 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.236-card-art-and-pack-rip-update-only(1).zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.236
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.236-card-art-and-pack-rip-update-only(1).zip"
          TMP=.duckie-days-v24-236-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v236.py"
          rm -rf "$TMP"

      - name: Verify v24.236
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.236"' version.json
          grep -Fq 'duck-habit-build" content="24.236"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.236";' index.html
          grep -Fq 'trading-cards-v236.css?v=24-236' index.html
          grep -Fq 'trading-cards-ui-v236.js?v=24-236' index.html
          grep -Fq '../trading-cards-v236.css?v=24-236' memory-game/index.html
          grep -Fq '../trading-cards-v236.css?v=24-236' crane-game/play-v24-40.html
          grep -Fq '.tc-frame{z-index:1}' trading-cards-v236.css
          grep -Fq '.tc-art{z-index:2}' trading-cards-v236.css
          grep -Fq '.tc-locked .tc-art{z-index:2;filter:brightness(0)' trading-cards-v236.css
          grep -Fq '@keyframes tcPackRipV236' trading-cards-v236.css
          grep -Fq '@keyframes tcCardRise' trading-cards-v236.css
          grep -Fq 'Swipe across or click the pack to rip it!' trading-cards-ui-v236.js
          grep -Fq 'function ripPack()' trading-cards-ui-v236.js
          grep -Fq 'function buildPackCards(results,sequence)' trading-cards-ui-v236.js
          grep -Fq 'Tap each card to reveal!' trading-cards-ui-v236.js
          grep -Fq 'ripTarget.addEventListener("pointerdown"' trading-cards-ui-v236.js
          grep -Fq 'ripTarget.addEventListener("click",ripPack)' trading-cards-ui-v236.js
          grep -Fq 'window.DUCKIE_TRADING_CARD_UI_BUILD="24.236"' trading-cards-ui-v236.js
          grep -Fq "importScripts('./sw-v24-236.js?v=24-236');" sw.js
          grep -Fq "duck-habit-hub-app-v24-236" sw-v24-236.js
          grep -Fq './trading-cards-v236.css?v=24-236' sw-v24-236.js
          grep -Fq './trading-cards-ui-v236.js?v=24-236' sw-v24-236.js
          test -f UPDATE-v24.236.txt
          node --check trading-cards-v235.js
          node --check trading-cards-ui-v236.js
          node --check script-v24-201.js
          node --check memory-game/trading-card-memory-v235.js
          node --check crane-game/script-v24-40.js
          node --check sw-v24-236.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('trading-cards-v236.css').read_text(encoding='utf-8')
          ui=Path('trading-cards-ui-v236.js').read_text(encoding='utf-8')
          assert css.rindex('.tc-art{z-index:2}') > css.index('.tc-art{position:absolute;z-index:1')
          assert css.rindex('.tc-frame{z-index:1}') > css.index('.tc-frame{position:absolute')
          open_start=ui.index('function openPack()')
          rip_start=ui.index('function ripPack()')
          assert 'state.unopenedPacks-=1' not in ui[open_start:rip_start]
          assert 'state.unopenedPacks-=1' in ui[rip_start:]
          assert 'pointerdown' in ui and 'pointerup' in ui and 'click",ripPack' in ui
          print('VERIFIED: card art is above the opaque frame, missing silhouettes are visible, and packs spend only when ripped.')
          PY
          echo "VERIFIED: v24.236 card rendering, interactive pack sequence, code, and cache files are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-236-card-art-and-pack-rip(1).yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.236.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-236.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v236.css
          test -f trading-cards-ui-v236.js
          test -f trading-cards-v235.js
          test -f sw-v24-236.js
          test -f UPDATE-v24.236.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.236 installed cleanly."

      - name: Commit v24.236 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.236 card art and pack rip"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.236 installed, verified, cleaned, committed, and pushed."

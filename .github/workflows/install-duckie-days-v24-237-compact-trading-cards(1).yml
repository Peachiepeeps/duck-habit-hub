name: Install Duckie Days v24.237 Compact Trading Cards

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.237-compact-trading-cards-update-only(1).zip"
      - ".github/workflows/install-duckie-days-v24-237-compact-trading-cards(1).yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require exact v24.237 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.237-compact-trading-cards-update-only(1).zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing."; ls -1; exit 1; }
          unzip -tq "$ZIP"

      - name: Install v24.237
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.237-compact-trading-cards-update-only(1).zip"
          TMP=.duckie-days-v24-237-install
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v237.py"
          rm -rf "$TMP"

      - name: Verify v24.237
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.237"' version.json
          grep -Fq 'duck-habit-build" content="24.237"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.237";' index.html
          grep -Fq 'trading-cards-v237.css?v=24-237' index.html
          grep -Fq 'trading-cards-ui-v236.js?v=24-237' index.html
          grep -Fq '../trading-cards-v237.css?v=24-237' memory-game/index.html
          grep -Fq '../trading-cards-v237.css?v=24-237' crane-game/play-v24-40.html
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr));' trading-cards-v237.css
          grep -Fq 'grid-template-columns:repeat(6,minmax(0,1fr))' trading-cards-v237.css
          grep -Fq 'grid-template-columns:repeat(8,minmax(0,1fr))' trading-cards-v237.css
          grep -Fq '.tc-detail-card>.tc-face{width:min(78vw,300px)' trading-cards-v237.css
          grep -Fq 'grid-template-columns:auto minmax(0,1fr) auto;' trading-cards-v237.css
          grep -Fq '.tc-pack-bar .tc-open-pack{justify-self:end' trading-cards-v237.css
          grep -Fq '.duckipedia-tab{' trading-cards-v237.css
          grep -Fq 'white-space:nowrap;' trading-cards-v237.css
          grep -Fq "importScripts('./sw-v24-237.js?v=24-237');" sw.js
          grep -Fq "duck-habit-hub-app-v24-237" sw-v24-237.js
          grep -Fq './trading-cards-v237.css?v=24-237' sw-v24-237.js
          test -f UPDATE-v24.237.txt
          node --check trading-cards-v235.js
          node --check trading-cards-ui-v236.js
          node --check script-v24-201.js
          node --check memory-game/trading-card-memory-v235.js
          node --check crane-game/script-v24-40.js
          node --check sw-v24-237.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('trading-cards-v237.css').read_text(encoding='utf-8')
          compact=css.index('/* v24.237 — compact Duckipedia Trading Card collection */')
          tail=css[compact:]
          assert 'grid-template-columns:repeat(4,minmax(0,1fr));' in tail
          assert 'grid-template-columns:auto minmax(0,1fr) auto;' in tail
          assert 'width:min(78vw,300px)' in tail
          assert tail.index('.duckipedia-tabs{') < tail.index('.tc-grid{')
          print('VERIFIED: one-line tabs, horizontal pack row, four-column phone thumbnails, and enlarged detail cards are installed.')
          PY
          echo "VERIFIED: v24.237 mobile Trading Card layout, code, and cache files are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name 'install-duckie-days-v24-237-compact-trading-cards(1).yml' -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.237.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-237.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v237.css
          test -f trading-cards-v235.js
          test -f trading-cards-ui-v236.js
          test -f sw-v24-237.js
          test -f UPDATE-v24.237.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.237 installed cleanly."

      - name: Commit v24.237 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.237 compact Trading Cards"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.237 installed, verified, cleaned, committed, and pushed."

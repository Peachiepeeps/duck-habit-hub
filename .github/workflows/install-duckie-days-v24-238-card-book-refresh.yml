name: Install Duckie Days v24.238 Card Book Refresh

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-238-card-book-refresh.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install v24.238
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import sys

          ROOT = Path.cwd()

          def read(rel):
              return (ROOT / rel).read_text(encoding="utf-8")

          def write(rel, text):
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def bump(text):
              return text.replace("24.237", "24.238").replace("24-237", "24-238")

          required = [
              "index.html",
              "version.json",
              "trading-cards-v235.js",
              "trading-cards-v237.css",
              "trading-cards-ui-v236.js",
              "memory-game/index.html",
              "crane-game/index.html",
              "crane-game/play-v24-40.html",
              "duck-quest/index.html",
              "script-v24-201.js",
              "sw-v24-237.js",
          ]
          missing = [p for p in required if not (ROOT / p).exists()]
          if missing:
              raise RuntimeError("Missing expected v24.237 files: " + ", ".join(missing))

          current = json.loads(read("version.json")).get("version")
          if str(current) != "24.237":
              raise RuntimeError(f"Expected Duckie Days v24.237, found {current!r}")

          # --- Trading Card UI: v24.238 ---
          ui = read("trading-cards-ui-v236.js")
          ui = replace_once(
              ui,
              "const state=TC.ensureState(save);",
              "let state=TC.ensureState(save);",
              "make Trading Card state refreshable",
          )

          ui = replace_once(
              ui,
              '<section class="tc-pack-stage"><button class="tc-pack-close" type="button" aria-label="Close">×</button><p class="tc-pack-kicker">',
              '<section class="tc-pack-stage"><p class="tc-pack-kicker">',
              "remove corner pack X",
          )
          ui = replace_once(
              ui,
              '<div class="tc-reveal-grid" aria-live="polite"></div></section>',
              '<div class="tc-reveal-grid" aria-live="polite"></div><button class="tc-pack-close tc-pack-close-bottom hidden" type="button" aria-label="Close Card Pack">Close</button></section>',
              "add bottom Close button",
          )

          sync_fn = '''\n  function syncCardState(){\n    const latest=TC.readSave();\n    const latestState=TC.ensureState(latest);\n    if(latestState){\n      save.tradingCards=latest.tradingCards;\n      state=TC.ensureState(save);\n    }else{\n      state=TC.ensureState(save);\n    }\n    return state;\n  }\n'''
          ui = replace_once(
              ui,
              "  function isFavorite(id){return state.favorites.includes(id);}",
              sync_fn + "  function isFavorite(id){return state.favorites.includes(id);}",
              "insert saved-card refresh helper",
          )

          ui = replace_once(
              ui,
              "  function renderCards(){\n    TC.ensureState(save);const ownedCount=",
              "  function renderCards(){\n    syncCardState();const ownedCount=",
              "refresh saved cards before rendering",
          )

          ui = replace_once(
              ui,
              'const rip=packLayer.querySelector(".tc-pack-rip"),body=rip.querySelector(".tc-pack-body"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title");\n    rip.className="tc-pack-rip ready";rip.style.removeProperty("transform");body.src=TC.packAsset("card-pack-unopened.png");grid.innerHTML="";title.textContent="Open a Pack!";note.textContent="Swipe across or click the pack to rip it!";packLayer.classList.remove("hidden");',
              'const rip=packLayer.querySelector(".tc-pack-rip"),body=rip.querySelector(".tc-pack-body"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title"),close=packLayer.querySelector(".tc-pack-close-bottom");\n    rip.className="tc-pack-rip ready";rip.style.removeProperty("transform");body.src=TC.packAsset("card-pack-unopened.png");grid.innerHTML="";title.textContent="Open a Pack!";note.textContent="Swipe across or click the pack to rip it!";close.classList.add("hidden");packLayer.classList.remove("hidden");',
              "reset bottom Close button for each pack",
          )

          ui = replace_once(
              ui,
              'const rip=packLayer.querySelector(".tc-pack-rip"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title");\n    rip.classList.add("cards-ready");title.textContent="Your Cards!";note.textContent="Tap each card to reveal!";',
              'const rip=packLayer.querySelector(".tc-pack-rip"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title"),close=packLayer.querySelector(".tc-pack-close-bottom");\n    rip.classList.add("cards-ready");title.textContent="Your Cards!";note.textContent="Tap each card to reveal!";close.classList.remove("hidden");',
              "show Close button under revealed cards",
          )

          ui = replace_once(
              ui,
              'results.forEach(card=>TC.grantCard(save,card.id,1));persist();renderCards();',
              'results.forEach(card=>TC.grantCard(save,card.id,1));persist();syncCardState();renderCards();',
              "refresh collection immediately after pack grant",
          )

          ui = replace_once(
              ui,
              'function closePack(){packSequence+=1;packRipping=false;packPointer=null;packLayer.classList.add("hidden");const rip=packLayer.querySelector(".tc-pack-rip");rip.className="tc-pack-rip";rip.style.removeProperty("transform");renderCards();}',
              'function closePack(){packSequence+=1;packRipping=false;packPointer=null;packLayer.classList.add("hidden");const rip=packLayer.querySelector(".tc-pack-rip"),close=packLayer.querySelector(".tc-pack-close-bottom");rip.className="tc-pack-rip";rip.style.removeProperty("transform");close.classList.add("hidden");syncCardState();renderCards();}',
              "refresh collection when pack closes",
          )

          ui = replace_once(
              ui,
              '  packLayer.querySelector(".tc-pack-close").addEventListener("click",closePack);',
              '  packLayer.querySelector(".tc-pack-close-bottom").addEventListener("click",closePack);',
              "wire bottom Close button",
          )

          refresh_listeners = '''\n  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!panel.classList.contains("hidden"))renderCards();});\n  window.addEventListener("focus",()=>{if(!panel.classList.contains("hidden"))renderCards();});\n  window.addEventListener("storage",event=>{if(event.key===TC.SAVE_KEY&&!panel.classList.contains("hidden"))renderCards();});\n'''
          ui = replace_once(
              ui,
              '  ripTarget.addEventListener("pointercancel",()=>{packPointer=null;ripTarget.classList.remove("swiping");ripTarget.style.removeProperty("transform");});\n',
              '  ripTarget.addEventListener("pointercancel",()=>{packPointer=null;ripTarget.classList.remove("swiping");ripTarget.style.removeProperty("transform");});\n' + refresh_listeners,
              "add automatic card-book refresh listeners",
          )

          write("trading-cards-ui-v238.js", ui)

          # --- Trading Card CSS: keep v24.237 compact layout + fix overflow/Close button ---
          css = read("trading-cards-v237.css")
          css += '''\n\n/* v24.238 — live collection refresh, scroll-contained missing cards, bottom pack Close */\n.tc-panel{min-height:0}\n.tc-grid{min-height:0;max-height:min(56vh,560px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:4px;padding-bottom:14px;align-content:start;scrollbar-gutter:stable}\n.tc-pack-close.tc-pack-close-bottom{position:static;z-index:20;width:auto;height:auto;min-width:112px;margin:12px auto 2px;padding:9px 24px;border:2px solid #d96c99;border-radius:999px;background:linear-gradient(#ffb8d1,#ef83ad);color:#fff;font:inherit;font-weight:950;font-size:.86rem;line-height:1.1;box-shadow:0 3px 0 #b75b84;cursor:pointer}\n.tc-pack-close.tc-pack-close-bottom:active{transform:translateY(2px);box-shadow:0 1px 0 #b75b84}\n.tc-pack-close-bottom.hidden{display:none!important}\n@media(max-width:560px){.tc-grid{max-height:48vh;padding-right:2px}.tc-pack-close.tc-pack-close-bottom{min-width:104px;margin-top:9px;padding:8px 20px;font-size:.78rem}}\n'''
          write("trading-cards-v238.css", css)

          # --- HTML/cache version bump ---
          root = bump(read("index.html"))
          root = root.replace("trading-cards-v237.css", "trading-cards-v238.css")
          root = root.replace("trading-cards-ui-v236.js", "trading-cards-ui-v238.js")
          write("index.html", root)

          memory = bump(read("memory-game/index.html")).replace("../trading-cards-v237.css", "../trading-cards-v238.css")
          write("memory-game/index.html", memory)

          crane = bump(read("crane-game/play-v24-40.html")).replace("../trading-cards-v237.css", "../trading-cards-v238.css")
          write("crane-game/play-v24-40.html", crane)
          write("crane-game/index.html", bump(read("crane-game/index.html")))
          write("duck-quest/index.html", bump(read("duck-quest/index.html")))

          script = read("script-v24-201.js").replace(
              'window.location.href = "crane-game/?v=24-237";',
              'window.location.href = "crane-game/?v=24-238";',
          )
          write("script-v24-201.js", script)

          worker = bump(read("sw-v24-237.js"))
          worker = worker.replace("trading-cards-v237.css", "trading-cards-v238.css")
          worker = worker.replace("trading-cards-ui-v236.js", "trading-cards-ui-v238.js")
          write("sw-v24-238.js", worker)
          write("sw.js", "importScripts('./sw-v24-238.js?v=24-238');\n")
          write("version.json", json.dumps({"version": "24.238"}, indent=2) + "\n")

          write(
              "UPDATE-v24.238.txt",
              "Duckie Days v24.238\n\n"
              "Trading Card quality-of-life fixes:\n"
              "- Replaces the pack-opening corner X with a cute pink Close button beneath the three cards.\n"
              "- Refreshes the Trading Card collection directly from the saved collection after a pack is opened/closed and whenever the app regains focus or visibility.\n"
              "- Keeps Show Missing results inside a scrollable card area so the collection no longer runs past the Duckipedia window.\n",
          )

          print("Duckie Days v24.238 installed successfully.")
          PY

      - name: Verify v24.238
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.238"' version.json
          grep -Fq 'duck-habit-build" content="24.238"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.238";' index.html
          grep -Fq 'trading-cards-v238.css?v=24-238' index.html
          grep -Fq 'trading-cards-ui-v238.js?v=24-238' index.html
          grep -Fq '../trading-cards-v238.css?v=24-238' memory-game/index.html
          grep -Fq '../trading-cards-v238.css?v=24-238' crane-game/play-v24-40.html
          grep -Fq 'function syncCardState()' trading-cards-ui-v238.js
          grep -Fq 'tc-pack-close tc-pack-close-bottom hidden' trading-cards-ui-v238.js
          grep -Fq '>Close</button>' trading-cards-ui-v238.js
          grep -Fq 'syncCardState();renderCards();' trading-cards-ui-v238.js
          grep -Fq 'window.addEventListener("focus"' trading-cards-ui-v238.js
          grep -Fq 'window.addEventListener("storage"' trading-cards-ui-v238.js
          grep -Fq 'max-height:min(56vh,560px);overflow-y:auto' trading-cards-v238.css
          grep -Fq '.tc-pack-close.tc-pack-close-bottom{' trading-cards-v238.css
          grep -Fq "importScripts('./sw-v24-238.js?v=24-238');" sw.js
          grep -Fq 'duck-habit-hub-app-v24-238' sw-v24-238.js
          grep -Fq './trading-cards-v238.css?v=24-238' sw-v24-238.js
          grep -Fq './trading-cards-ui-v238.js?v=24-238' sw-v24-238.js
          test -f UPDATE-v24.238.txt
          node --check trading-cards-v235.js
          node --check trading-cards-ui-v238.js
          node --check script-v24-201.js
          node --check sw-v24-238.js
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('trading-cards-ui-v238.js').read_text(encoding='utf-8')
          css=Path('trading-cards-v238.css').read_text(encoding='utf-8')
          assert '<button class="tc-pack-close" type="button" aria-label="Close">×</button>' not in ui
          assert ui.count('tc-pack-close-bottom') >= 5
          assert 'save.tradingCards=latest.tradingCards;' in ui
          assert 'event.key===TC.SAVE_KEY' in ui
          assert 'overflow-y:auto' in css and 'overscroll-behavior:contain' in css
          assert '.tc-pack-close-bottom.hidden{display:none!important}' in css
          print('VERIFIED: Close button, live card refresh, and Show Missing scrolling are installed.')
          PY
          echo "VERIFIED: v24.238 Trading Card fixes and cache files are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-238-card-book-refresh.yml"
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name "$SELF" -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.238.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-238.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v238.css
          test -f trading-cards-ui-v238.js
          test -f trading-cards-v235.js
          test -f sw-v24-238.js
          test -f UPDATE-v24.238.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.238 installed cleanly with one Duckie Days installer workflow."

      - name: Commit v24.238 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.238 card book refresh"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.238 installed, verified, cleaned, committed, and pushed."

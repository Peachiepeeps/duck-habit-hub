name: Install Duckie Days v24.239 Fabled Cards and Taller Card Scroll

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-239-fabled-cards.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install v24.239
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json

          ROOT = Path.cwd()

          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')

          def write(rel, text):
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          def write_bytes(rel, data):
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          def require_files(paths):
              missing = [p for p in paths if not (ROOT / p).exists()]
              if missing:
                  raise RuntimeError('Missing required files: ' + ', '.join(missing))

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def maybe_replace(text, old, new):
              return text.replace(old, new) if old in text else text

          def bump_versions(text):
              return text.replace('24.238', '24.239').replace('24-238', '24-239').replace('24.237', '24.239').replace('24-237', '24-239')

          require_files([
              'index.html',
              'version.json',
              'trading-cards-v235.js',
              'memory-game/index.html',
              'crane-game/index.html',
              'crane-game/play-v24-40.html',
              'duck-quest/index.html',
              'script-v24-201.js',
          ])

          current = str(json.loads(read('version.json')).get('version'))
          if current not in {'24.237', '24.238'}:
              raise RuntimeError(f'Expected Duckie Days v24.237 or v24.238, found {current!r}')

          ui_source = 'trading-cards-ui-v238.js' if (ROOT / 'trading-cards-ui-v238.js').exists() else 'trading-cards-ui-v236.js'
          css_source = 'trading-cards-v238.css' if (ROOT / 'trading-cards-v238.css').exists() else 'trading-cards-v237.css'
          sw_source = f"sw-v24-{current.split('.')[-1]}.js"
          if not (ROOT / sw_source).exists():
              fallback = 'sw-v24-238.js' if (ROOT / 'sw-v24-238.js').exists() else 'sw-v24-237.js'
              if (ROOT / fallback).exists():
                  sw_source = fallback
              else:
                  raise RuntimeError('Could not find sw-v24-237.js or sw-v24-238.js')

          assets = {
            "duck-quest/assets/trading-cards/fabled/F-acorn-mouse.png": "",
            "duck-quest/assets/trading-cards/fabled/F-bee.png": "",
            "duck-quest/assets/trading-cards/fabled/F-flower.png": "",
            "duck-quest/assets/trading-cards/fabled/F-mimic.png": "",
            "duck-quest/assets/trading-cards/fabled/F-slime-kitty.png": ""
}
          for rel, b64 in assets.items():
              write_bytes(rel, base64.b64decode(b64))

          # --- Trading Card core data: v24.239 ---
          tc = read('trading-cards-v235.js')
          tc = maybe_replace(tc,
              'const order={common:1,uncommon:2,rare:3,ultra:4,fabled:5};',
              'const order={common:1,uncommon:2,rare:3,fabled:4};'
          )
          tc = maybe_replace(tc,
              'const labels={common:"Common",uncommon:"Uncommon",rare:"Rare",ultra:"Ultra Rare",fabled:"Fabled"};',
              'const labels={common:"Common",uncommon:"Uncommon",rare:"Rare",fabled:"Fabled"};'
          )
          tc = maybe_replace(tc,
              'const templates={common:"card-common.png",uncommon:"card-uncommon.png",rare:"card-rare.png",ultra:"card-rare.png",fabled:"card-rare.png"};',
              'const templates={common:"card-common.png",uncommon:"card-uncommon.png",rare:"card-rare.png",fabled:"card-rare.png"};'
          )
          if 'const fabled=[' not in tc:
              tc = replace_once(
                  tc,
                  '  const cards=[];',
                  '  const fabled=[\n'
                  '    ["slime-kitty","Slime Kitty","trading-cards/fabled/F-slime-kitty.png","Meadow Fabled","Find this Fabled card in a Card Pack or as a very rare Daily Shop offer."],\n'
                  '    ["acorn-mouse","Acorn Mouse","trading-cards/fabled/F-acorn-mouse.png","Forest Fabled","Find this Fabled card in a Card Pack or as a very rare Daily Shop offer."],\n'
                  '    ["bee","Bee","trading-cards/fabled/F-bee.png","Meadow Fabled","Find this Fabled card in a Card Pack or as a very rare Daily Shop offer."],\n'
                  '    ["flower","Flower","trading-cards/fabled/F-flower.png","Meadow Fabled","Find this Fabled card in a Card Pack or as a very rare Daily Shop offer."],\n'
                  '    ["mimic","Mimic","trading-cards/fabled/F-mimic.png","Mystery Chest Fabled","Find this Fabled card in a Card Pack or as a very rare Daily Shop offer."]\n'
                  '  ];\n'
                  '  const cards=[];',
                  'insert fabled card definitions',
              )
          if 'fabled.forEach(' not in tc:
              tc = replace_once(
                  tc,
                  '  shiny.forEach((x,i)=>cards.push({id:`r-${x[0]}`,enemyId:x[0],name:x[1],art:x[2],rarity:"rare",number:`R-${String(i+1).padStart(3,"0")}`,category:`${stage[x[0]]||"Duck Quest"} Shiny`,hint:`Encounter the shiny ${x[1]} in Duck Quest, or get very lucky with a pack or Daily Shop offer.`}));\n',
                  '  shiny.forEach((x,i)=>cards.push({id:`r-${x[0]}`,enemyId:x[0],name:x[1],art:x[2],rarity:"rare",number:`R-${String(i+1).padStart(3,"0")}`,category:`${stage[x[0]]||"Duck Quest"} Shiny`,hint:`Encounter the shiny ${x[1]} in Duck Quest, or get very lucky with a pack or Daily Shop offer.`}));\n'
                  '  fabled.forEach((x,i)=>cards.push({id:`f-${x[0]}`,name:x[1],art:x[2],rarity:"fabled",number:`F-${String(i+1).padStart(3,"0")}`,category:x[3],hint:x[4]}));\n',
                  'insert fabled card entries',
              )
          tc = maybe_replace(tc,
              'function rollRarity(weights={common:.8,uncommon:.18,rare:.02}){let roll=Math.random(),last="common";for(const [rarity,chance] of Object.entries(weights)){last=rarity;roll-=chance;if(roll<=0)return rarity;}return last;}',
              'function rollRarity(weights={common:.79,uncommon:.18,rare:.02,fabled:.01}){let roll=Math.random(),last="common";for(const [rarity,chance] of Object.entries(weights)){last=rarity;roll-=chance;if(roll<=0)return rarity;}return last;}'
          )
          tc = maybe_replace(tc,
              'function rollPack(){return [rollCard("common"),rollCard("common"),rollCard(rollRarity({common:.70,uncommon:.25,rare:.05}))];}',
              'function rollPack(){return [rollCard("common"),rollCard("common"),rollCard(rollRarity({common:.69,uncommon:.25,rare:.05,fabled:.01}))];}'
          )
          tc = maybe_replace(tc,
              'if(card.rarity==="rare"||card.rarity==="ultra"||card.rarity==="fabled"){const shine=document.createElement("i");shine.className="tc-shine";face.append(shine);}return face;',
              'if(card.rarity==="rare"||card.rarity==="fabled"){const shine=document.createElement("i");shine.className="tc-shine";face.append(shine);}return face;'
          )
          write('trading-cards-v239.js', tc)

          # --- Trading Card UI: carry forward v24.238 fixes + add Fabled cleanup ---
          ui = read(ui_source)
          if 'let state=TC.ensureState(save);' not in ui:
              ui = replace_once(ui, 'const state=TC.ensureState(save);', 'let state=TC.ensureState(save);', 'make state refreshable')
          if '<button class="tc-pack-close" type="button" aria-label="Close">×</button>' in ui:
              ui = replace_once(
                  ui,
                  '<section class="tc-pack-stage"><button class="tc-pack-close" type="button" aria-label="Close">×</button><p class="tc-pack-kicker">',
                  '<section class="tc-pack-stage"><p class="tc-pack-kicker">',
                  'remove corner pack close button'
              )
          if 'tc-pack-close-bottom' not in ui:
              ui = replace_once(
                  ui,
                  '<div class="tc-reveal-grid" aria-live="polite"></div></section>',
                  '<div class="tc-reveal-grid" aria-live="polite"></div><button class="tc-pack-close tc-pack-close-bottom hidden" type="button" aria-label="Close Card Pack">Close</button></section>',
                  'add bottom pack close button'
              )
          if 'function syncCardState()' not in ui:
              sync_fn = '\n  function syncCardState(){\n    const latest=TC.readSave();\n    const latestState=TC.ensureState(latest);\n    if(latestState){\n      save.tradingCards=latest.tradingCards;\n      state=TC.ensureState(save);\n    }else{\n      state=TC.ensureState(save);\n    }\n    return state;\n  }\n'
              ui = replace_once(ui, '  function isFavorite(id){return state.favorites.includes(id);}', sync_fn + '  function isFavorite(id){return state.favorites.includes(id);}', 'insert syncCardState helper')
          if '  function renderCards(){\n    syncCardState();const ownedCount=' not in ui:
              ui = replace_once(ui, '  function renderCards(){\n    TC.ensureState(save);const ownedCount=', '  function renderCards(){\n    syncCardState();const ownedCount=', 'refresh state before rendering cards')
          if 'const rip=packLayer.querySelector(".tc-pack-rip"),body=rip.querySelector(".tc-pack-body"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title"),close=packLayer.querySelector(".tc-pack-close-bottom");' not in ui:
              ui = replace_once(
                  ui,
                  'const rip=packLayer.querySelector(".tc-pack-rip"),body=rip.querySelector(".tc-pack-body"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title");\n    rip.className="tc-pack-rip ready";rip.style.removeProperty("transform");body.src=TC.packAsset("card-pack-unopened.png");grid.innerHTML="";title.textContent="Open a Pack!";note.textContent="Swipe across or click the pack to rip it!";packLayer.classList.remove("hidden");',
                  'const rip=packLayer.querySelector(".tc-pack-rip"),body=rip.querySelector(".tc-pack-body"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title"),close=packLayer.querySelector(".tc-pack-close-bottom");\n    rip.className="tc-pack-rip ready";rip.style.removeProperty("transform");body.src=TC.packAsset("card-pack-unopened.png");grid.innerHTML="";title.textContent="Open a Pack!";note.textContent="Swipe across or click the pack to rip it!";close.classList.add("hidden");packLayer.classList.remove("hidden");',
                  'reset pack Close button each open'
              )
          if 'const rip=packLayer.querySelector(".tc-pack-rip"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title"),close=packLayer.querySelector(".tc-pack-close-bottom");' not in ui:
              ui = replace_once(
                  ui,
                  'const rip=packLayer.querySelector(".tc-pack-rip"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title");\n    rip.classList.add("cards-ready");title.textContent="Your Cards!";note.textContent="Tap each card to reveal!";',
                  'const rip=packLayer.querySelector(".tc-pack-rip"),grid=packLayer.querySelector(".tc-reveal-grid"),note=packLayer.querySelector(".tc-pack-instruction"),title=packLayer.querySelector(".tc-pack-title"),close=packLayer.querySelector(".tc-pack-close-bottom");\n    rip.classList.add("cards-ready");title.textContent="Your Cards!";note.textContent="Tap each card to reveal!";close.classList.remove("hidden");',
                  'show pack Close button once cards are visible'
              )
          ui = maybe_replace(ui,
              'results.forEach(card=>TC.grantCard(save,card.id,1));persist();renderCards();',
              'results.forEach(card=>TC.grantCard(save,card.id,1));persist();syncCardState();renderCards();'
          )
          ui = maybe_replace(ui,
              'function closePack(){packSequence+=1;packRipping=false;packPointer=null;packLayer.classList.add("hidden");const rip=packLayer.querySelector(".tc-pack-rip");rip.className="tc-pack-rip";rip.style.removeProperty("transform");renderCards();}',
              'function closePack(){packSequence+=1;packRipping=false;packPointer=null;packLayer.classList.add("hidden");const rip=packLayer.querySelector(".tc-pack-rip"),close=packLayer.querySelector(".tc-pack-close-bottom");rip.className="tc-pack-rip";rip.style.removeProperty("transform");close.classList.add("hidden");syncCardState();renderCards();}'
          )
          ui = maybe_replace(ui,
              '  packLayer.querySelector(".tc-pack-close").addEventListener("click",closePack);',
              '  packLayer.querySelector(".tc-pack-close-bottom").addEventListener("click",closePack);'
          )
          if 'window.addEventListener("focus",()=>{if(!panel.classList.contains("hidden"))renderCards();});' not in ui:
              ui = replace_once(
                  ui,
                  '  ripTarget.addEventListener("pointercancel",()=>{packPointer=null;ripTarget.classList.remove("swiping");ripTarget.style.removeProperty("transform");});\n',
                  '  ripTarget.addEventListener("pointercancel",()=>{packPointer=null;ripTarget.classList.remove("swiping");ripTarget.style.removeProperty("transform");});\n\n  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!panel.classList.contains("hidden"))renderCards();});\n  window.addEventListener("focus",()=>{if(!panel.classList.contains("hidden"))renderCards();});\n  window.addEventListener("storage",event=>{if(event.key===TC.SAVE_KEY&&!panel.classList.contains("hidden"))renderCards();});\n',
                  'add live refresh listeners'
              )
          ui = maybe_replace(
              ui,
              '<option value="all">All</option><option value="common">Common</option><option value="uncommon">Uncommon</option><option value="rare">Rare</option><option value="ultra">Ultra Rare</option><option value="fabled">Fabled</option>',
              '<option value="all">All</option><option value="common">Common</option><option value="uncommon">Uncommon</option><option value="rare">Rare</option><option value="fabled">Fabled</option>'
          )
          ui = maybe_replace(
              ui,
              'const first=TC.rollCard("common"),second=TC.rollCard(Math.random()<.72?"common":"uncommon"),third=TC.rollCard(TC.rollRarity({common:.58,uncommon:.37,rare:.05}));',
              'const first=TC.rollCard("common"),second=TC.rollCard(Math.random()<.72?"common":"uncommon"),third=TC.rollCard(TC.rollRarity({common:.57,uncommon:.36,rare:.06,fabled:.01}));'
          )
          ui = maybe_replace(ui, 'const prices={common:40,uncommon:100,rare:300,ultra:500,fabled:750};', 'const prices={common:40,uncommon:100,rare:300,fabled:750};')
          ui = maybe_replace(ui, 'window.DUCKIE_TRADING_CARD_UI_BUILD="24.236";', 'window.DUCKIE_TRADING_CARD_UI_BUILD="24.239";')
          ui = maybe_replace(ui, 'window.DUCKIE_TRADING_CARD_UI_BUILD="24.238";', 'window.DUCKIE_TRADING_CARD_UI_BUILD="24.239";')
          write('trading-cards-ui-v239.js', ui)

          # --- Trading Card CSS: larger scroll area, keep compact layout, support bottom Close button ---
          css = read(css_source)
          css += '\n\n/* v24.239 — larger Trading Card scroll area + Fabled rarity support */\n.tc-panel{min-height:0}\n.tc-grid{min-height:0;max-height:min(64vh,640px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:4px;padding-bottom:22px;align-content:start;scrollbar-gutter:stable}\n.tc-pack-close.tc-pack-close-bottom{position:static;z-index:20;width:auto;height:auto;min-width:112px;margin:12px auto 2px;padding:9px 24px;border:2px solid #d96c99;border-radius:999px;background:linear-gradient(#ffb8d1,#ef83ad);color:#fff;font:inherit;font-weight:950;font-size:.86rem;line-height:1.1;box-shadow:0 3px 0 #b75b84;cursor:pointer}\n.tc-pack-close.tc-pack-close-bottom:active{transform:translateY(2px);box-shadow:0 1px 0 #b75b84}\n.tc-pack-close-bottom.hidden{display:none!important}\n@media(max-width:560px){.tc-grid{max-height:56vh;padding-right:2px;padding-bottom:18px}.tc-pack-close.tc-pack-close-bottom{min-width:104px;margin-top:9px;padding:8px 20px;font-size:.78rem}}\n'
          write('trading-cards-v239.css', css)

          # --- HTML and cache version bump ---
          def update_html(rel):
              text = bump_versions(read(rel))
              text = text.replace('trading-cards-v235.js', 'trading-cards-v239.js')
              text = text.replace('trading-cards-v237.css', 'trading-cards-v239.css').replace('trading-cards-v238.css', 'trading-cards-v239.css')
              text = text.replace('trading-cards-ui-v236.js', 'trading-cards-ui-v239.js').replace('trading-cards-ui-v238.js', 'trading-cards-ui-v239.js')
              write(rel, text)

          update_html('index.html')
          update_html('memory-game/index.html')
          update_html('crane-game/play-v24-40.html')
          update_html('duck-quest/index.html')
          write('crane-game/index.html', bump_versions(read('crane-game/index.html')))

          script = read('script-v24-201.js')
          script = maybe_replace(script, 'window.location.href = "crane-game/?v=24-237";', 'window.location.href = "crane-game/?v=24-239";')
          script = maybe_replace(script, 'window.location.href = "crane-game/?v=24-238";', 'window.location.href = "crane-game/?v=24-239";')
          write('script-v24-201.js', script)

          worker = bump_versions(read(sw_source))
          worker = worker.replace('trading-cards-v235.js', 'trading-cards-v239.js')
          worker = worker.replace('trading-cards-v237.css', 'trading-cards-v239.css').replace('trading-cards-v238.css', 'trading-cards-v239.css')
          worker = worker.replace('trading-cards-ui-v236.js', 'trading-cards-ui-v239.js').replace('trading-cards-ui-v238.js', 'trading-cards-ui-v239.js')
          if 'F-slime-kitty.png' not in worker and "./assets/trading-cards/card-pack-torn-top.png'," in worker:
              worker = worker.replace(
                  "./assets/trading-cards/card-pack-torn-top.png',",
                  "./assets/trading-cards/card-pack-torn-top.png',\n  './duck-quest/assets/trading-cards/fabled/F-slime-kitty.png',\n  './duck-quest/assets/trading-cards/fabled/F-acorn-mouse.png',\n  './duck-quest/assets/trading-cards/fabled/F-bee.png',\n  './duck-quest/assets/trading-cards/fabled/F-flower.png',\n  './duck-quest/assets/trading-cards/fabled/F-mimic.png',",
                  1,
              )
          write('sw-v24-239.js', worker)
          write('sw.js', "importScripts('./sw-v24-239.js?v=24-239');\n")
          write('version.json', json.dumps({'version': '24.239'}, indent=2) + '\n')

          write(
              'UPDATE-v24.239.txt',
              'Duckie Days v24.239\n\n'
              'Trading Card update:\n'
              '- Expands the Trading Card scroll area lower so the collection uses more of the open space at the bottom.\n'
              '- Adds 5 new Fabled cards: Slime Kitty, Acorn Mouse, Bee, Flower, and Mimic.\n'
              '- Uses Common, Uncommon, Rare, and Fabled rarities (no Ultra Rare filter).\n'
              '- Keeps the pink Close button under opened packs and the automatic card-book refresh from the previous update.\n',
          )

          print('Duckie Days v24.239 installed successfully.')
          PY

      - name: Verify v24.239
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.239"' version.json
          grep -Fq 'duck-habit-build" content="24.239"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.239";' index.html
          grep -Fq 'trading-cards-v239.js?v=24-239' index.html
          grep -Fq 'trading-cards-v239.css?v=24-239' index.html
          grep -Fq 'trading-cards-ui-v239.js?v=24-239' index.html
          grep -Fq '../trading-cards-v239.js?v=24-239' duck-quest/index.html
          grep -Fq '../trading-cards-v239.js?v=24-239' memory-game/index.html
          grep -Fq '../trading-cards-v239.js?v=24-239' crane-game/play-v24-40.html
          grep -Fq '../trading-cards-v239.css?v=24-239' memory-game/index.html
          grep -Fq '../trading-cards-v239.css?v=24-239' crane-game/play-v24-40.html
          grep -Fq 'window.DUCKIE_TRADING_CARD_UI_BUILD="24.239";' trading-cards-ui-v239.js
          grep -Fq '<option value="fabled">Fabled</option>' trading-cards-ui-v239.js
          ! grep -Fq '<option value="ultra">Ultra Rare</option>' trading-cards-ui-v239.js
          grep -Fq 'const prices={common:40,uncommon:100,rare:300,fabled:750};' trading-cards-ui-v239.js
          grep -Fq 'max-height:min(64vh,640px);overflow-y:auto' trading-cards-v239.css
          grep -Fq 'padding-bottom:22px' trading-cards-v239.css
          test -f duck-quest/assets/trading-cards/fabled/F-slime-kitty.png
          test -f duck-quest/assets/trading-cards/fabled/F-acorn-mouse.png
          test -f duck-quest/assets/trading-cards/fabled/F-bee.png
          test -f duck-quest/assets/trading-cards/fabled/F-flower.png
          test -f duck-quest/assets/trading-cards/fabled/F-mimic.png
          grep -Fq "importScripts('./sw-v24-239.js?v=24-239');" sw.js
          grep -Fq './trading-cards-v239.js?v=24-239' sw-v24-239.js
          grep -Fq './trading-cards-v239.css?v=24-239' sw-v24-239.js
          grep -Fq './trading-cards-ui-v239.js?v=24-239' sw-v24-239.js
          grep -Fq 'F-slime-kitty.png' sw-v24-239.js
          test -f UPDATE-v24.239.txt
          node --check trading-cards-v239.js
          node --check trading-cards-ui-v239.js
          node --check script-v24-201.js
          node --check sw-v24-239.js
          python3 - <<'PY'
          from pathlib import Path
          tc = Path('trading-cards-v239.js').read_text(encoding='utf-8')
          ui = Path('trading-cards-ui-v239.js').read_text(encoding='utf-8')
          css = Path('trading-cards-v239.css').read_text(encoding='utf-8')
          assert 'const order={common:1,uncommon:2,rare:3,fabled:4};' in tc
          assert 'const labels={common:"Common",uncommon:"Uncommon",rare:"Rare",fabled:"Fabled"};' in tc
          assert 'const fabled=[' in tc and tc.count('trading-cards/fabled/F-') == 5
          assert 'F-001' in tc and 'F-005' in tc
          assert 'Slime Kitty' in tc and 'Mimic' in tc
          assert 'rollRarity({common:.69,uncommon:.25,rare:.05,fabled:.01})' in tc
          assert '<option value="ultra">Ultra Rare</option>' not in ui
          assert 'const prices={common:40,uncommon:100,rare:300,fabled:750};' in ui
          assert 'max-height:min(64vh,640px)' in css and 'padding-bottom:22px' in css
          print('VERIFIED: 5 Fabled cards, no Ultra filter, and larger card scroll area are installed.')
          PY
          echo "VERIFIED: v24.239 Fabled cards and larger Trading Card scroll area are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-239-fabled-cards.yml"
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name "$SELF" -delete
          fi
          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'V24.*-NOTES.txt' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.239.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-239.js' -delete

      - name: Final verification after cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v239.js
          test -f trading-cards-ui-v239.js
          test -f trading-cards-v239.css
          test -f sw-v24-239.js
          test -f UPDATE-v24.239.txt
          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"
          echo "VERIFIED: v24.239 installed cleanly with one Duckie Days installer workflow."

      - name: Commit v24.239 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes were staged."; exit 1; }
          git commit -m "Install Duckie Days v24.239 Fabled cards"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.239 installed, verified, cleaned, committed, and pushed."

name: Install Duckie Days v24.240 Lukio Love-Interest Encounter

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-240-lukio-love-interest.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install v24.240
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json
          ROOT = Path.cwd()

          def read(rel): return (ROOT / rel).read_text(encoding='utf-8')
          def write(rel, text):
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          def write_bytes(rel, data):
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          def maybe_replace(text, old, new):
              return text.replace(old, new) if old in text else text
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          def bump_versions(text):
              return text.replace('24.239','24.240').replace('24-239','24-240')

          required = [
            'index.html','version.json','trading-cards-v239.js','trading-cards-ui-v239.js','trading-cards-v239.css',
            'memory-game/index.html','crane-game/index.html','crane-game/play-v24-40.html','duck-quest/index.html',
            'script-v24-201.js','sw-v24-239.js'
          ]
          missing = [p for p in required if not (ROOT / p).exists()]
          if missing:
              raise RuntimeError('Missing required files: ' + ', '.join(missing))
          current = str(json.loads(read('version.json')).get('version'))
          if current != '24.239':
              raise RuntimeError(f'Expected Duckie Days v24.239 before installing Lukio, found {current!r}')

          assets = {
  "duck-quest/assets/love-interests/lukio/Lukio-duck.png": "",
  "duck-quest/assets/love-interests/lukio/Lukio-idle-1.png": "",
  "duck-quest/assets/love-interests/lukio/Lukio-idle-2.png": "",
  "duck-quest/assets/love-interests/lukio/Lukio-wink.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-Booties.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-Hair-Streak.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-Shorts.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-Socks.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-hoodie-shop.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-hoodie.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-Lukio-reference.png": "",
  "duck-quest/assets/love-interests/lukio/Miko-lukio-sleeve.png": "",
  "duck-quest/assets/love-interests/lukio/Pixel-heart.png": ""
}
          for rel, b64 in assets.items():
              write_bytes(rel, base64.b64decode(b64))

          tc = read('trading-cards-v239.js')
          if 'r-love-lukio' not in tc:
              tc = replace_once(
                tc,
                '  const byId=Object.fromEntries(cards.map(card=>[card.id,card]));',
                '  cards.push({id:"r-love-lukio",characterId:"lukio",name:"Lukio",art:"love-interests/lukio/Lukio-idle-1.png",rarity:"rare",number:"R-999",category:"Love Interest",hint:"Meet Lukio while exploring Duck Quest as Miko to unlock this Trading Card."});\n  const byId=Object.fromEntries(cards.map(card=>[card.id,card]));',
                'insert Lukio trading card'
              )
          write('trading-cards-v240.js', tc)

          write('love-interest-lukio-v240.js', "(function(){\n  \"use strict\";\n  const SAVE_KEY = \"duckHabitHubSave_v1\";\n  const IS_SUBPAGE = /\\/(duck-quest|memory-game|crane-game)\\//.test(location.pathname);\n  const asset = (rel) => `${IS_SUBPAGE ? \"../\" : \"\"}${rel}`;\n  const DATA = {\n    id: \"lukio\",\n    cardId: \"r-love-lukio\",\n    duckId: \"lukio-duck\",\n    duckName: \"Lukio Duck\",\n    encounterChance: 0.06,\n    cooldownMs: 45000,\n    dialogue: [\n      { speaker: \"Miko\", text: \"Lukio! There you are!\", pose: \"idle\" },\n      { speaker: \"Lukio\", text: \"Hey babe! What are you doing here?\", pose: \"idle\" },\n      { speaker: \"Miko\", text: \"Just finding cute buddies and exploring. Have you seen the others?\", pose: \"idle\" },\n      { speaker: \"Lukio\", text: \"Hmm, I\u2019ve seen some here or there. I bet most are home. Wanna head back with me?\", pose: \"idle\" },\n      { speaker: \"Miko\", text: \"Yeah! Let\u2019s hold hands!\", pose: \"idle\" },\n      { speaker: \"Lukio\", text: \"(Winks) Alright. Then here, I found these.\", pose: \"wink\" },\n      { speaker: \"Miko\", text: \"(smug) A gift? For me? You\u2019re too sweet!\", pose: \"idle\" }\n    ],\n    images: {\n      miko: asset(\"duck-quest/assets/love-interests/lukio/Miko-Lukio-reference.png\"),\n      lukioIdle: asset(\"duck-quest/assets/love-interests/lukio/Lukio-idle-1.png\"),\n      lukioAlt: asset(\"duck-quest/assets/love-interests/lukio/Lukio-idle-2.png\"),\n      lukioWink: asset(\"duck-quest/assets/love-interests/lukio/Lukio-wink.png\"),\n      heart: asset(\"duck-quest/assets/love-interests/lukio/Pixel-heart.png\"),\n      duck: asset(\"duck-quest/assets/love-interests/lukio/Lukio-duck.png\"),\n      hoodie: asset(\"duck-quest/assets/love-interests/lukio/Miko-Lukio-hoodie-shop.png\")\n    },\n    outfitPieces: [\n      \"Miko-Lukio-Hair-Streak\",\n      \"Miko-Lukio-hoodie\",\n      \"Miko-lukio-sleeve\",\n      \"Miko-Lukio-Shorts\",\n      \"Miko-Lukio-Socks\",\n      \"Miko-Lukio-Booties\"\n    ]\n  };\n\n  let encounterOpen = false;\n  let lastAttemptAt = 0;\n  let sessionTriggered = false;\n\n  function readSave(){\n    try{return JSON.parse(localStorage.getItem(SAVE_KEY) || \"{}\");}\n    catch(_){return {};}\n  }\n  function writeSave(data){ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }\n  function ensureState(save){\n    if(!save || typeof save !== \"object\") save = {};\n    if(!save.loveInterests || typeof save.loveInterests !== \"object\") save.loveInterests = {};\n    if(!save.loveInterests[DATA.id] || typeof save.loveInterests[DATA.id] !== \"object\") {\n      save.loveInterests[DATA.id] = {\n        encountered:false,\n        spritesUnlocked:false,\n        duckUnlocked:false,\n        outfitUnlocked:false,\n        cardUnlocked:false,\n        outfitEquipped:false\n      };\n    }\n    if(!Array.isArray(save.specialDucks)) save.specialDucks = [];\n    if(!Array.isArray(save.unlockedLoveCards)) save.unlockedLoveCards = [];\n    if(!save.unlockedOutfitPieces || typeof save.unlockedOutfitPieces !== \"object\") save.unlockedOutfitPieces = {};\n    if(!Array.isArray(save.unlockedOutfitPieces.miko)) save.unlockedOutfitPieces.miko = [];\n    if(!Array.isArray(save.loveInterestNotifications)) save.loveInterestNotifications = [];\n    return save.loveInterests[DATA.id];\n  }\n  function showToast(msg){\n    if(typeof window.showToast === \"function\") return window.showToast(msg);\n    try{ console.log(msg); }catch(_){ }\n  }\n  function activeCharacterIsMiko(save){\n    const keys = [\"selectedOc\",\"selectedOC\",\"currentOc\",\"currentOC\",\"activeOc\",\"activeOC\",\"selectedCharacter\",\"currentCharacter\",\"activeCharacter\",\"playerOc\",\"playerCharacter\"];\n    for(const key of keys){\n      const value = save[key];\n      const text = typeof value === \"string\" ? value : (value && typeof value.id === \"string\" ? value.id : (value && typeof value.name === \"string\" ? value.name : \"\"));\n      if(text && /miko/i.test(text)) return true;\n    }\n    return true;\n  }\n  function unlockRewards(){\n    const save = readSave();\n    const state = ensureState(save);\n    state.encountered = true;\n    state.spritesUnlocked = true;\n    state.duckUnlocked = true;\n    state.outfitUnlocked = true;\n    state.cardUnlocked = true;\n    if(!save.specialDucks.includes(DATA.duckId)) save.specialDucks.push(DATA.duckId);\n    if(!save.unlockedLoveCards.includes(DATA.cardId)) save.unlockedLoveCards.push(DATA.cardId);\n    DATA.outfitPieces.forEach(piece=>{ if(!save.unlockedOutfitPieces.miko.includes(piece)) save.unlockedOutfitPieces.miko.push(piece); });\n    save.loveInterestNotifications.push({ id: DATA.id, at: Date.now() });\n    if(window.DuckieTradingCards && typeof window.DuckieTradingCards.grantCard === \"function\"){\n      window.DuckieTradingCards.grantCard(save, DATA.cardId, 1);\n    }\n    writeSave(save);\n    window.dispatchEvent(new CustomEvent(\"duckie-love-interest-unlocked\", {detail:{id:DATA.id}}));\n    showToast(\"Lukio unlocked! Duck, outfit, sprites, and Trading Card added. \u2661\");\n  }\n  function buildEncounter(){\n    if(document.querySelector(\".lukio-encounter-layer\")) return document.querySelector(\".lukio-encounter-layer\");\n    const layer = document.createElement(\"div\");\n    layer.className = \"lukio-encounter-layer hidden\";\n    layer.innerHTML = `\n      <section class=\"lukio-encounter-card\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Lukio Encounter\">\n        <p class=\"lukio-kicker\">LOVE INTEREST ENCOUNTER</p>\n        <h2 class=\"lukio-title\">Lukio</h2>\n        <div class=\"lukio-stage\">\n          <div class=\"lukio-char lukio-char-miko\">\n            <img class=\"lukio-miko\" src=\"${DATA.images.miko}\" alt=\"Miko wearing the Lukio-inspired outfit\">\n          </div>\n          <div class=\"lukio-heart-wrap hidden\" aria-hidden=\"true\">\n            <img class=\"lukio-heart\" src=\"${DATA.images.heart}\" alt=\"\">\n          </div>\n          <div class=\"lukio-char lukio-char-lukio\">\n            <img class=\"lukio-lukio\" src=\"${DATA.images.lukioIdle}\" alt=\"Lukio\">\n          </div>\n        </div>\n        <div class=\"lukio-dialogue\">\n          <strong class=\"lukio-speaker\">Miko</strong>\n          <p class=\"lukio-line\"></p>\n        </div>\n        <div class=\"lukio-actions\">\n          <button type=\"button\" class=\"lukio-next\">Next</button>\n        </div>\n      </section>`;\n    document.body.append(layer);\n    return layer;\n  }\n  function openEncounter(){\n    if(encounterOpen) return;\n    encounterOpen = true;\n    sessionTriggered = true;\n    const layer = buildEncounter();\n    const speaker = layer.querySelector('.lukio-speaker');\n    const line = layer.querySelector('.lukio-line');\n    const next = layer.querySelector('.lukio-next');\n    const lukio = layer.querySelector('.lukio-lukio');\n    const heartWrap = layer.querySelector('.lukio-heart-wrap');\n    let step = 0;\n    const render = ()=>{\n      const item = DATA.dialogue[step];\n      speaker.textContent = item.speaker;\n      line.textContent = item.text;\n      if(item.pose === 'wink') lukio.src = DATA.images.lukioWink;\n      else if(item.pose === 'alt') lukio.src = DATA.images.lukioAlt;\n      else lukio.src = DATA.images.lukioIdle;\n      next.textContent = step >= DATA.dialogue.length - 1 ? 'Finish' : 'Next';\n    };\n    const finish = ()=>{\n      heartWrap.classList.remove('hidden');\n      next.disabled = true;\n      unlockRewards();\n      setTimeout(()=>{\n        layer.classList.add('hidden');\n        heartWrap.classList.add('hidden');\n        next.disabled = false;\n        next.textContent = 'Next';\n        encounterOpen = false;\n      }, 1500);\n    };\n    next.onclick = ()=>{\n      if(step >= DATA.dialogue.length - 1){ finish(); return; }\n      step += 1;\n      render();\n    };\n    render();\n    layer.classList.remove('hidden');\n  }\n  function maybeTriggerEncounter(){\n    if(encounterOpen || sessionTriggered || !/\\/duck-quest\\//.test(location.pathname)) return;\n    const now = Date.now();\n    if(now - lastAttemptAt < DATA.cooldownMs) return;\n    lastAttemptAt = now;\n    const save = readSave();\n    const state = ensureState(save);\n    if(state.encountered) return;\n    if(!activeCharacterIsMiko(save)) return;\n    if(Math.random() <= DATA.encounterChance) openEncounter();\n  }\n  function injectRewardButton(){\n    if(/\\/duck-quest\\//.test(location.pathname)) return;\n    const save = readSave();\n    const state = ensureState(save);\n    if(!state.encountered || document.querySelector('.lukio-reward-button')) return;\n    const button = document.createElement('button');\n    button.type = 'button';\n    button.className = 'lukio-reward-button';\n    button.textContent = '\u2661 Lukio Rewards';\n    button.addEventListener('click', ()=>{\n      const existing = document.querySelector('.lukio-reward-modal');\n      if(existing){ existing.classList.remove('hidden'); return; }\n      const modal = document.createElement('div');\n      modal.className = 'lukio-reward-modal';\n      modal.innerHTML = `\n        <section class=\"lukio-reward-card\">\n          <button type=\"button\" class=\"lukio-reward-close\" aria-label=\"Close\">\u00d7</button>\n          <h2>Lukio Unlocked \u2661</h2>\n          <div class=\"lukio-reward-preview\"><img src=\"${DATA.images.hoodie}\" alt=\"Lukio hoodie preview\"><img src=\"${DATA.images.duck}\" alt=\"Lukio duck\"></div>\n          <ul>\n            <li>Lukio Duck unlocked</li>\n            <li>Miko Lukio outfit pieces saved</li>\n            <li>Lukio sprites unlocked for Duck Quest</li>\n            <li>Lukio Trading Card unlocked</li>\n          </ul>\n        </section>`;\n      modal.querySelector('.lukio-reward-close').onclick = ()=> modal.classList.add('hidden');\n      modal.addEventListener('click', e=>{ if(e.target === modal) modal.classList.add('hidden'); });\n      document.body.append(modal);\n    });\n    document.body.append(button);\n  }\n  function wrapFunction(name){\n    if(typeof window[name] !== 'function' || window[name].__lukioWrapped) return;\n    const original = window[name];\n    const wrapped = function(){\n      const result = original.apply(this, arguments);\n      setTimeout(maybeTriggerEncounter, 400);\n      return result;\n    };\n    wrapped.__lukioWrapped = true;\n    window[name] = wrapped;\n  }\n  function install(){\n    try{\n      const save = readSave();\n      ensureState(save);\n      writeSave(save);\n    }catch(_){ }\n    ['finishBattle','endBattle','completeBattle','closeBattle','continueAfterBattle','returnToMap','showMap','resumeQuest','startBattle'].forEach(wrapFunction);\n    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) maybeTriggerEncounter(); });\n    window.addEventListener('focus', maybeTriggerEncounter);\n    setTimeout(maybeTriggerEncounter, 5000);\n    setInterval(maybeTriggerEncounter, DATA.cooldownMs);\n    injectRewardButton();\n    window.triggerLukioEncounter = openEncounter;\n  }\n  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, {once:true});\n  else install();\n})();\n")
          write('love-interest-lukio-v240.css', ".lukio-encounter-layer,.lukio-reward-modal{position:fixed;inset:0;z-index:12000;display:grid;place-items:center;padding:18px;background:rgba(29,18,33,.68);backdrop-filter:blur(4px)}\n.lukio-encounter-layer.hidden,.lukio-reward-modal.hidden{display:none!important}\n.lukio-encounter-card,.lukio-reward-card{width:min(94vw,780px);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#fff8fc,#f3ecff);border:3px solid #d99ab5;border-radius:24px;box-shadow:0 22px 60px rgba(0,0,0,.28);padding:18px 18px 20px;color:#573f4c}\n.lukio-kicker{margin:0 0 3px;font-size:.74rem;font-weight:900;letter-spacing:.08em;color:#af6286;text-align:center}.lukio-title{margin:0 0 10px;text-align:center}.lukio-stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;min-height:260px}.lukio-char{display:flex;justify-content:center;align-items:flex-end}.lukio-char img{image-rendering:pixelated;object-fit:contain}.lukio-miko{max-height:260px;width:auto;max-width:100%}.lukio-lukio{width:min(36vw,170px);height:auto}.lukio-heart-wrap{display:flex;justify-content:center;align-items:center}.lukio-heart-wrap.hidden{visibility:hidden}.lukio-heart{width:46px;height:46px;image-rendering:pixelated;animation:lukioHeartBob .65s steps(2,end) infinite}\n@keyframes lukioHeartBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}\n.lukio-dialogue{margin-top:8px;padding:14px 15px;border:2px solid #ebc0d1;border-radius:16px;background:#fff}.lukio-speaker{display:block;margin-bottom:6px;color:#a1567b}.lukio-line{margin:0;line-height:1.45}.lukio-actions{display:flex;justify-content:center;margin-top:12px}.lukio-next,.lukio-reward-button{border:2px solid #d96c99;border-radius:999px;background:linear-gradient(#ffb8d1,#ef83ad);color:#fff;font:inherit;font-weight:900;padding:10px 22px;box-shadow:0 3px 0 #b75b84}.lukio-next:disabled{opacity:.7}.lukio-reward-button{position:fixed;right:14px;bottom:14px;z-index:1000;padding:9px 16px;font-size:.82rem}.lukio-reward-card{width:min(92vw,520px)}.lukio-reward-card h2{text-align:center;margin-top:6px}.lukio-reward-card ul{margin:8px 0 0 18px;padding:0;line-height:1.5}.lukio-reward-preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.lukio-reward-preview img{width:100%;max-height:260px;object-fit:contain;image-rendering:pixelated;background:#fff;border:2px solid #ebc0d1;border-radius:16px;padding:6px}.lukio-reward-close{position:absolute;right:10px;top:10px;border:2px solid #d99ab5;border-radius:50%;width:36px;height:36px;background:#fff;font-size:22px}.lukio-reward-card{position:relative}\n@media(max-width:680px){.lukio-stage{grid-template-columns:1fr;gap:4px;justify-items:center}.lukio-heart-wrap{order:3}.lukio-char-miko{order:1}.lukio-char-lukio{order:2}.lukio-miko{max-height:220px}.lukio-lukio{width:120px}.lukio-heart{width:38px;height:38px}}\n")

          def patch_page(rel):
              text = bump_versions(read(rel))
              text = text.replace('trading-cards-v239.js', 'trading-cards-v240.js')
              if rel == 'index.html':
                  if 'love-interest-lukio-v240.css' not in text:
                      if '</head>' in text:
                          text = text.replace('</head>', '  <link rel="stylesheet" href="love-interest-lukio-v240.css?v=24-240">\n</head>', 1)
                      else:
                          text = '  <link rel="stylesheet" href="love-interest-lukio-v240.css?v=24-240">\n' + text
                  if 'love-interest-lukio-v240.js?v=24-240' not in text:
                      if '</body>' in text:
                          text = text.replace('</body>', '  <script src="love-interest-lukio-v240.js?v=24-240"></script>\n</body>', 1)
                      else:
                          text += '\n<script src="love-interest-lukio-v240.js?v=24-240"></script>\n'
              elif rel == 'duck-quest/index.html':
                  if '../love-interest-lukio-v240.css?v=24-240' not in text:
                      if '</head>' in text:
                          text = text.replace('</head>', '  <link rel="stylesheet" href="../love-interest-lukio-v240.css?v=24-240">\n</head>', 1)
                      else:
                          text = '  <link rel="stylesheet" href="../love-interest-lukio-v240.css?v=24-240">\n' + text
                  if '../love-interest-lukio-v240.js?v=24-240' not in text:
                      if '</body>' in text:
                          text = text.replace('</body>', '  <script src="../love-interest-lukio-v240.js?v=24-240"></script>\n</body>', 1)
                      else:
                          text += '\n<script src="../love-interest-lukio-v240.js?v=24-240"></script>\n'
              write(rel, text)

          for rel in ['index.html','memory-game/index.html','crane-game/play-v24-40.html','duck-quest/index.html']:
              patch_page(rel)
          write('crane-game/index.html', bump_versions(read('crane-game/index.html')))
          write('script-v24-201.js', bump_versions(read('script-v24-201.js')))

          sw = bump_versions(read('sw-v24-239.js'))
          sw = sw.replace('trading-cards-v239.js', 'trading-cards-v240.js')
          if 'love-interest-lukio-v240.js?v=24-240' not in sw:
              sw = sw.replace("'./trading-cards-ui-v239.js?v=24-239'", "'./trading-cards-ui-v239.js?v=24-240','./love-interest-lukio-v240.js?v=24-240','./love-interest-lukio-v240.css?v=24-240'")
          if 'duck-quest/assets/love-interests/lukio/Lukio-duck.png' not in sw and './duck-quest/assets/trading-cards/fabled/F-mimic.png' in sw:
              sw = sw.replace("'./duck-quest/assets/trading-cards/fabled/F-mimic.png',", "'./duck-quest/assets/trading-cards/fabled/F-mimic.png',\n  './duck-quest/assets/love-interests/lukio/Lukio-duck.png',\n  './duck-quest/assets/love-interests/lukio/Lukio-idle-1.png',\n  './duck-quest/assets/love-interests/lukio/Lukio-idle-2.png',\n  './duck-quest/assets/love-interests/lukio/Lukio-wink.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-Booties.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-Hair-Streak.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-Shorts.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-Socks.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-hoodie-shop.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-hoodie.png',\n  './duck-quest/assets/love-interests/lukio/Miko-Lukio-reference.png',\n  './duck-quest/assets/love-interests/lukio/Miko-lukio-sleeve.png',\n  './duck-quest/assets/love-interests/lukio/Pixel-heart.png',", 1)
          write('sw-v24-240.js', sw)
          write('sw.js', "importScripts('./sw-v24-240.js?v=24-240');\n")
          write('version.json', json.dumps({'version':'24.240'}, indent=2) + '\n')
          write('UPDATE-v24.240.txt', 'Duckie Days v24.240\n\n- Adds Lukio as a Duck Quest love-interest encounter for Miko.\n- Unlocks Lukio\'s duck, sprites, outfit data, and Rare Trading Card reward.\n- Adds a bouncing pixel heart finale for the encounter.\n- Adds Lukio reward assets and a small reward viewer button after unlocking.\n')
          print('Duckie Days v24.240 Lukio update installed successfully.')
          PY

      - name: Verify v24.240
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.240"' version.json
          test -f trading-cards-v240.js
          test -f love-interest-lukio-v240.js
          test -f love-interest-lukio-v240.css
          test -f sw-v24-240.js
          grep -Fq 'r-love-lukio' trading-cards-v240.js
          grep -Fq 'Meet Lukio while exploring Duck Quest as Miko' trading-cards-v240.js
          grep -Fq 'window.triggerLukioEncounter = openEncounter;' love-interest-lukio-v240.js

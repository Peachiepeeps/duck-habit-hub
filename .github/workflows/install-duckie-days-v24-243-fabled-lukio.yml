name: Install Duckie Days v24.243 Fabled + Lukio

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.243-fabled-lukio-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-243-fabled-lukio.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.243 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.243-fabled-lukio-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            echo "Upload the ZIP and this workflow together."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.243
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.243-fabled-lukio-update-only.zip"
          TMP=".duckie-days-v24-243-install"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v243.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.243
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.243"' version.json

          test -f trading-cards-v243.js
          test -f trading-cards-ui-v243.js
          test -f trading-cards-v243.css
          test -f sw-v24-243.js

          grep -Fq 'id:"r-love-lukio"' trading-cards-v243.js
          grep -Fq 'art:"love-interests/lukio/Lukio-idle-1.png"' trading-cards-v243.js
          grep -Fq 'rarity:"rare"' trading-cards-v243.js
          grep -Fq 'const fabled=[' trading-cards-v243.js
          grep -Fq 'F-slime-kitty.png' trading-cards-v243.js
          grep -Fq 'F-mimic.png' trading-cards-v243.js

          ! grep -Fq 'Ultra Rare' trading-cards-ui-v243.js
          grep -Fq 'fabled:750' trading-cards-ui-v243.js
          grep -Fq 'max-height:min(66vh,680px)' trading-cards-v243.css

          grep -Fq '"lukio-hoodie"' script-v24-201.js
          grep -Fq '"lukio-sleeve"' script-v24-201.js
          grep -Fq '"lukio-shorts"' script-v24-201.js
          grep -Fq '"lukio-socks"' script-v24-201.js
          grep -Fq '"lukio-booties"' script-v24-201.js
          grep -Fq '"lukio-hair-streak"' script-v24-201.js

          grep -Fq 'js/love-interest-lukio-v243.js?v=24-243' duck-quest/index.html
          grep -Fq 'css/love-interest-lukio-v243.css?v=24-243' duck-quest/index.html
          grep -Fq 'Lukio! There you are!' duck-quest/js/love-interest-lukio-v243.js
          grep -Fq 'lukio-heart-bob' duck-quest/css/love-interest-lukio-v243.css

          test -f duck-quest/assets/love-interests/lukio/Lukio-duck.png
          test -f duck-quest/assets/love-interests/lukio/Lukio-idle-1.png
          test -f duck-quest/assets/love-interests/lukio/Lukio-idle-2.png
          test -f duck-quest/assets/love-interests/lukio/Lukio-wink.png
          test -f duck-quest/assets/love-interests/lukio/Pixel-heart.png

          test -f duck-quest/assets/trading-cards/fabled/F-acorn-mouse.png
          test -f duck-quest/assets/trading-cards/fabled/F-flower.png
          test -f duck-quest/assets/trading-cards/fabled/F-bee.png
          test -f duck-quest/assets/trading-cards/fabled/F-slime-kitty.png
          test -f duck-quest/assets/trading-cards/fabled/F-mimic.png

          test -f assets/miko/Miko-Lukio-hoodie.png
          test -f assets/miko/Miko-Lukio-Hair-Streak.png
          test -f assets/miko/Miko-Lukio-Shorts.png
          test -f assets/miko/Miko-Lukio-Socks.png
          test -f assets/miko/Miko-Lukio-Booties.png

          grep -Fq "importScripts('./sw-v24-243.js?v=24-243');" sw.js

          node --check trading-cards-v243.js
          node --check trading-cards-ui-v243.js
          node --check script-v24-201.js
          node --check duck-quest/js/love-interest-lukio-v243.js
          node --check sw-v24-243.js

          echo "VERIFIED: v24.243 Fabled cards + Lukio update installed successfully."

      - name: Clean failed installer clutter
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-243-fabled-lukio.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.243.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-243.js' -delete

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v243.js
          test -f trading-cards-ui-v243.js
          test -f trading-cards-v243.css
          test -f sw-v24-243.js
          test -f UPDATE-v24.243.txt

          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"

          echo "VERIFIED: v24.243 is clean and only the current Duckie Days installer remains."

      - name: Commit v24.243
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }

          git commit -m "Install Duckie Days v24.243 Fabled cards and Lukio"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.243 installed, verified, cleaned, committed, and pushed."

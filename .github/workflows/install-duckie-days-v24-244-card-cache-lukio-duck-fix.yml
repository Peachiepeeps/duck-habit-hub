name: Install Duckie Days v24.244 Card Cache + Lukio Duck Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.244-card-cache-lukio-duck-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-244-card-cache-lukio-duck-fix.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.244 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.244-card-cache-lukio-duck-fix-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            echo "Upload the ZIP and this workflow in the same commit."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.244
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.244-card-cache-lukio-duck-fix-update-only.zip"
          TMP=".duckie-days-v24-244-install"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v244.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.244
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.244"' version.json

          test -f trading-cards-v244.js
          test -f trading-cards-ui-v244.js
          test -f trading-cards-v244.css
          test -f sw-v24-244.js

          grep -Fq 'id:"r-love-lukio"' trading-cards-v244.js
          grep -Fq 'art:"love-interests/lukio/Lukio-idle-1.png"' trading-cards-v244.js
          grep -Fq 'rarity:"rare"' trading-cards-v244.js
          grep -Fq 'const fabled=[' trading-cards-v244.js
          grep -Fq 'F-slime-kitty.png' trading-cards-v244.js
          grep -Fq 'F-mimic.png' trading-cards-v244.js

          ! grep -Fq 'Ultra Rare' trading-cards-ui-v244.js
          grep -Fq 'fabled:750' trading-cards-ui-v244.js

          grep -Fq '.tc-panel:not(.hidden){display:flex!important' trading-cards-v244.css
          grep -Fq 'max-height:none!important' trading-cards-v244.css

          grep -Fq '"lukio-duck": {' script-v24-201.js
          grep -Fq '"name": "Lukio Duck"' script-v24-201.js
          grep -Fq '"acquisition": "love-interest-lukio"' script-v24-201.js
          grep -Fq 'case "love-interest-lukio":' script-v24-201.js
          grep -Fq '"lukio-hoodie"' script-v24-201.js
          grep -Fq '"lukio-shorts"' script-v24-201.js
          grep -Fq '"lukio-socks"' script-v24-201.js
          grep -Fq '"lukio-booties"' script-v24-201.js

          grep -Fq 'js/love-interest-lukio-v244.js?v=24-244' duck-quest/index.html
          grep -Fq 'css/love-interest-lukio-v244.css?v=24-244' duck-quest/index.html
          grep -Fq 'Lukio! There you are!' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'data.tradingCards.owned[DATA.cardId]=before+1' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'chance:.05' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'function activeCharacterId(){return String(load().selectedCharacter||"").trim().toLowerCase();}' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'function isMiko(){return activeCharacterId()==="miko";}' duck-quest/js/love-interest-lukio-v244.js

          grep -Fq 'trading-cards-v244.js?v=24-244' index.html
          grep -Fq 'trading-cards-ui-v244.js?v=24-244' index.html
          grep -Fq 'trading-cards-v244.css?v=24-244' index.html

          test -f duck-quest/assets/love-interests/lukio/Lukio-duck.png
          test -f duck-quest/assets/love-interests/lukio/Lukio-idle-1.png
          test -f duck-quest/assets/love-interests/lukio/Lukio-idle-2.png
          test -f duck-quest/assets/love-interests/lukio/Lukio-wink.png
          test -f duck-quest/assets/love-interests/lukio/Pixel-heart.png

          test -f duck-quest/assets/trading-cards/fabled/F-acorn-mouse.png
          test -f duck-quest/assets/trading-cards/fabled/F-flower.png
          test -f duck-quest/assets/trading-cards/fabled/F-bee.png
          test -f duck-quest/assets/trading-cards/fabled/F-slime-kitty.png
          test -f duck-quest/assets/trading-cards/fabled/F-mimic.png

          grep -Fq "importScripts('./sw-v24-244.js?v=24-244');" sw.js
          grep -Fq './trading-cards-v244.js?v=24-244' sw-v24-244.js
          grep -Fq './duck-quest/js/love-interest-lukio-v244.js?v=24-244' sw-v24-244.js
          grep -Fq './duck-quest/assets/love-interests/lukio/Lukio-duck.png' sw-v24-244.js

          node --check trading-cards-v244.js
          node --check trading-cards-ui-v244.js
          node --check script-v24-201.js
          node --check duck-quest/js/love-interest-lukio-v244.js
          node --check sw-v24-244.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v244.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==71) throw new Error(`Expected 71 Trading Cards, found ${TC.cards.length}`);
          if(TC.byRarity('fabled').length!==5) throw new Error('Expected exactly 5 Fabled cards');
          if(!TC.byId['r-love-lukio']) throw new Error('Lukio Rare card is missing');
          console.log('VERIFIED: 71 total cards = original 65 + 5 Fabled + Lukio.');
          NODE

          echo "VERIFIED: v24.244 card cache, scroll area, Lukio card, and Lukio Duck registration are valid."

      - name: Clean old update clutter
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-244-card-cache-lukio-duck-fix.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.244.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-244.js' -delete

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          test -f trading-cards-v244.js
          test -f trading-cards-ui-v244.js
          test -f trading-cards-v244.css
          test -f sw-v24-244.js
          test -f UPDATE-v24.244.txt

          COUNT=$(find .github/workflows -maxdepth 1 -type f -name 'install-duckie-days-v*.yml' | wc -l | tr -d ' ')
          test "$COUNT" = "1"

          echo "VERIFIED: v24.244 is clean."

      - name: Commit v24.244
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }

          git commit -m "Install Duckie Days v24.244 card cache and Lukio Duck fix"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.244 installed, verified, cleaned, committed, and pushed."

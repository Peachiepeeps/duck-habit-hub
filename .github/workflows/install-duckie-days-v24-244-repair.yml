name: Install Duckie Days v24.244 Repair

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-244-repair.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require existing v24.244 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.244-card-cache-lukio-duck-fix-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install repaired v24.244
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duckie-Days-v24.244-card-cache-lukio-duck-fix-update-only.zip"
          TMP=".duckie-days-v24-244-repair"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          # The previous installer only recognized old service-worker array names.
          # The live v24.243 worker uses APP_SHELL, which caused:
          # "Could not locate service-worker precache array."
          python3 - <<'PY'
          from pathlib import Path

          patch = Path(".duckie-days-v24-244-repair/tools/patch-v244.py")
          text = patch.read_text(encoding="utf-8")

          old = r'(const\s+(?:PRECACHE_URLS|ASSETS|APP_ASSETS)\s*=\s*\[)(.*?)(\];)'
          new = r'(const\s+(?:PRECACHE_URLS|ASSETS|APP_ASSETS|APP_SHELL)\s*=\s*\[)(.*?)(\];)'

          if old not in text:
              raise RuntimeError("Could not find the old service-worker array matcher in patch-v244.py.")

          text = text.replace(old, new, 1)
          patch.write_text(text, encoding="utf-8")
          print("Patched v24.244 installer to support APP_SHELL.")
          PY

          python3 "$TMP/tools/patch-v244.py" "$TMP"

          # Replace the early timed prototype with the final 5%-per-transition
          # love-interest hook. This uses Duck Quest's own active hero field.
          cat > duck-quest/js/love-interest-lukio-v244.js <<'JS'
          (function(){
            "use strict";

            const SAVE_KEY="duckHabitHubSave_v1";
            const DATA={
              id:"lukio",
              cardId:"r-love-lukio",
              duckId:"lukio-duck",
              chance:.05,
              dialogue:[
                {speaker:"Miko",text:"Lukio! There you are!",pose:"idle"},
                {speaker:"Lukio",text:"Hey babe! What are you doing here?",pose:"idle"},
                {speaker:"Miko",text:"Just finding cute buddies and exploring. Have you seen the others?",pose:"idle"},
                {speaker:"Lukio",text:"Hmm, I’ve seen some here or there. I bet most are home. Wanna head back with me?",pose:"idle"},
                {speaker:"Miko",text:"Yeah! Let’s hold hands!",pose:"idle"},
                {speaker:"Lukio",text:"(Winks) Alright. Then here, I found these.",pose:"wink"},
                {speaker:"Miko",text:"(smug) A gift? For me? You’re too sweet!",pose:"idle"}
              ],
              miko:"assets/characters/miko/base/idle-1.webp",
              mikoSmug:"assets/characters/miko/base/smug.webp",
              idle1:"assets/love-interests/lukio/Lukio-idle-1.png",
              idle2:"assets/love-interests/lukio/Lukio-idle-2.png",
              wink:"assets/love-interests/lukio/Lukio-wink.png",
              heart:"assets/love-interests/lukio/Pixel-heart.png"
            };

            let open=false;
            let bypassNextRoll=false;

            function load(){
              try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");}
              catch(_){return {};}
            }

            function save(data){
              localStorage.setItem(SAVE_KEY,JSON.stringify(data));
            }

            function ensure(data){
              data.loveInterests=data.loveInterests&&typeof data.loveInterests==="object"?data.loveInterests:{};
              data.loveInterests.lukio=data.loveInterests.lukio&&typeof data.loveInterests.lukio==="object"?data.loveInterests.lukio:{};
              data.characterUnlockedItems=data.characterUnlockedItems&&typeof data.characterUnlockedItems==="object"?data.characterUnlockedItems:{};
              if(!Array.isArray(data.characterUnlockedItems.miko))data.characterUnlockedItems.miko=[];
              if(!Array.isArray(data.unlockedDucks))data.unlockedDucks=[];
              data.duckCollectionCounts=data.duckCollectionCounts&&typeof data.duckCollectionCounts==="object"?data.duckCollectionCounts:{};
              return data.loveInterests.lukio;
            }

            function activeCharacterId(){
              const data=load();
              return String(data?.duckQuest?.activeCharacter||data?.selectedCharacter||"").trim().toLowerCase();
            }

            function isMiko(){
              return activeCharacterId()==="miko";
            }

            function unlock(){
              const data=load(),state=ensure(data);
              Object.assign(state,{
                encountered:true,
                spritesUnlocked:true,
                duckUnlocked:true,
                outfitUnlocked:true,
                cardUnlocked:true,
                unlockedAt:Date.now()
              });

              const pieces=["lukio-hair-streak","lukio-hoodie","lukio-shorts","lukio-socks","lukio-booties"];
              for(const id of pieces){
                if(!data.characterUnlockedItems.miko.includes(id))data.characterUnlockedItems.miko.push(id);
              }

              if(!data.unlockedDucks.includes(DATA.duckId))data.unlockedDucks.push(DATA.duckId);
              data.duckCollectionCounts[DATA.duckId]=Math.max(1,Number(data.duckCollectionCounts[DATA.duckId]||0));

              if(window.DuckieTradingCards?.grantCard){
                window.DuckieTradingCards.grantCard(data,DATA.cardId,1);
              }else{
                data.tradingCards=data.tradingCards&&typeof data.tradingCards==="object"?data.tradingCards:{};
                data.tradingCards.owned=data.tradingCards.owned&&typeof data.tradingCards.owned==="object"?data.tradingCards.owned:{};
                data.tradingCards.unseen=Array.isArray(data.tradingCards.unseen)?data.tradingCards.unseen:[];
                const before=Math.max(0,Number(data.tradingCards.owned[DATA.cardId]||0));
                data.tradingCards.owned[DATA.cardId]=before+1;
                if(before===0&&!data.tradingCards.unseen.includes(DATA.cardId)){
                  data.tradingCards.unseen.push(DATA.cardId);
                }
              }

              save(data);
              window.dispatchEvent(new CustomEvent("duckie-love-interest-unlocked",{detail:{id:DATA.id}}));
            }

            function layer(){
              let el=document.querySelector(".lukio-love-layer");
              if(el)return el;

              el=document.createElement("div");
              el.className="lukio-love-layer hidden";
              el.innerHTML=`<section class="lukio-love-card" role="dialog" aria-modal="true" aria-label="Lukio encounter">
                <p class="lukio-love-kicker">LOVE INTEREST ENCOUNTER</p>
                <h2>Lukio</h2>
                <div class="lukio-love-stage">
                  <img class="lukio-miko" src="${DATA.miko}" alt="Miko">
                  <span class="lukio-heart-wrap hidden"><img src="${DATA.heart}" alt=""></span>
                  <img class="lukio-sprite" src="${DATA.idle1}" alt="Lukio">
                </div>
                <div class="lukio-love-dialogue">
                  <strong class="lukio-speaker"></strong>
                  <p class="lukio-line"></p>
                </div>
                <button type="button" class="lukio-next">Next</button>
              </section>`;
              document.body.append(el);
              return el;
            }

            function show(onFinished=null){
              if(open)return false;
              open=true;

              const el=layer();
              const speaker=el.querySelector(".lukio-speaker");
              const line=el.querySelector(".lukio-line");
              const next=el.querySelector(".lukio-next");
              const sprite=el.querySelector(".lukio-sprite");
              const miko=el.querySelector(".lukio-miko");
              const heart=el.querySelector(".lukio-heart-wrap");
              let i=0;

              const render=()=>{
                const d=DATA.dialogue[i];
                speaker.textContent=d.speaker;
                line.textContent=d.text;
                sprite.src=d.pose==="wink"?DATA.wink:(i%2?DATA.idle2:DATA.idle1);
                miko.src=i===DATA.dialogue.length-1?DATA.mikoSmug:DATA.miko;
                next.textContent=i===DATA.dialogue.length-1?"Finish":"Next";
              };

              next.onclick=()=>{
                if(i<DATA.dialogue.length-1){
                  i++;
                  render();
                  return;
                }

                next.disabled=true;
                heart.classList.remove("hidden");
                unlock();

                setTimeout(()=>{
                  el.classList.add("hidden");
                  heart.classList.add("hidden");
                  next.disabled=false;
                  open=false;

                  if(typeof onFinished==="function"){
                    bypassNextRoll=true;
                    onFinished();
                  }
                },1600);
              };

              render();
              el.classList.remove("hidden");
              return true;
            }

            function maybeBeforeNextEncounter(continueFn){
              if(bypassNextRoll){
                bypassNextRoll=false;
                return false;
              }

              if(open||!isMiko())return false;

              const data=load(),state=ensure(data);
              if(state.encountered)return false;

              // ONE shared 5% love-interest roll per completed Duck Quest encounter.
              // As more of Miko's lovers are added, this remains 5% total; a
              // character is chosen only after this shared roll succeeds.
              if(Math.random()>=DATA.chance)return false;

              return show(continueFn);
            }

            window.DuckieLoveInterests=window.DuckieLoveInterests||{};
            window.DuckieLoveInterests.maybeBeforeNextEncounter=maybeBeforeNextEncounter;
            window.DuckieLoveInterests.activeCharacterId=activeCharacterId;
            window.DuckieLoveInterests.chance=DATA.chance;
            window.triggerLukioEncounter=()=>show();
          })();
          JS

          # Hook the shared 5% roll into Duck Quest's actual transition between
          # encounters. This means it does NOT reroll every 45 seconds while idle.
          python3 - <<'PY'
          from pathlib import Path

          game_path=Path("duck-quest/js/game-v96.js")
          game=game_path.read_text(encoding="utf-8")

          hook='  if(window.DuckieLoveInterests?.maybeBeforeNextEncounter?.(()=>nextEncounter())) return;\n'
          anchor='function nextEncounter() {\n'

          if hook not in game:
              count=game.count(anchor)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one nextEncounter function, found {count}.")
              game=game.replace(anchor,anchor+hook,1)

          game_path.write_text(game,encoding="utf-8")
          PY

          # Update the note generated by the original package.
          cat >> UPDATE-v24.244.txt <<'TXT'
          - Repair: supports the live APP_SHELL service-worker cache list.
          - Love-interest encounter chance is one shared 5% roll per completed encounter.
          - Love-interest encounters are strictly Miko-only using duckQuest.activeCharacter.
          TXT

          rm -rf "$TMP"

      - name: Verify repaired v24.244
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.244"' version.json

          test -f trading-cards-v244.js
          test -f trading-cards-ui-v244.js
          test -f trading-cards-v244.css
          test -f sw-v24-244.js
          test -f duck-quest/js/love-interest-lukio-v244.js

          # Trading Card database
          grep -Fq 'id:"r-love-lukio"' trading-cards-v244.js
          grep -Fq 'art:"love-interests/lukio/Lukio-idle-1.png"' trading-cards-v244.js
          grep -Fq 'number:"R-031"' trading-cards-v244.js
          grep -Fq 'const fabled=[' trading-cards-v244.js

          # Duckipedia registration
          grep -Fq '"lukio-duck": {' script-v24-201.js
          grep -Fq '"name": "Lukio Duck"' script-v24-201.js
          grep -Fq '"acquisition": "love-interest-lukio"' script-v24-201.js
          grep -Fq '"lukio-duck"' script-v24-201.js

          # 5% shared Miko-only encounter check
          grep -Fq 'chance:.05' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'data?.duckQuest?.activeCharacter||data?.selectedCharacter' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'function isMiko()' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'Math.random()>=DATA.chance' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'window.DuckieLoveInterests.maybeBeforeNextEncounter=maybeBeforeNextEncounter' duck-quest/js/love-interest-lukio-v244.js
          grep -Fq 'if(window.DuckieLoveInterests?.maybeBeforeNextEncounter?.(()=>nextEncounter())) return;' duck-quest/js/game-v96.js

          # Make sure the old timer-based repeated chance is gone.
          ! grep -Fq 'setInterval(maybe' duck-quest/js/love-interest-lukio-v244.js
          ! grep -Fq 'cooldown:45000' duck-quest/js/love-interest-lukio-v244.js

          # UI/cache fixes
          grep -Fq '.tc-panel:not(.hidden){display:flex!important' trading-cards-v244.css
          grep -Fq 'max-height:none!important' trading-cards-v244.css
          grep -Fq "const APP_SHELL = [" sw-v24-244.js
          grep -Fq './duck-quest/js/love-interest-lukio-v244.js?v=24-244' sw-v24-244.js
          grep -Fq './duck-quest/assets/love-interests/lukio/Lukio-duck.png' sw-v24-244.js
          grep -Fq "importScripts('./sw-v24-244.js?v=24-244');" sw.js

          node --check trading-cards-v244.js
          node --check trading-cards-ui-v244.js
          node --check script-v24-201.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/love-interest-lukio-v244.js
          node --check sw-v24-244.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v244.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==71) throw new Error(`Expected 71 Trading Cards, found ${TC.cards.length}`);
          if(TC.byRarity('fabled').length!==5) throw new Error('Expected exactly 5 Fabled cards');
          if(!TC.byId['r-love-lukio']) throw new Error('Lukio Rare card is missing');
          console.log('VERIFIED: 71 total Trading Cards and Lukio Rare card are present.');
          NODE

          echo "VERIFIED: repaired v24.244 is valid."

      - name: Clean old failed installers
        shell: bash
        run: |
          set -euo pipefail

          SELF="install-duckie-days-v24-244-repair.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -iname '*update-only*.zip' -delete
          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.244.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-244.js' -delete

      - name: Commit repaired v24.244
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No repaired files were staged."
            exit 1
          }

          git commit -m "Repair Duckie Days v24.244 Lukio install"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: repaired v24.244 installed and pushed."

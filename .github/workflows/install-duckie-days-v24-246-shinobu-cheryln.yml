name: Install Duckie Days v24.246 Shinobu + Cheryln

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-246-shinobu-cheryln.yml"

permissions:
  contents: write

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.246 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.246-shinobu-cheryln-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.246
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.246-shinobu-cheryln-update-only.zip"
          TMP=".duckie-days-v24-246"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 "$TMP/tools/patch-v246.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.246
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.246"' version.json

          test -f trading-cards-v246.js
          test -f trading-cards-ui-v246.js
          test -f trading-cards-v246.css
          test -f sw-v24-246.js
          test -f duck-quest/js/love-interests-v246.js
          test -f duck-quest/css/love-interests-v246.css

          # New cards
          grep -Fq 'id:"r-love-shinobu"' trading-cards-v246.js
          grep -Fq 'art:"love-interests/shinobu/Shinobu-idle-1.png"' trading-cards-v246.js
          grep -Fq 'number:"R-032"' trading-cards-v246.js
          grep -Fq 'id:"r-love-cheryln"' trading-cards-v246.js
          grep -Fq 'art:"love-interests/cheryln/Cheryln-idle-1.png"' trading-cards-v246.js
          grep -Fq 'number:"R-033"' trading-cards-v246.js

          # Duckipedia ducks
          grep -Fq '"shinobu-duck": {' script-v24-201.js
          grep -Fq '"cheryln-duck": {' script-v24-201.js
          grep -Fq '"file": "duck-quest/assets/love-interests/shinobu/Shinobu-duck.png"' script-v24-201.js
          grep -Fq '"file": "duck-quest/assets/love-interests/cheryln/Cheryln-duck.png"' script-v24-201.js

          # Miko outfit pieces
          grep -Fq '"shino-sweater"' script-v24-201.js
          grep -Fq '"cheryln-sweater"' script-v24-201.js
          grep -Fq '"cheryln-tights"' script-v24-201.js

          # Encounter runtime
          grep -Fq 'const SHARED_CHANCE = 0.05;' duck-quest/js/love-interests-v246.js
          grep -Fq 'window.DuckieLoveInterests.maybeBeforeNextEncounter = maybeBeforeNextEncounter;' duck-quest/js/love-interests-v246.js
          grep -Fq 'window.triggerShinobuEncounter' duck-quest/js/love-interests-v246.js
          grep -Fq 'window.triggerCherylnEncounter' duck-quest/js/love-interests-v246.js
          grep -Fq 'window.triggerShinobuCherylnCutscene' duck-quest/js/love-interests-v246.js

          # Assets copied
          test -f duck-quest/assets/love-interests/shinobu/Shinobu-duck.png
          test -f duck-quest/assets/love-interests/cheryln/Cheryln-duck.png
          test -f assets/miko/Miko-Shino-Sweater.png
          test -f assets/miko/Miko-Cheryln-sweater.png

          # Page / cache references
          grep -Fq 'trading-cards-v246.js?v=24-246' index.html
          grep -Fq 'trading-cards-v246.css?v=24-246' index.html
          grep -Fq 'js/love-interests-v246.js?v=24-246' duck-quest/index.html
          grep -Fq 'css/love-interests-v246.css?v=24-246' duck-quest/index.html
          grep -Fq "importScripts('./sw-v24-246.js?v=24-246');" sw.js
          grep -Fq './duck-quest/js/love-interests-v246.js?v=24-246' sw-v24-246.js
          grep -Fq './duck-quest/assets/love-interests/shinobu/Shinobu-duck.png' sw-v24-246.js
          grep -Fq './duck-quest/assets/love-interests/cheryln/Cheryln-duck.png' sw-v24-246.js

          node --check trading-cards-v246.js
          node --check trading-cards-ui-v246.js
          node --check script-v24-201.js
          node --check duck-quest/js/love-interests-v246.js
          node --check sw-v24-246.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v246.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==73) throw new Error(`Expected 73 Trading Cards, found ${TC.cards.length}`);
          if(!TC.byId['r-love-shinobu']) throw new Error('Shinobu Rare card is missing');
          if(!TC.byId['r-love-cheryln']) throw new Error('Cheryln Rare card is missing');
          console.log('VERIFIED: 73 total Trading Cards including Shinobu and Cheryln.');
          NODE

          echo "VERIFIED: v24.246 is valid."

      - name: Clean old installers and bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-246-shinobu-cheryln.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.246.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-246.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.246
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Add Shinobu and Cheryln love-interest encounters"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.246 installed and verified."

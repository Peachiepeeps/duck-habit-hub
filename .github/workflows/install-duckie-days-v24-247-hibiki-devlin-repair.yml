name: Repair Duckie Days v24.247 Hibiki + Devlin

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-247-hibiki-devlin-repair.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-247-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require existing v24.247 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.247-hibiki-devlin-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Repair installer and install v24.247
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duckie-Days-v24.247-hibiki-devlin-update-only.zip"
          TMP=".duckie-days-v24-247-repair"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 - "$TMP/tools/patch-v247.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old = (
              'helper_anchor = \'  else if (outfit.outer === "shino-sweater") ids.push("shino-sleeve");\\n  return ids;\'\n'
              'helper_new = \'  else if (outfit.outer === "shino-sweater") ids.push("shino-sleeve");\\n  else if (outfit.outer === "hibiki-coat") ids.push("hibiki-back-coat", "hibiki-shirt", "hibiki-ribbon", "hibiki-coat-sleeve");\\n  else if (outfit.outer === "devlin-vest") ids.push("devlin-shirt", "devlin-tie", "devlin-bangs-pinned");\\n  if (outfit.bottom === "devlin-pants") ids.push("devlin-belt");\\n  return ids;\'\n'
              'if \'outfit.outer === "hibiki-coat"\' not in hub:\n'
              '    hub = replace_once(hub, helper_anchor, helper_new, \'add Hibiki and Devlin helper layers\')'
          )

          new = (
              'helper_anchor = \'  else if (outfit.outer === "shino-sweater") ids.push("shino-sleeve");\'\n'
              'helper_new = helper_anchor + \'\\n  else if (outfit.outer === "hibiki-coat") ids.push("hibiki-back-coat", "hibiki-shirt", "hibiki-ribbon", "hibiki-coat-sleeve");\\n  else if (outfit.outer === "devlin-vest") ids.push("devlin-shirt", "devlin-tie", "devlin-bangs-pinned");\\n  if (outfit.bottom === "devlin-pants") ids.push("devlin-belt");\'\n'
              'if \'outfit.outer === "hibiki-coat"\' not in hub:\n'
              '    hub = replace_once(hub, helper_anchor, helper_new, \'add Hibiki and Devlin helper layers\')'
          )

          if old not in text:
              raise RuntimeError("Could not locate the v24.247 helper-layer block.")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("Repaired v24.247 helper-layer matcher for the live Miko render function.")
          PY

          python3 -m py_compile "$TMP/tools/patch-v247.py"
          node --check "$TMP/love-interests-v247.js"
          python3 "$TMP/tools/patch-v247.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.247
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.247"' version.json

          test -f trading-cards-v247.js
          test -f trading-cards-ui-v247.js
          test -f trading-cards-v247.css
          test -f sw-v24-247.js
          test -f duck-quest/js/love-interests-v247.js
          test -f duck-quest/css/love-interests-v247.css

          grep -Fq 'id:"r-love-hibiki"' trading-cards-v247.js
          grep -Fq 'number:"R-034"' trading-cards-v247.js
          grep -Fq 'id:"r-love-devlin"' trading-cards-v247.js
          grep -Fq 'number:"R-035"' trading-cards-v247.js

          grep -Fq '"hibiki-duck": {' script-v24-201.js
          grep -Fq '"devlin-duck": {' script-v24-201.js
          grep -Fq '"hibiki-duck", "devlin-duck"' script-v24-201.js

          grep -Fq '"hibiki-coat"' script-v24-201.js
          grep -Fq '"devlin-vest"' script-v24-201.js
          grep -Fq 'outfit.outer === "hibiki-coat"' script-v24-201.js
          grep -Fq 'outfit.outer === "devlin-vest"' script-v24-201.js
          grep -Fq 'outfit.bottom === "devlin-pants"' script-v24-201.js

          grep -Fq 'const SHARED_CHANCE = 0.05;' duck-quest/js/love-interests-v247.js
          grep -Fq 'activeCharacterId() === "miko"' duck-quest/js/love-interests-v247.js
          grep -Fq 'unlockCharacter(data, "hibiki", { grantCard: false, grantDuck: true, grantOutfit: true });' duck-quest/js/love-interests-v247.js
          grep -Fq 'unlockCharacter(data, "devlin", { grantCard: false, grantDuck: true, grantOutfit: true });' duck-quest/js/love-interests-v247.js
          grep -Fq 'unlockCardsOnly(data, ["hibiki", "devlin"]);' duck-quest/js/love-interests-v247.js
          grep -Fq 'window.triggerDevlinHibikiCutscene' duck-quest/js/love-interests-v247.js

          test -f duck-quest/assets/love-interests/hibiki/Hibiki-duck.png
          test -f duck-quest/assets/love-interests/devlin/Devlin-duck.png
          test -f assets/miko/Miko-Hibiki-coat.png
          test -f assets/miko/Miko-Devlin-Vest.png

          grep -Fq 'trading-cards-v247.js?v=24-247' index.html
          grep -Fq 'js/love-interests-v247.js?v=24-247' duck-quest/index.html
          grep -Fq "importScripts('./sw-v24-247.js?v=24-247');" sw.js

          node --check trading-cards-v247.js
          node --check trading-cards-ui-v247.js
          node --check script-v24-201.js
          node --check duck-quest/js/love-interests-v247.js
          node --check sw-v24-247.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v247.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==75) throw new Error(`Expected 75 Trading Cards, found ${TC.cards.length}`);
          if(!TC.byId['r-love-hibiki']) throw new Error('Hibiki Rare card is missing');
          if(!TC.byId['r-love-devlin']) throw new Error('Devlin Rare card is missing');
          console.log('VERIFIED: 75 total Trading Cards including Hibiki and Devlin.');
          NODE

          echo "VERIFIED: repaired v24.247 is valid."

      - name: Clean old installers and bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-247-hibiki-devlin-repair.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.247.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-247.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.247
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }

          git commit -m "Repair Hibiki and Devlin love-interest update"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.247 installed and verified."

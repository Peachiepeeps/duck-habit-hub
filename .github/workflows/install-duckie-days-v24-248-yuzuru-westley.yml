name: Install Duckie Days v24.248 Yuzuru + Westley

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-248-yuzuru-westley.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-248-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.248 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.248-yuzuru-westley-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.248
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.248-yuzuru-westley-update-only.zip"
          TMP=".duckie-days-v24-248"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 -m py_compile "$TMP/tools/patch-v248.py"
          node --check "$TMP/love-interests-v248.js"
          python3 "$TMP/tools/patch-v248.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.248
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.248"' version.json

          test -f trading-cards-v248.js
          test -f trading-cards-ui-v248.js
          test -f trading-cards-v248.css
          test -f sw-v24-248.js
          test -f duck-quest/js/love-interests-v248.js
          test -f duck-quest/css/love-interests-v248.css

          grep -Fq 'id:"r-love-yuzuru"' trading-cards-v248.js
          grep -Fq 'number:"R-036"' trading-cards-v248.js
          grep -Fq 'id:"r-love-westley"' trading-cards-v248.js
          grep -Fq 'number:"R-037"' trading-cards-v248.js

          grep -Fq '"yuzuru-duck": {' script-v24-201.js
          grep -Fq '"westley-duck": {' script-v24-201.js
          grep -Fq '"yuzuru-duck", "westley-duck"' script-v24-201.js

          grep -Fq '"yuzuru-shirt"' script-v24-201.js
          grep -Fq '"yuzuru-shorts"' script-v24-201.js
          grep -Fq '"yuzuru-socks"' script-v24-201.js
          grep -Fq '"yuzuru-shoes"' script-v24-201.js
          grep -Fq '"westley-jacket"' script-v24-201.js
          grep -Fq '"westley-pants"' script-v24-201.js
          grep -Fq '"westley-boots"' script-v24-201.js
          grep -Fq 'outfit.outer === "yuzuru-shirt"' script-v24-201.js
          grep -Fq 'outfit.outer === "westley-jacket"' script-v24-201.js

          grep -Fq 'const SHARED_CHANCE = 0.05;' duck-quest/js/love-interests-v248.js
          grep -Fq 'activeCharacterId() === "miko"' duck-quest/js/love-interests-v248.js
          grep -Fq 'unlockCharacter(data, "yuzuru", { grantCard: false, grantDuck: true, grantOutfit: true });' duck-quest/js/love-interests-v248.js
          grep -Fq 'unlockCharacter(data, "westley", { grantCard: false, grantDuck: true, grantOutfit: true });' duck-quest/js/love-interests-v248.js
          grep -Fq 'unlockCardsOnly(data, ["yuzuru", "westley"]);' duck-quest/js/love-interests-v248.js
          grep -Fq 'window.triggerYuzuruEncounter' duck-quest/js/love-interests-v248.js
          grep -Fq 'window.triggerWestleyEncounter' duck-quest/js/love-interests-v248.js
          grep -Fq 'window.triggerWestleyYuzuruCutscene' duck-quest/js/love-interests-v248.js

          test -f duck-quest/assets/love-interests/yuzuru/Yuzuru-duck.png
          test -f duck-quest/assets/love-interests/westley/Westley-duck.png
          test -f assets/miko/Miko-Yuzuru-shirt.png
          test -f assets/miko/Miko-Westley-Jacket.png

          grep -Fq 'trading-cards-v248.js?v=24-248' index.html
          grep -Fq 'js/love-interests-v248.js?v=24-248' duck-quest/index.html
          grep -Fq "importScripts('./sw-v24-248.js?v=24-248');" sw.js
          grep -Fq './duck-quest/js/love-interests-v248.js?v=24-248' sw-v24-248.js
          grep -Fq './duck-quest/assets/love-interests/yuzuru/Yuzuru-duck.png' sw-v24-248.js
          grep -Fq './duck-quest/assets/love-interests/westley/Westley-duck.png' sw-v24-248.js

          node --check trading-cards-v248.js
          node --check trading-cards-ui-v248.js
          node --check script-v24-201.js
          node --check duck-quest/js/love-interests-v248.js
          node --check sw-v24-248.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v248.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==77) throw new Error(`Expected 77 Trading Cards, found ${TC.cards.length}`);
          if(!TC.byId['r-love-yuzuru']) throw new Error('Yuzuru Rare card is missing');
          if(!TC.byId['r-love-westley']) throw new Error('Westley Rare card is missing');
          console.log('VERIFIED: 77 total Trading Cards including Yuzuru and Westley.');
          NODE

          echo "VERIFIED: v24.248 is valid."

      - name: Clean old installers and bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-248-yuzuru-westley.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.248.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-248.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.248
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Add Yuzuru and Westley love-interest encounters"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.248 installed and verified."

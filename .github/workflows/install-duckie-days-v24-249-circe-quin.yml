name: Install Duckie Days v24.249 Circe + Quin

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-249-circe-quin.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-249-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.249 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.249-circe-quin-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.249
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.249-circe-quin-update-only.zip"
          TMP=".duckie-days-v24-249"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 -m py_compile "$TMP/tools/patch-v249.py"
          node --check "$TMP/love-interests-v249.js"
          python3 "$TMP/tools/patch-v249.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.249
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.249"' version.json

          test -f trading-cards-v249.js
          test -f trading-cards-ui-v249.js
          test -f trading-cards-v249.css
          test -f sw-v24-249.js
          test -f duck-quest/js/love-interests-v249.js
          test -f duck-quest/css/love-interests-v249.css

          grep -Fq 'id:"r-love-circe"' trading-cards-v249.js
          grep -Fq 'number:"R-038"' trading-cards-v249.js
          grep -Fq 'id:"r-love-quin"' trading-cards-v249.js
          grep -Fq 'number:"R-039"' trading-cards-v249.js

          grep -Fq '"circe-duck": {' script-v24-201.js
          grep -Fq '"quin-duck": {' script-v24-201.js
          grep -Fq '"circe-duck", "quin-duck"' script-v24-201.js

          grep -Fq '"circe-sweater"' script-v24-201.js
          grep -Fq '"circe-shorts"' script-v24-201.js
          grep -Fq '"circe-stockings"' script-v24-201.js
          grep -Fq '"circe-shoes"' script-v24-201.js
          grep -Fq '"circe-choker"' script-v24-201.js
          grep -Fq '"quin-jacket"' script-v24-201.js
          grep -Fq '"quin-shorts"' script-v24-201.js
          grep -Fq '"quin-boots"' script-v24-201.js
          grep -Fq '"quin-hairpins"' script-v24-201.js
          grep -Fq 'outfit.outer === "circe-sweater"' script-v24-201.js
          grep -Fq 'outfit.outer === "quin-jacket"' script-v24-201.js

          grep -Fq 'const SHARED_CHANCE = 0.05;' duck-quest/js/love-interests-v249.js
          grep -Fq 'activeCharacterId() === "miko"' duck-quest/js/love-interests-v249.js
          grep -Fq 'unlockCharacter(data, "circe", { grantCard: false, grantDuck: true, grantOutfit: true });' duck-quest/js/love-interests-v249.js
          grep -Fq 'unlockCharacter(data, "quin", { grantCard: false, grantDuck: true, grantOutfit: true });' duck-quest/js/love-interests-v249.js
          grep -Fq 'unlockCardsOnly(data, ["circe", "quin"]);' duck-quest/js/love-interests-v249.js
          grep -Fq 'window.triggerCirceEncounter' duck-quest/js/love-interests-v249.js
          grep -Fq 'window.triggerQuinEncounter' duck-quest/js/love-interests-v249.js
          grep -Fq 'window.triggerCirceQuinCutscene' duck-quest/js/love-interests-v249.js

          test -f duck-quest/assets/love-interests/circe/Circe-duck.png
          test -f duck-quest/assets/love-interests/quin/Quin-duck.png
          test -f assets/miko/Miko-circe-sweater.png
          test -f assets/miko/Miko-Quin-jacket.png

          grep -Fq 'trading-cards-v249.js?v=24-249' index.html
          grep -Fq 'js/love-interests-v249.js?v=24-249' duck-quest/index.html
          grep -Fq "importScripts('./sw-v24-249.js?v=24-249');" sw.js
          grep -Fq './duck-quest/js/love-interests-v249.js?v=24-249' sw-v24-249.js
          grep -Fq './duck-quest/assets/love-interests/circe/Circe-duck.png' sw-v24-249.js
          grep -Fq './duck-quest/assets/love-interests/quin/Quin-duck.png' sw-v24-249.js

          node --check trading-cards-v249.js
          node --check trading-cards-ui-v249.js
          node --check script-v24-201.js
          node --check duck-quest/js/love-interests-v249.js
          node --check sw-v24-249.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v249.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==79) throw new Error(`Expected 79 Trading Cards, found ${TC.cards.length}`);
          if(!TC.byId['r-love-circe']) throw new Error('Circe Rare card is missing');
          if(!TC.byId['r-love-quin']) throw new Error('Quin Rare card is missing');
          console.log('VERIFIED: 79 total Trading Cards including Circe and Quin.');
          NODE

          echo "VERIFIED: v24.249 is valid."

      - name: Clean old installers and bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-249-circe-quin.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.249.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-249.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.249
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Add Circe and Quin love-interest encounters"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.249 installed and verified."

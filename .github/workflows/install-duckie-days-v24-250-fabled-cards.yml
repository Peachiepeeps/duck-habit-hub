name: Install Duckie Days v24.250 Fabled Cards

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-250-fabled-cards.yml"
      - "Duckie-Days-v24.250-fabled-cards-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-250-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.250 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.250-fabled-cards-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.250
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.250-fabled-cards-update-only.zip"
          TMP=".duckie-days-v24-250"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 -m py_compile "$TMP/tools/patch-v250.py"
          python3 "$TMP/tools/patch-v250.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.250
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.250"' version.json

          test -f trading-cards-v250.js
          test -f trading-cards-ui-v250.js
          test -f trading-cards-v250.css
          test -f sw-v24-250.js

          grep -Fq '["peep","Peep","trading-cards/fabled/F-peep.png","Fabled"]' trading-cards-v250.js
          grep -Fq '["io","Io","trading-cards/fabled/F-io.png","Fabled"]' trading-cards-v250.js
          grep -Fq '["annika","Annika","trading-cards/fabled/F-annika.png","Fabled"]' trading-cards-v250.js
          grep -Fq '["miho","Miho","trading-cards/fabled/F-miho.png","Fabled"]' trading-cards-v250.js
          grep -Fq '["shinobu-cheryln","Shinobu x Cheryln","trading-cards/fabled/F-shinobu-cheryln.png","Fabled"]' trading-cards-v250.js

          grep -Fq 'if(card.rarity==="fabled")' trading-cards-v250.js
          grep -Fq 'full.className="tc-fabled-image"' trading-cards-v250.js

          grep -Fq 'TC.order[a.rarity]-TC.order[b.rarity]' trading-cards-ui-v250.js
          ! grep -Fq 'TC.order[b.rarity]-TC.order[a.rarity]' trading-cards-ui-v250.js

          test -f duck-quest/assets/trading-cards/fabled/F-peep.png
          test -f duck-quest/assets/trading-cards/fabled/F-io.png
          test -f duck-quest/assets/trading-cards/fabled/F-annika.png
          test -f duck-quest/assets/trading-cards/fabled/F-miho.png
          test -f duck-quest/assets/trading-cards/fabled/F-shinobu-cheryln.png

          grep -Fq 'trading-cards-v250.js?v=24-250' index.html
          grep -Fq 'trading-cards-ui-v250.js?v=24-250' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-250"' index.html
          grep -Fq "importScripts('./sw-v24-250.js?v=24-250');" sw.js
          grep -Fq './duck-quest/assets/trading-cards/fabled/F-peep.png' sw-v24-250.js
          grep -Fq './duck-quest/assets/trading-cards/fabled/F-shinobu-cheryln.png' sw-v24-250.js

          node --check trading-cards-v250.js
          node --check trading-cards-ui-v250.js
          node --check sw-v24-250.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('trading-cards-v250.js','utf8');
          const ctx={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            location:{pathname:'/'},
            document:{createElement:()=>({className:'',classList:{add:()=>{}},append:()=>{},dataset:{}})}
          };
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          const TC=ctx.window.DuckieTradingCards;
          if(TC.cards.length!==84) throw new Error(`Expected 84 Trading Cards, found ${TC.cards.length}`);
          const expected={
            'f-peep':'F-006',
            'f-io':'F-007',
            'f-annika':'F-008',
            'f-miho':'F-009',
            'f-shinobu-cheryln':'F-010'
          };
          for(const [id,num] of Object.entries(expected)){
            if(!TC.byId[id]) throw new Error(`${id} is missing`);
            if(TC.byId[id].number!==num) throw new Error(`${id} expected ${num}, found ${TC.byId[id].number}`);
            if(TC.byId[id].rarity!=='fabled') throw new Error(`${id} is not Fabled`);
          }
          if(!(TC.order.common < TC.order.uncommon && TC.order.uncommon < TC.order.rare && TC.order.rare < TC.order.fabled)){
            throw new Error('Rarity order map is not Common -> Uncommon -> Rare -> Fabled');
          }
          console.log('VERIFIED: 84 cards and F-006 through F-010 are present.');
          NODE

          echo "VERIFIED: v24.250 is valid."

      - name: Clean old installers and bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-250-fabled-cards.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.250.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-250.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.250
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Add more Fabled cards and reorder Duckipedia cards"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.250 installed and verified."

name: Install Duckie Days v24.251 Love Interest Polish + Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-251-love-interest-polish-fix.yml"
      - "Duckie-Days-v24.251-love-interest-polish-fix-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-251-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.251 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.251-love-interest-polish-fix-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.251
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.251-love-interest-polish-fix-update-only.zip"
          TMP=".duckie-days-v24-251"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          python3 -m py_compile "$TMP/tools/patch-v251.py"
          node --check "$TMP/love-interests-v251.js"
          python3 "$TMP/tools/patch-v251.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.251
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.251"' version.json

          test -f duck-quest/js/love-interests-v251.js
          test -f duck-quest/css/love-interests-v251.css
          test -f sw-v24-251.js
          test -f sw-v24-244.js

          # Love-interest presentation and rarity.
          grep -Fq 'const SHARED_CHANCE = 0.02;' duck-quest/js/love-interests-v251.js
          grep -Fq 'love-interest-battle-scene' duck-quest/js/love-interests-v251.js
          grep -Fq 'cleanDialogueText' duck-quest/js/love-interests-v251.js
          grep -Fq 'love-interest-battle-right' duck-quest/css/love-interests-v251.css
          grep -Fq 'scaleX(-1)' duck-quest/css/love-interests-v251.css
          grep -Fq 'translateY(-4px)' duck-quest/css/love-interests-v251.css
          grep -Fq 'translateY(-2px)' duck-quest/css/love-interests-v251.css

          # Reward overwrite fix.
          grep -Fq 'window.DuckieQuestLoveRewardSync = function(incoming)' duck-quest/js/game-v96.js
          grep -Fq 'window.DuckieQuestLoveRewardSync(data)' duck-quest/js/love-interests-v251.js
          grep -Fq 'characterUnlockedItems.miko' duck-quest/js/game-v96.js
          grep -Fq 'hubSave.unlockedDucks' duck-quest/js/game-v96.js
          grep -Fq 'hubSave.duckCollectionCounts' duck-quest/js/game-v96.js

          # Closet crops for encounter outfits.
          grep -Fq '"Miko-Shino-Sweater-Shop.png": [377, 1199, 736, 1508]' script-v24-201.js
          grep -Fq '"Miko-Hibiki-coat-shop.png": [352, 1202, 810, 1639]' script-v24-201.js
          grep -Fq '"Miko-Westley-Jacket-shop.png": [376, 1179, 763, 1533]' script-v24-201.js
          grep -Fq '"Miko-circe-sweater-shop.png": [373, 1195, 735, 1458]' script-v24-201.js
          grep -Fq '"Miko-Quin-jacket-shop.png": [386, 1168, 773, 1548]' script-v24-201.js

          # Encounter outfits are not Shop items and have encounter-specific lock text.
          grep -Fq 'const loveInterestWardrobe = {' script-v24-201.js
          grep -Fq 'meet ${loveInterestWardrobe[id]} while exploring Duck Quest as Miko!' script-v24-201.js
          ! grep -Fq 'wardrobeId: "hibiki-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "devlin-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "yuzuru-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "westley-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "circe-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "quin-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "shino-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "cheryln-' script-v24-201.js
          ! grep -Fq 'wardrobeId: "lukio-' script-v24-201.js

          # Current pages and service worker point to v24.251.
          grep -Fq 'css/love-interests-v251.css?v=24-251' duck-quest/index.html
          grep -Fq 'js/love-interests-v251.js?v=24-251' duck-quest/index.html
          grep -Fq 'js/game-v96.js?v=24-251' duck-quest/index.html
          grep -Fq 'script-v24-201.js?v=24-251' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-251"' index.html
          grep -Fq "importScripts('./sw-v24-251.js?v=24-251');" sw.js
          grep -Fq "importScripts('./sw-v24-251.js?v=24-251');" sw-v24-244.js
          grep -Fq './duck-quest/js/love-interests-v251.js?v=24-251' sw-v24-251.js
          grep -Fq './duck-quest/css/love-interests-v251.css?v=24-251' sw-v24-251.js

          node --check script-v24-201.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/love-interests-v251.js
          node --check sw-v24-251.js

          # Confirm expression markers are removed at render time but the non-expression
          # sound cue remains available as dialogue/narration.
          grep -Fq '(?:happy|content|threaten|angry|smug|thinking)' duck-quest/js/love-interests-v251.js
          grep -Fq '*Loud crash*' duck-quest/js/love-interests-v251.js

          echo "VERIFIED: v24.251 love-interest polish and reward fixes are valid."

      - name: Clean old installers and bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-251-love-interest-polish-fix.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.251.txt' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

          # Keep the legacy bridge plus the current worker; remove obsolete versioned workers.
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' \
            ! -name 'sw-v24-244.js' ! -name 'sw-v24-251.js' -delete

          rm -f duck-quest/js/love-interests-v249.js duck-quest/css/love-interests-v249.css

      - name: Commit v24.251
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Polish love-interest scenes and fix encounter rewards"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.251 installed and verified."

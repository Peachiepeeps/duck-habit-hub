name: Install Duckie Days v24.254 Task Progression

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-254-task-progression.yml"
      - "Duckie-Days-v24.254-task-progression-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-254-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.254 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.254-task-progression-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.254
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.254-task-progression-update-only.zip"
          TMP=".duckie-days-v24-254"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v254.py"
          node --check "$TMP/task-progression-v254.js"
          node --check "$TMP/duck-quest/js/task-buddy-boost-v254.js"
          python3 "$TMP/tools/patch-v254.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.254
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.254"' version.json

          # New Task Progression files and art.
          test -f task-progression-v254.js
          test -f task-progression-v254.css
          test -f duck-quest/js/task-buddy-boost-v254.js
          test -f assets/task-shop/Duck-bucks.png
          for N in 1 2 3 4 5; do test -f "assets/task-shop/Task-plush-$N.png"; done

          # Duck Bucks + five 20-Buck plushes.
          grep -Fq "const SHELF_UNLOCK_TASKS=50;" task-progression-v254.js
          grep -Fq "const SURPRISE_CHANCE=.15;" task-progression-v254.js
          grep -Fq "p.duckBucks+=1;" task-progression-v254.js
          grep -Fq "task-plush-1',name:'Special Plush 1',image:'assets/task-shop/Task-plush-1.png',price:20" task-progression-v254.js
          grep -Fq "task-plush-5',name:'Special Plush 5',image:'assets/task-shop/Task-plush-5.png',price:20" task-progression-v254.js
          PLUSH_PRICE_COUNT=$(grep -o "price:20,kind:'collectible'" task-progression-v254.js | wc -l | tr -d ' ')
          test "$PLUSH_PRICE_COUNT" = "5"

          # Treasure Meter / Perfect Day / surprise rewards / shop utilities.
          grep -Fq "{count:1,key:'m1'" task-progression-v254.js
          grep -Fq "{count:5,key:'m5'" task-progression-v254.js
          grep -Fq "{count:15,key:'m15'" task-progression-v254.js
          grep -Fq "{count:25,key:'m25'" task-progression-v254.js
          grep -Fq "{count:40,key:'m40'" task-progression-v254.js
          grep -Fq "{count:60,key:'m60'" task-progression-v254.js
          grep -Fq "for(let threshold=80;threshold<=p.completedToday;threshold+=20)" task-progression-v254.js
          grep -Fq "function perfectDayReward()" task-progression-v254.js
          grep -Fq "Perfect Day Chest JACKPOT" task-progression-v254.js
          grep -Fq "Surprise Drop: +2 Duck Bucks!" task-progression-v254.js
          grep -Fq "card-pack-unopened.png" task-progression-v254.js
          grep -Fq "exp-candy-small" task-progression-v254.js
          grep -Fq "exp-candy-large" task-progression-v254.js
          grep -Fq "rare-egg" task-progression-v254.js
          grep -Fq "jump-token-bundle" task-progression-v254.js

          # Task Shop / shelf UI is actually mounted in the Hub.
          grep -Fq 'task-progression-v254.css?v=24-254' index.html
          grep -Fq 'task-progression-v254.js?v=24-254' index.html
          grep -Fq 'id="openTaskShopButton"' index.html
          grep -Fq 'id="taskShopPanel"' index.html
          grep -Fq 'id="taskShelfButton"' index.html
          grep -Fq 'id="taskCollectibleWing"' index.html
          grep -Fq 'id="taskCollectibleSlots"' index.html
          grep -Fq 'id="taskCollectiblePicker"' index.html
          grep -Fq '#roomMirrorImage{translate:0 -8%;}' task-progression-v254.css
          grep -Fq '#roomBookImage{translate:0 -7%;}' task-progression-v254.css

          # Buddy Boost activates from the shared Task save after 5 Tasks.
          grep -Fq 'const BOOST=1.20;' duck-quest/js/task-buddy-boost-v254.js
          grep -Fq 'Number(p.completedToday||0)>=5' duck-quest/js/task-buddy-boost-v254.js
          grep -Fq 'Task Buddy Boost: +20% ability power today.' duck-quest/js/task-buddy-boost-v254.js
          grep -Fq 'js/task-buddy-boost-v254.js?v=24-254' duck-quest/index.html

          # Failed Spell gamble.
          grep -Fq 'failedSpellBackfire=skill.id==="failed-spell" && failedSpellRoll<0.01' duck-quest/js/game-v96.js
          grep -Fq 'failedSpellHuge=skill.id==="failed-spell" && !failedSpellBackfire && failedSpellRoll<0.16' duck-quest/js/game-v96.js
          grep -Fq 'failedSpellHuge?4.25' duck-quest/js/game-v96.js
          grep -Fq 'Failed Spell BACKFIRED!' duck-quest/js/game-v96.js
          grep -Fq 'currentRun.hp=Math.max(1,currentRun.hp-backlash)' duck-quest/js/game-v96.js

          # Merchant automatically tips his hat and exits when sold out.
          grep -Fq 'merchantTipHatV254' duck-quest/js/merchant-fix-v218.js
          grep -Fq 'chest.autoLeavingV254=true' duck-quest/js/merchant-fix-v218.js
          grep -Fq 'chest.wares.every(item=>Boolean(item?.sold))' duck-quest/js/merchant-fix-v218.js
          grep -Fq 'setTimeout(()=>leaveMerchant(),720)' duck-quest/js/merchant-fix-v218.js

          # Offline/PWA update wiring.
          test -f sw-v24-254.js
          test -f sw-v24-244.js
          grep -Fq "importScripts('./sw-v24-254.js?v=24-254');" sw.js
          grep -Fq "importScripts('./sw-v24-254.js?v=24-254');" sw-v24-244.js
          grep -Fq './task-progression-v254.js?v=24-254' sw-v24-254.js
          grep -Fq './assets/task-shop/Duck-bucks.png' sw-v24-254.js
          grep -Fq './assets/task-shop/Task-plush-5.png' sw-v24-254.js
          grep -Fq './duck-quest/js/task-buddy-boost-v254.js?v=24-254' sw-v24-254.js

          node --check script-v24-201.js
          node --check trading-cards-v250.js
          node --check trading-cards-ui-v250.js
          node --check task-progression-v254.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/merchant-fix-v218.js
          node --check duck-quest/js/task-buddy-boost-v254.js
          node --check sw-v24-254.js

          echo "VERIFIED: v24.254 Task Progression update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-254-task-progression.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.254.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-254.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.254
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Add Duck Bucks and Task Progression system"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.254 installed and verified."

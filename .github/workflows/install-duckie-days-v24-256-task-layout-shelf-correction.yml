name: Install Duckie Days v24.256 Task Layout + Shelf Correction

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-256-task-layout-shelf-correction.yml"
      - "Duckie-Days-v24.256-task-layout-shelf-correction-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-256-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.256 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.256-task-layout-shelf-correction-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.256
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.256-task-layout-shelf-correction-update-only.zip"
          TMP=".duckie-days-v24-256"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v256.py"
          node --check "$TMP/task-progression-v256.js"
          python3 "$TMP/tools/patch-v256.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.256
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.256"' version.json
          test -f task-progression-v256.js
          test -f task-progression-v256.css
          grep -Fq 'task-progression-v256.css?v=24-256' index.html
          grep -Fq 'task-progression-v256.js?v=24-256' index.html

          grep -Fq 'const THEMES=[' task-progression-v256.js
          grep -Fq 'while(original.length<24) original.push(null);' task-progression-v256.js
          grep -Fq 'task-shelf-theme-choice-v256' task-progression-v256.js
          grep -Fq 'right.style.right=' task-progression-v256.js
          grep -Fq "book.style.translate='0 -28%'" task-progression-v256.js
          grep -Fq 'taskActionsRowV256' task-progression-v256.js
          grep -Fq 'taskTopShellV256' task-progression-v256.js

          grep -Fq '.task-actions-row-v256{' task-progression-v256.css
          grep -Fq '.tasks-panel-v256 .task-treasure-milestones-v254{' task-progression-v256.css
          grep -Fq '#taskCollectibleWing.task-shelf-v256{' task-progression-v256.css
          grep -Fq 'grid-template-rows:repeat(6,minmax(0,1fr));' task-progression-v256.css
          grep -Fq '#taskShelfThemeBarV256{' task-progression-v256.css
          grep -Fq '#roomBookImage{translate:0 -28% !important;}' task-progression-v256.css

          test -f sw-v24-256.js
          grep -Fq "importScripts('./sw-v24-256.js?v=24-256');" sw.js
          grep -Fq './task-progression-v256.js?v=24-256' sw-v24-256.js
          grep -Fq './task-progression-v256.css?v=24-256' sw-v24-256.js

          node --check task-progression-v256.js
          echo "VERIFIED: v24.256 Task Layout + Shelf correction update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-256-task-layout-shelf-correction.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.256.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-256.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.256
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Correct task layout and collectible shelf"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.256 installed and verified."

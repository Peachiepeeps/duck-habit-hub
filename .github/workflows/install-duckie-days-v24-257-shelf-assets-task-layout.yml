name: Install Duckie Days v24.257 Shelf Assets + Task Layout

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-257-shelf-assets-task-layout.yml"
      - "Duckie-Days-v24.257-shelf-assets-task-layout-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-257-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.257 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.257-shelf-assets-task-layout-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.257
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.257-shelf-assets-task-layout-update-only.zip"
          TMP=".duckie-days-v24-257"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v257.py"
          node --check "$TMP/task-progression-v257.js"
          python3 "$TMP/tools/patch-v257.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.257
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.257"' version.json
          test -f task-progression-v257.js
          test -f task-progression-v257.css
          grep -Fq 'task-progression-v257.css?v=24-257' index.html
          grep -Fq 'task-progression-v257.js?v=24-257' index.html
          ! grep -Fq 'task-progression-v255.js' index.html
          ! grep -Fq 'task-progression-v256.js' index.html

          # Exact user shelf assets + same control/layout style as Shelf of Ducks.
          grep -Fq 'id="taskCollectibleShelfImage"' index.html
          grep -Fq 'assets/room-expansion/shelves/shelf-cream.webp' index.html
          grep -Fq 'data-task-shelf-style="cream"' index.html
          grep -Fq 'data-task-shelf-style="brown"' index.html
          grep -Fq 'data-task-shelf-style="dark-brown"' index.html
          grep -Fq 'const SHELF_SLOTS=24;' task-progression-v254.js
          grep -Fq 'wing-duck-slot task-collectible-slot-v254' task-progression-v254.js
          grep -Fq 'grid-template-rows:repeat(6,minmax(0,1fr))' task-progression-v257.css
          grep -Fq 'left:6.2% !important;' task-progression-v257.css
          grep -Fq 'top:16.0% !important;' task-progression-v257.css

          # Main-room Book + arrow fix.
          grep -Fq 'bottom:4.6% !important;' task-progression-v257.css
          grep -Fq '#roomBookImage.on-shelf{' task-progression-v257.css
          grep -Fq 'bottom:8.7% !important;' task-progression-v257.css
          grep -Fq 'width:31% !important;' task-progression-v257.css
          grep -Fq 'height:18% !important;' task-progression-v257.css

          # Task order and compact Treasure area.
          grep -Fq '<h1>Your Tasks</h1>' index.html
          grep -Fq 'tasks-header-actions-v257' index.html
          grep -Fq 'tasksContent.before(renderTaskProgressCard());' task-progression-v254.js
          grep -Fq 'task-treasure-status-row-v257' task-progression-v254.js
          grep -Fq 'grid-template-columns:repeat(6,minmax(0,1fr));' task-progression-v257.css

          # App refresh/cache wiring.
          grep -Fq 'const DUCK_HUB_BUILD = "24.257";' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-257"' index.html
          test -f sw-v24-257.js
          grep -Fq "importScripts('./sw-v24-257.js?v=24-257');" sw.js
          grep -Fq './task-progression-v257.js?v=24-257' sw-v24-257.js
          grep -Fq './task-progression-v257.css?v=24-257' sw-v24-257.js
          grep -Fq './assets/room-expansion/shelves/shelf-cream.webp' sw-v24-257.js

          node --check task-progression-v254.js
          node --check task-progression-v257.js
          node --check sw-v24-257.js

          echo "VERIFIED: v24.257 Shelf Assets + Task Layout update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-257-shelf-assets-task-layout.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.257.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-257.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.257
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Match collectible shelf assets and task layout"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.257 installed and verified."

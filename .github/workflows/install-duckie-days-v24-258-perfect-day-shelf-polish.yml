name: Install Duckie Days v24.258 Perfect Day + Shelf Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-258-perfect-day-shelf-polish.yml"
      - "Duckie-Days-v24.258-perfect-day-shelf-polish-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-258-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.258 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.258-perfect-day-shelf-polish-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.258
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.258-perfect-day-shelf-polish-update-only.zip"
          TMP=".duckie-days-v24-258"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v258.py"
          python3 "$TMP/tools/patch-v258.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.258
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.258"' version.json
          test -f task-progression-v258.css
          grep -Fq 'task-progression-v258.css?v=24-258' index.html
          grep -Fq 'task-progression-v254.js?v=24-258' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.258";' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-258"' index.html

          # Task Shop button no longer shows a number in the header.
          grep -Fq '<span>Task Shop</span>' index.html
          ! grep -Fq 'taskHeaderBuckCount' index.html

          # Perfect Day is now gated behind 5 tasks.
          grep -Fq 'dueAfter===0 && p.completedToday>=5 && !p.perfectDayClaimed' task-progression-v254.js

          # Requested status icons.
          grep -Fq "duck-quest/assets/items/chests/treasure/closed.png" task-progression-v254.js
          grep -Fq "duck-quest/assets/enemies/cat-slime/base/Strawberry-idle-1-neutral.png" task-progression-v254.js

          # Main-room arrow + Book positioning polish.
          grep -Fq '#roomWingButton,' task-progression-v258.css
          grep -Fq 'bottom:5.8% !important;' task-progression-v258.css
          grep -Fq '#roomBookImage.on-shelf{' task-progression-v258.css
          grep -Fq 'bottom:12.8% !important;' task-progression-v258.css

          # Collectible shelf lower-row placement matches Shelf of Ducks.
          grep -Fq 'nth-child(n+13):nth-child(-n+16) img' task-progression-v258.css
          grep -Fq 'nth-child(n+21):nth-child(-n+24) > span' task-progression-v258.css

          # Service worker/cache wiring.
          test -f sw-v24-258.js
          grep -Fq "importScripts('./sw-v24-258.js?v=24-258');" sw.js
          grep -Fq './task-progression-v258.css?v=24-258' sw-v24-258.js
          grep -Fq './duck-quest/assets/items/chests/treasure/closed.png' sw-v24-258.js
          grep -Fq './duck-quest/assets/enemies/cat-slime/base/Strawberry-idle-1-neutral.png' sw-v24-258.js

          node --check task-progression-v254.js
          node --check sw-v24-258.js

          echo "VERIFIED: v24.258 Perfect Day + Shelf Polish update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-258-perfect-day-shelf-polish.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.258.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-258.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.258
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Polish task shelf and perfect day requirements"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.258 installed and verified."

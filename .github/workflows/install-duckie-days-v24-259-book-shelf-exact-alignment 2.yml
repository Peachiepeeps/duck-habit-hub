name: Install Duckie Days v24.259 Book + Shelf Exact Alignment

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-259-book-shelf-exact-alignment.yml"
      - "Duckie-Days-v24.259-book-shelf-exact-alignment-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-259-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.259 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.259-book-shelf-exact-alignment-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.259
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.259-book-shelf-exact-alignment-update-only.zip"
          TMP=".duckie-days-v24-259"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v259.py"
          python3 "$TMP/tools/patch-v259.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.259
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.259"' version.json
          test -f task-progression-v259.css
          grep -Fq 'task-progression-v259.css?v=24-259' index.html
          grep -Fq 'class="wing-duck-slots task-collectible-slots-v254"' index.html

          # Exact current Shelf of Ducks geometry.
          grep -Fq 'top:17.9167% !important;' task-progression-v259.css
          grep -Fq 'bottom:7.8125% !important;' task-progression-v259.css
          grep -Fq 'grid-template-rows:211fr 242fr 248fr 242fr 229fr 210fr !important;' task-progression-v259.css
          grep -Fq 'transform:translateY(5%) !important;' task-progression-v259.css
          grep -Fq 'margin-bottom:0 !important;' task-progression-v259.css
          grep -Fq 'height:127.9630vw !important;' task-progression-v259.css

          # Book is much higher and hotspot follows it.
          grep -Fq 'bottom:18.4% !important;' task-progression-v259.css
          grep -Fq 'bottom:16.8% !important;' task-progression-v259.css
          grep -Fq '#roomBookImage.duckipedia-room-book-v232' task-progression-v259.css

          # App refresh/cache wiring.
          grep -Fq 'const DUCK_HUB_BUILD = "24.259";' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-259"' index.html
          test -f sw-v24-259.js
          grep -Fq "importScripts('./sw-v24-259.js?v=24-259');" sw.js
          grep -Fq './task-progression-v259.css?v=24-259' sw-v24-259.js

          node --check sw-v24-259.js
          echo "VERIFIED: v24.259 Book + Shelf Exact Alignment update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-259-book-shelf-exact-alignment.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.259.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-259.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.259
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Align Book and collectible shelf exactly"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.259 installed and verified."

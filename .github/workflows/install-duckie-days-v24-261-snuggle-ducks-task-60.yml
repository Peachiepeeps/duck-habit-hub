name: Install Duckie Days v24.261 Snuggle Ducks + Task 60

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-261-snuggle-ducks-task-60.yml"
      - "Duckie-Days-v24.261-snuggle-ducks-task-60-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-261-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.261 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.261-snuggle-ducks-task-60-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.261
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.261-snuggle-ducks-task-60-update-only.zip"
          TMP=".duckie-days-v24-261"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v261.py"
          node --check "$TMP/task-progression-v261.js"
          python3 "$TMP/tools/patch-v261.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.261
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.261"' version.json
          test -f task-progression-v261.js
          test -f task-progression-v261.css
          grep -Fq 'task-progression-v261.css?v=24-261' index.html
          grep -Fq 'task-progression-v261.js?v=24-261' index.html

          # Book moved farther right.
          grep -Fq 'left:73.8% !important;' task-progression-v261.css
          grep -Fq 'left:71.8% !important;' task-progression-v261.css

          # Snuggle Ducks perk.
          grep -Fq 'Snuggle Ducks' task-progression-v261.js
          grep -Fq 'double-head-ducks' task-progression-v261.js
          grep -Fq 'assignDuckToOcSecond' task-progression-v261.js
          grep -Fq 'doubleHeadDuckUnlocked' task-progression-v261.js
          grep -Fq 'secondHeadDuckDisplay' task-progression-v261.js

          # Full daily ladder display + fill.
          grep -Fq 'const dailyTotal=60;' task-progression-v254.js
          grep -Fq 'p.completedToday / ${dailyTotal}' task-progression-v254.js || grep -Fq 'p.completedToday} / ${dailyTotal}' task-progression-v254.js
          grep -Fq 'p.completedToday/Math.max(1,dailyTotal)' task-progression-v254.js

          # App refresh/cache wiring.
          grep -Fq 'const DUCK_HUB_BUILD = "24.261";' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-261"' index.html
          test -f sw-v24-261.js
          grep -Fq "importScripts('./sw-v24-261.js?v=24-261');" sw.js
          grep -Fq './task-progression-v261.js?v=24-261' sw-v24-261.js
          grep -Fq './task-progression-v261.css?v=24-261' sw-v24-261.js

          node --check task-progression-v254.js
          node --check task-progression-v261.js
          node --check sw-v24-261.js

          echo "VERIFIED: v24.261 Snuggle Ducks + Task 60 update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-261-snuggle-ducks-task-60.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.261.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-261.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.261
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Add Snuggle Ducks perk and 60-task treasure bar"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.261 installed and verified."

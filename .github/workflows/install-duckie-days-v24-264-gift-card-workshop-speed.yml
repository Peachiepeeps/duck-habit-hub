name: Install Duckie Days v24.264 Gift Rewards + Card Workshop + Speed

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-duckie-days-v24-264-gift-card-workshop-speed.yml"
      - "Duckie-Days-v24.264-gift-card-workshop-speed-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-264-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.264 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.264-gift-card-workshop-speed-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.264
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.264-gift-card-workshop-speed-update-only.zip"
          TMP=".duckie-days-v24-264"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/payload"

          cp -a "$TMP/payload/." .
          rm -rf "$TMP"

      - name: Verify v24.264
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.264"' version.json
          grep -Fq '<meta name="duck-habit-build" content="24.264"' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.264";' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-264"' index.html

          # Gift Box uses Mimic-sized chest presentation and visual reward pop.
          grep -Fq 'special-encounters-v264.css?v=24-264' duck-quest/index.html
          grep -Fq 'special-encounters-v264.js?v=24-264' duck-quest/index.html
          grep -Fq 'width:100px!important' duck-quest/css/special-encounters-v264.css
          grep -Fq 'width:82px!important' duck-quest/css/special-encounters-v264.css
          grep -Fq 'giftRewardBumpV264' duck-quest/css/special-encounters-v264.css
          grep -Fq 'showGiftRewardVisual' duck-quest/js/special-encounters-v264.js
          grep -Fq 'TC.createFace(result.card' duck-quest/js/special-encounters-v264.js
          grep -Fq 'card-pack-unopened.png' duck-quest/js/special-encounters-v264.js

          # Trading Card detail swipe + dedicated Card Workshop.
          grep -Fq 'navigateCardDetail' trading-cards-ui-v250.js
          grep -Fq 'touchstart' trading-cards-ui-v250.js
          grep -Fq 'Card Workshop' trading-cards-ui-v250.js
          grep -Fq 'DuckieCardWorkshopV264' trading-cards-ui-v264.js
          grep -Fq 'tc-workshop-layer-v264' trading-cards-v264.css
          grep -Fq 'trading-cards-ui-v264.js?v=24-264' index.html
          grep -Fq 'trading-cards-v264.css?v=24-264' index.html

          # New Task reward presets.
          grep -Fq 'name="taskReward" value="15" checked' index.html
          grep -Fq 'name="taskReward" value="25"' index.html
          grep -Fq 'name="taskReward" value="40"' index.html
          grep -Fq 'name="taskReward" value="50"' index.html
          grep -Fq 'const preset = [15, 25, 40, 50]' script-v24-201.js
          grep -Fq 'setTaskRewardInForm(15);' script-v24-201.js

          # Faster installed-PWA startup + valid app shell.
          test -f sw-v24-264.js
          grep -Fq "importScripts('./sw-v24-264.js?v=24-264');" sw.js
          grep -Fq 'cacheFirstRefresh(request, APP_CACHE)' sw-v24-264.js
          grep -Fq "pathname.endsWith('/version.json')" sw-v24-264.js

          node --check trading-cards-ui-v250.js
          node --check trading-cards-ui-v264.js
          node --check script-v24-201.js
          node --check duck-quest/js/special-encounters-v264.js
          node --check sw-v24-264.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          text=(root/'sw-v24-264.js').read_text()
          shell=text.split('const APP_SHELL = [',1)[1].split('];',1)[0]
          entries=re.findall(r"'([^']+)'",shell)
          missing=[]
          for entry in entries:
              clean=entry.split('?',1)[0]
              path=root/'index.html' if clean=='./' else root/clean.removeprefix('./')
              if not path.exists(): missing.append(entry)
          if missing:
              raise SystemExit('Missing APP_SHELL files: '+', '.join(missing))
          print(f'APP_SHELL verified: {len(entries)} files/URLs, none missing.')
          PY

          echo "VERIFIED: v24.264 Gift Rewards + Card Workshop + Speed update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="install-duckie-days-v24-264-gift-card-workshop-speed.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.264.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-264.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.264
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Polish gift rewards, cards, tasks, and startup"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: Duckie Days v24.264 installed and verified."

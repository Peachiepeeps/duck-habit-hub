name: Install Duckie Days v24.275 Buddy Box Click Repair

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.275-buddy-box-click-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-275-buddy-box-click.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-275-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact update ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Duckie-Days-v24.275-buddy-box-click-update-only.zip
          unzip -tq Duckie-Days-v24.275-buddy-box-click-update-only.zip
      - name: Install and verify v24.275
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .duckie-update-v275
          unzip -q Duckie-Days-v24.275-buddy-box-click-update-only.zip -d .duckie-update-v275
          python3 -m py_compile .duckie-update-v275/tools/patch-v275.py .duckie-update-v275/tools/verify-v275.py
          node --check .duckie-update-v275/payload/duck-quest/js/quest-v265.js
          node --check .duckie-update-v275/payload/sw-v24-275.js
          python3 .duckie-update-v275/tools/patch-v275.py
          python3 .duckie-update-v275/tools/verify-v275.py
      - name: Remove temporary installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .duckie-update-v275
          rm -f Duckie-Days-v24.275-buddy-box-click-update-only.zip
          rm -f .github/workflows/install-duckie-days-v24-275-buddy-box-click.yml
      - name: Commit app update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Repair Buddy Box detail opening'
            git push
          fi

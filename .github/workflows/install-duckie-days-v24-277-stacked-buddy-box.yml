name: Install Duckie Days v24.277 Stacked Buddy Box

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.277-stacked-buddy-box-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-277-stacked-buddy-box.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-277-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact update ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Duckie-Days-v24.277-stacked-buddy-box-update-only.zip
          unzip -tq Duckie-Days-v24.277-stacked-buddy-box-update-only.zip
      - name: Install and verify v24.277
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .duckie-update-v277
          unzip -q Duckie-Days-v24.277-stacked-buddy-box-update-only.zip -d .duckie-update-v277
          python3 -m py_compile .duckie-update-v277/tools/patch-v277.py .duckie-update-v277/tools/verify-v277.py
          node --check .duckie-update-v277/payload/duck-quest/js/quest-v265.js
          node --check .duckie-update-v277/payload/sw-v24-277.js
          python3 .duckie-update-v277/tools/patch-v277.py
          python3 .duckie-update-v277/tools/verify-v277.py
      - name: Remove temporary installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .duckie-update-v277
          rm -f Duckie-Days-v24.277-stacked-buddy-box-update-only.zip
          rm -f .github/workflows/install-duckie-days-v24-277-stacked-buddy-box.yml
      - name: Commit app update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Stack Buddy Box details and add Buddy info popup'
            git push
          fi

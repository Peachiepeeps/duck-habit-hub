name: Install Duckie Days v24.278 Buddy Family Mimic Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.278-buddy-family-mimic-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-278-buddy-family-mimic-fix.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-278-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact update ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Duckie-Days-v24.278-buddy-family-mimic-update-only.zip
          unzip -tq Duckie-Days-v24.278-buddy-family-mimic-update-only.zip
      - name: Install and verify v24.278
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .duckie-update-v278
          unzip -q Duckie-Days-v24.278-buddy-family-mimic-update-only.zip -d .duckie-update-v278
          python3 -m py_compile .duckie-update-v278/tools/patch-v278.py .duckie-update-v278/tools/verify-v278.py
          node --check .duckie-update-v278/payload/duck-quest/js/quest-v265.js
          node --check .duckie-update-v278/payload/sw-v24-278.js
          python3 .duckie-update-v278/tools/patch-v278.py
          python3 .duckie-update-v278/tools/verify-v278.py
      - name: Remove temporary installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .duckie-update-v278
          rm -f Duckie-Days-v24.278-buddy-family-mimic-update-only.zip
          rm -f .github/workflows/install-duckie-days-v24-278-buddy-family-mimic-fix.yml
      - name: Commit app update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Group Buddy families and repair Mimic icons'
            git push
          fi

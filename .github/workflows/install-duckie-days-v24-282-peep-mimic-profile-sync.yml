name: Install Duckie Days v24.282 Peep Mimic Profile Sync

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.282-peep-mimic-profile-sync-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-282-peep-mimic-profile-sync.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-282-peep-mimic-profile-sync
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate update bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.282-peep-mimic-profile-sync-update-only.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.281"' version.json

      - name: Install and verify v24.282
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.282-peep-mimic-profile-sync-update-only.zip"
          TMP=".duckie-days-v24-282"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v282.py" "$TMP/tools/verify-v282.py"
          python3 "$TMP/tools/patch-v282.py"

          node --check script-v24-201.js
          node --check sw-v24-282.js
          node --check sw.js

          python3 "$TMP/tools/verify-v282.py"

      - name: Clean installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-282"
          rm -f "Duckie-Days-v24.282-peep-mimic-profile-sync-update-only.zip"
          rm -f ".github/workflows/install-duckie-days-v24-282-peep-mimic-profile-sync.yml"

      - name: Commit v24.282
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Sync Peep Mimic profile with Buddy Box instance"
          git push

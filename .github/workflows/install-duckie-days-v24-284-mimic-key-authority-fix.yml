name: Install Duckie Days v24.284 Mimic Key Authority Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.284-mimic-key-authority-fix-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-284-mimic-key-authority-fix.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-284-mimic-key-authority-fix
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate update bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.284-mimic-key-authority-fix-update-only.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.283"' version.json

      - name: Install and verify v24.284
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.284-mimic-key-authority-fix-update-only.zip"
          TMP=".duckie-days-v24-284"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v284.py" "$TMP/tools/verify-v284.py"
          python3 "$TMP/tools/patch-v284.py"

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/quest-v270.js
          node --check script-v24-201.js
          node --check sw-v24-284.js
          node --check sw.js

          python3 "$TMP/tools/verify-v284.py"

      - name: Clean installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-284"
          rm -f "Duckie-Days-v24.284-mimic-key-authority-fix-update-only.zip"
          rm -f ".github/workflows/install-duckie-days-v24-284-mimic-key-authority-fix.yml"

      - name: Commit v24.284
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Make Mimic form key authoritative"
          git push

name: Install Duckie Days v24.285 Book Wall Shelf

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.285-book-wall-shelf-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-285-book-wall-shelf.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-285-book-wall-shelf
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate update bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.285-book-wall-shelf-update-only.zip"

          test -f "$ZIP"
          unzip -tq "$ZIP"

          # This bundle was built directly from the user's current v24.284 repo.
          grep -Fq '"version": "24.284"' version.json

      - name: Install v24.285
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.285-book-wall-shelf-update-only.zip"
          TMP=".duckie-days-v24-285"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 "$TMP/tools/verify-v285.py"

          node --check script-v24-201.js
          node --check sw-v24-285.js
          node --check sw.js

      - name: Clean installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-285"
          rm -f "Duckie-Days-v24.285-book-wall-shelf-update-only.zip"
          rm -f ".github/workflows/install-duckie-days-v24-285-book-wall-shelf.yml"

      - name: Commit v24.285
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Add free Book wall shelf color choices"
          git push

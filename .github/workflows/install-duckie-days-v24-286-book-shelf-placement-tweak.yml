name: Install Duckie Days v24.286 Book Shelf Placement Tweak

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.286-book-shelf-placement-tweak-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-286-book-shelf-placement-tweak.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-286-book-shelf-placement-tweak
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate update bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.286-book-shelf-placement-tweak-update-only.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.285"' version.json

      - name: Install v24.286
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.286-book-shelf-placement-tweak-update-only.zip"
          TMP=".duckie-days-v24-286"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 "$TMP/tools/verify-v286.py"

          node --check script-v24-201.js
          node --check sw-v24-286.js
          node --check sw.js

      - name: Clean installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-286"
          rm -f "Duckie-Days-v24.286-book-shelf-placement-tweak-update-only.zip"
          rm -f ".github/workflows/install-duckie-days-v24-286-book-shelf-placement-tweak.yml"

      - name: Commit v24.286
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Lower and enlarge Book wall shelf placement"
          git push

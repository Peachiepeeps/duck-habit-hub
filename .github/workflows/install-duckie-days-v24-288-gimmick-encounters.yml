name: Install Duckie Days v24.288 Gimmick Encounters

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.288-gimmick-encounters-update-only.zip"
      - ".github/workflows/install-duckie-days-v24-288-gimmick-encounters.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-288-gimmick-encounters
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.288-gimmick-encounters-update-only.zip"

          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
            echo "v24.288 update bundle found."
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.288 update ZIP."
          fi

      - name: Validate current v24.287 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.288-gimmick-encounters-update-only.zip"

          unzip -tq "$ZIP"
          grep -Fq '"version": "24.287"' version.json

          # Guard the exact files this bundle replaces.
          test "$(git hash-object index.html)" = "924e2ab50b72bcff0bec52db24c2d44929b1b4e7"
          test "$(git hash-object duck-quest/index.html)" = "bf0b11878cfb36182efa320e792b8834e6a0a3b4"
          test "$(git hash-object duck-quest/js/game-v96.js)" = "6ea67f610a719fa4c17007bdae63e41ee691b173"

          test -f app.js
          test -f app.css
          test -f hub.css
          test -f trading-cards-base.js
          test -f trading-cards-extra.js

          # Preserve the user's manually tuned Book/shelf CSS.
          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.288
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.288-gimmick-encounters-update-only.zip"
          TMP=".duckie-days-v24-288"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/verify-v288.py"

          node --check trading-cards-gimmicks-v288.js
          node --check gimmick-hub-v288.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check sw.js

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-288"
          rm -f "Duckie-Days-v24.288-gimmick-encounters-update-only.zip"
          rm -f ".github/workflows/install-duckie-days-v24-288-gimmick-encounters.yml"

      - name: Commit v24.288
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Add rare gimmick encounters and rewards"
          git push

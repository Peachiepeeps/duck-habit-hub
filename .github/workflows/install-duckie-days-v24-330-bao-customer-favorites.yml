name: Install Duckie Days v24.330 Bao Customer Favorites

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.330-Bao-Customer-Favorites-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-330-bao-customer-favorites.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-cafe-favorites-24330-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-bao-favorites:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Duckie Days
        uses: actions/checkout@v4

      - name: Check for update ZIP
        id: update
        shell: bash
        run: |
          if [ -f Duckie-Days-v24.330-Bao-Customer-Favorites-update-only.zip ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Upload the matching v24.330 update ZIP to the repository root, then run this workflow.'
          fi

      - name: Install and verify Bao Café customer favorites
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256

          PACKAGE = 'Duckie-Days-v24.330-Bao-Customer-Favorites-update-only.zip'
          PACKAGE_SHA256 = '14fe19d7227de93d9c72e55b27d0ea106944c8a5084dae7b0f3fa32bc65c4e32'
          OLD = {'bao-cafe/index.html': 'c2370d82554f121effe52a44f788dc6b93ad6b88c7707f96dbe1a2a634a2ed3f', 'index.html': 'a2b84ad8696c084e0b24a6164a38d26ff59a3511683cda972ef948649a4b885e', 'sw.js': '93647ebe2d6f0dc9908ab19a36dd66d202f682d97d81a5d2634361c701923e39', 'version.json': 'aa2828e349cdc4140346ad23dc9fae9c5a021ebba862f3c5b71b179da60b90e2'}
          NEW = {'bao-cafe/index.html': '70b09c4d50edcb3b32361421253010e27622c0f94fec9c95eb8b1e9fa85b3048', 'index.html': '35b81a0399bcfde3f5a3e393dd5b8a7989a6b2a6f0c529cb78e88da0ad013769', 'sw.js': 'a36627dca778facc5e1257a16ad4157072abefb48f8a5a1814973122b0e8cb11', 'version.json': '841e33c3f3d6ddf67835f33adef5ff1b963a507788505e7c1d104595368f0bd1'}

          def digest(data):
              return sha256(data).hexdigest()

          archive_path = Path(PACKAGE)
          if digest(archive_path.read_bytes()) != PACKAGE_SHA256:
              raise SystemExit('The uploaded ZIP does not match the verified v24.330 download.')
          with ZipFile(archive_path) as archive:
              members = archive.namelist()
              if len(members) != len(NEW) or sorted(members) != sorted(NEW):
                  raise SystemExit('Unexpected files or duplicate paths found in the update ZIP.')
              updates = {name: archive.read(name) for name in NEW}

          for name, payload in updates.items():
              if digest(payload) != NEW[name]:
                  raise SystemExit('Update file checksum mismatch: ' + name)

          # Protect unrelated or newer edits; install only on the exact v24.329 files.
          states = []
          for name in OLD:
              p = Path(name)
              if not p.is_file():
                  raise SystemExit('Required Duckie Days file missing: ' + name)
              actual = digest(p.read_bytes())
              if actual not in (OLD[name], NEW[name]):
                  raise SystemExit('File differs from the verified v24.329 base; refusing overwrite: ' + name)
              states.append(actual == NEW[name])
          if any(states) and not all(states):
              raise SystemExit('Detected a partial version update; no files were changed.')

          for name, payload in updates.items():
              Path(name).write_bytes(payload)
          assert all(digest(Path(name).read_bytes()) == NEW[name] for name in NEW)
          print('Duckie Days v24.330 installed: 27 café customers, personalized favorites, and Surprise Me mode.')
          PYCODE

      - name: Remove used installation ZIP
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: rm -f 'Duckie-Days-v24.330-Bao-Customer-Favorites-update-only.zip'

      - name: Commit favorites update and trigger Pages deployment
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'bao-cafe/index.html' 'index.html' 'sw.js' 'version.json' 'Duckie-Days-v24.330-Bao-Customer-Favorites-update-only.zip'
          if git diff --cached --quiet; then
            echo 'Bao Café customer favorites are already installed.'
          else
            git commit -m 'Personalize Bao Café customers and Surprise Me (v24.330)'
            git push
          fi

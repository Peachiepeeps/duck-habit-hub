name: Install Duckie Days v24.331 Iced Coffee Sweetness Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.331-Iced-Coffee-Sweetness-Fix-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-331-iced-coffee-sweetness.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-iced-coffee-sweetness-v24331-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-iced-coffee-sweetness-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Duckie Days
        uses: actions/checkout@v4

      - name: Check for update ZIP
        id: update
        shell: bash
        run: |
          if [ -f Duckie-Days-v24.331-Iced-Coffee-Sweetness-Fix-update-only.zip ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Upload the matching v24.331 update ZIP to the repository root, then rerun the workflow.'
          fi

      - name: Verify and install Sweetness Station fix
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256

          PACKAGE = 'Duckie-Days-v24.331-Iced-Coffee-Sweetness-Fix-update-only.zip'
          PACKAGE_SHA256 = '838f77abc5ebd9234610b2a508b12c018b5b5732e6c62aaf45d4aec04fc26a80'
          OLD = {'bao-cafe/index.html': '70b09c4d50edcb3b32361421253010e27622c0f94fec9c95eb8b1e9fa85b3048', 'index.html': '35b81a0399bcfde3f5a3e393dd5b8a7989a6b2a6f0c529cb78e88da0ad013769', 'sw.js': 'a36627dca778facc5e1257a16ad4157072abefb48f8a5a1814973122b0e8cb11', 'version.json': '841e33c3f3d6ddf67835f33adef5ff1b963a507788505e7c1d104595368f0bd1'}
          NEW = {'bao-cafe/index.html': '4cdc729d972337cb54a15e61cbf25d08b714e2c274f3c7bbb2b127e5fe3f3f95', 'index.html': '69e5c2e6213845c4bca476f30ef597434f530b5e2484c7ca2adca9ea661af086', 'sw.js': 'b77d589c30c621b9314b8f72301136756801ad4cb03a702ad6b44f39611e5b0d', 'version.json': '2abb1903874fe727d140ddc2c45e56cd0abc85166f16e60edf28115790c74acd'}

          def digest(data):
              return sha256(data).hexdigest()

          archive_path = Path(PACKAGE)
          if digest(archive_path.read_bytes()) != PACKAGE_SHA256:
              raise SystemExit('The uploaded ZIP does not match the verified v24.331 package.')
          with ZipFile(archive_path) as archive:
              members = archive.namelist()
              if len(members) != len(NEW) or sorted(members) != sorted(NEW):
                  raise SystemExit('Unexpected or duplicate paths inside the update ZIP.')
              updates = {name: archive.read(name) for name in NEW}

          for name, payload in updates.items():
              if digest(payload) != NEW[name]:
                  raise SystemExit('Update file checksum mismatch: ' + name)

          # Only apply to the exact v24.330 files; never overwrite unrelated edits.
          states = []
          for name in OLD:
              p = Path(name)
              if not p.is_file():
                  raise SystemExit('Required file missing: ' + name)
              actual = digest(p.read_bytes())
              if actual not in (OLD[name], NEW[name]):
                  raise SystemExit('File does not match v24.330; install that version first or inspect changes: ' + name)
              states.append(actual == NEW[name])
          if any(states) and not all(states):
              raise SystemExit('Partial patch detected; refusing to modify files.')

          for name, payload in updates.items():
              Path(name).write_bytes(payload)
          assert all(digest(Path(name).read_bytes()) == NEW[name] for name in NEW)
          print('Iced Coffee now has brown liquid artwork in the Sweetness Station. (v24.331)')
          PYCODE

      - name: Remove installed ZIP
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: rm -f 'Duckie-Days-v24.331-Iced-Coffee-Sweetness-Fix-update-only.zip'

      - name: Commit fix and trigger Pages deployment
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'bao-cafe/index.html' 'index.html' 'sw.js' 'version.json' 'Duckie-Days-v24.331-Iced-Coffee-Sweetness-Fix-update-only.zip'
          if git diff --cached --quiet; then
            echo 'Iced Coffee Sweetness Station fix is already installed.'
          else
            git commit -m 'Fix Iced Coffee liquid color in Sweetness Station (v24.331)'
            git push
          fi

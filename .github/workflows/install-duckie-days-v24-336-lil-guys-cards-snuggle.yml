name: Install Duckie Days v24.336 Lil Guys Cards and Snuggle Ducks

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.336-Lil-Guys-Variants-Snuggle-Ducks-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-336-lil-guys-cards-snuggle.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-v24336-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-lil-guys:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check for update ZIP
        id: update
        shell: bash
        run: |
          if [ -f 'Duckie-Days-v24.336-Lil-Guys-Variants-Snuggle-Ducks-update-only.zip' ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Upload Duckie-Days-v24.336-Lil-Guys-Variants-Snuggle-Ducks-update-only.zip to the repository root and rerun the workflow.'
          fi
      - name: Verify and install the exact v24.336 package
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile

          PACKAGE='Duckie-Days-v24.336-Lil-Guys-Variants-Snuggle-Ducks-update-only.zip'
          PACKAGE_SHA256='70399135685f19b1a5238cee7e3ddd4400f1b6f5e540e728761e49f10e938526'
          EXPECTED_OLD={'app.js': 'd41e72d55b1c9cb27ef7973825cca8c1bfb1b51c084f64cdd9a91eac75bd99f9', 'duck-quest/index.html': '41417c8a7a4c611385683676d5275f91435b32a054c5518735fdb6c1337ae214', 'duck-quest/js/game-v96.js': '02871beb1e58d83eb2feba78109f3a9ce9fe657885d459f660adbc6d5e60dbcb', 'index.html': '8fd2715759e51d8ce99f001f3a0757f8cf98fccd12cdbd9523f093d3e42d3990', 'sw.js': '8eef79f83482dceb785a7f66dc2b6db5f62f246cdc10581b6ea5e3f3238a973c', 'tasks.css': 'cf9945b595f8d46712263aab226b8e7e749d273014a0114c65a9e1c31778a53b', 'tasks.js': '46a013363a92d266b21fe025acd06d1ca180677e042d804f00616950014b4ec9', 'trading-cards-ui.js': '7693ba38e06254fa4c2b5d93cf0fbeac81cf9133b2235f17830060c632b503cb', 'version.json': '217d4af604887c7695bec459ecbf9dba97430832ee22a8df7301e63d25ce4cbe'}
          EXPECTED_NEW={'app.js': 'a2d824c4755891ed21cbe62f80ed468deca71096e2e869f32d81f8610a8f2362', 'duck-quest/index.html': '4e9e1deab92f4c516681df7779798d395a79f73edf27f584cd78e742cde3161a', 'duck-quest/js/game-v96.js': '5d56993d1f69ec8e581b5a1ccaec4d4228120eeb2aff51615598fc60b9cfa00b', 'duck-quest/js/lil-guys-capture-v336.js': '399f82cfa7166bca669db93f1a06f6ed4ffde09138db8d0bed8d0e9e056c32f1', 'index.html': 'e8fd4f7ba2fedd8dd85c6bed9c0abb92474e0922ddd6bffc9fcb7ee33de7b29e', 'sw.js': '8d67231254b0252cb155c525fc9bf5bdd8d5388b6ac787739310fa438cffb75b', 'tasks.css': 'd3a7dd89b44604af8c7b20955070be3c3ed9740fb89a11681c3c7cdacc0b5e8b', 'tasks.js': 'c3a3ef4da845ad90ee1b51c2523e642e5fcfa3708f1a5efd83ba5c9b50b5652b', 'trading-cards-lil-guys-v336.css': '33f6e47bc5eb76e78da7097d50a6d0a378e5a1a4a109c8267eb9d6a896726965', 'trading-cards-lil-guys-v336.js': 'ad7ac08d8ab4503f029f0eb1f2c7c595932de4cf9e544519b20304e2114a642e', 'trading-cards-ui.js': '23637cfe5a8df8587972c78d3bb3697d4725b5978718d4e14e3595682ee1566c', 'version.json': '6b82b1ebecfd2492168e799c46f909c414acc37bee72a929318b1cd69c50229f'}

          def digest(data):
              return sha256(data).hexdigest()

          package=Path(PACKAGE)
          if not package.is_file():
              raise SystemExit('Upload the exact v24.336 update ZIP into the repository root first.')
          if digest(package.read_bytes())!=PACKAGE_SHA256:
              raise SystemExit('ZIP checksum mismatch. Please use the matching v24.336 ZIP.')
          with ZipFile(package) as archive:
              names=archive.namelist()
              if sorted(names)!=sorted(EXPECTED_NEW) or len(names)!=len(EXPECTED_NEW):
                  raise SystemExit('Unexpected paths in ZIP. No game files changed.')
              updates={name:archive.read(name) for name in EXPECTED_NEW}
          for name,content in updates.items():
              if digest(content)!=EXPECTED_NEW[name]:
                  raise SystemExit('File checksum mismatch inside ZIP: '+name)

          before={}
          for name in EXPECTED_NEW:
              path=Path(name)
              before[name]=digest(path.read_bytes()) if path.is_file() else None
              if name in EXPECTED_OLD:
                  if before[name] not in (EXPECTED_OLD[name],EXPECTED_NEW[name]):
                      raise SystemExit('Unexpected code version or edits in '+name+'; refusing to overwrite.')
              elif before[name] not in (None,EXPECTED_NEW[name]):
                  raise SystemExit('Unexpected preexisting file '+name+'; refusing to overwrite.')

          if all(before[name]==EXPECTED_NEW[name] for name in EXPECTED_NEW):
              print('Duckie Days v24.336 is already installed.')
          elif all(before[name]==EXPECTED_OLD.get(name,None) for name in EXPECTED_NEW):
              for name,content in updates.items():
                  path=Path(name)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(content)
              assert all(digest(Path(name).read_bytes())==EXPECTED_NEW[name] for name in EXPECTED_NEW)
              print('Installed Duckie Days v24.336: Lil Guys + variant cards + Snuggle Ducks.')
          else:
              raise SystemExit('Partial or mixed update detected. No files changed; restore previous version or review manually.')
          package.unlink(missing_ok=True)
          PYCODE
      - name: Commit and push updated game files
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'app.js' 'duck-quest/index.html' 'duck-quest/js/game-v96.js' 'duck-quest/js/lil-guys-capture-v336.js' 'index.html' 'sw.js' 'tasks.css' 'tasks.js' 'trading-cards-lil-guys-v336.css' 'trading-cards-lil-guys-v336.js' 'trading-cards-ui.js' 'version.json' 'Duckie-Days-v24.336-Lil-Guys-Variants-Snuggle-Ducks-update-only.zip'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Install Duckie Days v24.336: Lil Guys, card variants and Snuggle Ducks'
            git push
          fi

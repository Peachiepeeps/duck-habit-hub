name: Install Duckie Days v24.337 + Clean Old Installers

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.337-Bao-Cafe-Soda-Flavors-Cleanup-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-337-bao-soda-flavor-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-install-v24337-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check whether release ZIP is uploaded
        id: package
        shell: bash
        run: |
          if [ -f 'Duckie-Days-v24.337-Bao-Cafe-Soda-Flavors-Cleanup-update-only.zip' ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Upload the v24.337 ZIP beside index.html, then rerun this workflow.'
          fi
      - name: Install verified Bao Cafe fixes and clean obsolete installers
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          import subprocess

          PACKAGE='Duckie-Days-v24.337-Bao-Cafe-Soda-Flavors-Cleanup-update-only.zip'
          PACKAGE_SHA='845bb3db3f14300e9fe8d44e46ec629e1dd45a1e45fbf2e93d329c2e9847822f'
          OLD={'bao-cafe/index.html': 'cf9370c488942abb43db60750d0eb0519bccb6328a7f24bde1a29e49e4b0414b', 'index.html': 'e8fd4f7ba2fedd8dd85c6bed9c0abb92474e0922ddd6bffc9fcb7ee33de7b29e', 'sw.js': '8d67231254b0252cb155c525fc9bf5bdd8d5388b6ac787739310fa438cffb75b', 'version.json': '6b82b1ebecfd2492168e799c46f909c414acc37bee72a929318b1cd69c50229f'}
          NEW={'bao-cafe/index.html': '7d6c748d1d59725cffe78ddbf355f7ae66afc8d13145110597f8ad63ea9f9f8d', 'index.html': '61b63623f0a8219b548c9b0982f9aeffd25858661415edac331e42a019312590', 'sw.js': 'a8fd8b13eef4a196cb0102deeca11960d77f951bc9d2431484b3278c86a840c4', 'version.json': '8d6f426e34256cf19bdc8d3adec216494426e7f7349aa2eee5178e25063af444'}
          OBSOLETE={'.github/workflows/Duckie-Days-v24.335-Installer.yml': '675f3fbb52794d784492d5af764580fb20342a14', '.github/workflows/Hold': '8b137891791fe96927ad78e64b0aad7bded08bdc', '.github/workflows/install-bao-cafe-v12-55.yml': '16bffa848874f19481bc5b8fc083402e9f88efc1', '.github/workflows/install-duckie-days-v24-326-remaining-miko-love-interests-REDO.yml': 'e2d9301397c8dd7b5b15988c028669e527539cfd', '.github/workflows/install-duckie-days-v24-327-qol.yml': '62ad97fee1708d8a61ec523a3115c410a4ff9f59', '.github/workflows/install-duckie-days-v24-328-iced-coffee.yml': '8b5f7e3b865d56b4adc51a3d4536a19b0e35a648', '.github/workflows/install-duckie-days-v24-329-bao-new-flavors.yml': 'ac562f6d7283e44661ef5dbcaadc5f231a141e7f', '.github/workflows/install-duckie-days-v24-330-bao-customer-favorites.yml': '3e0856f3c7269af4cb9d707203e00b39c570fdc8', '.github/workflows/install-duckie-days-v24-331-iced-coffee-sweetness.yml': '1e7fc0015881f124fb08439c27f64cdde0217b28', '.github/workflows/install-duckie-days-v24-334-bao-extra-favorites.yml': 'ade3186be87a563272e166e898c5eaceb13aff19', 'Duckie-Days-v24.325-game-card-polish.zip': '84053929e243bb1df9215f203dcc132428b29d45', 'DUCKIE-DAYS-v24.313-README.txt': '904315dd39afa2b874c59c5225767d5f96984e3e', 'UPDATE-v24.326.txt': '2f37f675de98ebe4b4352ec636e16bd0216f3331', 'CHANGELOG-LATEST.txt': '5b9fcc92b4bc6ebdeb309ce06da1cfc3da63248a'}

          def digest(contents):
              return sha256(contents).hexdigest()

          pkg=Path(PACKAGE)
          if not pkg.is_file():
              raise SystemExit('Upload the matching v24.337 ZIP to the repository root and rerun this installer.')
          if digest(pkg.read_bytes()) != PACKAGE_SHA:
              raise SystemExit('Incorrect v24.337 update ZIP. Nothing has been changed.')
          with ZipFile(pkg) as archive:
              names=archive.namelist()
              if len(names)!=len(NEW) or sorted(names)!=sorted(NEW):
                  raise SystemExit('Unexpected paths in update ZIP; refusing to install.')
              updates={p:archive.read(p) for p in NEW}
          for p,data in updates.items():
              if digest(data)!=NEW[p]:
                  raise SystemExit('Update ZIP file failed checksum: '+p)
          for p in OLD:
              if not Path(p).is_file():
                  raise SystemExit('Expected installed game file is missing: '+p)
              if digest(Path(p).read_bytes()) not in (OLD[p],NEW[p]):
                  raise SystemExit('Unexpected edits to game file; refusing overwrite: '+p)
          states=[digest(Path(p).read_bytes())==NEW[p] for p in NEW]
          if all(states):
              print('v24.337 code is already installed; cleanup can still run.')
          elif not any(states):
              for p,data in updates.items():
                  Path(p).write_bytes(data)
              assert all(digest(Path(p).read_bytes())==NEW[p] for p in NEW)
              print('Installed v24.337 Soda, Sweetness and Flavor fixes.')
          else:
              raise SystemExit('Detected partial update; no installation performed.')

          removed=[]
          skipped=[]
          for path,expected_sha in OBSOLETE.items():
              file=Path(path)
              if not file.is_file():
                  continue
              actual=subprocess.check_output(['git','hash-object',str(file)],text=True).strip()
              if actual!=expected_sha:
                  skipped.append(path)
                  print('Preserving modified old file: '+path)
                  continue
              file.unlink()
              removed.append(path)
          # Never remove artwork, active JS/CSS, newest installer, or unknown files.
          pkg.unlink(missing_ok=True)
          print(f'Cleaned {len(removed)} verified obsolete repository files; {len(skipped)} edited files preserved.')
          PYCODE
      - name: Commit and push checked changes
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Fresh checkout: changes are limited to verified release files and old installer debris.
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Duckie Days v24.337: fix cafe soda/flavor shelves and clean obsolete installers'
            git push
          fi

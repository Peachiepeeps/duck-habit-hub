name: Install Duckie Days v24.338 Flavor Station + Head Duck Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.338-Flavor-Station-and-Head-Duck-Fix-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-338-flavor-station-head-duck-fix.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-install-v24338-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether release ZIP is uploaded
        id: package
        shell: bash
        run: |
          if [ -f 'Duckie-Days-v24.338-Flavor-Station-and-Head-Duck-Fix-update-only.zip' ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Upload the v24.338 ZIP beside index.html, then rerun this workflow.'
          fi

      - name: Install verified v24.338 fix
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile

          PACKAGE='Duckie-Days-v24.338-Flavor-Station-and-Head-Duck-Fix-update-only.zip'
          PACKAGE_SHA='6c2655b5482293753541c5b3a61665f77ab4d1c3a7cf6ba6c060ed1edd29d557'
          OLD={
            'tasks.js': 'c3a3ef4da845ad90ee1b51c2523e642e5fcfa3708f1a5efd83ba5c9b50b5652b',
            'index.html': '61b63623f0a8219b548c9b0982f9aeffd25858661415edac331e42a019312590',
            'sw.js': 'a8fd8b13eef4a196cb0102deeca11960d77f951bc9d2431484b3278c86a840c4',
            'version.json': '8d6f426e34256cf19bdc8d3adec216494426e7f7349aa2eee5178e25063af444',
            'bao-cafe/index.html': '7d6c748d1d59725cffe78ddbf355f7ae66afc8d13145110597f8ad63ea9f9f8d'
          }
          NEW={
            'tasks.js': 'f191f35b66bccb5c1304e20796505bfd96bb01538c691318ceccb5105d88fc51',
            'index.html': '442153b052de5d502c62064bee8c57edb12939b94162c08876534a6e939cb0d1',
            'sw.js': '1003f6984ba0498bdc40fbe56db1c683c0998b09f0225d2accff4f9d10ada643',
            'version.json': '04ddab6dba9b5fc02143abce05aee8398f16fb862a2ba9f6c5ce992ec876a839',
            'bao-cafe/index.html': 'a30a93a5863eb54df9f2fb449c4386f1da5ca44e84b06515aeade301e742eb51'
          }

          def digest(contents: bytes) -> str:
              return sha256(contents).hexdigest()

          pkg=Path(PACKAGE)
          if not pkg.is_file():
              raise SystemExit('Upload the matching v24.338 update ZIP to the repository root and rerun this installer.')
          if digest(pkg.read_bytes()) != PACKAGE_SHA:
              raise SystemExit('Incorrect v24.338 update ZIP. Nothing has been changed.')

          with ZipFile(pkg) as archive:
              members=archive.namelist()
              # ZIPs made by ordinary archivers can contain a folder entry.
              # Ignore only the expected Bao Cafe directory, never unknown paths.
              folders=[name for name in members if name.endswith('/')]
              names=sorted(name for name in members if not name.endswith('/'))
              if folders not in ([], ['bao-cafe/']) or names != sorted(NEW):
                  raise SystemExit('Unexpected paths in update ZIP; refusing to install.')
              updates={p:archive.read(p) for p in NEW}

          # Verify the exact ZIP already uploaded to GitHub. Its original Bao Cafe
          # entry has an older bottle sheet, so we'll patch the installed v24.337
          # station below instead of accidentally restoring those old bottles.
          BUNDLE_SHA={**NEW,'bao-cafe/index.html':'6e4ec696584a5af7185fa92ef5ba1d8218a4434d1beb9bd874bd7fca423d251b'}
          for p,data in updates.items():
              if digest(data) != BUNDLE_SHA[p]:
                  raise SystemExit('Update ZIP file failed checksum: '+p)

          for p in NEW:
              file=Path(p)
              if not file.is_file():
                  raise SystemExit('Expected installed game file is missing: '+p)
              current=digest(file.read_bytes())
              if current not in (OLD[p], NEW[p]):
                  raise SystemExit('Unexpected edits to game file; refusing overwrite: '+p)

          states=[digest(Path(p).read_bytes()) == NEW[p] for p in NEW]
          if all(states):
              print('v24.338 code is already installed.')
          elif not any(states):
              # Preserve the completed v24.337 bottle artwork and flavor symbols.
              # Correct only the number of shelves, visible cards, and pagination.
              flavor=Path('bao-cafe/index.html').read_bytes()
              flavor_patches=[
                  (b'const PAGE_SIZE=14;',b'const PAGE_SIZE=25;',1),
                  (b'rowStart\\u003c15',b'rowStart\\u003c25',1),
                  (b'grid-template-rows:repeat(3,minmax(0,1fr));',
                   b'grid-template-rows:repeat(5,minmax(0,1fr));',2),
              ]
              for before,after,count in flavor_patches:
                  if flavor.count(before)!=count:
                      raise SystemExit('Unexpected flavor layout content; refusing overwrite.')
                  flavor=flavor.replace(before,after)
              updates['bao-cafe/index.html']=flavor
              for p,data in updates.items():
                  if digest(data)!=NEW[p]:
                      raise SystemExit('Fixed update failed verification: '+p)
              for p,data in updates.items():
                  Path(p).write_bytes(data)
              assert all(digest(Path(p).read_bytes()) == NEW[p] for p in NEW)
              print('Installed v24.338 Flavor Station + Head Duck fix.')
          else:
              raise SystemExit('Detected partial update; no installation performed.')

          pkg.unlink(missing_ok=True)
          PYCODE

      - name: Commit and push checked changes
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Duckie Days v24.338: flavor station layout and head duck spacing fix'
            git push
          fi

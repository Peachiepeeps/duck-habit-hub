name: Install Duckie Days v24.341 Quest Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.341-Quest-Button-Card-Midori-Fixes-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-341-quest-polish.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-install-24341-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out game repository
        uses: actions/checkout@v4
      - name: Check update ZIP
        id: package
        shell: bash
        run: |
          if [ -f 'Duckie-Days-v24.341-Quest-Button-Card-Midori-Fixes-update-only.zip' ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Update ZIP not present. Upload it and rerun the installer.'
          fi
      - name: Install safe, verified v24.341 update
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile

          PACKAGE='Duckie-Days-v24.341-Quest-Button-Card-Midori-Fixes-update-only.zip'
          PACKAGE_SHA='9fa9c244fe10ba09c3ff58b54fd43b58d60bb670cdbb5b478a58ec5aaf7964b9'
          OLD={'duck-quest/index.html': '7340bd84701bb306737f147df3b05d6a476ffb21fa976d295e7e1486d15eba89', 'duck-quest/js/love-interests-v326.js': '2a50ef69edc20ef6d618290a81fea7c7b0fc5ed4a9778e0be8e8d9a1b4bdacd9', 'duck-quest/js/fixes-v341.js': None, 'index.html': '9e6d88576411796585d15b7af83fca9194d19dce8d2e2b10a9fb5794848d2b8c', 'sw.js': 'd5a3d5de0c86aad7bb06595a2c58cf8866709b4ef1952454f4ee953eae8ed2f0', 'version.json': 'c750d4b19d18041f28f57df6279e13ea98e2c30228205cbfecad86d685469d8b'}
          NEW={'duck-quest/index.html': '3210d07e0844eb0ede2212fa21e3557af237e9522542bc8f39c88efbd8050a1f', 'duck-quest/js/love-interests-v326.js': 'b0b1551c16e2cadfd216871cd351296db47e71f4ef318cf461ec0837ac1f2130', 'duck-quest/js/fixes-v341.js': '1c2a6ccda0f944c1587b75e5cffbd0a0d51ad73bf564f84d66727dcdfa6ec2b4', 'index.html': 'd2de45ded73e6b2db23dd70e8f8adb1ffb5f022b6d9f1612dc48025401a86dce', 'sw.js': '6302832c5c25f224c3b824ee026451cb0fe024bc67e8ad6987200712b83eb298', 'version.json': 'b2ca7c8fdb3db9ef0e409620d93c725d0619ed35a74b813a3cc955a4d679d457'}

          def digest(contents):
              return sha256(contents).hexdigest()

          pkg=Path(PACKAGE)
          if not pkg.is_file():
              raise SystemExit('Upload the matching update-only ZIP to repository root and run again.')
          if digest(pkg.read_bytes()) != PACKAGE_SHA:
              raise SystemExit('Wrong update ZIP / checksum. No changes made.')
          with ZipFile(pkg) as archive:
              names=archive.namelist()
              if len(names)!=len(NEW) or set(names)!=set(NEW):
                  raise SystemExit('Unexpected ZIP entries. No changes made.')
              updates={path:archive.read(path) for path in NEW}
          for path,contents in updates.items():
              if digest(contents)!=NEW[path]:
                  raise SystemExit('Corrupted update file: '+path)

          # Verify every path before making any modifications
          states=[]
          for path in NEW:
              target=Path(path)
              if not target.exists():
                  if OLD[path] is None:
                      states.append('old')
                      continue
                  raise SystemExit('Missing required v24.340 file: '+path)
              checksum=digest(target.read_bytes())
              if checksum==NEW[path]:states.append('new')
              elif checksum==OLD[path]:states.append('old')
              else:raise SystemExit('Unexpected local edit; refusing overwrite: '+path)

          if all(s=='new' for s in states):
              print('v24.341 already installed.')
          elif all(s=='old' for s in states):
              for path,contents in updates.items():
                  target=Path(path)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(contents)
              assert all(digest(Path(path).read_bytes())==NEW[path] for path in NEW)
              print('Installed v24.341 over exact v24.340 baseline.')
          else:
              raise SystemExit('Partial update detected. No changes made.')

          pkg.unlink(missing_ok=True)

          PYCODE
      - name: Commit and push patched files
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Duckie Days v24.341: Quest home buttons, event card cleanup, Midori pacing'
            git push
          else
            echo 'Nothing to commit.'
          fi

name: Install Duckie Days v24.342 - Bao Effects, EXP Candy and Hub OC

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.342-Bao-Textures-EXP-Candy-Hub-Alignment-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-342-bao-candy-oc.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-v24342-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
      - name: Check for matching release package
        id: update
        shell: bash
        run: |
          if [ -f 'Duckie-Days-v24.342-Bao-Textures-EXP-Candy-Hub-Alignment-update-only.zip' ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Upload the v24.342 update ZIP to the repository root, then rerun.'
          fi
      - name: Install verified update
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          
          PACKAGE='Duckie-Days-v24.342-Bao-Textures-EXP-Candy-Hub-Alignment-update-only.zip'
          PACKAGE_SHA='40da8fbdb1a9c01e99aade7850a386141b289092bbd0b0bb0ff89f78e6c136a8'
          OLD={'app.css': '915c640e6810d8b8f80a1749f7ed0e5ae466b61fb7b12c51fa2373003b94d252', 'app.js': '5e44dad4b94108b15ab7d411d0bfed15d6d4e4bfdf5c6ce99a5d60265b4db0d0', 'bao-cafe/index.html': '2165294069c6ab2778b24ac78a831a2a9e4614041d9ee3dd508df2b9066d94c7', 'duck-quest/index.html': '3210d07e0844eb0ede2212fa21e3557af237e9522542bc8f39c88efbd8050a1f', 'duck-quest/js/boost-items-v213.js': 'c357d4e45db55c921930684fdfcf32503dfd0add7dd134b26421337a29458a37', 'index.html': 'd2de45ded73e6b2db23dd70e8f8adb1ffb5f022b6d9f1612dc48025401a86dce', 'sw.js': '6302832c5c25f224c3b824ee026451cb0fe024bc67e8ad6987200712b83eb298', 'tasks.css': 'd3a7dd89b44604af8c7b20955070be3c3ed9740fb89a11681c3c7cdacc0b5e8b', 'version.json': 'b2ca7c8fdb3db9ef0e409620d93c725d0619ed35a74b813a3cc955a4d679d457'}
          NEW={'app.css': 'ae21e797a116f6606508ab6950bad83db21dd6a788bdabd074a8b18b38124985', 'app.js': 'cd5a3148f48818ee3988ba9105cad5a6f885ac9334d8529a41a4598fdb490b8a', 'bao-cafe/index.html': 'e27dbe1f3512fab0698b97009a898a1a40f419c9ed41209d42802ed4e937a0e8', 'duck-quest/index.html': '850dde00e608d5ae792efd1941e248072bef970e950da8cbc8e0157d6cd15952', 'duck-quest/js/boost-items-v213.js': '2740651b375a590c0fc7eed0201ffde78f3402faa06520ed3a11828e24fc6e69', 'index.html': '73c44ba39560a5cc30b560c3574da6391744c493a39c170bd98199e7107d80d2', 'sw.js': '0375302b5bd64254e1f9bf75ae63e42a30557c2661cf893d8e10a30fe0500925', 'tasks.css': 'ad13088534a67aca5b42be0635d74564ff1de1cdfd04c1fb67d0203804d3598a', 'version.json': '993fc8cc5b839b99d4b656bb620a561cef2c8e1a4d3aef6ff08ff405abef0580'}
          
          def checksum(data):
              return sha256(data).hexdigest()
          
          package=Path(PACKAGE)
          if not package.is_file():
              raise SystemExit('Upload the v24.342 update ZIP beside index.html first.')
          if checksum(package.read_bytes())!=PACKAGE_SHA:
              raise SystemExit('The update ZIP checksum does not match v24.342. No changes were made.')
          with ZipFile(package) as archive:
              names=archive.namelist()
              if sorted(names)!=sorted(NEW):
                  raise SystemExit('Unexpected or missing update ZIP entries. Refusing installation.')
              updates={path:archive.read(path) for path in NEW}
          for path,data in updates.items():
              if checksum(data)!=NEW[path]:
                  raise SystemExit('Invalid checksum for '+path)
          for path in NEW:
              file=Path(path)
              if not file.is_file():
                  raise SystemExit('Missing baseline game file: '+path)
              current=checksum(file.read_bytes())
              if current not in (OLD[path],NEW[path]):
                  raise SystemExit('Unexpected existing edits to '+path+'. Nothing overwritten.')
          states=[checksum(Path(path).read_bytes())==NEW[path] for path in NEW]
          if all(states):
              print('v24.342 already installed.')
          elif any(states):
              raise SystemExit('Partial v24.342 installation found; refusing changes.')
          else:
              for path,data in updates.items():
                  Path(path).write_bytes(data)
              assert all(checksum(Path(path).read_bytes())==NEW[path] for path in NEW)
              print('Installed v24.342!')
          package.unlink(missing_ok=True)
          PYCODE
      - name: Commit game changes
        if: steps.update.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Already up to date.'
          else
            git commit -m 'Duckie Days v24.342 - consistent drink effects, EXP candies and room alignment'
            git push
          fi

          def digest(data):
              return sha256(data).hexdigest()
          
          package = Path(PACKAGE)
          if not package.is_file():
              raise SystemExit("Upload the v24.344 update-only ZIP beside index.html and rerun this installer.")
          if digest(package.read_bytes()) != PACKAGE_SHA:
              raise SystemExit("The v24.344 ZIP doesn't match the verified release. No changes made.")
          
          expected = {**{p:x[1] for p,x in CHANGED.items()}, **NEW}
          with ZipFile(package) as z:
              entries = [entry for entry in z.infolist() if not entry.is_dir()]
              names = [entry.filename for entry in entries]
              if sorted(names) != sorted(expected) or len(names) != len(set(names)):
                  raise SystemExit("Unexpected or repeated ZIP paths; refusing installation.")
              updates = {}
              for entry in entries:
                  rel=Path(entry.filename)
                  if rel.is_absolute() or ".." in rel.parts or "\\" in entry.filename:
                      raise SystemExit("Unsafe ZIP path: " + entry.filename)
                  if entry.file_size > 16 * 1024 * 1024:
                      raise SystemExit("Unexpectedly large update file: "+entry.filename)
                  content=z.read(entry)
                  if digest(content) != expected[entry.filename]:
                      raise SystemExit("Checksum failed for: " + entry.filename)
                  updates[entry.filename]=content
          
          # Preflight ALL paths before writing anything; preserve unrelated changes.
          partial=[]
          for rel, (oldhash,newhash) in CHANGED.items():
              p=Path(rel)
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("Required v24.343 file is missing: " + rel)
              seen=digest(p.read_bytes())
              if seen not in (oldhash,newhash):
                  raise SystemExit("Local changes detected; refusing to overwrite: " + rel)
              partial.append(seen==newhash)
          for rel,newhash in NEW.items():
              p=Path(rel)
              if p.exists() and (not p.is_file() or p.is_symlink() or digest(p.read_bytes())!=newhash):
                  raise SystemExit("Conflicting existing artwork; refusing overwrite: " + rel)
          
          if any(partial) and not all(partial):
              raise SystemExit("Partial prior installation detected; no further changes made.")
          
          for rel,content in updates.items():
              dest=Path(rel)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(content)
          assert all(digest(Path(rel).read_bytes())==digest(data) for rel,data in updates.items())
          package.unlink()
          print("Installed Duckie Days v24.344 City Streets expansion, including eggs, cards, Endless, and Duckie Dash.")

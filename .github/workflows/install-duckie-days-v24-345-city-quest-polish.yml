name: Install Duckie Days v24.345 City Quest Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.345-Hatching-City-Crown-Owl-Candy-Fixes-update-only.zip'
      - '.github/workflows/install-duckie-days-v24-345-city-quest-polish.yml'

permissions:
  contents: write
concurrency:
  group: duckie-days-v24345-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified v24.345 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          import json
          PACKAGE="Duckie-Days-v24.345-Hatching-City-Crown-Owl-Candy-Fixes-update-only.zip"
          PACKAGE_SHA="bcb932a9dd42d3ea2be224ea786c5f588c7d1dc871177c025a4046a7f1261cfc"
          EXISTING=json.loads(r'''{"app.css":["ae21e797a116f6606508ab6950bad83db21dd6a788bdabd074a8b18b38124985","be2f6dd9601895f7277ff5b4f0f4345d664cba2777123769a528146ea6a399f4"],"app.js":["cd5a3148f48818ee3988ba9105cad5a6f885ac9334d8529a41a4598fdb490b8a","05ff4953472a17ec837d4cfbe8904a3f7a2aea4c15abd15031b85671a8f8a95f"],"duck-quest/index.html":["d1840dbc0fd4ea5f45d95e393e5c4951129b6fe7819ee877beeb371d1c06a56e","5630ab2866e68d522736eee02878453650994dcc5cd94fcd51fdfd10380cc20a"],"duck-quest/js/boost-items-v213.js":["2740651b375a590c0fc7eed0201ffde78f3402faa06520ed3a11828e24fc6e69","8c07bb5c49a70a17c3c0484982de6eff2caee4a74ac02e3567b3a77efbdfe731"],"duck-quest/js/fixes-v341.js":["1c2a6ccda0f944c1587b75e5cffbd0a0d51ad73bf564f84d66727dcdfa6ec2b4","f1b34b4a950d126c7945f7aab7bf4ba475c4616a3a264aed50728ba56f0bd1ba"],"duck-quest/js/game-v96.js":["d3292a1f5dbafea28aa661cf2cb3d193df4e62925cb13ce28f2cccddcbf6ace7","383dba75667d0cd7ef83d24f6182a9a5d076f10171251ed8e298deade4d7934a"],"duck-quest/js/hatchery-v179.js":["f939db99f21b26d8cb8f52a92831b66534b683ce888d11286a788f73630f6d5a","045a65761523047a1a3dc02e30ee09331066a12514df9e7d388bf79a3ef1da2a"],"duck-quest/js/new-enemies-v313.js":["b6257f693d369ccf03bf7b9f65117ad5eee1175f003f9f52dde9b2b5f1ea306f","190965401c18fcf01b051049994b72af5714dd278a0f1e6c4aa2e5586ed126c5"],"index.html":["11128cf49386a174aa22e7ee90e165884fb851851aa6c93b12821ecb52609229","b5e9eda044817079325042f77bd892d65f139a024b209777be2c2dc15557b49b"],"sw.js":["d87d35137efc9e817703e3829389d841bfccade189b71e9e467ff567effdba40","65845ad8951795ddddabe78721ed6e8b71d71950ded9b023abffb358ddb5d1b4"],"version.json":["d74744fe42eba68b2f6f42e188c02236fae035ce73276ce5cbfd926d0f33730f","9625cc9c87dd21961d2aeb278da552ba91860524841a552879d1ee0200fb556b"]}''')
          NEW=json.loads(r'''{"assets/annika/City-Crown-Base.png":"18bd4023af3199f42e2744f72f6aeeb9fe103452731ccbc507e14ba07ff9c66c","assets/io/City-Crown-Base.png":"18bd4023af3199f42e2744f72f6aeeb9fe103452731ccbc507e14ba07ff9c66c","assets/miho/City-Crown-Base.png":"18bd4023af3199f42e2744f72f6aeeb9fe103452731ccbc507e14ba07ff9c66c","assets/miko/City-Crown-Base.png":"18bd4023af3199f42e2744f72f6aeeb9fe103452731ccbc507e14ba07ff9c66c","assets/peep/City-Crown-Base.png":"18bd4023af3199f42e2744f72f6aeeb9fe103452731ccbc507e14ba07ff9c66c"}''')
          def digest(data):return sha256(data).hexdigest()
          pkg=Path(PACKAGE)
          if not pkg.is_file():raise SystemExit("Upload the v24.345 update ZIP to the repository root and rerun the workflow.")
          if digest(pkg.read_bytes())!=PACKAGE_SHA:raise SystemExit("Wrong v24.345 release ZIP; no changes made.")
          expected={**{p:x[1] for p,x in EXISTING.items()},**NEW}
          with ZipFile(pkg) as z:
           entries=z.infolist()
           names=[e.filename for e in entries]
           if any(e.is_dir() for e in entries) or sorted(names)!=sorted(expected) or len(set(names))!=len(names):
            raise SystemExit("Unexpected or repeated ZIP entries; no changes made.")
           updates={}
           for e in entries:
            path=Path(e.filename)
            if path.is_absolute() or ".." in path.parts or "\\" in e.filename or e.file_size>16*1024*1024:
             raise SystemExit("Unsafe ZIP entry: "+e.filename)
            data=z.read(e)
            if digest(data)!=expected[e.filename]:raise SystemExit("Checksum mismatch: "+e.filename)
            updates[e.filename]=data
          states=[]
          for rel,(old,new) in EXISTING.items():
           p=Path(rel)
           if not p.is_file() or p.is_symlink():raise SystemExit("Missing required v24.344 file: "+rel)
           seen=digest(p.read_bytes())
           if seen not in (old,new):raise SystemExit("Unrecognized edits; refusing overwrite: "+rel)
           states.append(seen==new)
          for rel,new in NEW.items():
           p=Path(rel)
           if p.exists() and (not p.is_file() or p.is_symlink() or digest(p.read_bytes())!=new):
            raise SystemExit("Conflicting file; refusing overwrite: "+rel)
          if any(states) and not all(states):raise SystemExit("Partial prior installation; no changes made.")
          for rel,data in updates.items():
           p=Path(rel);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          assert all(digest(Path(p).read_bytes())==expected[p] for p in expected)
          pkg.unlink()
          print("Duckie Days v24.345 installed: owl signal, City Crown, hatchery layout, EXP candy and menu buttons.")
          PYCODE
      - name: Commit installed game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Already up to date.'; else
            git commit -m 'Duckie Days v24.345: owl signals, crown colors, hatchery and candy'
            git push
          fi

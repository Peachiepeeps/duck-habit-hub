name: Install Duckie Days v24.346 Inventory EXP Candy Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-duckie-days-v24-346-inventory-candy-fix.yml'

permissions:
  contents: write

concurrency:
  group: duckie-days-v24346-inventory-candy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked v24.346 candy hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import json
          import subprocess

          # Exact v24.345 baseline Git blob IDs. Decline to overwrite newer edits.
          expected = {
              'hub-boosts.js': '90ee8ad8631c85be9bc43136d57959210c015e62',
              'index.html': 'a2931401e3ac688ef36a8f0f00ec2c9415de8eed',
              'sw.js': '7c90736d6d825da7dae3431df9e1a3a0be5b3a23',
              'version.json': 'b01243acbca02f52e449c111ec0b459bfe044943',
          }
          if (Path('version.json').is_file() and
              json.loads(Path('version.json').read_text(encoding='utf-8')).get('version') == '24.346' and
              'hero?.level>=QUEST_MAX_LEVEL' in Path('hub-boosts.js').read_text(encoding='utf-8')):
              print('Duckie Days v24.346 candy hotfix is already installed.')
              raise SystemExit(0)

          patches = {
              'hub-boosts.js': [
                  ("window.DUCKIE_HUB_EXP_CANDY_USE='24.215-safe-use-and-large-candy-recovery';",
                   "window.DUCKIE_HUB_EXP_CANDY_USE='24.346-inventory-level-999-fix';\n  const QUEST_MAX_LEVEL=999;"),
                  ("description:'Use in Duck Quest to gain 50% of the active OC’s current EXP bar.'",
                   "description:'Raises the active Duck Quest OC by one level (up to Lv. 999).'"),
                  ("name:'EXP Candy Large',percent:.50,",
                   "name:'EXP Candy Large',percent:.50,nextLevel:true,"),
                  ("description:'Use on the active Duck Quest OC to gain 50% of the current EXP bar.'",
                   "description:'Raises an unlocked Duck Quest OC by one level (up to Lv. 999).'"),
                  ('if(!hero || hero.level>=999)', 'if(!hero || hero.level>=QUEST_MAX_LEVEL)'),
                  ('const amount=Math.max(1,Math.ceil(need*candy.percent));',
                   'const amount=candy.nextLevel\n      ? Math.max(1,need-Math.max(0,Number(hero.exp)||0))\n      : Math.max(1,Math.ceil(need*candy.percent));'),
                  ('while(hero.level<999){', 'while(hero.level<QUEST_MAX_LEVEL){'),
                  ('if(hero.level>=999){hero.level=999;hero.exp=0;break;}',
                   'if(hero.level>=QUEST_MAX_LEVEL){hero.level=QUEST_MAX_LEVEL;hero.exp=0;break;}'),
                  ("note.textContent=`Adds ${Math.round(candy.percent*100)}% of ${who}'s current Duck Quest EXP bar.`;",
                   "note.textContent=candy.nextLevel\n      ? `Raises ${who} by one Duck Quest level (up to Lv. ${QUEST_MAX_LEVEL}).`\n      : `Adds ${Math.round(candy.percent*100)}% of ${who}'s current Duck Quest EXP bar.`;\n    const oldInstruction=inventorySheetActions.querySelector('.inventory-furniture-placement');\n    if(oldInstruction) oldInstruction.textContent='Choose an unlocked OC and use your EXP Candy here.';"),
                  ('button.textContent=hero?.level>=100?`${who} is MAX Level`:`Use on ${who}`;',
                   'button.textContent=hero?.level>=QUEST_MAX_LEVEL?`${who} is MAX Level`:`Use on ${who}`;'),
                  ('button.disabled=Boolean(hero?.level>=100);',
                   'button.disabled=Boolean(hero?.level>=QUEST_MAX_LEVEL);'),
              ],
              'index.html': [
                  ('<script src="hub-boosts.js?v=24.327"></script>',
                   '<script src="hub-boosts.js?v=24.346"></script>'),
                  ('const DUCK_HUB_BUILD = "24.336";',
                   'const DUCK_HUB_BUILD = "24.346";'),
                  ('register("./sw.js?v=24-345-city-polish",',
                   'register("./sw.js?v=24-346-inventory-candy-fix",'),
              ],
              'sw.js': [
                  ("const APP_CACHE='duck-habit-hub-app-v24-345-city-polish';",
                   "const APP_CACHE='duck-habit-hub-app-v24-346-inventory-candy-fix';"),
                  ("'./sw.js?v=24.345',", "'./sw.js?v=24.346',"),
                  ("'./hub-boosts.js?v=24.327',", "'./hub-boosts.js?v=24.346',"),
              ],
              'version.json': [
                  ('  "version": "24.345"', '  "version": "24.346"'),
              ],
          }

          updates = {}
          for filename, changes in patches.items():
              file = Path(filename)
              if not file.is_file() or file.is_symlink():
                  raise SystemExit(f'Required file missing or unsafe: {filename}')
              old_blob = subprocess.check_output(['git', 'hash-object', filename], text=True).strip()
              if old_blob != expected[filename]:
                  raise SystemExit(f'Unexpected base version for {filename}; no files changed. Got {old_blob}')
              content = file.read_text(encoding='utf-8')
              for before, after in changes:
                  if content.count(before) != 1:
                      raise SystemExit(f'Expected exactly one occurrence in {filename}: {before[:70]!r}')
                  content = content.replace(before, after)
              updates[filename] = content

          assert 'hero?.level>=100' not in updates['hub-boosts.js']
          assert 'hero?.level>=QUEST_MAX_LEVEL' in updates['hub-boosts.js']
          assert 'const QUEST_MAX_LEVEL=999' in updates['hub-boosts.js']
          assert json.loads(updates['version.json'])['version'] == '24.346'
          for filename, content in updates.items():
              Path(filename).write_text(content, encoding='utf-8')
          print('Installed v24.346: candy inventory works beyond Lv.100, Large Candy grants the next level, max Lv.999, cached assets bumped.')
          PYCODE
          node --check hub-boosts.js
          node --check sw.js
          python3 -m json.tool version.json > /dev/null
          git diff --check
      - name: Commit patched game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- hub-boosts.js index.html sw.js version.json
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Duckie Days v24.346: fix inventory EXP candies above level 100'
            git push origin HEAD:main
          fi

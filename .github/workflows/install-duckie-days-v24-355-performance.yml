      - name: Verify assets and game files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          assert json.loads((root/'version.json').read_text())['version']=='24.355'
          for p in ['app.js','tasks.js','sw.js','duck-quest/js/game-v96.js','duck-quest/js/love-interests-v326.js','duck-quest/js/gimmick-encounters-v288.js','duck-quest/js/special-encounters-v326.js','duck-quest/js/ufono-v298.js','duck-quest/js/sock-gremlin-v297.js','duck-quest/js/bao-cafe-v299.js']:
              assert (root/p).is_file(), p
          sw=(root/'sw.js').read_text()
          assert 'ignoreSearch:true' not in sw and 'ESSENTIAL_SHELL' in sw and 'MAX_MEDIA_ENTRIES=400' in sw
          matches=re.findall(r"['\"](\./[^'\"]+)['\"]",sw.split('const APP_SHELL=[',1)[1].split('];',1)[0])
          assert len(matches)>=400
          assert all((root/x.split('?')[0][2:]).is_file() for x in matches)
          assert 'setQuestSpriteFrame' in (root/'duck-quest/js/game-v96.js').read_text()
          assert 'duck-quest/assets/enemies/mimic/lucky/open.webp' in (root/'app.js').read_text()
          print(f'PASS: v24.355; {len(matches)} cache paths valid; 112 essential shell files; sprites and scripts verified')
          PY
          node --check sw.js
          node --check app.js
          node --check tasks.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/love-interests-v326.js
          node --check duck-quest/js/gimmick-encounters-v288.js

name: Install Ducky Days v24.356 Big Update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-duckie-days-v24-356.yml'
      - '.github/workflows/duckie-days-v24-356-content.zip'
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest game
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Unpack the supplied artwork and installer helpers
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          from zipfile import ZipFile
          bundle=Path('.github/workflows/duckie-days-v24-356-content.zip')
          if not bundle.is_file():raise SystemExit('Missing content zip. Upload BOTH files together to .github/workflows')
          with ZipFile(bundle) as z:
              for member in z.infolist():
                  path=Path(member.filename)
                  if member.is_dir():continue
                  if path.is_absolute() or '..' in path.parts:raise RuntimeError('Unsafe archive path')
                  target=Path('.')/path
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(member))
          print('New illustrations and install scripts extracted')
          PYEXTRACT
      - name: Apply big content update and cafe fixes
        run: python3 .github/workflows/patch_big.py .
      - name: Verify game JavaScript, artwork, and integration
        run: |
          node --check app.js
          node --check trading-cards-base.js
          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/love-interests-v326.js
          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check duck-quest/js/shared-families-v356.js
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import re,json
          root=Path('.')
          needed=['duck-quest/js/shared-families-v356.js','duck-quest/assets/love-interests/midori/Midori-idle-2.png',
            'duck-quest/assets/love-interests/shin/Shin-duck.png','duck-quest/assets/love-interests/bubble/Bubble-duck.png',
            'duck-quest/assets/bosses/pancake-ray/base/raspberry-idle-3.webp',
            'duck-quest/assets/bosses/pancake-ray/base/raspberry-hurt.webp',
            'duck-quest/assets/enemies/strawbunny/base/shiny-idle-1.webp',
            'duck-quest/assets/enemies/pudding-snatcher/base/shiny-idle-1.webp',
            'assets/annika/Annika-date-Sweater.webp','assets/annika/Annika-lingerie-babydoll.webp',
            'duck-quest/assets/trading-cards/fabled/F-io.png']
          for path in needed:
            target=root/path
            if not target.is_file() or target.stat().st_size==0:raise RuntimeError('Missing required asset: '+path)
          cards=(root/'trading-cards-base.js').read_text()
          for card in ['f-quackers','r-love-shin','r-love-bubble']:
            # f-quackers is built from the source array, not as a literal object id.
            if card=='f-quackers':
              if '["quackers","Quackers"' not in cards:raise RuntimeError('Quackers Fabled card not registered')
            elif "id:'"+card+"'" not in cards:raise RuntimeError('Card missing '+card)
          additions=json.loads((root/'.github/workflows/extra-cards-v356.json').read_text())
          if len(additions)!=25:raise RuntimeError('Missing Fabled illustrations')
          for card in additions:
            if not (root/f"duck-quest/assets/trading-cards/fabled/F-{card['slug']}.png").is_file():raise RuntimeError('Fabled art missing '+card['slug'])
          for rel, tokens in {
            'duck-quest/js/love-interests-v326.js':['Midori-idle-2.png','bubble:{id:', 'shin:{id:'],
            'duck-quest/js/gimmick-encounters-v288.js':['function quackersPond()','r<.50','r<.85','Math.random()<.03'],
            'bao-cafe/index.html':['Midori-idle-2.png','"name":"Bubble"','"name":"Shin"','"name":"Quackers"'],
            'app.js':['annika-date-sweater','annika-lingerie-babydoll','"shin-duck"','"bubble-duck"']
           }.items():
            text=(root/rel).read_text()
            for token in tokens:
              if token not in text:raise RuntimeError('Expected integration not found: '+rel+' '+token)
          if json.loads((root/'version.json').read_text())['version']!='24.356':raise RuntimeError('Wrong release version')
          print('Verified three families, two Annika scenes, Quackers rewards, Midori frame, outfit assets and 25 Fabled cards')
          PYVERIFY
      - name: Commit v24.356 and remove temporary installer files
        run: |
          rm -f .github/workflows/patch_big.py \
            .github/workflows/prepare_bao_cafe_patch.py \
            .github/workflows/cafe-customer-v356.zip \
            .github/workflows/extra-cards-v356.json
          rm -f .github/workflows/install-duckie-days-v24-356.yml \
            .github/workflows/duckie-days-v24-356-content.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Ducky Days v24.356: shared creatures, Annika scenes, Quackers, cards and cafe fixes'
            git push origin HEAD:main
          fi

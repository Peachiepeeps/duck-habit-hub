name: Install Ducky Days v24.359 Complete Update (ZIP + workflow)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-duckie-days-v24-359-split.yml'
      - '.github/workflows/duckie-days-v24-359-complete-content.zip'
      - 'duckie-days-v24-359-complete-content.zip'
permissions:
  contents: write
concurrency:
  group: duckie-days-v24-359-installer
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current game
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Unpack v24.359 content ZIP
        shell: bash
        run: |
          python3 - <<'PY_UNPACK'
          from pathlib import Path
          from zipfile import ZipFile
          candidates = [Path('.github/workflows/duckie-days-v24-359-complete-content.zip'), Path('duckie-days-v24-359-complete-content.zip')]
          bundle = next((p for p in candidates if p.is_file()), None)
          if bundle is None:
              raise SystemExit('Missing update ZIP in repository root or .github/workflows/')
          with ZipFile(bundle) as z:
              for item in z.infolist():
                  name=Path(item.filename)
                  if item.is_dir(): continue
                  if name.is_absolute() or '..' in name.parts:
                      raise RuntimeError('Unsafe ZIP path: '+str(name))
                  target=Path('.')/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          print('Unpacked v24.359 assets and patch scripts.')
          PY_UNPACK
      - name: Apply incremental v24.359 update (existing saves preserved)
        shell: bash
        run: python3 .github/workflows/patch-v359.py .
      - name: Validate all new assets, dialogue, JavaScript and gameplay integration
        shell: bash
        run: |
          python3 .github/workflows/verify-v359.py .
          node - <<'NODE_CARDS'
          const assert=require('node:assert/strict');
          global.window={};global.location={pathname:'/duck-quest/'};global.document={createElement(){return {}}};
          require('./trading-cards-base.js');
          const cards=window.DuckieTradingCards;
          assert.ok(cards && cards.cards.length>=190);
          for(const id of ['r-love-lain','r-love-tamao','r-bownny','r-love-shin','r-love-bubble'])
            assert.ok(cards.byId[id],`Missing trading card ${id}`);
          const save={tradingCards:{owned:{'f-io':3,'r-love-shin':1},unopenedPacks:4}};
          cards.grantPack(save,1);
          assert.equal(save.tradingCards.owned['f-io'],3);
          assert.equal(save.tradingCards.owned['r-love-shin'],1);
          assert.equal(save.tradingCards.unopenedPacks,5);
          console.log('Trading cards ready:',cards.cards.length,'; existing cards and packs preserved');
          NODE_CARDS
      - name: Commit and deploy v24.359
        shell: bash
        run: |
          rm -f .github/workflows/patch-v359.py \
            .github/workflows/verify-v359.py \
            .github/workflows/v359-annika-bounds.json \
            .github/workflows/install-duckie-days-v24-359-split.yml \
            .github/workflows/duckie-days-v24-359-complete-content.zip
          rm -f .github/workflows/install-duckie-days-v24-359-complete-corrected.yml
          rm -f duckie-days-v24-359-complete-content.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Ducky Days v24.359: new kitties, Annika romances, Bownny and Flame Spirit'
            git push origin HEAD:main
          fi

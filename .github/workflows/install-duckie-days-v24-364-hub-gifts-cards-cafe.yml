
name: Install Duckie Days v24.364 - Hub, Gifts, Cards and Cafe

on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.364-Hub-Gifts-Cards-Cafe-Fixes-UPDATE-ONLY.zip'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install v24.364 refinements
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Duckie-Days-v24.364-Hub-Gifts-Cards-Cafe-Fixes-UPDATE-ONLY.zip'
          test -f "$ZIP" || {
            echo "::error::Upload $ZIP in the repository root first."
            exit 1
          }
          unzip -t "$ZIP"
          unzip -oq "$ZIP" -d .
          grep -q '24.364' version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.css task-buddy-beta.html bao-cafe/index.html trading-cards-ui.js trading-cards-base.css index.html version.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Install Duckie Days v24.364 fixes'
            git push
          else
            echo 'v24.364 already installed.'
          fi

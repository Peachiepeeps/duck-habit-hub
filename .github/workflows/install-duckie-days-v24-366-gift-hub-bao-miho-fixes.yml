name: Install Duckie Days v24.366 - Gift, Hub, Bao Cafe and Miho Fixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.366-Gift-Hub-Bao-Miho-Fixes-UPDATE-ONLY.zip'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install v24.366
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Duckie-Days-v24.366-Gift-Hub-Bao-Miho-Fixes-UPDATE-ONLY.zip'
          test -f "$ZIP" || { echo "::error::Upload $ZIP to the repository root first."; exit 1; }
          unzip -t "$ZIP"
          unzip -oq "$ZIP" -d .
          grep -q '24.366' version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.css task-buddy-beta.html bao-cafe/index.html index.html sw.js version.json assets/miho/Miho-neutral.webp assets/miho/Miho-angry.webp assets/thumbs/characters/miho/Miho-neutral.webp assets/thumbs/characters/miho/Miho-angry.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Install Duckie Days v24.366 gift, hub, Bao Cafe, and Miho fixes'
            git push
          else
            echo 'v24.366 already installed.'
          fi

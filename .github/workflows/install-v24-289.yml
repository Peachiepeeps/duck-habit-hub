name: Install Duckie Days v24.289 Wonder Charm Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.289-wonder-charm-and-encounter-fixes.zip"
      - ".github/workflows/install-v24-289.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-289-wonder-fixes
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.289-wonder-charm-and-encounter-fixes.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
            echo "v24.289 update bundle found."
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.289 update ZIP."
          fi

      - name: Validate current v24.288 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.289-wonder-charm-and-encounter-fixes.zip"

          unzip -tq "$ZIP"
          grep -Fq '"version": "24.288"' version.json

          # Exact live files checked when this patch was built.
          test "$(git hash-object duck-quest/js/game-v96.js)" = "5571b2842b9400725165a71874a47e4655311708"
          test "$(git hash-object duck-quest/js/gimmick-encounters-v288.js)" = "455aa633d464e3d4bc490de29653d2ef8e9f435e"
          test "$(git hash-object duck-quest/index.html)" = "d260d6c88ae3de405b2f8fbb04fe1b32da38f78c"
          test "$(git hash-object index.html)" = "af3419cd413f92ed6038085cc943205711edb48f"
          test "$(git hash-object sw.js)" = "7d3f3150fa92018ca0799c37f67820ed2bda6fdf"

          # The patch must never overwrite the user's manually tuned hub CSS.
          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.289
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.289-wonder-charm-and-encounter-fixes.zip"
          TMP=".duckie-days-v24-289"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v289.py"

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check duck-quest/js/fixes-v289.js
          node --check sw.js

          grep -Fq '"version": "24.289"' version.json
          grep -Fq 'Rose-Gold Wonder Charm' duck-quest/js/game-v96.js
          grep -Fq 'js/fixes-v289.js?v=24-289' duck-quest/index.html
          grep -Fq 'css/fixes-v289.css?v=24-289' duck-quest/index.html

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-289"
          rm -f "Duckie-Days-v24.289-wonder-charm-and-encounter-fixes.zip"
          rm -f ".github/workflows/install-v24-289.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.289
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Fix special encounter transitions and add Wonder Charm"
          git push

name: Install Duckie Days v24.290 Scene Gift Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.290-scene-and-gift-fixes.zip"
      - ".github/workflows/install-v24-290.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-290-scene-gift-fixes
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.290-scene-and-gift-fixes.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.290 update ZIP."
          fi

      - name: Validate current v24.289 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.290-scene-and-gift-fixes.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.289"' version.json

          test "$(git hash-object duck-quest/js/special-encounters-v265.js)" = "020134d95686d230e6c3bcdfa9195241e2d68871"
          test "$(git hash-object duck-quest/js/love-interests-v252.js)" = "2b84a35f9d382652cde77e9f60a22402e7b78cab"
          test "$(git hash-object duck-quest/index.html)" = "b764636468ca1eebb3808836bf46a1de55209512"
          test "$(git hash-object index.html)" = "637b940500af57232eadc2255e23e315717c4dd8"
          test "$(git hash-object sw.js)" = "153bddbd3259720fe2f2c6cb1f03b2bcbf396529"

          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.290
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.290-scene-and-gift-fixes.zip"
          TMP=".duckie-days-v24-290"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v290.py"

          node --check duck-quest/js/special-encounters-v265.js
          node --check duck-quest/js/love-interests-v252.js
          node --check sw.js

          grep -Fq '"version": "24.290"' version.json
          grep -Fq 'css/fixes-v290.css?v=24-290' duck-quest/index.html
          grep -Fq 'js/love-interests-v252.js?v=24-290' duck-quest/index.html
          grep -Fq 'js/special-encounters-v265.js?v=24-290' duck-quest/index.html

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-290"
          rm -f "Duckie-Days-v24.290-scene-and-gift-fixes.zip"
          rm -f ".github/workflows/install-v24-290.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.290
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Polish Gift Boxes and love-interest scene endings"
          git push

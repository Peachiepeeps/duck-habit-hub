name: Install Duckie Days v24.291 Luv Birdie Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.291-luv-birdie-layout-fix.zip"
      - ".github/workflows/install-v24-291.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-291-luv-birdie-fix
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.291-luv-birdie-layout-fix.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.291 update ZIP."
          fi

      - name: Validate current v24.290 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.291-luv-birdie-layout-fix.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.290"' version.json

          test "$(git hash-object duck-quest/js/special-encounters-v265.js)" = "7f457304eb6ef614628725809bcf4cd9f5c06b5c"
          test "$(git hash-object duck-quest/index.html)" = "99d127777c862b4a30897361f89eb041d665cc22"
          test "$(git hash-object index.html)" = "0bcb5b70f341b2534bf87ccff4e8b44e491d780f"
          test "$(git hash-object sw.js)" = "df04b0c6477dff5e14d31a17d83e21106fc69853"

          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.291
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.291-luv-birdie-layout-fix.zip"
          TMP=".duckie-days-v24-291"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v291.py"

          node --check duck-quest/js/special-encounters-v265.js
          node --check sw.js

          grep -Fq '"version": "24.291"' version.json
          grep -Fq 'css/fixes-v291.css?v=24-291' duck-quest/index.html
          grep -Fq 'js/special-encounters-v265.js?v=24-291' duck-quest/index.html

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-291"
          rm -f "Duckie-Days-v24.291-luv-birdie-layout-fix.zip"
          rm -f ".github/workflows/install-v24-291.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.291
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Fix Luv and Birdie event layout"
          git push

name: Install Duckie Days v24.292 Gift Reward Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.292-gift-reward-display-fix.zip"
      - ".github/workflows/install-v24-292.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-292-gift-reward-fix
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.292-gift-reward-display-fix.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.292 update ZIP."
          fi

      - name: Validate current v24.291 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.292-gift-reward-display-fix.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.291"' version.json
          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.292
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.292-gift-reward-display-fix.zip"
          TMP=".duckie-days-v24-292"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v292.py"

          node --check sw.js

          grep -Fq '"version": "24.292"' version.json
          grep -Fq 'css/fixes-v292.css?v=24-292' duck-quest/index.html

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-292"
          rm -f "Duckie-Days-v24.292-gift-reward-display-fix.zip"
          rm -f ".github/workflows/install-v24-292.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.292
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Fix gift box reward display sizing"
          git push

name: Install Duckie Days v24.293 Gift Card Render Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.293-gift-card-render-fix.zip"
      - ".github/workflows/install-v24-293.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-293-gift-card-render-fix
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.293-gift-card-render-fix.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for v24.293 ZIP."
          fi

      - name: Validate current v24.292 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.293-gift-card-render-fix.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.292"' version.json

          test "$(git hash-object duck-quest/index.html)" = "cfa8eb75fad6b3f361ade23d9b3b549d5b37ba6f"
          test "$(git hash-object index.html)" = "2659937e53a0d1287ad7d1d879fd204063030569"
          test "$(git hash-object sw.js)" = "376b4574e248f58bcdc376113e3541b1d3224caf"
          test "$(git hash-object duck-quest/css/fixes-v292.css)" = "1fc70ab10e1c5538d15d6188e855aed33ee48b00"

          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.293
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.293-gift-card-render-fix.zip"
          TMP=".duckie-days-v24-293"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v293.py"

          node --check sw.js
          grep -Fq '"version": "24.293"' version.json
          grep -Fq 'css/fixes-v293.css?v=24-293' duck-quest/index.html
          grep -Fq '.gift-reward-card-v264 .tc-frame' duck-quest/css/fixes-v293.css
          grep -Fq 'width:60px!important' duck-quest/css/fixes-v293.css

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-293"
          rm -f "Duckie-Days-v24.293-gift-card-render-fix.zip"
          rm -f ".github/workflows/install-v24-293.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.293
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Fix Gift Box trading card rendering"
          git push

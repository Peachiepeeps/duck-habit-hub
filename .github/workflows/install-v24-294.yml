name: Install Duckie Days v24.294 Gimmick Layout Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.294-gimmick-layout-and-sibling-fixes.zip"
      - ".github/workflows/install-v24-294.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-294-gimmick-layout-fixes
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.294-gimmick-layout-and-sibling-fixes.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.294 update ZIP."
          fi

      - name: Validate current v24.293 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.294-gimmick-layout-and-sibling-fixes.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.293"' version.json

          test "$(git hash-object duck-quest/js/gimmick-encounters-v288.js)" = "9c048768d9a63a3c4ec667efca6610055276f119"
          test "$(git hash-object duck-quest/js/game-v96.js)" = "af587a139bea1741812e78e899d68ced77a945f5"
          test "$(git hash-object duck-quest/index.html)" = "7047dbccdceb2b19f995feff905a3d791fc9efb5"
          test "$(git hash-object index.html)" = "124d932e940edff04cfdb9bddce02e75f38bb445"
          test "$(git hash-object sw.js)" = "006f100304c03edac01d3f5727d0f2f49959b1af"

          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.294
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.294-gimmick-layout-and-sibling-fixes.zip"
          TMP=".duckie-days-v24-294"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v294.py"

          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check sw.js

          grep -Fq '"version": "24.294"' version.json
          grep -Fq 'css/fixes-v294.css?v=24-294' duck-quest/index.html
          grep -Fq 'js/gimmick-encounters-v288.js?v=24-294' duck-quest/index.html
          grep -Fq "gimmick-choice-panel-v294" duck-quest/js/gimmick-encounters-v288.js
          grep -Fq "startsWith('dash-cart-')" duck-quest/js/gimmick-encounters-v288.js

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-294"
          rm -f "Duckie-Days-v24.294-gimmick-layout-and-sibling-fixes.zip"
          rm -f ".github/workflows/install-v24-294.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.294
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Fix gimmick layouts and Sibling Spat movement"
          git push

name: Install Duckie Days v24.295 Artist Friend Chest Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.295-artist-friend-and-chest-polish.zip"
      - ".github/workflows/install-v24-295.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-295-artist-friend-chest-fixes
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.295-artist-friend-and-chest-polish.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.295 update ZIP."
          fi

      - name: Validate current v24.294 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.295-artist-friend-and-chest-polish.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.294"' version.json

          test "$(git hash-object duck-quest/js/gimmick-encounters-v288.js)" = "dac95909a0a971b97806f1aa1b34e603d2073026"
          test "$(git hash-object duck-quest/js/game-v96.js)" = "af587a139bea1741812e78e899d68ced77a945f5"
          test "$(git hash-object duck-quest/index.html)" = "75d10628e74ce283c6f4e99f879024240449f6f0"
          test "$(git hash-object index.html)" = "f21f8302d2fdfeeae4ec9fe57ebd3514448c5d22"
          test "$(git hash-object sw.js)" = "e068377beaaf00363f3d24a2f8793cdc269a2b71"

          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.295
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.295-artist-friend-and-chest-polish.zip"
          TMP=".duckie-days-v24-295"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v295.py"

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check sw.js

          grep -Fq '"version": "24.295"' version.json
          grep -Fq 'css/fixes-v295.css?v=24-295' duck-quest/index.html
          grep -Fq 'js/game-v96.js?v=24-295' duck-quest/index.html
          grep -Fq 'js/gimmick-encounters-v288.js?v=24-295' duck-quest/index.html
          grep -Fq '75 Pink Coins' duck-quest/js/gimmick-encounters-v288.js
          grep -Fq 'Owned:' duck-quest/js/gimmick-encounters-v288.js

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-295"
          rm -f "Duckie-Days-v24.295-artist-friend-and-chest-polish.zip"
          rm -f ".github/workflows/install-v24-295.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.295
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Polish Artist Friend recolors and chest opening"
          git push

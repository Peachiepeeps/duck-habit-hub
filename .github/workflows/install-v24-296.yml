name: Install Duckie Days v24.296 Card Art Static Props Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.296-card-art-and-static-event-fix.zip"
      - ".github/workflows/install-v24-296.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-296-card-static-fix
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.296-card-art-and-static-event-fix.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.296 update ZIP."
          fi

      - name: Validate current v24.295 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.296-card-art-and-static-event-fix.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.295"' version.json

          test "$(git hash-object duck-quest/js/special-encounters-v265.js)" = "57f02dd4cbe7aa98fbc1fc84b5420cc079da9953"
          test "$(git hash-object duck-quest/index.html)" = "a07c1a4c8412d05caf506e880ef48a0481055672"
          test "$(git hash-object index.html)" = "ae5fc84e9394bf270ecd4ba12b841e261f61d058"
          test "$(git hash-object sw.js)" = "d9dc0bf3ad5ab4be3f43775db7d7c14ef1d284b6"
          test "$(git hash-object duck-quest/css/fixes-v293.css)" = "d11ac403dcb784ea23c773fa5fd1f67989ebc7d2"
          test "$(git hash-object duck-quest/css/fixes-v295.css)" = "a6cd1eaa00908d0b67e8bde2731fa66521f6f172"

          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.296
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.296-card-art-and-static-event-fix.zip"
          TMP=".duckie-days-v24-296"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v296.py"

          node --check duck-quest/js/special-encounters-v265.js
          node --check sw.js

          grep -Fq '"version": "24.296"' version.json
          grep -Fq 'css/fixes-v296.css?v=24-296' duck-quest/index.html
          grep -Fq 'js/special-encounters-v265.js?v=24-296' duck-quest/index.html
          grep -Fq '.tc-frame' duck-quest/css/fixes-v296.css
          grep -Fq 'z-index:1!important' duck-quest/css/fixes-v296.css

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-296"
          rm -f "Duckie-Days-v24.296-card-art-and-static-event-fix.zip"
          rm -f ".github/workflows/install-v24-296.yml"
          rm -f ".github/workflows/install.yml"

      - name: Commit v24.296
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Fix Gift Box card art and event prop motion"
          git push

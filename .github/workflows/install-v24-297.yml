name: Install Duckie Days v24.297 Sock Gremlin Fashion Battle

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.297-sock-gremlin-fashion-battle.zip"
      - ".github/workflows/install-v24-297.yml"
      - ".github/workflows/install.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-297-sock-gremlin
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check whether update bundle is ready
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.297-sock-gremlin-fashion-battle.zip"
          if [ -f "$ZIP" ]; then echo "UPDATE_READY=1" >> "$GITHUB_ENV"; else echo "UPDATE_READY=0" >> "$GITHUB_ENV"; echo "Workflow installed. Waiting for the v24.297 update ZIP."; fi
      - name: Validate current v24.296 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.297-sock-gremlin-fashion-battle.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.296"' version.json
          test "$(git hash-object index.html)" = "10a85b573c11fb379bbf9e96dc2f9459bc3e9bc9"
          test "$(git hash-object duck-quest/index.html)" = "1a2341d4c305e6ca9a7c633bb6f40fa840f4ac84"
          test "$(git hash-object sw.js)" = "eb8a82ceac96c8e6a5a181c9b1cfa1c1b2c4634e"
          test "$(git hash-object duck-quest/js/gimmick-encounters-v288.js)" = "4a225411523d11240e95d370c63ce558024b718c"
          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then echo "ERROR: update unexpectedly contains hub.css"; exit 1; fi
      - name: Install v24.297
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.297-sock-gremlin-fashion-battle.zip"
          TMP=".duckie-days-v24-297"
          rm -rf "$TMP"; mkdir -p "$TMP"; unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/payload/." .
          python3 -S "$TMP/tools/apply-v297.py"
          node --check trading-cards-sock-gremlin-v297.js
          node --check sock-gremlin-fashion-v297.js
          node --check duck-quest/js/sock-gremlin-v297.js
          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check sw.js
          grep -Fq '"version": "24.297"' version.json
          grep -Fq 'sock-gremlin-fashion-v297.js?v=24.297' index.html
          grep -Fq 'js/sock-gremlin-v297.js?v=24-297' duck-quest/index.html
          test "$(find duck-quest/assets/gimmicks/sock-gremlin -type f -name '*.png' | wc -l | tr -d ' ')" = "18"
      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-297"
          rm -f "Duckie-Days-v24.297-sock-gremlin-fashion-battle.zip"
          rm -f ".github/workflows/install-v24-297.yml"
          rm -f ".github/workflows/install.yml"
      - name: Commit v24.297
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "ERROR: No changes were staged."; exit 1; fi
          git commit -m "Add Sock Gremlin fashion battle"
          git push

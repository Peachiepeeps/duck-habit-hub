name: Install Duckie Days v24.298 Porcupin UFONO Catch Plush Polish

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.298-porcupin-ufono-catch-plush-polish.zip"
      - ".github/workflows/install-v24-298.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-298
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.298-porcupin-ufono-catch-plush-polish.zip"
          if [ -f "$ZIP" ]; then
            echo "UPDATE_READY=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for the v24.298 update ZIP."
          fi

      - name: Validate v24.297 base
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.298-porcupin-ufono-catch-plush-polish.zip"
          unzip -tq "$ZIP"
          grep -Fq '"version": "24.297"' version.json
          if unzip -Z1 "$ZIP" | grep -Fxq "payload/hub.css"; then
            echo "ERROR: update unexpectedly contains hub.css"
            exit 1
          fi

      - name: Install v24.298
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.298-porcupin-ufono-catch-plush-polish.zip"
          TMP=".duckie-days-v24-298"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          cp -a "$TMP/payload/." .

          node --check duck-quest/js/game-v96.js
          node --check duck-quest/js/gimmick-encounters-v288.js
          node --check duck-quest/js/sock-gremlin-v297.js
          node --check duck-quest/js/special-catch-v298.js
          node --check duck-quest/js/ufono-v298.js
          node --check duck-quest/js/porcupin-v298.js
          node --check memory-game/script-v24-44.js
          node --check sort-game/script-v24-32.js
          node --check crane-game/script-v24-40.js
          node --check sw.js

          grep -Fq '"version": "24.298"' version.json
          grep -Fq 'ufono-v298.js?v=24-298' duck-quest/index.html
          grep -Fq 'porcupin-v298.js?v=24-298' duck-quest/index.html
          grep -Fq 'special-catch-v298.js?v=24-298' duck-quest/index.html
          grep -Fq 'R-048' trading-cards-universal-v298.js
          grep -Fq 'R-049' trading-cards-universal-v298.js
          test -f duck-quest/assets/gimmicks/ufono/shiny/idle-1.png
          test -f duck-quest/assets/enemies/porcupin/shiny/idle-1.png

      - name: Clean installer files
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-days-v24-298"
          rm -f "Duckie-Days-v24.298-porcupin-ufono-catch-plush-polish.zip"
          rm -f ".github/workflows/install-v24-298.yml"

      - name: Commit v24.298
        if: env.UPDATE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi
          git commit -m "Add Porcupin and UFONO encounters"
          git push

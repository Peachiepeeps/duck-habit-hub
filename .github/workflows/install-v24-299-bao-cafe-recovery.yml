name: Install Bao Cafe Planning Pack - Recovery

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-v24-299-bao-cafe-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-bao-cafe-planning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Bao Cafe planning pack exists
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.299-bao-cafe-planning-pack.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            exit 1
          fi
          echo "Found $ZIP"
          unzip -tq "$ZIP"

      - name: Install Bao Cafe planning pack
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.299-bao-cafe-planning-pack.zip"
          TMP=".bao-cafe-recovery-temp"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/bao-cafe-planning"
          rm -rf "bao-cafe-planning"
          cp -a "$TMP/bao-cafe-planning" "./bao-cafe-planning"

          test -f "bao-cafe-planning/README.md"
          test -f "bao-cafe-planning/01-layout-spec.txt"
          test -f "bao-cafe-planning/02-gameplay-logic.txt"
          test -f "bao-cafe-planning/03-recipes-and-bears.txt"
          test -f "bao-cafe-planning/04-duck-quest-encounter-flow.txt"
          test -f "bao-cafe-planning/05-file-folder-plan.txt"
          test -f "bao-cafe-planning/reference/Background-cafe.png"
          test -f "bao-cafe-planning/reference/Cafe-counter.png"
          test -f "bao-cafe-planning/reference/Request-Bubble.png"
          test -f "bao-cafe-planning/reference/Reference-Cafe.png"

      - name: Clean temporary and installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".bao-cafe-recovery-temp"
          rm -f "Duckie-Days-v24.299-bao-cafe-planning-pack.zip"
          rm -f ".github/workflows/install-v24-299-bao-cafe-planning.yml"
          rm -f ".github/workflows/install-v24-299-bao-cafe-recovery.yml"

      - name: Commit installed planning pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi
          git commit -m "Install Bao Cafe planning pack"
          git push

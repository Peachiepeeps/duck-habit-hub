name: Install Duckie Days v24.306 Bao Cafe Sprite Size Correction

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.306-bao-cafe-sprite-size-correction.zip"
      - ".github/workflows/install-v24-306-bao-cafe-sprite-size-correction.yml"

permissions:
  contents: write

concurrency:
  group: bao-cafe-v24-306
  cancel-in-progress: false

jobs:
  install-pack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm patch zip exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Duckie-Days-v24.306-bao-cafe-sprite-size-correction.zip" ]; then
            echo "PATCH_READY=1" >> "$GITHUB_ENV"
          else
            echo "PATCH_READY=0" >> "$GITHUB_ENV"
            echo "Workflow installed. Waiting for Duckie-Days-v24.306-bao-cafe-sprite-size-correction.zip"
          fi

      - name: Install patch
        if: env.PATCH_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.306-bao-cafe-sprite-size-correction.zip"
          TMP=".bao-cafe-v24-306"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/payload"
          cp -a "$TMP/payload/." .
          test -f "bao-cafe/index.html"
          test -f "bao-cafe/style.css"
          test -f "bao-cafe/script.js"
          test -f "version.json"
          grep -q '24.306' version.json
          grep -q 'scale(1.32)' bao-cafe/style.css
          grep -q 'width:40%;height:40%' bao-cafe/style.css
          grep -q 'top:53.1%' bao-cafe/style.css

      - name: Clean installer files
        if: env.PATCH_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".bao-cafe-v24-306"
          rm -f "Duckie-Days-v24.306-bao-cafe-sprite-size-correction.zip"
          rm -f ".github/workflows/install-v24-306-bao-cafe-sprite-size-correction.yml"
          rm -f "BAO-CAFE-v24.305-README.txt"

      - name: Commit patch
        if: env.PATCH_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi
          git commit -m "Correct Bao Cafe sprite size and lift mixer area v24.306"
          git push

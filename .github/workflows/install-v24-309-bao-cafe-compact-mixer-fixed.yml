name: Install Duckie Days v24.309 Bao Cafe Compact Mixer Fixed

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.309-bao-cafe-compact-mixer.zip"
      - ".github/workflows/install-v24-309-bao-cafe-compact-mixer-fixed.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for patch
        id: patch
        shell: bash
        run: |
          if [ -f "Duckie-Days-v24.309-bao-cafe-compact-mixer.zip" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Patch ZIP is not uploaded yet. Upload it to the repository root."
          fi

      - name: Install v24.309
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duckie-Days-v24.309-bao-cafe-compact-mixer.zip"
          TMP=".bao-cafe-v24-309-install"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$TMP"

          test -d "$TMP/payload"
          cp -a "$TMP/payload/." .

          test -f "bao-cafe/index.html"
          test -f "bao-cafe/style.css"
          test -f "bao-cafe/script.js"
          test -f "version.json"

          grep -q '"version": "24.309"' version.json
          grep -q 'height:10.9%' bao-cafe/style.css
          grep -q 'width:68%;justify-self:center' bao-cafe/style.css
          grep -q 'height:34.6%' bao-cafe/style.css

      - name: Clean installer files
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".bao-cafe-v24-309-install"
          rm -f "Duckie-Days-v24.309-bao-cafe-compact-mixer.zip"
          rm -f ".github/workflows/install-v24-309-bao-cafe-compact-mixer-fixed.yml"
          rm -f "BAO-CAFE-v24.308-README.txt"

      - name: Commit installed patch
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes were staged."
            exit 1
          fi

          git commit -m "Compact Bao Cafe mixer panel v24.309"
          git push

name: Install Duckie Days v24.311 Universal Clothing

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.311-universal-clothing.zip"
      - ".github/workflows/install-v24-311-universal-clothing.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-311
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for patch ZIP
        id: patch
        shell: bash
        run: |
          if [ -f "Duckie-Days-v24.311-universal-clothing.zip" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Workflow is ready. Upload Duckie-Days-v24.311-universal-clothing.zip to the repository root."
          fi

      - name: Install v24.311
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duckie-Days-v24.311-universal-clothing.zip"
          TMP=".duckie-v24-311-install"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/payload"
          cp -a "$TMP/payload/." .

          python3 - <<'PY'
          from pathlib import Path

          # ---------- Root app ----------
          root=Path("index.html")
          text=root.read_text()

          text=text.replace(
              '<meta name="duck-habit-build" content="24.297" />',
              '<meta name="duck-habit-build" content="24.311" />'
          )

          css_tag='  <link rel="stylesheet" href="universal-clothing-v311.css?v=24.311" />'
          css_anchor='  <link rel="stylesheet" href="universal-enemies-v298.css?v=24.298" />'
          if css_tag not in text:
              if css_anchor not in text:
                  raise SystemExit("Could not find Universal Enemies CSS anchor in root index.html")
              text=text.replace(css_anchor,css_anchor+"\n"+css_tag,1)

          clothing_tag='  <script src="universal-clothing-v311.js?v=24.311"></script>'
          app_anchor='  <script src="app.js?v=24.296"></script>'
          if clothing_tag not in text:
              if app_anchor not in text:
                  raise SystemExit("Could not find app.js anchor in root index.html")
              text=text.replace(app_anchor,app_anchor+"\n"+clothing_tag,1)

          fashion_tag='  <script src="sock-gremlin-fashion-fix-v311.js?v=24.311"></script>'
          fashion_anchor='  <script src="sock-gremlin-fashion-v297.js?v=24.297"></script>'
          if fashion_tag not in text:
              if fashion_anchor not in text:
                  raise SystemExit("Could not find Sock Gremlin fashion anchor in root index.html")
              text=text.replace(fashion_anchor,fashion_anchor+"\n"+fashion_tag,1)

          root.write_text(text)

          # ---------- Duck Quest ----------
          quest=Path("duck-quest/index.html")
          text=quest.read_text()
          drops_tag='  <script src="js/universal-clothing-drops-v311.js?v=24.311"></script>'
          fixes_tag='  <script src="js/fixes-v311.js?v=24.311"></script>'
          anchor='  <script src="js/fixes-v289.js?v=24-289"></script>'
          additions=[]
          if drops_tag not in text:additions.append(drops_tag)
          if fixes_tag not in text:additions.append(fixes_tag)
          if additions:
              if anchor not in text:
                  raise SystemExit("Could not find final Duck Quest fixes anchor")
              text=text.replace(anchor,anchor+"\n"+"\n".join(additions),1)
          quest.write_text(text)

          # ---------- Sock Gremlin clothing drop ----------
          sock=Path("duck-quest/js/sock-gremlin-v297.js")
          text=sock.read_text()
          marker="DuckieUniversalClothingDropsV311"
          if marker not in text:
              anchor='    let cardResult=null;const baseChance='
              if anchor not in text:
                  raise SystemExit("Could not find Sock Gremlin reward anchor")
              insert=(
                  '    const clothingDrops=window.DuckieUniversalClothingDropsV311;\n'
                  '    const clothingBaseChance=score===1?.10:score===2?.22:.40;\n'
                  '    if(clothingDrops?.ids?.length && Math.random()<Math.min(.80,clothingBaseChance+(c.shiny?.15:0))){\n'
                  '      const clothingId=pick(clothingDrops.ids);\n'
                  '      addInventory(clothingId,1);\n'
                  '      bonus.push(`${clothingDrops.names?.[clothingId]||"Universal Clothing"} ×1`);\n'
                  '    }\n'
                  '    let cardResult=null;const baseChance='
              )
              text=text.replace(anchor,insert,1)
          sock.write_text(text)

          # ---------- Service worker ----------
          sw=Path("sw.js")
          text=sw.read_text()
          text=text.replace("duck-habit-hub-app-v24-309","duck-habit-hub-app-v24-311")
          text=text.replace("duck-habit-hub-app-v24-310","duck-habit-hub-app-v24-311")

          entries=[
              (" './universal-enemies-v298.css?v=24.298',"," './universal-clothing-v311.css?v=24.311',"),
              (" './app.js?v=24.296',"," './universal-clothing-v311.js?v=24.311',"),
              (" './sock-gremlin-fashion-v297.js?v=24.297',"," './sock-gremlin-fashion-fix-v311.js?v=24.311',"),
              (" './duck-quest/js/fixes-v289.js?v=24-296',"," './duck-quest/js/universal-clothing-drops-v311.js?v=24.311',\n './duck-quest/js/fixes-v311.js?v=24.311',")
          ]
          for anchor,entry in entries:
              first=entry.split("\n")[0].strip().rstrip(",")
              if first in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f"Could not find service worker anchor: {anchor}")
              text=text.replace(anchor,anchor+"\n"+entry,1)

          preview_anchor=" './assets/furniture/book-shelves/book-shelf-brown.png',"
          preview_entries=[
              " './assets/universal-clothing/previews/big-hoodie.webp',",
              " './assets/universal-clothing/previews/big-cardigan.webp',",
              " './assets/universal-clothing/previews/bow-dress-large.webp',",
              " './assets/universal-clothing/previews/bunny-outfit.webp',",
              " './assets/universal-clothing/previews/maid-outfit.webp',",
              " './assets/universal-clothing/previews/big-bow.webp',",
              " './assets/universal-clothing/previews/r-bow.webp',",
              " './assets/universal-clothing/previews/glasses.webp',",
              " './assets/universal-clothing/previews/short-socks.webp',",
              " './assets/universal-clothing/previews/knee-socks.webp',",
              " './assets/universal-clothing/previews/thigh-socks.webp',"
          ]
          if " './assets/universal-clothing/previews/big-hoodie.webp'" not in text:
              if preview_anchor not in text:
                  raise SystemExit("Could not find service worker preview anchor")
              text=text.replace(preview_anchor,"\n".join(preview_entries)+"\n"+preview_anchor,1)
          sw.write_text(text)
          PY

          test -f "universal-clothing-v311.js"
          test -f "universal-clothing-v311.css"
          test -f "sock-gremlin-fashion-fix-v311.js"
          test -f "duck-quest/js/universal-clothing-drops-v311.js"
          test -f "duck-quest/js/fixes-v311.js"
          test -f "assets/universal-clothing/big-hoodie/main-white.webp"
          test -f "assets/universal-clothing/knee-socks/left-white.webp"
          test -f "assets/universal-clothing/maid-outfit/accent-pink.webp"
          test -f "assets/universal-clothing/shared/io-miko-hand.webp"

          grep -q '"version": "24.311"' version.json
          grep -q 'universal-clothing-v311.js?v=24.311' index.html
          grep -q 'sock-gremlin-fashion-fix-v311.js?v=24.311' index.html
          grep -q 'universal-clothing-drops-v311.js?v=24.311' duck-quest/index.html
          grep -q 'fixes-v311.js?v=24.311' duck-quest/index.html
          grep -q 'DuckieUniversalClothingDropsV311' duck-quest/js/sock-gremlin-v297.js
          grep -q 'duck-habit-hub-app-v24-311' sw.js

          node --check universal-clothing-v311.js
          node --check sock-gremlin-fashion-fix-v311.js
          node --check duck-quest/js/universal-clothing-drops-v311.js
          node --check duck-quest/js/fixes-v311.js
          node --check duck-quest/js/sock-gremlin-v297.js

      - name: Clean installer files
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-v24-311-install"
          rm -f "Duckie-Days-v24.311-universal-clothing.zip"
          rm -f ".github/workflows/install-v24-311-universal-clothing.yml"
          rm -f "DUCKIE-DAYS-v24.310-README.txt"
          rm -f "BAO-CAFE-v24.309-README.txt"

      - name: Commit patch
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Add universal clothing and merged app fixes v24.311"
          git push

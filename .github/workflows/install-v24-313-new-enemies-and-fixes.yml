name: Install Duckie Days v24.313 New Enemies and Fixes

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.313-new-enemies-and-fixes.zip"
      - ".github/workflows/install-v24-313-new-enemies-and-fixes.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-313
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for patch ZIP
        id: patch
        shell: bash
        run: |
          if [ -f "Duckie-Days-v24.313-new-enemies-and-fixes.zip" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Workflow is ready. Upload Duckie-Days-v24.313-new-enemies-and-fixes.zip to the repository root."
          fi

      - name: Install v24.313
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Duckie-Days-v24.313-new-enemies-and-fixes.zip"
          TMP=".duckie-v24-313-install"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/payload"
          cp -a "$TMP/payload/." .

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Root app: polish CSS + shop category fix.
          root=Path("index.html")
          text=root.read_text()

          text=re.sub(
              r'<meta name="duck-habit-build" content="[^"]+"\s*/>',
              '<meta name="duck-habit-build" content="24.313" />',
              text,
              count=1
          )

          css_tag='  <link rel="stylesheet" href="fixes-v313.css?v=24.313" />'
          css_anchor='  <link rel="stylesheet" href="sock-gremlin-fashion-fix-v312.css?v=24.312" />'
          if css_tag not in text:
              if css_anchor not in text:
                  raise SystemExit("Could not find v24.312 CSS anchor in root index.html")
              text=text.replace(css_anchor,css_anchor+"\n"+css_tag,1)

          js_tag='  <script src="fixes-v313.js?v=24.313"></script>'
          js_anchor='  <script src="sock-gremlin-fashion-fix-v312.js?v=24.312"></script>'
          if js_tag not in text:
              if js_anchor not in text:
                  raise SystemExit("Could not find v24.312 JS anchor in root index.html")
              text=text.replace(js_anchor,js_anchor+"\n"+js_tag,1)

          root.write_text(text)

          # Duck Quest: new enemies first, reward sizing fix last.
          quest=Path("duck-quest/index.html")
          text=quest.read_text()
          anchor='  <script src="js/fixes-v311.js?v=24.311"></script>'
          enemy_tag='  <script src="js/new-enemies-v313.js?v=24.313"></script>'
          fix_tag='  <script src="js/fixes-v313.js?v=24.313"></script>'
          additions=[]
          if enemy_tag not in text:additions.append(enemy_tag)
          if fix_tag not in text:additions.append(fix_tag)
          if additions:
              if anchor not in text:
                  raise SystemExit("Could not find Duck Quest v24.311 fixes anchor")
              text=text.replace(anchor,anchor+"\n"+"\n".join(additions),1)
          quest.write_text(text)

          # Service worker.
          sw=Path("sw.js")
          text=sw.read_text()
          text=re.sub(r"const APP_CACHE='duck-habit-hub-app-v24-\d+';",
                      "const APP_CACHE='duck-habit-hub-app-v24-313';",text,count=1)

          shell_entries=[
              (" './sock-gremlin-fashion-fix-v312.css?v=24.312',"," './fixes-v313.css?v=24.313',"),
              (" './sock-gremlin-fashion-fix-v312.js?v=24.312',"," './fixes-v313.js?v=24.313',"),
              (" './duck-quest/js/fixes-v311.js?v=24.311',"," './duck-quest/js/new-enemies-v313.js?v=24.313',\n './duck-quest/js/fixes-v313.js?v=24.313',"),
          ]
          for anchor,entry in shell_entries:
              first=entry.split("\n")[0].strip().rstrip(",")
              if first in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f"Could not find service worker anchor: {anchor}")
              text=text.replace(anchor,anchor+"\n"+entry,1)

          # Pre-cache all supplied new enemy art.
          asset_paths=[]
          for family in ["chonk","feathertail","puffer","shrimpie","licorunt","pretzette","asterfox","star-glider"]:
              base=Path("duck-quest/assets/enemies")/family/"base"
              for p in sorted(base.glob("*.png")):
                  asset_paths.append(f" './{p.as_posix()}',")
          if asset_paths and asset_paths[0].strip().rstrip(",") not in text:
              anchor=" './duck-quest/assets/enemies/porcupin/shiny/hurt.png',"
              if anchor not in text:
                  raise SystemExit("Could not find enemy asset cache anchor")
              text=text.replace(anchor,anchor+"\n"+"\n".join(asset_paths),1)

          sw.write_text(text)
          PY

          # Verify patch files/assets.
          test -f "fixes-v313.js"
          test -f "fixes-v313.css"
          test -f "duck-quest/js/new-enemies-v313.js"
          test -f "duck-quest/js/fixes-v313.js"

          for family in chonk feathertail puffer shrimpie licorunt pretzette asterfox star-glider; do
            test -f "duck-quest/assets/enemies/$family/base/idle-1.png"
            test -f "duck-quest/assets/enemies/$family/base/shiny-idle-1.png"
          done

          test -f "duck-quest/assets/enemies/chonk/base/gold-hurt.png"
          test -f "duck-quest/assets/enemies/pretzette/base/cookies-idle-1.png"
          test -f "duck-quest/assets/enemies/star-glider/base/dark-idle-1.png"

          grep -q '"version": "24.313"' version.json
          grep -q 'fixes-v313.css?v=24.313' index.html
          grep -q 'fixes-v313.js?v=24.313' index.html
          grep -q 'new-enemies-v313.js?v=24.313' duck-quest/index.html
          grep -q 'js/fixes-v313.js?v=24.313' duck-quest/index.html
          grep -q "duck-habit-hub-app-v24-313" sw.js
          grep -q "Cookies n’ Cream Pretzette" duck-quest/js/new-enemies-v313.js
          grep -q "Star Glider" duck-quest/js/new-enemies-v313.js
          grep -q "Sugar Snare!" duck-quest/js/new-enemies-v313.js
          grep -q "uclothes-big-bow" fixes-v313.js
          grep -q "quest-card-reward-item-v311" duck-quest/js/fixes-v313.js

          node --check fixes-v313.js
          node --check duck-quest/js/new-enemies-v313.js
          node --check duck-quest/js/fixes-v313.js

      - name: Clean installer files
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-v24-313-install"
          rm -f "Duckie-Days-v24.313-new-enemies-and-fixes.zip"
          rm -f ".github/workflows/install-v24-313-new-enemies-and-fixes.yml"
          # Old temporary installer that was left behind from the universal-clothing install.
          rm -f ".github/workflows/install-v24-311-universal-clothing.yml"
          rm -f "DUCKIE-DAYS-v24.312-README.txt"

      - name: Commit patch
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

          git commit -m "Add 8 new enemy families and polish fixes v24.313"
          git push

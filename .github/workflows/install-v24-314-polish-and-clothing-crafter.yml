name: Install Duckie Days v24.314 Polish and Clothing Crafter

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.314-polish-and-clothing-crafter.zip"
      - ".github/workflows/install-v24-314-polish-and-clothing-crafter.yml"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-314
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for patch ZIP
        id: patch
        shell: bash
        run: |
          if [ -f "Duckie-Days-v24.314-polish-and-clothing-crafter.zip" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Workflow is ready. Upload Duckie-Days-v24.314-polish-and-clothing-crafter.zip to the repository root."
          fi

      - name: Install v24.314
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.314-polish-and-clothing-crafter.zip"
          TMP=".duckie-v24-314-install"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/payload"
          cp -a "$TMP/payload/." .

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # Version file.
          version=Path("version.json")
          data=json.loads(version.read_text())
          data["version"]="24.314"
          version.write_text(json.dumps(data,indent=2)+"\n")

          # Root app hooks.
          root=Path("index.html")
          text=root.read_text()
          text=re.sub(r'<meta name="duck-habit-build" content="[^"]+"\s*/>',
                      '<meta name="duck-habit-build" content="24.314" />',text,count=1)
          css_anchor='  <link rel="stylesheet" href="fixes-v313.css?v=24.313" />'
          css_tag='  <link rel="stylesheet" href="fixes-v314.css?v=24.314" />'
          if css_tag not in text:
              if css_anchor not in text: raise SystemExit("Could not find v24.313 root CSS anchor")
              text=text.replace(css_anchor,css_anchor+"\n"+css_tag,1)
          js_anchor='  <script src="fixes-v313.js?v=24.313"></script>'
          js_tag='  <script src="fixes-v314.js?v=24.314"></script>'
          if js_tag not in text:
              if js_anchor not in text: raise SystemExit("Could not find v24.313 root JS anchor")
              text=text.replace(js_anchor,js_anchor+"\n"+js_tag,1)
          root.write_text(text)

          # Duck Quest hooks.
          quest=Path("duck-quest/index.html")
          text=quest.read_text()
          anchor='  <script src="js/fixes-v313.js?v=24.313"></script>'
          tag='  <script src="js/fixes-v314.js?v=24.314"></script>'
          if tag not in text:
              if anchor not in text: raise SystemExit("Could not find Duck Quest v24.313 JS anchor")
              text=text.replace(anchor,anchor+"\n"+tag,1)
          quest.write_text(text)

          # Service worker: bump cache and pre-cache patch files.
          sw=Path("sw.js")
          text=sw.read_text()
          text=re.sub(r"const APP_CACHE='duck-habit-hub-app-v24-\d+';",
                      "const APP_CACHE='duck-habit-hub-app-v24-314';",text,count=1)
          entries=[
              (" './fixes-v313.css?v=24.313',"," './fixes-v314.css?v=24.314',"),
              (" './fixes-v313.js?v=24.313',"," './fixes-v314.js?v=24.314',"),
              (" './duck-quest/js/fixes-v313.js?v=24.313',"," './duck-quest/js/fixes-v314.js?v=24.314',"),
          ]
          for anchor,entry in entries:
              if entry.strip().rstrip(',') in text: continue
              if anchor not in text: raise SystemExit(f"Could not find service worker anchor: {anchor}")
              text=text.replace(anchor,anchor+"\n"+entry,1)
          sw.write_text(text)
          PY

          test -f "fixes-v314.css"
          test -f "fixes-v314.js"
          test -f "duck-quest/js/fixes-v314.js"
          grep -q '"version": "24.314"' version.json
          grep -q 'fixes-v314.css?v=24.314' index.html
          grep -q 'fixes-v314.js?v=24.314' index.html
          grep -q 'js/fixes-v314.js?v=24.314' duck-quest/index.html
          grep -q "duck-habit-hub-app-v24-314" sw.js
          grep -q 'data-crafter-tab="clothing"' fixes-v314.js
          grep -q 'dqTradingCardsBaseV314' duck-quest/js/fixes-v314.js
          grep -q 'closeHatchDetail' duck-quest/js/fixes-v314.js
          grep -q 'special-catch-v314' duck-quest/js/fixes-v314.js
          node --check fixes-v314.js
          node --check duck-quest/js/fixes-v314.js

      - name: Clean installer files
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-v24-314-install"
          rm -f "Duckie-Days-v24.314-polish-and-clothing-crafter.zip"
          rm -f ".github/workflows/install-v24-314-polish-and-clothing-crafter.yml"

      - name: Commit patch
        if: steps.patch.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi
          git commit -m "Polish rewards, hatchery, Sock Gremlin, and clothing crafter v24.314"
          git push

name: Install Duckie Days v24.320 Duckdoku Tap Fix

"on":
  workflow_dispatch:
  push:
    paths:
      - "Duckie-Days-v24.320-duckdoku-tap-fix.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-320
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "Duckie-Days-v24.320-duckdoku-tap-fix.zip"
          unzip -tq "Duckie-Days-v24.320-duckdoku-tap-fix.zip"

      - name: Install v24.320 Duckdoku fixes
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.320-duckdoku-tap-fix.zip"
          TMP=".duckie-v24-320-install"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          test -f "$TMP/payload/duckdoku/index.html"
          test -f "$TMP/payload/duckdoku/style.css"
          test -f "$TMP/payload/duckdoku/script.js"
          test -f "$TMP/payload/fixes-v319.js"
          cp -a "$TMP/payload/." .

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION = "24.320"

          version = Path("version.json")
          data = json.loads(version.read_text())
          data["version"] = VERSION
          version.write_text(json.dumps(data, indent=2) + "\n")

          root = Path("index.html")
          text = root.read_text()
          text = re.sub(
              r'<meta name="duck-habit-build" content="[^"]+"\s*/>',
              '<meta name="duck-habit-build" content="24.320" />',
              text,
              count=1,
          )
          text = text.replace('fixes-v319.css?v=24.319', 'fixes-v319.css?v=24.320')
          text = text.replace('fixes-v319.js?v=24.319', 'fixes-v319.js?v=24.320')
          text = re.sub(r'navigator\.serviceWorker\.register\("\./sw\.js\?v=24-\d+"',
                        'navigator.serviceWorker.register("./sw.js?v=24-320"', text, count=1)
          root.write_text(text)

          sw = Path("sw.js")
          s = sw.read_text()
          s = re.sub(
              r"const APP_CACHE='duck-habit-hub-app-v24-\d+';",
              "const APP_CACHE='duck-habit-hub-app-v24-320';",
              s,
              count=1,
          )
          s = s.replace("./fixes-v319.css?v=24.319", "./fixes-v319.css?v=24.320")
          s = s.replace("./fixes-v319.js?v=24.319", "./fixes-v319.js?v=24.320")
          s = s.replace("./duckdoku/style.css?v=24.319", "./duckdoku/style.css?v=24.320")
          s = s.replace("./duckdoku/script.js?v=24.319", "./duckdoku/script.js?v=24.320")
          sw.write_text(s)
          PY

          test -f duckdoku/index.html
          test -f duckdoku/style.css
          test -f duckdoku/script.js
          grep -q 'style.css?v=24.320' duckdoku/index.html
          grep -q 'script.js?v=24.320' duckdoku/index.html
          grep -q 'duck-pair.*Standard-duck' duckdoku/index.html
          grep -q 'border-top-color:#fff' duckdoku/style.css
          grep -q 'DOUBLE_TAP_MS=360' duckdoku/script.js
          grep -q 'handleBoardTap' duckdoku/script.js
          grep -q 'pointIndex=boardIndexFromPoint' duckdoku/script.js
          grep -q '"version": "24.320"' version.json
          grep -q 'duck-habit-build" content="24.320"' index.html
          grep -q 'duck-habit-hub-app-v24-320' sw.js
          node --check fixes-v319.js
          node --check duckdoku/script.js

      - name: Clean installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".duckie-v24-320-install"
          rm -f "Duckie-Days-v24.320-duckdoku-tap-fix.zip"
          rm -f ".github/workflows/install-v24-320-duckdoku-tap-fix.yml"

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi
          git commit -m "Fix Duckdoku tapping and white grid v24.320"
          git push

name: Install Duckie Days v24.321 Duckdoku + Miko Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.321-duckdoku-miko-fix.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install v24.321 patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Duckie-Days-v24.321-duckdoku-miko-fix.zip'
          test -f "$ZIP"
          unzip -o "$ZIP" -d .

          test -f duckdoku/index.html
          test -f duckdoku/script.js
          test -f fixes-v321.js
          test -f index.html
          test -f sw.js
          test -f version.json

          grep -q '24.321' version.json
          grep -q 'one-cell color region' duckdoku/script.js
          grep -q 'MIKO_NATIVE_ARM_LAYERS' fixes-v321.js
          grep -q '../../assets/universal-clothing/shared/io-miko-hand.webp' fixes-v321.js
          grep -q 'duck-habit-hub-app-v24-321' sw.js

      - name: Clean installer files
        shell: bash
        run: |
          rm -f 'Duckie-Days-v24.321-duckdoku-miko-fix.zip'
          rm -f '.github/workflows/install-v24-321-duckdoku-miko-fix.yml'

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Ease Duckdoku starters and fix Miko Universal sleeves v24.321'
          git push

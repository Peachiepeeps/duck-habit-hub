name: Install Duckie Days v24.323 Game Card Centering

on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.323-game-card-centering.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install v24.323 patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Duckie-Days-v24.323-game-card-centering.zip'
          test -f "$ZIP"
          unzip -o "$ZIP" -d .

          test -f fixes-v323.css
          test -f index.html
          test -f sw.js
          test -f version.json

          grep -q '24.323' version.json
          grep -q 'fixes-v323.css?v=24.323' index.html
          grep -q 'min-height:124px' fixes-v323.css
          grep -q 'translateY(-20px)' fixes-v323.css
          grep -q 'duck-habit-hub-app-v24-323' sw.js

      - name: Clean installer files
        shell: bash
        run: |
          rm -f 'Duckie-Days-v24.323-game-card-centering.zip'
          rm -f 'Duckie-Days-v24.323-WORKFLOW.zip'
          rm -f 'Duckie-Days-v24.323-COMPLETE.zip'
          rm -f '.github/workflows/install-v24-323-game-card-centering.yml'

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Center Games artwork and restore card descriptions v24.323'
          git push

name: Install Duckie Days v24.324 Single-Screen Games

on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.324-single-screen-games.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install v24.324 patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Duckie-Days-v24.324-single-screen-games.zip'
          test -f "$ZIP"
          unzip -o "$ZIP" -d .

          test -f fixes-v324.css
          test -f index.html
          test -f sw.js
          test -f version.json

          grep -q '24.324' version.json
          grep -q 'repeat(7, minmax(0, 1fr))' fixes-v324.css
          grep -q 'overflow: hidden' fixes-v324.css
          grep -q 'fixes-v324.css?v=24.324' index.html
          grep -q 'duck-habit-hub-app-v24-324' sw.js

      - name: Clean installer files
        shell: bash
        run: |
          rm -f 'Duckie-Days-v24.324-single-screen-games.zip'
          rm -f '.github/workflows/install-v24-324-single-screen-games.yml'

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fit all Games cards on one phone screen v24.324'
          git push

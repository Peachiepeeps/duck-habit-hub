name: Install Duckie Days v24.325 Game Card Polish

on:
  workflow_dispatch:
  push:
    paths:
      - 'Duckie-Days-v24.325-game-card-polish.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install v24.325 patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Duckie-Days-v24.325-game-card-polish.zip'
          test -f "$ZIP"
          unzip -o "$ZIP" -d .
          test -f fixes-v325.css
          grep -q '24.325' version.json
          grep -q 'duck-quest-card-strawberry' fixes-v325.css
          grep -q 'top: 17%' fixes-v325.css
          grep -q 'fixes-v325.css?v=24.325' index.html
          grep -q 'duck-habit-hub-app-v24-325' sw.js

      - name: Clean installer files
        shell: bash
        run: |
          rm -f 'Duckie-Days-v24.325-game-card-polish.zip'
          rm -f '.github/workflows/install-v24-325-game-card-polish.yml'

      - name: Commit installed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Polish Duck Quest slime and crane icon v24.325'
          git push

name: Install Duckie Days v24.280 from existing bundle

on:
  push:
    paths:
      - .github/workflows/install_v24_280.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check update
        run: |
          python3 - <<'PY'
          import io, json, pathlib, zipfile
          bundle = pathlib.Path('Duckie-Days-v24.280-Workflow-Upload-Bundle.zip')
          source = zipfile.ZipFile(bundle)
          inner = zipfile.ZipFile(io.BytesIO(source.read('Duckie-Days-v24.280-Changed-Files.zip')))
          files = {
              'duck-quest/js/game-v96.js', 'duck-quest/index.html',
              'index.html', 'version.json', 'sw.js', 'sw-v24-280.js',
              'UPDATE-v24.280.txt',
          }
          assert set(inner.namelist()) == files, 'Unexpected update ZIP contents'
          assert inner.testzip() is None, 'Update ZIP is damaged'
          assert json.loads(inner.read('version.json'))['version'] == '24.280'
          current = json.loads(pathlib.Path('version.json').read_text())['version']
          assert tuple(map(int, current.split('.'))) <= (24, 280), f'Current version {current} is newer'
          for name in files:
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(inner.read(name))
          PY
          node --check duck-quest/js/game-v96.js
          node --check sw-v24-280.js
          python3 -c "import json; assert json.load(open('version.json'))['version'] == '24.280'"
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duck-quest/js/game-v96.js duck-quest/index.html index.html version.json sw.js sw-v24-280.js UPDATE-v24.280.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Install Duckie Days v24.280 special variants'
            git push
          fi

name: Organize and Fix Duck Quest v06

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repo history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize Duck Quest and install fixes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BACKUP_BRANCH="backup-before-duck-quest-v06-${GITHUB_RUN_ID}"
          git branch "$BACKUP_BRANCH" HEAD
          git push origin "$BACKUP_BRANCH"

          mkdir -p duck-quest/css duck-quest/js

          mkdir -p "duck-quest/assets/backgrounds/meadow"
          if [ -f "duck-quest/meadow-stage-1-tree.png" ] && [ ! -f "duck-quest/assets/backgrounds/meadow/stage-1-tree.png" ]; then
            git mv "duck-quest/meadow-stage-1-tree.png" "duck-quest/assets/backgrounds/meadow/stage-1-tree.png"
          elif [ -f "duck-quest/meadow-stage-1-tree.png" ]; then
            rm -f "duck-quest/meadow-stage-1-tree.png"
          fi
          mkdir -p "duck-quest/assets/backgrounds/meadow"
          if [ -f "duck-quest/meadow-stage-2-bushes.png" ] && [ ! -f "duck-quest/assets/backgrounds/meadow/stage-2-bushes.png" ]; then
            git mv "duck-quest/meadow-stage-2-bushes.png" "duck-quest/assets/backgrounds/meadow/stage-2-bushes.png"
          elif [ -f "duck-quest/meadow-stage-2-bushes.png" ]; then
            rm -f "duck-quest/meadow-stage-2-bushes.png"
          fi
          mkdir -p "duck-quest/assets/backgrounds/meadow"
          if [ -f "duck-quest/meadow-stage-3-flowers.png" ] && [ ! -f "duck-quest/assets/backgrounds/meadow/stage-3-flowers.png" ]; then
            git mv "duck-quest/meadow-stage-3-flowers.png" "duck-quest/assets/backgrounds/meadow/stage-3-flowers.png"
          elif [ -f "duck-quest/meadow-stage-3-flowers.png" ]; then
            rm -f "duck-quest/meadow-stage-3-flowers.png"
          fi
          mkdir -p "duck-quest/assets/backgrounds/meadow"
          if [ -f "duck-quest/meadow-stage-4-boss.png" ] && [ ! -f "duck-quest/assets/backgrounds/meadow/stage-4-boss.png" ]; then
            git mv "duck-quest/meadow-stage-4-boss.png" "duck-quest/assets/backgrounds/meadow/stage-4-boss.png"
          elif [ -f "duck-quest/meadow-stage-4-boss.png" ]; then
            rm -f "duck-quest/meadow-stage-4-boss.png"
          fi
          mkdir -p "duck-quest/assets/characters/peep/base"
          if [ -f "duck-quest/peep-idle-1.png" ] && [ ! -f "duck-quest/assets/characters/peep/base/idle-1.png" ]; then
            git mv "duck-quest/peep-idle-1.png" "duck-quest/assets/characters/peep/base/idle-1.png"
          elif [ -f "duck-quest/peep-idle-1.png" ]; then
            rm -f "duck-quest/peep-idle-1.png"
          fi
          mkdir -p "duck-quest/assets/characters/peep/base"
          if [ -f "duck-quest/peep-idle-2.png" ] && [ ! -f "duck-quest/assets/characters/peep/base/idle-2.png" ]; then
            git mv "duck-quest/peep-idle-2.png" "duck-quest/assets/characters/peep/base/idle-2.png"
          elif [ -f "duck-quest/peep-idle-2.png" ]; then
            rm -f "duck-quest/peep-idle-2.png"
          fi
          mkdir -p "duck-quest/assets/characters/peep/base"
          if [ -f "duck-quest/peep-attack.png" ] && [ ! -f "duck-quest/assets/characters/peep/base/attack.png" ]; then
            git mv "duck-quest/peep-attack.png" "duck-quest/assets/characters/peep/base/attack.png"
          elif [ -f "duck-quest/peep-attack.png" ]; then
            rm -f "duck-quest/peep-attack.png"
          fi
          mkdir -p "duck-quest/assets/characters/peep/base"
          if [ -f "duck-quest/peep-hurt.png" ] && [ ! -f "duck-quest/assets/characters/peep/base/hurt.png" ]; then
            git mv "duck-quest/peep-hurt.png" "duck-quest/assets/characters/peep/base/hurt.png"
          elif [ -f "duck-quest/peep-hurt.png" ]; then
            rm -f "duck-quest/peep-hurt.png"
          fi
          mkdir -p "duck-quest/assets/enemies/cat-slime/base"
          if [ -f "duck-quest/cat-slime-idle-1-neutral.png" ] && [ ! -f "duck-quest/assets/enemies/cat-slime/base/idle-1-neutral.png" ]; then
            git mv "duck-quest/cat-slime-idle-1-neutral.png" "duck-quest/assets/enemies/cat-slime/base/idle-1-neutral.png"
          elif [ -f "duck-quest/cat-slime-idle-1-neutral.png" ]; then
            rm -f "duck-quest/cat-slime-idle-1-neutral.png"
          fi
          mkdir -p "duck-quest/assets/enemies/cat-slime/base"
          if [ -f "duck-quest/cat-slime-idle-2-squish.png" ] && [ ! -f "duck-quest/assets/enemies/cat-slime/base/idle-2-squish.png" ]; then
            git mv "duck-quest/cat-slime-idle-2-squish.png" "duck-quest/assets/enemies/cat-slime/base/idle-2-squish.png"
          elif [ -f "duck-quest/cat-slime-idle-2-squish.png" ]; then
            rm -f "duck-quest/cat-slime-idle-2-squish.png"
          fi
          mkdir -p "duck-quest/assets/enemies/cat-slime/base"
          if [ -f "duck-quest/cat-slime-idle-3-bounce.png" ] && [ ! -f "duck-quest/assets/enemies/cat-slime/base/idle-3-bounce.png" ]; then
            git mv "duck-quest/cat-slime-idle-3-bounce.png" "duck-quest/assets/enemies/cat-slime/base/idle-3-bounce.png"
          elif [ -f "duck-quest/cat-slime-idle-3-bounce.png" ]; then
            rm -f "duck-quest/cat-slime-idle-3-bounce.png"
          fi
          mkdir -p "duck-quest/assets/enemies/bee/base"
          if [ -f "duck-quest/bee-idle-1-high.png" ] && [ ! -f "duck-quest/assets/enemies/bee/base/idle-1-high.png" ]; then
            git mv "duck-quest/bee-idle-1-high.png" "duck-quest/assets/enemies/bee/base/idle-1-high.png"
          elif [ -f "duck-quest/bee-idle-1-high.png" ]; then
            rm -f "duck-quest/bee-idle-1-high.png"
          fi
          mkdir -p "duck-quest/assets/enemies/bee/base"
          if [ -f "duck-quest/bee-idle-2-low.png" ] && [ ! -f "duck-quest/assets/enemies/bee/base/idle-2-low.png" ]; then
            git mv "duck-quest/bee-idle-2-low.png" "duck-quest/assets/enemies/bee/base/idle-2-low.png"
          elif [ -f "duck-quest/bee-idle-2-low.png" ]; then
            rm -f "duck-quest/bee-idle-2-low.png"
          fi
          mkdir -p "duck-quest/assets/enemies/bee/base"
          if [ -f "duck-quest/bee-hurt.png" ] && [ ! -f "duck-quest/assets/enemies/bee/base/hurt.png" ]; then
            git mv "duck-quest/bee-hurt.png" "duck-quest/assets/enemies/bee/base/hurt.png"
          elif [ -f "duck-quest/bee-hurt.png" ]; then
            rm -f "duck-quest/bee-hurt.png"
          fi
          mkdir -p "duck-quest/assets/enemies/flower/base"
          if [ -f "duck-quest/flower-idle-1.png" ] && [ ! -f "duck-quest/assets/enemies/flower/base/idle-1.png" ]; then
            git mv "duck-quest/flower-idle-1.png" "duck-quest/assets/enemies/flower/base/idle-1.png"
          elif [ -f "duck-quest/flower-idle-1.png" ]; then
            rm -f "duck-quest/flower-idle-1.png"
          fi
          mkdir -p "duck-quest/assets/enemies/flower/base"
          if [ -f "duck-quest/flower-idle-2.png" ] && [ ! -f "duck-quest/assets/enemies/flower/base/idle-2.png" ]; then
            git mv "duck-quest/flower-idle-2.png" "duck-quest/assets/enemies/flower/base/idle-2.png"
          elif [ -f "duck-quest/flower-idle-2.png" ]; then
            rm -f "duck-quest/flower-idle-2.png"
          fi
          mkdir -p "duck-quest/assets/enemies/flower/base"
          if [ -f "duck-quest/flower-hurt.png" ] && [ ! -f "duck-quest/assets/enemies/flower/base/hurt.png" ]; then
            git mv "duck-quest/flower-hurt.png" "duck-quest/assets/enemies/flower/base/hurt.png"
          elif [ -f "duck-quest/flower-hurt.png" ]; then
            rm -f "duck-quest/flower-hurt.png"
          fi
          mkdir -p "duck-quest/assets/enemies/mimic/base"
          if [ -f "duck-quest/mimic-open-1.png" ] && [ ! -f "duck-quest/assets/enemies/mimic/base/open-1.png" ]; then
            git mv "duck-quest/mimic-open-1.png" "duck-quest/assets/enemies/mimic/base/open-1.png"
          elif [ -f "duck-quest/mimic-open-1.png" ]; then
            rm -f "duck-quest/mimic-open-1.png"
          fi
          mkdir -p "duck-quest/assets/enemies/mimic/base"
          if [ -f "duck-quest/mimic-open-2.png" ] && [ ! -f "duck-quest/assets/enemies/mimic/base/open-2.png" ]; then
            git mv "duck-quest/mimic-open-2.png" "duck-quest/assets/enemies/mimic/base/open-2.png"
          elif [ -f "duck-quest/mimic-open-2.png" ]; then
            rm -f "duck-quest/mimic-open-2.png"
          fi
          mkdir -p "duck-quest/assets/bosses/mushroom-cat/base"
          if [ -f "duck-quest/mushroom-cat-idle-1.png" ] && [ ! -f "duck-quest/assets/bosses/mushroom-cat/base/idle-1.png" ]; then
            git mv "duck-quest/mushroom-cat-idle-1.png" "duck-quest/assets/bosses/mushroom-cat/base/idle-1.png"
          elif [ -f "duck-quest/mushroom-cat-idle-1.png" ]; then
            rm -f "duck-quest/mushroom-cat-idle-1.png"
          fi
          mkdir -p "duck-quest/assets/bosses/mushroom-cat/base"
          if [ -f "duck-quest/mushroom-cat-idle-2.png" ] && [ ! -f "duck-quest/assets/bosses/mushroom-cat/base/idle-2.png" ]; then
            git mv "duck-quest/mushroom-cat-idle-2.png" "duck-quest/assets/bosses/mushroom-cat/base/idle-2.png"
          elif [ -f "duck-quest/mushroom-cat-idle-2.png" ]; then
            rm -f "duck-quest/mushroom-cat-idle-2.png"
          fi
          mkdir -p "duck-quest/assets/bosses/mushroom-cat/base"
          if [ -f "duck-quest/mushroom-cat-hurt.png" ] && [ ! -f "duck-quest/assets/bosses/mushroom-cat/base/hurt.png" ]; then
            git mv "duck-quest/mushroom-cat-hurt.png" "duck-quest/assets/bosses/mushroom-cat/base/hurt.png"
          elif [ -f "duck-quest/mushroom-cat-hurt.png" ]; then
            rm -f "duck-quest/mushroom-cat-hurt.png"
          fi
          mkdir -p "duck-quest/assets/items/chests/treasure"
          if [ -f "duck-quest/chest-closed.png" ] && [ ! -f "duck-quest/assets/items/chests/treasure/closed.png" ]; then
            git mv "duck-quest/chest-closed.png" "duck-quest/assets/items/chests/treasure/closed.png"
          elif [ -f "duck-quest/chest-closed.png" ]; then
            rm -f "duck-quest/chest-closed.png"
          fi
          mkdir -p "duck-quest/assets/items/chests/treasure"
          if [ -f "duck-quest/chest-open.png" ] && [ ! -f "duck-quest/assets/items/chests/treasure/open.png" ]; then
            git mv "duck-quest/chest-open.png" "duck-quest/assets/items/chests/treasure/open.png"
          elif [ -f "duck-quest/chest-open.png" ]; then
            rm -f "duck-quest/chest-open.png"
          fi

          echo "Installing Duck Quest v06..."
          printf '%s' '' | base64 --decode > duck-quest/index.html
          printf '%s' '' | base64 --decode > duck-quest/battle-v06.html
          printf '%s' '' | base64 --decode > duck-quest/css/style-v06.css
          printf '%s' '' | base64 --decode > duck-quest/js/game-v06.js
          printf '%s' '' | base64 --decode > duck-quest/FOLDER-GUIDE.txt

          # Remove obsolete flat/versioned Duck Quest code.
          rm -f duck-quest/battle-v03.html duck-quest/battle-v04.html duck-quest/battle-v05.html
          rm -f duck-quest/game-v01.js duck-quest/game-v02.js duck-quest/game-v03.js duck-quest/game-v04.js duck-quest/game-v05.js
          rm -f duck-quest/style-v01.css duck-quest/style-v02.css duck-quest/style-v03.css duck-quest/style-v04.css duck-quest/style-v05.css
          rm -f duck-quest/css/style-v05.css duck-quest/js/game-v05.js
          rm -f duck-quest/README.txt duck-quest/README-v02.txt duck-quest/README-v03.txt duck-quest/README-v04.txt

          echo "Installing Hub v24.46..."
          printf '%s' '' | base64 --decode > index.html
          printf '%s' '' | base64 --decode > style-v24-46.css
          printf '%s' '' | base64 --decode > script-v24-46.js
          printf '%s' '' | base64 --decode > sw-v24-46.js
          printf '%s' '' | base64 --decode > README-v24-46.txt

          rm -f style-v24-44.css script-v24-44.js sw-v24-44.js
          rm -f style-v24-45.css script-v24-45.js sw-v24-45.js
          rm -f README-v24-44.txt README-v24-45.txt

          rm -f .github/workflows/organize-duck-quest-v06.yml

          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "Organize Duck Quest and apply v06 fixes"
          git push

          echo "Done! Safety backup branch: $BACKUP_BRANCH"

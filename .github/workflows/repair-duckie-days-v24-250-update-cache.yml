name: Repair Duckie Days v24.250 Update Cache

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-duckie-days-v24-250-update-cache.yml"

permissions:
  contents: write

jobs:
  repair-update-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify v24.250
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"version": "24.250"' version.json
          test -f sw-v24-250.js
          test -f sw.js
          grep -Fq "importScripts('./sw-v24-250.js?v=24-250');" sw.js
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-250"' index.html

      - name: Restore legacy service-worker bridge
        shell: bash
        run: |
          set -euo pipefail

          cat > sw-v24-244.js <<'EOF'
          // Compatibility bridge for Duckie Days builds that still have
          // sw-v24-244.js registered. Loading this legacy URL upgrades those
          // installs to the current v24.250 worker without deleting save data.
          importScripts('./sw-v24-250.js?v=24-250');
          EOF

          grep -Fq "importScripts('./sw-v24-250.js?v=24-250');" sw-v24-244.js

      - name: Commit compatibility bridge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sw-v24-244.js
          if git diff --cached --quiet; then
            echo "Legacy service-worker bridge already exists."
            exit 0
          fi

          git commit -m "Restore legacy service-worker bridge for v24.250"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: old v24.249 installs can now update to v24.250."

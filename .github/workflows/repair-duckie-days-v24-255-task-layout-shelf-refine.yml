name: Repair Duckie Days v24.255 Task Layout + Shelf Refine

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-duckie-days-v24-255-task-layout-shelf-refine.yml"
      - "Duckie-Days-v24.255-task-layout-shelf-refine-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-255-install
  cancel-in-progress: false

jobs:
  install-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.255 update ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.255-task-layout-shelf-refine-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.255
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.255-task-layout-shelf-refine-update-only.zip"
          TMP=".duckie-days-v24-255"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v255.py"
          node --check "$TMP/task-progression-v255.js"
          python3 "$TMP/tools/patch-v255.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.255
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.255"' version.json
          test -f task-progression-v255.js
          test -f task-progression-v255.css
          grep -Fq 'task-progression-v255.css?v=24-255' index.html
          grep -Fq 'task-progression-v255.js?v=24-255' index.html

          grep -Fq 'const SHELF_THEMES=[' task-progression-v255.js
          grep -Fq 'task-shelf-theme-choice-v255' task-progression-v255.js
          grep -Fq 'task-compact-actions-v255' task-progression-v255.js
          grep -Fq "title.textContent='Tasks'" task-progression-v255.js
          grep -Fq 'shop,completed,addTask' task-progression-v255.js
          grep -Fq 'localStorage.getItem(THEME_KEY)' task-progression-v255.js
          grep -Fq 'right.style.top=cs.top' task-progression-v255.js
          grep -Fq "mirror.style.translate='0 -12%'" task-progression-v255.js
          grep -Fq "book.style.translate='0 -10%'" task-progression-v255.js

          grep -Fq '#roomMirrorImage{translate:0 -12% !important;}' task-progression-v255.css
          grep -Fq '#roomBookImage{translate:0 -10% !important;}' task-progression-v255.css
          grep -Fq '#taskShelfButton{top:57% !important;bottom:auto !important;}' task-progression-v255.css
          grep -Fq '.task-compact-actions-v255{' task-progression-v255.css
          grep -Fq '#taskShelfThemeBarV255' task-progression-v255.css
          grep -Fq '#taskCollectibleWing[data-shelf-theme="mint"]' task-progression-v255.css
          grep -Fq '.duck-shelf-layout-v255' task-progression-v255.css

          test -f sw-v24-255.js
          grep -Fq "importScripts('./sw-v24-255.js?v=24-255');" sw.js
          grep -Fq './task-progression-v255.js?v=24-255' sw-v24-255.js
          grep -Fq './task-progression-v255.css?v=24-255' sw-v24-255.js

          node --check task-progression-v255.js
          echo "VERIFIED: v24.255 Task Layout + Shelf refine update is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="repair-duckie-days-v24-255-task-layout-shelf-refine.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.255.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-255.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.255
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Polish Tasks panel and collectible shelf layout"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.255 installed and verified."

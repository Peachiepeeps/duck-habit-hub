name: Repair Duckie Days v24.263 Card Workshop Freeze

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-duckie-days-v24-263-card-workshop-freeze.yml"
      - "Duckie-Days-v24.263-card-workshop-freeze-repair-update-only.zip"

permissions:
  contents: write

concurrency:
  group: duckie-days-v24-263-repair
  cancel-in-progress: false

jobs:
  install-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require v24.263 repair ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.263-card-workshop-freeze-repair-update-only.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from the repository root."
            exit 1
          }
          unzip -tq "$ZIP"

      - name: Install v24.263 repair
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Duckie-Days-v24.263-card-workshop-freeze-repair-update-only.zip"
          TMP=".duckie-days-v24-263-repair"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          python3 -m py_compile "$TMP/tools/patch-v263.py"
          node --check "$TMP/payload/trading-cards-ui-v263.js"
          python3 "$TMP/tools/patch-v263.py" "$TMP"
          rm -rf "$TMP"

      - name: Verify v24.263 repair
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '"version": "24.263"' version.json
          grep -Fq '<meta name="duck-habit-build" content="24.263" />' index.html
          grep -Fq 'const DUCK_HUB_BUILD = "24.263";' index.html
          grep -Fq 'trading-cards-ui-v263.js?v=24-263' index.html
          grep -Fq 'navigator.serviceWorker.register("./sw.js?v=24-263"' index.html

          test -f trading-cards-ui-v263.js
          grep -Fq 'window.DUCKIE_TRADING_CARD_WORKSHOP_UI="24.263";' trading-cards-ui-v263.js
          grep -Fq 'detailObserver.observe(detailLayer,{attributes:true,attributeFilter:["class"]});' trading-cards-ui-v263.js
          ! grep -Fq 'detailObserver.observe(document.body' trading-cards-ui-v263.js

          test -f sw-v24-263.js
          grep -Fq "importScripts('./sw-v24-263.js?v=24-263');" sw.js
          grep -Fq "'./trading-cards-ui-v263.js?v=24-263'" sw-v24-263.js

          # Make sure the main v24.262 feature files remain installed.
          test -f trading-cards-v262.js
          test -f trading-cards-v262.css
          test -f duck-quest/js/special-encounters-v262.js
          test -f duck-quest/css/special-encounters-v262.css

          node --check trading-cards-ui-v263.js
          node --check trading-cards-v262.js
          node --check duck-quest/js/special-encounters-v262.js
          node --check sw-v24-263.js

          echo "VERIFIED: v24.263 Card Workshop startup repair is valid."

      - name: Clean old installers and update bundles
        shell: bash
        run: |
          set -euo pipefail
          SELF="repair-duckie-days-v24-263-card-workshop-freeze.yml"

          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'install-duck-habit-hub-v*.yml' -o -name 'install-duckie-days-v*.yml' -o -name 'repair-duckie-days-v*.yml' \) \
              ! -name "$SELF" -delete
          fi

          find . -maxdepth 1 -type f -name 'UPDATE-v*.txt' ! -name 'UPDATE-v24.263.txt' -delete
          find . -maxdepth 1 -type f -name 'sw-v24-*.js' ! -name 'sw-v24-263.js' ! -name 'sw-v24-244.js' -delete
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete

      - name: Commit v24.263 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR: No changes were staged."
            exit 1
          }
          git commit -m "Repair Card Workshop startup freeze"
          git push

      - name: Success
        shell: bash
        run: |
          echo "SUCCESS: v24.263 Card Workshop startup repair installed and verified."

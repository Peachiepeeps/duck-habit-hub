name: Repair Duckie Days v24.267 Restore v24.265 Core + UI Fixes
"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-duckie-days-v24-267-restore-core-ui.yml"
      - ".github/workflows/repair-duckie-days-v24-267-restore-core-ui.yaml"
      - "Duckie-Days-v24.267-repair-v265-core-and-ui-update-only.zip"
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require repair ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Duckie-Days-v24.267-repair-v265-core-and-ui-update-only.zip
          unzip -tq Duckie-Days-v24.267-repair-v265-core-and-ui-update-only.zip
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .duckie-v267 && mkdir .duckie-v267
          unzip -q Duckie-Days-v24.267-repair-v265-core-and-ui-update-only.zip -d .duckie-v267
          python3 -m py_compile .duckie-v267/tools/patch-v267.py .duckie-v267/tools/verify-v267.py
          node --check .duckie-v267/payload/hub-v267.js
          node --check .duckie-v267/payload/trading-cards-ui-v267.js
          node --check .duckie-v267/payload/duck-quest/js/quest-v267.js
          python3 .duckie-v267/tools/patch-v267.py .duckie-v267
          python3 .duckie-v267/tools/verify-v267.py .
          rm -rf .duckie-v267
      - name: Cleanup installer files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*update-only*.zip' -delete
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: No changes staged."; exit 1; }
          git commit -m "Restore Buddy Box core and finish UI reorganization"
          git push
      - name: Success
        shell: bash
        run: |
          echo 'SUCCESS: v24.267 repair installed.'

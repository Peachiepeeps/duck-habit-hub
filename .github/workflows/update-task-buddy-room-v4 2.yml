name: Update Task Buddy Room v4 — Hide Tasks behind room

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duckie-task-buddy-beta-install
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Duckie Days
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install update ZIP without changing game saves
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import re

          archive_path=Path('duckie-task-buddy-update-v4.zip')
          expected={'task-buddy-beta.html','task-buddy-beta.css','task-buddy-beta.js'}
          if not archive_path.is_file():
              raise SystemExit('Upload duckie-task-buddy-update-v4.zip to the repository root first.')
          try:
              with ZipFile(archive_path) as archive:
                  names=archive.namelist()
                  if len(names)!=len(expected) or set(names)!=expected:
                      raise SystemExit('Unexpected ZIP contents: '+repr(names))
                  extracted={name:archive.read(name) for name in expected}
                  if any(not value for value in extracted.values()):
                      raise SystemExit('An update file is empty.')
          except BadZipFile as exc:
              raise SystemExit(f'Invalid ZIP: {exc}')

          index_path=Path('index.html')
          source=index_path.read_text(encoding='utf-8')
          css_re=r'task-buddy-beta\.css\?v=\d+'
          js_re=r'task-buddy-beta\.js\?v=\d+'
          if len(re.findall(css_re,source))!=1 or len(re.findall(js_re,source))!=1:
              raise SystemExit('Unexpected Task Buddy references in index.html; no changes made.')
          source=re.sub(css_re,'task-buddy-beta.css?v=5',source,count=1)
          source=re.sub(js_re,'task-buddy-beta.js?v=5',source,count=1)
          for name,data in extracted.items():
              Path(name).write_bytes(data)
          index_path.write_text(source,encoding='utf-8')
          print('Task Buddy v4 installed. Your Tasks stays mounted, inert and visually hidden under the room.')
          PYCODE

      - name: Verify update
        run: |
          node --check task-buddy-beta.js
          test -s task-buddy-beta.html
          grep -Fq 'body.duckie-buddy-beta-open #tasksPanel' task-buddy-beta.css
          grep -Fq 'tasks.inert=true' task-buddy-beta.js
          grep -Fq "document.body.classList.remove('duckie-buddy-beta-open')" task-buddy-beta.js
          grep -Fq 'task-buddy-beta.css?v=5' index.html
          grep -Fq 'task-buddy-beta.js?v=5' index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html task-buddy-beta.html task-buddy-beta.css task-buddy-beta.js
          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi
          git commit -m 'Task Buddy Room: hide underlying Your Tasks window while room is open'
          git push

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7dbe5" />
  <title>Duck Habit Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section id="stage" class="stage" aria-label="Home room">
      <img id="roomImage" class="stage-layer room-layer" alt="Selected room" />

      <!-- Room objects intentionally sit BEHIND Peep. Their invisible hotspots stay clickable. -->
      <img class="stage-layer room-object" src="assets/ui/mirror.png" alt="" aria-hidden="true" />
      <img class="stage-layer room-object" src="assets/ui/book-room.png" alt="" aria-hidden="true" />

      <div id="peepWrap" class="peep-wrap">
        <div id="peepLayers" class="peep-layers" aria-label="Peep"></div>
        <button id="peepHotspot" class="peep-hotspot" type="button" aria-label="Poke Peep">
          <span>Poke Peep</span>
        </button>
      </div>

      <button id="mirrorHotspot" class="hotspot mirror-hotspot" type="button" aria-label="Open closet">
        <span>Closet</span>
      </button>
      <button id="bookHotspot" class="hotspot book-hotspot" type="button" aria-label="Open book menu">
        <span>Book</span>
      </button>

      <div class="top-hud">
        <div class="room-picker-wrap">
          <button id="roomPickerButton" class="room-swatch-button" type="button" aria-expanded="false" aria-label="Change room color">
            <span id="roomPickerSwatch" class="room-swatch current-room-swatch" aria-hidden="true"></span>
            <span class="room-picker-arrow" aria-hidden="true">▾</span>
          </button>
          <div id="roomPicker" class="room-picker hidden" role="menu" aria-label="Room colors"></div>
        </div>

        <div class="coin-pill" aria-label="Pink coin balance">
          <img src="assets/ui/pink-coin.png" alt="" />
          <strong id="coinCount">0</strong>
        </div>
      </div>

      <div id="toast" class="toast hidden" role="status"></div>

      <section id="closetPanel" class="closet-panel hidden" aria-label="Peep's closet">
        <div class="closet-panel-top">
          <div class="closet-category-wrap">
            <button id="closetCategoryButton" class="closet-category-button" type="button" aria-expanded="false">
              <span id="closetCategoryLabel">Hair</span>
              <span aria-hidden="true">▾</span>
            </button>
            <div id="closetCategoryMenu" class="closet-category-menu hidden"></div>
          </div>
          <button id="closeCloset" class="close-button closet-close" type="button" aria-label="Return to room">×</button>
        </div>

        <div id="closetOptions" class="closet-options"></div>
        <p class="save-note">Outfit changes save automatically.</p>
      </section>

      <section id="bookPanel" class="panel book-panel hidden" aria-label="Book menu">
        <div class="panel-header">
          <div>
            <p class="eyebrow">YOUR BOOK</p>
            <h1>Menu</h1>
          </div>
          <button id="closeBook" class="close-button" type="button" aria-label="Close book">×</button>
        </div>
        <div class="book-grid">
          <button data-book-page="tasks">✓ <span>Tasks</span></button>
          <button data-book-page="inventory">🎒 <span>Inventory</span></button>
          <button data-book-page="shop">♡ <span>Shop</span></button>
          <button data-book-page="crafter">🦆 <span>Duck Crafter</span></button>
          <button data-book-page="duckipedia">📖 <span>Duckipedia</span></button>
          <button data-book-page="characters">👤 <span>Character Change</span></button>
          <button data-book-page="games">🎮 <span>Games</span></button>
          <button data-book-page="status">★ <span>Status</span></button>
        </div>
        <p class="save-note">The Book pages are placeholders for our next steps.</p>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

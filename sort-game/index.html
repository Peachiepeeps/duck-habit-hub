<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8e8ef" />
  <title>Duck Sort · Duck Habit Hub</title>
  <link rel="stylesheet" href="style.css?v=24-23" />
</head>
<body>
  <main class="sort-shell">
    <header class="sort-topbar">
      <button id="backButton" class="pill-button back-button" type="button" aria-label="Back to Games">‹ Games</button>
      <div class="mini-title"><small>QUICK LITTLE BREAK</small><strong>Duck Sort</strong></div>
      <div class="coin-pill" aria-label="Pink Coins"><img class="sort-coin-icon" src="../assets/ui/pink-coin.png" alt=""><b id="coinCount">0</b></div>
    </header>

    <section id="gameBoard" class="game-board" aria-label="Duck Sort play area">
      <img class="canvas-layer bg-art" src="sort-background.png.png" alt="" />

      <div class="hud-row">
        <div class="hud-pill"><small>SCORE</small><b id="scoreValue">0</b></div>
        <div class="hud-pill combo-pill"><small>COMBO</small><b id="comboValue">×0</b></div>
        <div class="hud-pill timer-pill"><small>TIME</small><b id="timeValue">60</b></div>
      </div>

      <!-- Full-canvas basket BACK layers. These sit behind the thrown duck. -->
      <img class="canvas-layer basket-back" src="color-basket-back.png.png" alt="" />
      <img class="canvas-layer basket-back" src="food-basket-back.png.png" alt="" />
      <img class="canvas-layer basket-back" src="special-basket-back.png.png" alt="" />

      <div id="duckLayer" class="duck-layer"></div>

      <!-- Full-canvas basket FRONT layers. These cover the duck as it lands. -->
      <img class="canvas-layer basket-front" src="color-basket.png.png" alt="" />
      <img class="canvas-layer basket-front" src="food-basket.png.png" alt="" />
      <img class="canvas-layer basket-front" src="special-basket.png.png" alt="" />

      <!-- Tiny HTML names only — no pill/background, so your basket art stays untouched. -->
      <div class="basket-label label-color">Color</div>
      <div class="basket-label label-food">Food</div>
      <div class="basket-label label-special">Special</div>

      <div id="feedback" class="feedback" aria-live="polite"></div>

      <div id="startOverlay" class="game-overlay">
        <section class="overlay-card">
          <div class="overlay-duck"><img src="../assets/ducks/Standard-duck.PNG" alt="Standard Duck"></div>
          <p class="eyebrow">READY TO SORT?</p>
          <h1>Fling the ducks!</h1>
          <p>Swipe each duck toward the matching <b>Color</b>, <b>Food</b>, or <b>Special</b> basket.</p>
          <p class="tip">Slow dragging works too. ♡</p>
          <div class="duration-picker" role="group" aria-label="Choose round length">
            <button class="duration-choice" type="button" data-seconds="30">30 sec</button>
            <button class="duration-choice selected" type="button" data-seconds="60">60 sec</button>
            <button class="duration-choice" type="button" data-seconds="120">2 min</button>
          </div>
          <button id="startButton" class="primary-button" type="button">Start 60-Second Round</button>
        </section>
      </div>

      <div id="resultOverlay" class="game-overlay hidden">
        <section class="overlay-card result-card">
          <p class="eyebrow">ROUND COMPLETE!</p>
          <h1 id="resultTitle">Nice sorting! ♡</h1>
          <div class="result-grid">
            <div><small>Score</small><b id="resultScore">0</b></div>
            <div><small>Correct</small><b id="resultCorrect">0</b></div>
            <div><small>Best Combo</small><b id="resultCombo">×0</b></div>
          </div>
          <div class="reward-line"><img class="reward-coin-icon" src="../assets/ui/pink-coin.png" alt=""><b id="resultCoins">+0 Pink Coins</b></div>
          <p id="bestMessage" class="tip"></p>
          <div class="result-actions">
            <button id="playAgainButton" class="primary-button" type="button">Play Again</button>
            <button id="resultBackButton" class="secondary-button" type="button">Back to Games</button>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="script.js?v=24-23"></script>
</body>
</html>
